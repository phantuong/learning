<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><title>Learning Hub</title><style>:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--card:#fff;--line:#e2e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.page{max-width:980px;margin:auto;padding:28px 18px 48px}.page.nv-main{min-height:100vh}header{text-align:center;padding:22px 8px 30px}.logo{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:0 0 8px}.subtitle{margin:0;color:var(--muted);font-size:18px;line-height:1.5}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:28px;padding:30px 28px;margin-bottom:28px;box-shadow:0 14px 35px #7c3aed29}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;line-height:1.6;font-size:16px}.continue{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:22px;box-shadow:0 7px 20px #1820330d}.continue small{color:var(--muted);font-weight:700}.continue h2{margin:5px 0;font-size:21px}.continue a{display:inline-block;margin-top:10px;background:var(--navy);color:#fff;text-decoration:none;border-radius:13px;padding:11px 15px;font-weight:750}.section-title{font-size:23px;margin:0 0 16px}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grade{display:flex;align-items:center;justify-content:center;min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:20px;color:var(--navy);text-decoration:none;font-size:24px;font-weight:750;box-shadow:0 5px 16px #1820330d}.note{margin-top:20px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;color:var(--muted);line-height:1.5}footer{text-align:center;color:#8a93a5;margin-top:34px;font-size:14px}@media(max-width:700px){.grades{grid-template-columns:repeat(3,1fr)}.logo{font-size:38px}.hero{padding:25px 22px}}@media(max-width:460px){.page{padding:18px 14px 35px}.grades{grid-template-columns:repeat(2,1fr);gap:12px}.grade{min-height:92px;font-size:22px}.hero{border-radius:23px}.hero h1{font-size:26px}}</style></head><body><main class="page"><header><h1 class="logo">📚 Learning Hub</h1><p class="subtitle">Nền tảng học tập từ lớp 1 đến lớp 12</p></header><section class="hero"><h1>Chọn lớp học</h1><p>Chọn lớp → chọn môn → chọn bài học. Navigation bên trái luôn giữ cùng cấu trúc trên mọi trang.</p></section><section aria-labelledby="grade-title"><h2 id="grade-title" class="section-title">Lớp 1 → Lớp 12</h2><div class="grades" id="grades"></div></section><footer>Learning Hub · Học tập từ lớp 1 đến lớp 12</footer></main><script>document.getElementById('grades').innerHTML=Array.from({length:12},(_,i)=>{const g=i+1;return `<a class="grade" href="class.html?grade=${g}">Lớp ${g}</a>`}).join('');</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
