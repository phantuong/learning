<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Tách Gộp · Toán lớp 1</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}main{min-height:100vh;padding:12px 14px 40px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:36px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:15px}.setting h3{margin:0 0 11px;font-size:17px}.choices{display:grid;gap:8px}.levels,.types{grid-template-columns:repeat(2,1fr)}.ranges{grid-template-columns:repeat(4,1fr)}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;line-height:1.15}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer}.tip{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.top{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}.question{text-align:center;color:var(--muted);font-weight:750;font-size:17px;margin-top:10px}.equation{text-align:center;font-size:52px;font-weight:950;color:#29243b;margin:25px 0 30px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:70px;border:2px solid #ead3df;background:#fff;border-radius:18px;font-size:27px;font-weight:900;color:#514b5c;cursor:pointer}.answer.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.answer.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.feedback{text-align:center;min-height:42px;padding:14px 0;font-size:20px;font-weight:900}.feedback.bad{color:#b4232e}.fireworks{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:life 2s ease-in-out forwards}.firework{position:relative;width:210px;height:210px;opacity:0;transform:scale(.25);animation:burst 2s ease-in-out forwards}.firework:before{content:"🎉";position:absolute;font-size:78px;left:66px;top:65px}.spark{position:absolute;left:50%;top:50%;font-size:34px;animation:out 1.7s ease-out forwards}.s1{--x:-105px;--y:-85px}.s2{--x:0;--y:-125px}.s3{--x:105px;--y:-85px}.s4{--x:125px;--y:5px}.s5{--x:85px;--y:105px}.s6{--x:0;--y:125px}.s7{--x:-95px;--y:95px}.s8{--x:-125px;--y:5px}.s9{--x:-75px;--y:-115px}.s10{--x:75px;--y:-115px}@keyframes life{0%,100%{opacity:0}8%,88%{opacity:1}}@keyframes burst{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.18)}}@keyframes out{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}@media(max-width:760px){.settings{grid-template-columns:1fr}.ranges{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.card{padding:16px}.equation{font-size:43px}.answer{font-size:24px}}
</style></head><body><main><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap"><header class="hero"><div class="emoji">🧩</div><h1>Tách Gộp</h1><p>Lớp 1 · Luyện tập liên tục</p></header><section id="setup" class="card"><div class="settings"><div class="setting"><h3>🎯 Chọn level</h3><div id="levels" class="choices levels"></div></div><div class="setting"><h3>🔢 Phạm vi số</h3><div id="ranges" class="choices ranges"></div></div><div class="setting"><h3>🧩 Dạng bài</h3><div id="types" class="choices types"></div></div></div><button id="startBtn" class="start">Bắt đầu luyện tập ✨</button><div class="tip">Không giới hạn số câu. Trả lời đúng sẽ tự động chuyển sang câu tiếp theo.</div></section><section id="quiz" class="card quiz"></section></div></main><script>
const $=id=>document.getElementById(id);let level=2,range=10,type='split',current=null,answered=false,score=0,cursor=0,audioCtx=null;const RANGES=[10,20,50,100];const TYPES=[['split','Tách'],['remaining','Còn Lại'],['mixed','Hỗn Hợp']];
function choices(){ $('levels').innerHTML=[2,3].map(n=>`<button class="choice ${level===n?'on':''}" onclick="pickLevel(${n})">${n} số</button>`).join('');$('ranges').innerHTML=RANGES.map(n=>`<button class="choice ${range===n?'on':''}" onclick="pickRange(${n})">0–${n}</button>`).join('');$('types').innerHTML=TYPES.map(x=>`<button class="choice ${type===x[0]?'on':''}" onclick="pickType('${x[0]}')">${x[1]}</button>`).join('')}
function pickLevel(n){level=n;choices()}function pickRange(n){range=n;choices()}function pickType(v){type=v;choices()}
function rand(n){return Math.floor(Math.random()*(n+1))}
function sequentialQuestion(){const base=cursor%(range+1);if(level===2){if(type==='remaining'){const result=base,sub=(cursor%(range-result+1)),whole=result+sub;return{kind:'remaining',whole,result,answer:sub}}return{kind:'split',whole:base,known:cursor%(base+1),answer:base-(cursor%(base+1))}}const a=cursor%(range+1),b=Math.floor(cursor/(range+1))%(range+1-a);if(type==='remaining'){const result=a,sub=b,whole=result+sub;const extra=(cursor%(Math.max(1,range-whole+1)));return{kind:'remaining3',whole:whole+extra,result,sub,answer:extra}}const first=a,second=b,whole=first+second;const third=cursor%(Math.max(1,range-whole+1));return{kind:'split3',whole:whole+third,known1:first,known2:second,answer:third}}
function makeQuestion(){let q;if(level===2){if(type==='remaining'){const result=rand(range),sub=rand(range-result);q={kind:'remaining',whole:result+sub,result,answer:sub}}else{const whole=rand(range),known=rand(whole);q={kind:'split',whole,known,answer:whole-known}}}else{if(type==='remaining'){const result=rand(range),sub=rand(range-result),extra=rand(range-result-sub);q={kind:'remaining3',whole:result+sub+extra,result,sub,answer:extra}}else{const first=rand(range),second=rand(range-first),third=rand(range-first-second);q={kind:'split3',whole:first+second+third,known1:first,known2:second,answer:third}}}return q}
function getQuestion(){return level===3&&window.sequential?sequentialQuestion():makeQuestion()}
function distractors(ans){const s=new Set([ans]);while(s.size<4){const d=Math.max(0,Math.min(range,ans+Math.floor(Math.random()*7)-3));s.add(d)}return [...s].sort(()=>Math.random()-.5)}
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(f,d,t,g,e){if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(e)o.frequency.exponentialRampToValueAtTime(e,n+d);a.gain.setValueAtTime(.0001,n);a.gain.exponentialRampToValueAtTime(g,n+.006);a.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(a);a.connect(audioCtx.destination);o.start(n);o.stop(n+d+.01)}
function goodSound(){initAudio();tone(523,.18,'sine',1,659);setTimeout(()=>tone(659,.18,'sine',1,784),70);setTimeout(()=>tone(784,.28,'sine',1,1047),140)}function badSound(){initAudio();tone(260,.18,'square',1,150);setTimeout(()=>tone(190,.2,'square',1,120),110)}
function fireworks(){const w=document.createElement('div');w.className='fireworks';const f=document.createElement('div');f.className='firework';f.innerHTML=['🌟','✨','🎊','✨','🌟','✨','🎉','✨','🌟','🎊'].map((x,i)=>`<span class="spark s${i+1}">${x}</span>`).join('');w.appendChild(f);document.body.appendChild(w);setTimeout(()=>w.remove(),2050)}
function render(){current=getQuestion();answered=false;let eq;if(current.kind==='split')eq=`${current.whole} = ${current.known} + ?`;else if(current.kind==='remaining')eq=`${current.whole} = ${current.result} + ?`;else if(current.kind==='split3')eq=`${current.whole} = ${current.known1} + ${current.known2} + ?`;else eq=`${current.whole} = ${current.result} + ${current.sub} + ?`;const opts=distractors(current.answer);$('quiz').innerHTML=`<div class="top"><span>Câu ${score+1}</span><span>Đúng: ${score}</span></div><div class="question">${current.kind.startsWith('remaining')?'Tìm số còn thiếu':'Tách một số'}</div><div class="equation">${eq}</div><div class="answers">${opts.map(x=>`<button class="answer" onclick="answer(${x},this)">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`}
function answer(v,b){if(answered)return;if(v===current.answer){answered=true;score++;b.classList.add('correct');goodSound();fireworks();setTimeout(render,2000)}else{b.classList.add('wrong');badSound();$('feedback').className='feedback bad';$('feedback').textContent='✗ Chưa đúng — thử lại nhé!';setTimeout(()=>b.classList.remove('wrong'),500)}}
$('startBtn').onclick=()=>{initAudio();score=0;cursor=0;window.sequential=false;$('setup').style.display='none';$('quiz').classList.add('show');render()};choices();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
