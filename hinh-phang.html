<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hình phẳng · Toán lớp 1</title><style>:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25253a;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#f0dbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.sub{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open{display:grid;gap:3px}.sub a{font-size:14px;padding:8px 9px;border-radius:9px}.courses{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a{font-size:13px}.main{margin-left:260px;padding:20px;min-height:100vh}.wrap{max-width:900px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012}.hero{text-align:center;padding:18px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:35px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:20px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 13px;font-weight:750;color:#625c6c;cursor:pointer}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start,.again{width:100%;border:0;border-radius:16px;padding:14px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:750}.bar{height:8px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 28px}.bar i{display:block;height:100%;background:var(--pink)}.question{text-align:center;font-size:22px;font-weight:850;color:#575163;margin-bottom:18px}.visual{min-height:230px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffafd,#fff);border:1px solid #f4e2eb;border-radius:22px;margin:8px 0 20px;padding:16px}.visual svg{max-width:100%;width:min(620px,85vw);height:230px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px 8px;font-size:18px;font-weight:850;color:#514b5c;cursor:pointer}.ans:hover{border-color:var(--pink)}.ans:disabled{cursor:default}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.feedback{text-align:center;min-height:48px;padding:14px 0;font-weight:850;font-size:18px}.next{display:none;width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-weight:850;font-size:18px;cursor:pointer}.next.show{display:block}.hint{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.result{text-align:center}.stars{font-size:46px}.result h2{font-size:29px;margin:8px}.result p{color:var(--muted);font-size:17px}.count-scene{width:min(100%,680px)!important;height:270px!important}.complex{width:min(100%,600px)!important;height:260px!important}@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.main{margin:0;padding:12px 14px 35px}.mobile{display:block}.card{padding:18px;border-radius:22px}.hero h1{font-size:30px}.answers{grid-template-columns:repeat(2,1fr)}.ans{padding:14px 4px}.visual{min-height:200px}.visual svg{height:205px}}</style></head><body><aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside><main class="main"><button class="mobile" onclick="toggleNav()">☰</button><div class="wrap"><header class="hero"><div class="emoji">🔺🟦⭕💗</div><h1>Hình phẳng</h1><p>Nhận biết, đếm và khám phá các hình phẳng cơ bản</p></header><section class="card setup" id="setup"><div class="setting"><h3>🎯 Chọn mức luyện tập</h3><div class="choices" id="levels"></div></div><button class="start" onclick="startQuiz()">Bắt đầu luyện tập ✨</button><div class="hint">Mỗi bài gồm 10 câu. Câu hỏi được trộn tự động.</div></section><section class="card quiz" id="quiz"></section></div></main><script src="app-nav.js"></script><script>
const LEVELS=[['1','Nhận biết hình'],['2','Đếm hình'],['3','Đặc điểm hình'],['4','Chia hình'],['5','Hình trong hình'],['6','Tổng hợp']];const NAMES={circle:'hình tròn',triangle:'hình tam giác',square:'hình vuông',rectangle:'hình chữ nhật'};const TYPES=Object.keys(NAMES);let level=Number(localStorage.getItem('flatShapeLevel')||1),qs=[],pos=0,score=0,answered=false;const $=id=>document.getElementById(id);const rnd=n=>Math.floor(Math.random()*n);const pick=()=>TYPES[rnd(TYPES.length)];const shuffle=a=>a.sort(()=>Math.random()-.5);function choices(){$('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${+x[0]===level?'on':''}" onclick="pickLevel(${x[0]})">Mức ${x[0]}<br><small>${x[1]}</small></button>`).join('')}function pickLevel(v){level=+v;localStorage.setItem('flatShapeLevel',level);choices()}
function shape(type,x,y,w,h,fill='#ffd7e9',stroke='#ec5fa4',sw=4){if(type==='circle')return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;if(type==='triangle')return `<polygon points="${x+w/2},${y+h*.1} ${x+w*.1},${y+h*.9} ${x+w*.9},${y+h*.9}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;return `<rect x="${x+w*.1}" y="${y+h*.1}" width="${w*.8}" height="${h*.8}" rx="${type==='square'?5:3}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}function oneShape(t,rot=0){return `<svg viewBox="0 0 240 180"><g transform="rotate(${rot} 120 90)">${shape(t,45,15,150,150)}</g></svg>`}
function identify(){const t=pick();return{prompt:'Đây là hình gì?',visual:oneShape(t,[-12,0,12,25][rnd(4)]),answer:NAMES[t],opts:shuffle([NAMES[t],...shuffle(TYPES.filter(x=>x!==t)).slice(0,3).map(x=>NAMES[x])])}}
function count(){const wanted=pick(),items=[];const total=2+rnd(5);for(let i=0;i<total;i++)items.push(wanted);for(let i=0;i<4+rnd(4);i++)items.push(pick());shuffle(items);let svg='<svg class="count-scene" viewBox="0 0 680 270"><rect x="3" y="3" width="674" height="264" rx="22" fill="#fffafd" stroke="#f0dbe7"/>';items.forEach((t,i)=>{const x=30+(i%5)*125+rnd(20),y=35+Math.floor(i/5)*105+rnd(18),s=60;svg+=`<g>${shape(t,x,y,s,s,t===wanted?'#ffd7e9':'#e6edff',t===wanted?'#ec5fa4':'#7f91c7',3)}</g>`});svg+='</svg>';const actual=items.filter(x=>x===wanted).length;return{prompt:`Có bao nhiêu ${NAMES[wanted]} trong hình?`,visual:svg,answer:String(actual),opts:shuffle([actual,Math.max(1,actual-1),actual+1,actual+2].map(String))}}
function property(){const t=pick();let prompt,answer,opts;if(t==='circle'){prompt='Hình tròn có bao nhiêu góc?';answer='0';opts=['0','1','2','3']}else if(t==='triangle'){prompt='Hình tam giác có bao nhiêu cạnh?';answer='3';opts=['2','3','4','5']}else if(t==='square'){prompt='Hình vuông có bao nhiêu cạnh bằng nhau?';answer='4';opts=['2','3','4','5']}else{prompt='Hình chữ nhật có bao nhiêu cạnh?';answer='4';opts=['3','4','5','6']}return{prompt,visual:oneShape(t),answer,opts:shuffle(opts)}}
function splitShape(){return{prompt:'Hình này được chia thành mấy phần?',visual:`<svg class="complex" viewBox="0 0 300 190"><rect x="45" y="25" width="210" height="140" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="5"/><line x1="150" y1="25" x2="150" y2="165" stroke="#697fc0" stroke-width="4"/></svg>`,answer:'2',opts:shuffle(['1','2','3','4'])}}
function complexCount(){if(Math.random()<.5)return{prompt:'Có tất cả bao nhiêu hình chữ nhật trong hình?',visual:`<svg class="complex" viewBox="0 0 300 190"><rect x="35" y="35" width="230" height="120" fill="#e6edff" stroke="#697fc0" stroke-width="4"/><line x1="150" y1="35" x2="150" y2="155" stroke="#ec5fa4" stroke-width="4"/></svg>`,answer:'3',opts:shuffle(['2','3','4','5'])};return{prompt:'Có tất cả bao nhiêu hình vuông trong hình?',visual:`<svg class="complex" viewBox="0 0 300 190"><rect x="75" y="15" width="150" height="150" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><line x1="150" y1="15" x2="150" y2="165" stroke="#697fc0" stroke-width="4"/><line x1="75" y1="90" x2="225" y2="90" stroke="#697fc0" stroke-width="4"/></svg>`,answer:'5',opts:shuffle(['3','4','5','6'])}}
function compose(){const a=pick(),b=pick();return{prompt:'Hai hình nào được ghép lại?',visual:`<svg viewBox="0 0 320 190">${shape(a,35,30,105,105,'#ffd7e9','#ec5fa4',4)}${shape(b,180,50,105,105,'#e6edff','#697fc0',4)}</svg>`,answer:`${NAMES[a]} và ${NAMES[b]}`,opts:shuffle([`${NAMES[a]} và ${NAMES[b]}`,`${NAMES[a]} và hình tròn`,'hình vuông và hình tam giác','hình tròn và hình chữ nhật'])}}
function make(){if(level===1)return identify();if(level===2)return count();if(level===3)return property();if(level===4)return splitShape();if(level===5)return complexCount();const all=[identify,count,property,splitShape,complexCount,compose];return all[rnd(all.length)]()}
function build(){qs=[];for(let i=0;i<10;i++)qs.push(make());pos=0;score=0}function startQuiz(){build();$('setup').classList.add('hide');$('quiz').classList.add('show');render()}function render(){answered=false;const q=qs[pos];$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div><div class="visual">${q.visual}</div><div class="answers">${q.opts.map(o=>`<button class="ans" onclick="answer(this,${JSON.stringify(o)})">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="next" class="next" onclick="nextQuestion()">Tiếp theo →</button>`}function answer(btn,value){if(answered)return;answered=true;const q=qs[pos],ok=value===q.answer;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(ok){score++;btn.classList.add('correct');$('fb').textContent='🎉 Chính xác!';$('fb').style.color='#087443'}else{btn.classList.add('wrong');$('fb').textContent=`💪 Chưa đúng. Đáp án: ${q.answer}`;$('fb').style.color='#b4232e'}$('next').classList.add('show')}function nextQuestion(){if(pos<9){pos++;render()}else showResult()}function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=9?'🌟🌟🌟':score>=7?'🌟🌟':'🌟'}</div><h2>Hoàn thành!</h2><p>Bé trả lời đúng <b>${score}/10</b> câu.</p><button class="again" onclick="startQuiz()">Luyện lại ✨</button></div>`}choices();function toggleNav(){document.getElementById('side')?.classList.toggle('open')}</script></body></html>
