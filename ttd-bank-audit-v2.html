<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Bank Audit v2</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border-radius:14px;padding:14px}.bad{color:#b42318}.ok{color:#16734a}table{width:100%;background:#fff;border-collapse:collapse;margin-top:14px}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>TTD Bank Audit v2</h1><div id="app">Loading...</div><script src="ttd-bank-audit-v2.js"></script><script src="ttd-spatial-cube-v2.js"></script><script src="ttd-multicondition-bank-v1.js"></script><script src="ttd-relational-bank-v1.js"></script><script src="ttd-spatial-cube-bank-v2.js"></script><script>const banks={multi_condition:TTD_MULTICONDITION_BANK_V1,relational:TTD_RELATIONAL_BANK_V1,spatial_cube:TTD_SPATIAL_CUBE_BANK_V2};const rows=TTD_BANK_AUDIT_V2.audit(banks,TTD_SPATIAL_CUBE_V2);const valid=rows.filter(q=>q.validation.valid),bad=rows.filter(q=>!q.validation.valid),by={};rows.forEach(q=>{const k=q.family||q.type;by[k]??={total:0,valid:0};by[k].total++;if(q.validation.valid)by[k].valid++});document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><b>Total</b><h2>${rows.length}</h2></div><div class="card"><b>PASS</b><h2 class="ok">${valid.length}</h2></div><div class="card"><b>REJECT</b><h2 class="bad">${bad.length}</h2></div></div><h2>By family</h2><table><tr><th>Family</th><th>Total</th><th>Pass</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v.total}</td><td>${v.valid}</td></tr>`).join('')}</table><h2>Rejected</h2><table><tr><th>ID</th><th>Errors</th></tr>${bad.map(q=>`<tr><td>${q.id}</td><td>${q.validation.errors.join(', ')}</td></tr>`).join('')||'<tr><td colspan="2" class="ok">Không có câu bị reject.</td></tr>'}</table></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
