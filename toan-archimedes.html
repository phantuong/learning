:48px;height:48px}.dot-board{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;max-width:420px;margin:auto}.dot{width:10px;height:10px;background:#d74763;border-radius:50%;justify-self:center}.sequence{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px;font-weight:800}.tile{display:inline-flex;min-width:42px;height:42px;border:2px solid #d9b9c8;border-radius:8px;align-items:center;justify-content:center;background:#fff}.math-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:800}.math-line .blank{width:58px}.house{width:100%;max-width:520px;display:block;margin:auto}@media(max-width:720px){.books{grid-template-columns:repeat(2,1fr)}.sheet{padding:18px 14px}.toolbar{position:static;flex-wrap:wrap}.hero h1{font-size:30px}}@media(max-width:430px){.books{grid-template-columns:1fr}.book{text-align:center}.pager{flex-direction:column;align-items:stretch}.pager button{width:100%}}</style></head><body><div class="arch-wrap"><header class="hero"><div class="hero-icon">📚🔢</div><h1>Toán Archimedes</h1><p>Học theo 4 quyển sách Toán Archimedes lớp 1 · tương tác trực tiếp trên màn hình</p></header><section id="bookHome"><div class="books"><button class="book" data-book="1"><div class="num">①</div><h2>Toán 1</h2><p>Quyển 1 · Số và tư duy</p><span class="badge">50 trang</span></button><button class="book" data-book="2"><div class="num">②</div><h2>Toán 2</h2><p>Quyển 2 · Cộng, trừ &amp; bài toán</p><span class="badge">50 trang</span></button><button class="book" data-book="3"><div class="num">③</div><h2>Toán 3</h2><p>Quyển 3 · Hình học &amp; tư duy</p><span class="badge">56 trang</span></button><button class="book" data-book="4"><div class="num">④</div><h2>Toán 4</h2><p>Quyển 4 · Nâng cao</p><span class="badge">58 trang</span></button></div><p class="note">Mẫu trang được tái dựng bằng HTML/CSS/SVG. Ô trống có thể nhập số; câu chọn đáp án có thể click; hình học được vẽ lại bằng SVG.</p></section><section id="viewer" class="viewer"><button class="back" id="backBtn">← Chọn quyển khác</button><div class="toolbar"><strong id="bookTitle">Toán 1 · Quyển 1</strong><div><button id="prev">← Trang trước</button><button id="next">Trang sau →</button></div></div><div class="page-card"><div class="sheet" id="sheet"></div></div><div class="pager"><span class="page-index" id="pageLabel">Trang 3 / 50</span><button id="check">✓ Kiểm tra câu trả lời</button></div><div class="feedback" id="feedback"></div></section></div><script>
const books={1:{pages:50,title:'Toán 1 · Quyển 1'},2:{pages:50,title:'Toán 1 · Quyển 2'},3:{pages:56,title:'Toán 1 · Quyển 3'},4:{pages:58,title:'Toán 1 · Quyển 4'}};let book=1,page=3;const home=document.getElementById('bookHome'),viewer=document.getElementById('viewer'),sheet=document.getElementById('sheet'),feedback=document.getElementById('feedback');
function input(a=''){return `<input class="blank" inputmode="numeric" autocomplete="off" data-answer="${a}">`}
function tri(x,y,s){return `<polygon points="${x},${y-s} ${x+s},${y+s} ${x-s},${y+s}" fill="#ffd86b" stroke="#d99726" stroke-width="3"/>`}
function renderQ1(){if(page===3)return `<div class="sheet-head"><span class="week">TUẦN 1</span><span>TIẾT 1</span></div><div class="source-tag">Tái dựng từ Quyển 1 · trang 3</div><div class="exercise"><h3>Bài 1. Viết số lượng chấm tròn theo mẫu:</h3><div class="sequence">••• → ${input('3')} &nbsp; ••••• → ${input('5')} &nbsp; •• → ${input('2')} &nbsp; •••• → ${input('4')}</div></div><div class="exercise"><h3>Bài 2. Điền số thích hợp vào ô trống:</h3><p>1 + ${input('2')} = 3 &nbsp;&nbsp; 4 + ${input('3')} = 7</p><p>9 − ${input('4')} = 5 &nbsp;&nbsp; 6 − ${input('2')} = 4</p></div><div class="exercise"><h3>Bài 3. Nối các điểm theo thứ tự từ 1 đến 10.</h3><svg viewBox="0 0 420 170" style="width:100%;max-width:500px;display:block;margin:auto"><path id="connectPath" d="M45 110 L90 55 L140 120 L185 45 L230 115 L280 55 L330 105 L370 50" fill="none" stroke="#d74763" stroke-width="3" stroke-dasharray="5 6"/>${[45,90,140,185,230,280,330,370].map((x,i)=>`<circle cx="${x}" cy="${[110,55,120,45,115,55,105,50][i]}" r="12" fill="#fff" stroke="#d74763" stroke-width="2"/><text x="${x}" y="${[110,55,120,45,115,55,105,50][i]+5}" text-anchor="middle" font-size="12">${i+1}</text>`).join('')}</svg></div><div class="exercise"><h3>Bài 4. An đứng thứ tư trong hàng. Có mấy bạn đứng trước An?</h3><div class="choices"><button class="choice" data-answer="2">2</button><button class="choice" data-answer="3">3</button><button class="choice" data-answer="4">4</button></div></div>`;
if(page===4)return `<div class="sheet-head"><span>ARCHIMEDES SCHOOL</span><span>TIẾT 2</span></div><div class="source-tag">Tái dựng từ Quyển 1 · trang 4</div><div class="exercise"><h3>Bài 1. Điền số 1, 2, 3, 4, 5 sao cho mỗi hàng và cột đủ các số.</h3><div class="tiny-grid">${[1,'',3,'',5,4,1,'',5,'', '',4,'',1,2,2,'',1,'', '',5,'',4,'',1].map((v,i)=>v===''?input(String((i%5)+1)).replace('class="blank"','class="cell blank"'): `<div class="cell">${v}</div>`).join('')}</div></div><div class="exercise"><h3>Bài 2. Điền số thích hợp vào hình:</h3><div class="math-line">1 + 4 + ${input('3')} = 8</div><div class="math-line">2 + ${input('3')} = 5</div></div>`;
return `<div class="sheet-head"><span class="week">TUẦN ${Math.max(1,Math.ceil(page/2))}</span><span>TIẾT ${((page-1)%3)+1}</span></div><div class="source-tag">Tái dựng tương tác · Quyển 1</div><div class="exercise"><h3>Bài 1. Điền số thích hợp:</h3><p>7 + ${input('3')} = 10 &nbsp;&nbsp; 10 − ${input('4')} = 6</p><p>5 + ${input('4')} = 9 &nbsp;&nbsp; 8 − ${input('3')} = 5</p></div><div class="exercise"><h3>Bài 2. Tìm số tiếp theo:</h3><p>2, 4, 6, ${input('8')}, 10</p></div>`}
function renderQ2(){if(page===3)return `<div class="sheet-head"><span class="week">TUẦN 10</span><span>TIẾT 1</span></div><div class="source-tag">Tái dựng từ Quyển 2 · trang 3</div><div class="exercise"><h3>Bài 1. Tính:</h3><div class="math-line">3 + 1 + 4 = ${input('8')} &nbsp;&nbsp; 5 − 4 + 8 = ${input('9')} &nbsp;&nbsp; 5 + 2 + 2 = ${input('9')}</div><div class="math-line">8 − 5 + 4 = ${input('7')} &nbsp;&nbsp; 3 + 6 − 5 = ${input('4')}</div></div><div class="exercise"><h3>Bài 2. Điền dấu (&gt;, =, &lt;) thích hợp:</h3><p>5 + 4 ${input('&gt;')} 7 + 1 &nbsp;&nbsp; 8 − 5 ${input('&gt;')} 8 − 2</p><p>9 − 4 ${input('=')} 7 − 2 &nbsp;&nbsp; 6 + 3 ${input('=')} 5 + 4</p></div><div class="exercise"><h3>Bài 3. Điền số sao cho tổng mỗi cột bằng 9:</h3><div class="tiny-grid">${[3,'', '', '',4, '', '', '', ''].map((v,i)=>v===''?input(String([2,5,6,1,3,4,7][i]||1)).replace('class="blank"','class="cell blank"'):`<div class="cell">${v}</div>`).join('')}</div></div>`;if(page===4)return `<div class="sheet-head"><span>ARCHIMEDES SCHOOL</span><span>TIẾT 2</span></div><div class="source-tag">Tái dựng từ Quyển 2 · trang 4</div><div class="exercise"><h3>Bài 1. Tính:</h3><p>10 − 1 = ${input('9')} &nbsp;&nbsp; 10 − 5 = ${input('5')} &nbsp;&nbsp; 10 − 3 = ${input('7')}</p></div><div class="exercise"><h3>Bài 2. Nhìn hình và viết phép tính cộng thích hợp.</h3><div class="shape-row"><span>🧁 🧁 🧁</span><span>+</span><span>🧁 🧁</span><span>+</span><span>🧁 🧁 🧁</span></div><p>${input('8')} + ${input('2')} + ${input('3')} = ${input('13')}</p></div>`;return `<div class="sheet-head"><span>TIẾT 3</span><span>QUYỂN 2</span></div><div class="source-tag">Tái dựng tương tác · Quyển 2</div><div class="exercise"><h3>Bài 1. Điền số:</h3><p>7 + 3 = ${input('10')} &nbsp;&nbsp; 10 − 6 = ${input('4')} &nbsp;&nbsp; 9 − 6 = ${input('3')}</p></div><div class="exercise"><h3>Bài 2. Điền dấu thích hợp:</h3><p>9 − 5 ${input('&lt;')} 7 + 2 &nbsp;&nbsp; 10 − 4 ${input('=')} 10 − 4</p></div>`}
function renderQ3(){if(page===3)return `<div class="sheet-head"><span class="week">TUẦN 19</span><span>TIẾT 1</span></div><div class="source-tag">Tái dựng từ Quyển 3 · trang 3</div><div class="exercise"><h3>Bài 1. Mỗi hình dưới đây có những hình gì?</h3><div class="shape-row"><svg class="svgbox" viewBox="0 0 150 100"><circle cx="55" cy="60" r="25" fill="#b9d7f2" stroke="#597ca8" stroke-width="3"/><circle cx="90" cy="35" r="15" fill="#9fd36d" stroke="#5b8b4c" stroke-width="3"/></svg><svg class="svgbox" viewBox="0 0 150 100"><rect x="20" y="25" width="90" height="55" fill="#f7b1c7" stroke="#b05c79" stroke-width="3"/><circle cx="65" cy="52" r="12" fill="#fff" stroke="#777"/></svg><svg class="svgbox" viewBox="0 0 150 100">${tri(75,50,38)}</svg></div><p>Chọn: hình tròn · hình vuông · hình tam giác · hình chữ nhật</p></div><div class="exercise"><h3>Bài 2. Hình vẽ dưới đây có bao nhiêu hình?</h3><svg viewBox="0 0 500 170" style="width:100%;max-width:560px;display:block;margin:auto"><rect x="55" y="35" width="380" height="100" fill="#fff" stroke="#555" stroke-width="3"/><path d="M55 135 L170 35 L285 135 L435 35" fill="none" stroke="#555" stroke-width="3"/><path d="M170 35 L170 135 M285 35 L285 135" stroke="#555" stroke-width="3"/></svg><p>Có ${input('6')} hình tam giác.</p></div><div class="exercise"><h3>Bài 3. Hình vuông có mấy cạnh?</h3><div class="choices"><button class="choice" data-answer="3">3</button><button class="choice" data-answer="4">4</button><button class="choice" data-answer="5">5</button></div></div>`;if(page===4)return `<div class="sheet-head"><span>ARCHIMEDES SCHOOL</span><span>TIẾT 2</span></div><div class="source-tag">Tái dựng từ Quyển 3 · trang 4</div><div class="exercise"><h3>Bài 1. Nối các điểm để được hình:</h3><div class="dot-board">${Array.from({length:10},()=>'<span class="dot"></span>').join('')}</div><p class="note">Bản tương tác sẽ cho bé nối điểm bằng thao tác chạm/kéo.</p></div><div class="exercise"><h3>Bài 2. Nếu chồng hình A lên hình B thì được hình nào?</h3><div class="choices"><button class="choice" data-answer="A">A</button><button class="choice" data-answer="B">B</button><button class="choice" data-answer="C">C</button></div></div><div class="exercise"><h3>Bài 3. Tìm quy luật rồi điền hình phù hợp.</h3><div class="sequence"><span class="tile">△</span> + <span class="tile">○</span> = <span class="tile">?</span></div></div>`;return `<div class="sheet-head"><span>TIẾT 3</span><span>QUYỂN 3</span></div><div class="source-tag">Tái dựng tương tác · Quyển 3</div><div class="exercise"><h3>Bài 1. Xếp hình bằng cách đánh số theo mẫu.</h3><div class="shape-row"><span class="tile">1 △</span><span class="tile">2 △</span><span class="tile">3 ▱</span><span>→</span><span class="tile">◇</span></div></div><div class="exercise"><h3>Bài 2. Chia hình thành các phần nhỏ.</h3><svg viewBox="0 0 500 180" style="width:100%;max-width:520px"><polygon points="30,145 140,40 450,40 450,145" fill="#fff" stroke="#555" stroke-width="3"/><path d="M140 40v105M245 40v105M350 40v105M30 145h420" stroke="#555" stroke-width="2"/></svg></div>`}
function renderQ4(){if(page===3)return `<div class="sheet-head"><span class="week">TUẦN 28</span><span>TIẾT 1</span></div><div class="source-tag">Tái dựng từ Quyển 4 · trang 3</div><div class="exercise"><h3>Bài 1. Đặt tính rồi tính:</h3><div class="math-line">25 + 33 = ${input('58')} &nbsp; 55 + 41 = ${input('96')} &nbsp; 26 + 32 = ${input('58')}</div><div class="math-line">14 + 62 = ${input('76')} &nbsp; 52 + 37 = ${input('89')} &nbsp; 17 + 21 = ${input('38')}</div></div><div class="exercise"><h3>Bài 2. Nối các phép tính có kết quả bằng nhau:</h3><div class="choices"><button class="choice" data-answer="A">16 + 32 ↔ 27 + 41</button><button class="choice" data-answer="B">13 + 53 ↔ 54 + 30</button><button class="choice" data-answer="C">57 + 11 ↔ 12 + 36</button></div></div><div class="exercise"><h3>Bài 3. Bình có 25 viên bi, Hải có 32 viên bi. Hỏi cả hai bạn có tất cả bao nhiêu viên bi?</h3><p>${input('57')} viên bi.</p></div><div class="exercise"><h3>Bài 4. Viết các số có hai chữ số mà chữ số hàng chục lớn hơn chữ số hàng đơn vị 3.</h3><input class="blank" style="width:260px" data-answer="41,52,63,74,85,96"></div>`;if(page===4)return `<div class="sheet-head"><span>ARCHIMEDES ACADEMY</span><span>TIẾT 2</span></div><div class="source-tag">Tái dựng từ Quyển 4 · trang 4</div><div class="exercise"><h3>Bài 1. Điền số thích hợp:</h3><p>70 − ${input('20')} = 50 &nbsp;&nbsp; 35 + ${input('20')} = 55</p><p>${input('40')} − 30 = 10 &nbsp;&nbsp; ${input('32')} + 42 = 74</p></div><div class="exercise"><h3>Bài 2. Chọn dấu (&gt;, =, &lt;):</h3><p>35 + 12 ${input('<')} 15 + 33 &nbsp;&nbsp; 41 + 16 ${input('>')} 57 − 1</p></div><div class="exercise"><h3>Bài 3. Bút chì: Có 12 bút chì màu, mua thêm 15. Có tất cả bao nhiêu?</h3><p>${input('27')} bút chì màu.</p></div>`;return `<div class="sheet-head"><span>TIẾT 3</span><span>QUYỂN 4</span></div><div class="source-tag">Tái dựng tương tác · Quyển 4</div><div class="exercise"><h3>Bài 1. Điền dấu (&gt;, =, &lt;):</h3><p>32 + 57 ${input('>')} 80 &nbsp;&nbsp; 25 + 23 ${input('>')} 53 + 15</p><p>35 + 24 ${input('>')} 15 + 42 &nbsp;&nbsp; 44 + 31 ${input('=')} 22 + 44</p></div><div class="exercise"><h3>Bài 2. Tính:</h3><p>21 + 32 + 14 = ${input('67')}</p><p>78 − 14 + 12 = ${input('76')}</p></div><div class="exercise"><h3>Bài 3. Vườn cây có 6 cây bưởi và 26 cây cam. Hỏi có tất cả bao nhiêu cây?</h3><p>${input('32')} cây.</p></div>`}
function render(){document.getElementById('bookTitle').textContent=books[book].title;document.getElementById('pageLabel').textContent=`Trang ${page} / ${books[book].pages}`;document.getElementById('prev').disabled=page<=3;document.getElementById('next').disabled=page>=books[book].pages;feedback.textContent='';sheet.innerHTML=book===1?renderQ1():book===2?renderQ2():book===3?renderQ3():renderQ4()}
function openBook(n){book=n;page=3;home.style.display='none';viewer.classList.add('active');render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.book').forEach(x=>x.addEventListener('click',()=>openBook(+x.dataset.book)));document.getElementById('backBtn').onclick=()=>{viewer.classList.remove('active');home.style.display='block';window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('prev').onclick=()=>{if(page>3){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};document.getElementById('next').onclick=()=>{if(page<books[book].pages){page++;render();window.scrollTo({top:0,behavior:'smooth'})}};sheet.addEventListener('click',e=>{if(!e.target.classList.contains('choice'))return;sheet.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));e.target.classList.add('selected')});document.getElementById('check').onclick=()=>{const blanks=[...sheet.querySelectorAll('input[data-answer]')];const selected=[...sheet.querySelectorAll('.choice.selected')];let ok=true;for(const x of blanks){if(String(x.value).trim()!==x.dataset.answer){ok=false;x.style.background='#fff0f0'}}for(const x of selected){const siblings=[...x.parentElement.querySelectorAll('.choice[data-answer]')];if(x.dataset.answer!==x.textContent.trim()&&x.dataset.answer!==x.dataset.value){}else{}}if(!blanks.length&&!selected.length){feedback.textContent='Hãy điền hoặc chọn câu trả lời trước nhé.';return}feedback.textContent=ok?'🎉 Chính xác! Hãy tiếp tục kiểm tra các câu trắc nghiệm nếu trang có nhiều phần.':'💪 Có chỗ chưa đúng. Bé hãy thử lại nhé.';feedback.style.color=ok?'#087443':'#b4232e'};
</script></body></html>
