<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Tách Gộp · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}main{min-height:100vh;padding:12px 14px 40px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:36px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:15px}.setting h3{margin:0 0 11px;font-size:17px}.choices{display:grid;gap:8px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(3,minmax(0,1fr))}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;line-height:1.15;min-width:0}.choice small{font-size:12px;font-weight:700}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.tip{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800}.question{text-align:center;color:var(--muted);font-weight:750;font-size:17px}.equation{text-align:center;font-size:52px;font-weight:950;letter-spacing:1px;color:var(--ink);margin:24px 0 30px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:70px;border:2px solid #ead3df;background:#fff;border-radius:18px;font-size:27px;font-weight:900;color:#514b5c;cursor:pointer}.answer.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.answer.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.feedback{text-align:center;min-height:42px;padding:14px 0;font-size:20px;font-weight:900}.feedback.bad{color:#b4232e}.fireworks{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:life 2s ease-in-out forwards}.firework{position:relative;width:210px;height:210px;opacity:0;transform:scale(.25);animation:burst 2s ease-in-out forwards}.firework:before{content:"🎉";position:absolute;font-size:78px;left:66px;top:65px}.spark{position:absolute;left:50%;top:50%;font-size:34px;animation:out 1.7s ease-out forwards}.s1{--x:-105px;--y:-85px}.s2{--x:0;--y:-125px}.s3{--x:105px;--y:-85px}.s4{--x:125px;--y:5px}.s5{--x:85px;--y:105px}.s6{--x:0;--y:125px}.s7{--x:-95px;--y:95px}.s8{--x:-125px;--y:5px}.s9{--x:-75px;--y:-115px}.s10{--x:75px;--y:-115px}@keyframes life{0%,100%{opacity:0}8%,88%{opacity:1}}@keyframes burst{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.18)}}@keyframes out{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}@media(max-width:760px){main{padding:12px 14px 35px}.hero h1{font-size:30px}.card{padding:16px;border-radius:22px}.settings{grid-template-columns:1fr;gap:12px}.ranges{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges .choice:last-child{grid-column:1/-1}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{font-size:14px;padding:9px 5px}.choice small{font-size:11px}.equation{font-size:43px;margin:20px 0 25px}.answer{min-height:68px;font-size:24px}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay"></div>
<main><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap">
<header class="hero"><div class="emoji">🧩</div><h1>Tách Gộp</h1><p>Lớp 1 · Luyện tập liên tục</p></header>
<section id="setup" class="card"><div class="settings"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices levels" id="levels"></div></div><div class="setting"><h3>🔢 Phạm vi số</h3><div class="choices ranges" id="ranges"></div></div><div class="setting"><h3>🧩 Dạng bài</h3><div class="choices operations" id="operations"></div></div></div><button id="startBtn" class="start">Bắt đầu luyện tập ✨</button><div class="tip">Không giới hạn số câu. Trả lời đúng sẽ tự động chuyển sang câu tiếp theo.</div></section>
<section id="quiz" class="card quiz"></section>
</div></main>
<script>
const $=id=>document.getElementById(id);const PREF='learning_math_split_merge_preferences_v1';
const LEVELS=[['basic','Cơ Bản','Các số trong phạm vi đã chọn'],['sequential','Tuần Tự','Các phép tính xuất hiện lần lượt, không bỏ sót']];
const RANGES=[10,20,50,100];const RANGE_LABELS=['0–10','0–20','0–50','0–100'];const TYPES=[['split','Tách'],['remaining','Còn Lại'],['mixed','Hỗn Hợp']];
let level='basic',range=10,type='split',current=null,answered=false,cursor=0,score=0,audioCtx=null;
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(LEVELS.some(x=>x[0]===p.level))level=p.level;if(RANGES.includes(p.range))range=p.range;if(TYPES.some(x=>x[0]===p.type))type=p.type}catch(e){}
function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range,type}))}catch(e){}}
function renderChoices(){$('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${x[0]===level?'on':''}" onclick="pickLevel('${x[0]}')">${x[1]}<br><small>${x[2]}</small></button>`).join('');$('ranges').innerHTML=RANGES.map((x,i)=>`<button class="choice ${x===range?'on':''}" onclick="pickRange(${x})">${RANGE_LABELS[i]}</button>`).join('');$('operations').innerHTML=TYPES.map(x=>`<button class="choice ${x[0]===type?'on':''}" onclick="pickType('${x[0]}')">${x[1]}</button>`).join('')}
function pickLevel(v){level=v;save();renderChoices()}function pickRange(v){range=v;save();renderChoices()}function pickType(v){type=v;save();renderChoices()}
function rand(n){return Math.floor(Math.random()*(n+1))}
function makeQuestion(){let kind=type;if(kind==='mixed')kind=cursor%2===0?'split':'remaining';if(level==='sequential'){const total=range+1;const i=cursor%(total*2);kind=type==='mixed'?(i%2===0?'split':'remaining'):kind;const pair=Math.floor(i/2);if(kind==='split'){const whole=Math.floor(pair/total);const part=pair%total;const remaining=whole-part;if(whole<=range&&part<=whole)return {kind,whole,known:part,answer:remaining}}else{const result=Math.floor(pair/total);const sub=pair%total;const whole=result+sub;if(whole<=range)return{kind,whole,result,answer:sub}}cursor++;return makeQuestion()}if(kind==='split'){const whole=rand(range);const known=whole===0?0:rand(whole);return{kind,whole,known,answer:whole-known}}const result=rand(range);const sub=rand(range-result);return{kind,whole:result+sub,result,answer:sub}}
function distractors(ans){const set=new Set([ans]);while(set.size<4){let d=ans+Math.floor(Math.random()*7)-3;if(d<0)d=Math.floor(Math.random()*Math.min(range+1,10));if(d<=range)set.add(d)}return [...set].sort(()=>Math.random()-.5)}
function initAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C()}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,type,gain,end){if(!audioCtx)return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(end)o.frequency.exponentialRampToValueAtTime(end,now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.01)}
function correctSound(){initAudio();tone(523,.18,'sine',1,659);setTimeout(()=>tone(659,.18,'sine',1,784),70);setTimeout(()=>tone(784,.28,'sine',1,1047),140)}function wrongSound(){initAudio();tone(260,.18,'square',1,150);setTimeout(()=>tone(190,.2,'square',1,120),110)}
function fireworks(){const w=document.createElement('div');w.className='fireworks';const f=document.createElement('div');f.className='firework';f.innerHTML=['🌟','✨','🎊','✨','🌟','✨','🎉','✨','🌟','🎊'].map((x,i)=>`<span class="spark s${i+1}">${x}</span>`).join('');w.appendChild(f);document.body.appendChild(w);setTimeout(()=>w.remove(),2050)}
function render(){current=makeQuestion();answered=false;const opts=distractors(current.answer);const title=current.kind==='split'?'Tách một số':'Tìm số còn lại';let equation=current.kind==='split'?`${current.whole} = ${current.known} + ?`:`${current.whole} = ${current.result} − ?`;$('quiz').innerHTML=`<div class="top"><span>Câu ${score+1}</span><span>Đúng: ${score}</span></div><div class="question">${title}</div><div class="equation">${equation}</div><div class="answers">${opts.map(x=>`<button class="answer" onclick="answer(${x},this)">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`}
function answer(value,button){if(answered)return;if(Number(value)===Number(current.answer)){answered=true;score++;button.classList.add('correct');correctSound();fireworks();setTimeout(render,2000)}else{button.classList.add('wrong');wrongSound();const f=$('feedback');f.className='feedback bad';f.textContent='✗ Chưa đúng — thử lại nhé!';setTimeout(()=>button.classList.remove('wrong'),500)}}
$('startBtn').onclick=()=>{initAudio();cursor=0;score=0;$('setup').style.display='none';$('quiz').classList.add('show');render()};renderChoices();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
