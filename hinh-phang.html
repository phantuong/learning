<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hình phẳng · Toán lớp 1</title><style>:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#f0dbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.grade.active{background:#fff0f7;color:var(--pink)}.sub{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open{display:grid;gap:3px}.sub a{font-size:14px;padding:8px 9px;border-radius:9px}.courses{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a{font-size:13px}.main{margin-left:260px;padding:20px;min-height:100vh}.wrap{max-width:900px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012;cursor:pointer}.overlay{display:none}.hero{text-align:center;padding:18px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:35px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:20px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:750;color:#625c6c;cursor:pointer;min-height:62px}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start,.again,.next{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:750}.bar{height:8px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 28px}.bar i{display:block;height:100%;background:var(--pink);transition:.2s}.question{text-align:center;font-size:22px;font-weight:850;color:#575163;margin-bottom:18px}.visual{min-height:245px;display:flex;align-items:center;justify-content:center;background:#fffafd;border:1px solid #f4e2eb;border-radius:20px;margin-bottom:18px;overflow:hidden}.visual svg{width:min(700px,94%);height:235px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px;font-size:18px;font-weight:850;color:#514b5c;cursor:pointer}.ans:hover{border-color:var(--pink)}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.ans:disabled{cursor:default}.feedback{text-align:center;min-height:50px;padding:12px 0;font-weight:850;font-size:18px}.next{display:none}.next.show{display:block}.result{text-align:center}.stars{font-size:46px}.result h2{font-size:29px;margin:8px}.result p{color:var(--muted);font-size:17px}.tip{margin-top:16px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#2b203855;z-index:15}.main{margin:0;padding:12px 14px 35px}.mobile{display:block}.card{padding:18px;border-radius:22px}.hero h1{font-size:30px}.choices{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.ans{padding:14px 5px}.visual{min-height:210px}.visual svg{height:205px}}</style></head><body><aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile" onclick="toggleNav()">☰</button><div class="wrap"><header class="hero"><div class="emoji">🔺🟦⭕💗</div><h1>Hình phẳng</h1><p>Nhận biết, đếm, chia và ghép các hình phẳng cơ bản</p></header><section class="card setup" id="setup"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices" id="levels"></div></div><button class="start" id="startBtn">Bắt đầu luyện tập ✨</button><div class="tip">Mỗi bài gồm 10 câu. Câu hỏi được kiểm tra trước khi hiển thị.</div></section><section class="card quiz" id="quiz"></section></div></main><script src="app-nav.js"></script><script>
const LEVELS=[['1','Nhận biết hình'],['2','Đếm hình'],['3','Hình phức tạp'],['4','Ghép & chia hình'],['5','Tổng hợp']];const NAME={circle:'hình tròn',triangle:'hình tam giác',square:'hình vuông',rectangle:'hình chữ nhật'},TYPES=Object.keys(NAME);let level=Number(localStorage.getItem('flatShapeLevel')||1),qs=[],pos=0,score=0,answered=false;const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),pick=()=>TYPES[rnd(TYPES.length)],shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};function toggleNav(){const s=$('side'),o=$('overlay');s.classList.toggle('open');o.classList.toggle('show')}function renderLevels(){$('levels').innerHTML='';LEVELS.forEach(([n,l])=>{const b=document.createElement('button');b.type='button';b.className='choice'+(+n===level?' on':'');b.innerHTML=`Level ${n}<br><small>${l}</small>`;b.onclick=()=>{level=+n;localStorage.setItem('flatShapeLevel',level);renderLevels()};$('levels').appendChild(b)})}function shape(t,x,y,w,h,f='#ffd7e9',s='#ec5fa4',sw=4){if(t==='circle')return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;if(t==='triangle')return `<polygon points="${x+w/2},${y+h*.08} ${x+w*.08},${y+h*.9} ${x+w*.92},${y+h*.9}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/>`;return `<rect x="${x+w*.08}" y="${y+h*.08}" width="${w*.84}" height="${h*.84}" rx="${t==='square'?5:2}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`}function one(t,r=0){return `<svg viewBox="0 0 260 190"><g transform="rotate(${r} 130 95)">${shape(t,50,20,160,150)}</g></svg>`}function identify(){const t=pick();return{prompt:'Đây là hình gì?',visual:one(t,[-18,0,12,28][rnd(4)]),answer:NAME[t],opts:shuffle([NAME[t],...shuffle(TYPES.filter(x=>x!==t)).slice(0,3).map(x=>NAME[x])])}}function countShapes(){const wanted=pick(),n=2+rnd(5),items=[];for(let i=0;i<n;i++)items.push(wanted);for(let i=0;i<3+rnd(3);i++)items.push(TYPES.filter(x=>x!==wanted)[rnd(3)]);shuffle(items);let svg='<svg viewBox="0 0 720 280">';items.forEach((t,i)=>svg+=shape(t,25+(i%6)*115,25+Math.floor(i/6)*115,78,78,t===wanted?'#ffd7e9':'#e7efff',t===wanted?'#ec5fa4':'#7187bf'));svg+='</svg>';const k=items.filter(x=>x===wanted).length;const vals=new Set([k,Math.max(1,k-1),k+1,k+2]);while(vals.size<4)vals.add(vals.size+1);return{prompt:`Có bao nhiêu ${NAME[wanted]} trong hình?`,visual:svg,answer:String(k),opts:shuffle([...vals].map(String)),verify:{kind:'count',count:k}}}function gridRect(){const twoByTwo=Math.random()<.55;let svg='<svg viewBox="0 0 420 260">';if(twoByTwo){svg+=`<rect x="70" y="35" width="280" height="190" fill="#e7efff" stroke="#7187bf" stroke-width="4"/><path d="M210 35V225M70 130H350" stroke="#ec5fa4" stroke-width="4"/>`;svg+='</svg>';return{prompt:'Có tất cả bao nhiêu hình chữ nhật trong hình?',visual:svg,answer:'9',opts:shuffle(['4','6','8','9']),verify:{kind:'count',count:9}}}svg+=`<rect x="70" y="55" width="280" height="150" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><path d="M210 55V205" stroke="#7187bf" stroke-width="4"/>`;svg+='</svg>';return{prompt:'Có tất cả bao nhiêu hình chữ nhật trong hình?',visual:svg,answer:'3',opts:shuffle(['1','2','3','4']),verify:{kind:'count',count:3}}}function gridSquare(){let svg='<svg viewBox="0 0 420 260"><rect x="85" y="20" width="250" height="220" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><path d="M210 20V240M85 130H335" stroke="#7187bf" stroke-width="4"/></svg>';return{prompt:'Có tất cả bao nhiêu hình vuông trong hình?',visual:svg,answer:'5',opts:shuffle(['3','4','5','6']),verify:{kind:'count',count:5}}}function triangleCount(){let svg='<svg viewBox="0 0 420 260"><polygon points="210,25 70,225 350,225" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><path d="M210 25V225" stroke="#7187bf" stroke-width="4"/></svg>';return{prompt:'Có tất cả bao nhiêu hình tam giác?',visual:svg,answer:'3',opts:shuffle(['2','3','4','5']),verify:{kind:'count',count:3}}}function partition(){const circle=Math.random()<.5,parts=Math.random()<.5?2:4;let svg='<svg viewBox="0 0 420 250">';if(circle){svg+=`<circle cx="210" cy="125" r="82" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/>`;svg+=parts===2?`<path d="M210 43V207" stroke="#7187bf" stroke-width="4"/>`:`<path d="M210 43V207M128 125H292" stroke="#7187bf" stroke-width="4"/>`}else{svg+=`<rect x="95" y="50" width="230" height="150" fill="#e7efff" stroke="#7187bf" stroke-width="4"/>`;svg+=parts===2?`<path d="M210 50V200" stroke="#ec5fa4" stroke-width="4"/>`:`<path d="M210 50V200M95 125H325" stroke="#ec5fa4" stroke-width="4"/>`}svg+='</svg>';return{prompt:'Hình này được chia thành mấy phần bằng nhau?',visual:svg,answer:String(parts),opts:shuffle(['2','3','4','5']),verify:{kind:'count',count:parts}}}function compose(){const pair=rnd(3);let visual,answer;if(pair===0){visual='<svg viewBox="0 0 420 250"><polygon points="80,200 210,45 210,200" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><polygon points="210,45 340,200 210,200" fill="#e7efff" stroke="#7187bf" stroke-width="4"/></svg>';answer='hình tam giác'}else if(pair===1){visual='<svg viewBox="0 0 420 250"><polygon points="80,60 210,60 80,190" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><polygon points="210,60 210,190 80,190" fill="#e7efff" stroke="#7187bf" stroke-width="4"/></svg>';answer='hình vuông'}else{visual='<svg viewBox="0 0 420 250"><rect x="80" y="70" width="130" height="110" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><rect x="210" y="70" width="130" height="110" fill="#e7efff" stroke="#7187bf" stroke-width="4"/></svg>';answer='hình chữ nhật'}return{prompt:'Các hình được ghép lại tạo thành hình gì?',visual,answer,opts:shuffle(['hình tròn','hình tam giác','hình vuông','hình chữ nhật'])}}function make(){if(level===1)return identify();if(level===2)return countShapes();if(level===3)return [gridRect,gridSquare,triangleCount][rnd(3)]();if(level===4)return rnd(2)?partition():compose();const all=[identify,countShapes,gridRect,gridSquare,triangleCount,partition,compose];return all[rnd(all.length)]()}function verifyQuestion(q){if(!q||!Array.isArray(q.opts)||q.opts.length!==4)return false;const opts=q.opts.map(String),ans=String(q.answer);if(new Set(opts).size!==opts.length)return false;if(!opts.includes(ans))return false;if(q.verify&&q.verify.kind==='count'&&Number(ans)!==Number(q.verify.count))return false;return true}function safeMake(){for(let i=0;i<100;i++){const q=make();if(verifyQuestion(q))return q}throw new Error('Không thể tạo câu hỏi hợp lệ')}function build(){qs=[];for(let i=0;i<10;i++){let q;try{q=safeMake()}catch(e){q=identify()}qs.push(q)}pos=0;score=0}function render(){const q=qs[pos];answered=false;$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div><div class="visual">${q.visual}</div><div class="answers">${q.opts.map((o,i)=>`<button type="button" class="ans" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button type="button" class="next" id="next">Tiếp theo →</button>`;$('quiz').querySelectorAll('.ans').forEach((b,i)=>b.onclick=()=>answer(b,q.opts[i]));$('next').onclick=nextQuestion}function answer(btn,v){if(answered)return;answered=true;const q=qs[pos],ok=String(v)===String(q.answer);$('quiz').querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===String(q.answer))b.classList.add('correct')});btn.classList.add(ok?'correct':'wrong');if(ok){score++;$('fb').textContent='🎉 Chính xác!';$('fb').style.color='#087443'}else{$('fb').textContent=`💪 Chưa đúng. Đáp án: ${q.answer}`;$('fb').style.color='#b4232e'}$('next').classList.add('show')}function nextQuestion(){if(pos<9){pos++;render()}else showResult()}function startQuiz(){build();$('setup').classList.add('hide');$('quiz').classList.add('show');render();window.scrollTo(0,0)}function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=9?'🌟🌟🌟':score>=7?'🌟🌟':'🌟'}</div><h2>Hoàn thành!</h2><p>Bé trả lời đúng <b>${score}/10</b> câu.</p><button type="button" class="again" id="again">Luyện lại ✨</button></div>`;$('again').onclick=startQuiz}$('startBtn').onclick=startQuiz;renderLevels();</script></body></html>
