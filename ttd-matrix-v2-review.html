<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Matrix v2 Review</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.matrix{display:grid;grid-template-columns:repeat(3,90px);gap:5px;margin:10px 0}.cell{border:1px solid #d6dde5;border-radius:10px;min-height:90px;display:grid;place-items:center}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{border:1px solid #d6dde5;border-radius:10px;padding:4px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.matrix{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:repeat(2,1fr)}}svg{max-width:100%}</style></head><body><h1>Matrix Reasoning v2</h1><div id="app"></div><script src="ttd-matrix-v2.js"></script><script src="ttd-matrix-validator-v2.js"></script><script src="ttd-matrix-bank-v2.js"></script><script>const qs=TTD_MATRIX_VALIDATOR_V2.validateBank(TTD_MATRIX_BANK_V2),app=document.getElementById('app');let ok=qs.filter(q=>q.validation.valid).length;app.innerHTML=`<p><b>${ok}/${qs.length}</b> valid</p>`;for(const q of qs){const grid=q.problem.grid;app.innerHTML+=`<section class="q"><b>${q.id}</b> — L${q.level} — <span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'VALID':'REJECTED'}</span><div class="matrix">${grid.flat().map(c=>c?`<div class="cell">${TTD_MATRIX_V2.renderCell(c)}</div>`:'<div class="cell">?</div>').join('')}</div><div class="choices">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_MATRIX_V2.renderCell(c)}</div>`).join('')}</div><small>${q.validation.errors.join(', ')}</small></section>`}</script></body></html>
