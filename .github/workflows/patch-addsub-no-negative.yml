name: Patch Cộng Trừ no negative numbers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-addsub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Cộng Trừ generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cong-tru-10.html')
          s = p.read_text(encoding='utf-8')
          old_multi = "function makeMulti(count){const nums=[],ops=[];const max=maxOperand();for(let i=0;i<count;i++)nums.push(rand(max));for(let i=0;i<count-1;i++)ops.push(operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−'));return{nums,ops,value:validExpression(nums,ops)}}"
          new_multi = "function makeMulti(count){const max=maxOperand();for(let attempt=0;attempt<5000;attempt++){const nums=[],ops=[];let value=operation==='sub'&&max>0?rand(max-1)+1:rand(max);nums.push(value);for(let i=1;i<count;i++){const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const n=op==='−'?rand(value):rand(max);nums.push(n);ops.push(op);value=op==='+'?value+n:value-n}if(value>=0)return{nums,ops,value}}const nums=Array(count).fill(1);const ops=Array(count-1).fill('+');return{nums,ops,value:count} }"
          old_answers = "function renderAnswers(q){let values=new Set([q.answer]);const span=Number.isFinite(range)?Math.max(12,Math.min(100,range)):100;while(values.size<4)values.add(Math.floor(Math.random()*(span*2+1))-Math.floor(span/3));const arr=shuffle([...values]);$('answerArea').innerHTML='<div class=\"answers\">'+arr.map(v=>`<button class=\"answer\" data-value=\"${v}\">${v}</button>`).join('')+'</div>';$('answerArea').querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(Number(b.dataset.value),b))}"
          new_answers = "function renderAnswers(q){let values=new Set([q.answer]);const span=Number.isFinite(range)?Math.max(12,Math.min(100,range)):100;while(values.size<4)values.add(Math.floor(Math.random()*(span+1)));const arr=shuffle([...values]);$('answerArea').innerHTML='<div class=\"answers\">'+arr.map(v=>`<button class=\"answer\" data-value=\"${v}\">${v}</button>`).join('')+'</div>';$('answerArea').querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(Number(b.dataset.value),b))}"
          if old_multi not in s:
              raise SystemExit('makeMulti pattern not found')
          if old_answers not in s:
              raise SystemExit('renderAnswers pattern not found')
          s=s.replace(old_multi,new_multi,1).replace(old_answers,new_answers,1)
          p.write_text(s,encoding='utf-8')
          print('Patched',p)
          PY
      - name: Verify no-negative generator rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cong-tru-10.html').read_text(encoding='utf-8')
          assert "const n=op==='−'?rand(value):rand(max)" in s
          assert "Math.floor(Math.random()*(span+1))" in s
          print('Verified: generated subtraction operands/results and answer choices cannot be negative.')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cong-tru-10.html
          git diff --cached --quiet || git commit -m 'Prevent negative numbers in Grade 1 addition subtraction'
          git push
