<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fb"><title>Vocabulary List · Tiếng Anh lớp 1</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:hidden}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 12px}.search{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none}.controls{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px}.control{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-weight:750;background:#eef2ff;color:var(--ink);cursor:pointer}.control.active{background:#fce7f3;color:#b42318}.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 8px}.sync{text-align:center;min-height:18px;font-size:12px;font-weight:700;padding:0 20px 10px}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:62px;height:62px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;font-size:34px;border:2px solid #f0dff0}.word{font-size:21px;font-weight:850}.ipa{font-size:14px;color:var(--muted);margin-top:3px}.meaning{font-size:17px;font-weight:700;margin-top:4px}.actions{display:flex;gap:7px}.speak,.star{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer}.speak{background:#fff0f7;color:var(--pink)}.star{background:#f2f4f7;color:#98a2b3}.star.selected{background:#fff3b8;color:#f59e0b}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:30px}.word{font-size:19px}.meaning{font-size:16px}.speak,.star{width:41px;height:41px}.actions{flex-direction:column;gap:5px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1 · Nguồn dữ liệu dùng chung cho toàn bộ chương trình</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"></div><div class="controls"><button id="selectAll" class="control">⭐ Chọn tất cả</button><button id="clearAll" class="control">Bỏ chọn tất cả</button><button id="selectedFilter" class="control">⭐ Chỉ hiện từ đã chọn</button></div><div id="count" class="count">Đang tải...</div><div id="sync" class="sync"></div><section id="list" class="list"></section></div></main><script>const URL='data/grade1/english/vocabulary.json',KEY='grade1EnglishSelectedWords';let words=[],selected=new Set(JSON.parse(localStorage.getItem(KEY)||'[]')),onlySelected=false;const details={'stand up':['/stænd ʌp/','đứng lên','🙋'],'sit down':['/sɪt daʊn/','ngồi xuống','🪑'],'open your book':['/ˈoʊpən jʊr bʊk/','mở sách','📖'],'raise your hand':['/reɪz jʊr hænd/','giơ tay','✋'],'listen and look':['/ˈlɪsən ænd lʊk/','lắng nghe và nhìn','👂'],'sit nicely':['/sɪt ˈnaɪsli/','ngồi ngay ngắn','🪑'],'be quiet':['/bi ˈkwaɪət/','giữ im lặng','🤫'],'speak English':['/spiːk ˈɪŋɡlɪʃ/','nói tiếng Anh','💬'],'happy':['/ˈhæpi/','vui','😊'],'sad':['/sæd/','buồn','😢'],'angry':['/ˈæŋɡri/','tức giận','😠'],'hungry':['/ˈhʌŋɡri/','đói','😋'],'thirsty':['/ˈθɜrsti/','khát','🥤'],'tired':['/ˈtaɪərd/','mệt','😴'],'scared':['/skerd/','sợ hãi','😨'],'sunny':['/ˈsʌni/','có nắng','☀️'],'rainy':['/ˈreɪni/','có mưa','🌧️'],'cloudy':['/ˈklaʊdi/','nhiều mây','☁️'],'windy':['/ˈwɪndi/','nhiều gió','💨'],'stormy':['/ˈstɔrmi/','có bão','⛈️'],'hot':['/hɑt/','nóng','🥵'],'cold':['/koʊld/','lạnh','🥶'],'monday':['/ˈmʌndeɪ/','thứ Hai','📅'],'tuesday':['/ˈtuːzdeɪ/','thứ Ba','📅'],'wednesday':['/ˈwenzdeɪ/','thứ Tư','📅'],'thursday':['/ˈθɜrzdeɪ/','thứ Năm','📅'],'friday':['/ˈfraɪdeɪ/','thứ Sáu','📅'],'saturday':['/ˈsætərdeɪ/','thứ Bảy','📅'],'sunday':['/ˈsʌndeɪ/','Chủ nhật','📅'],'one':['/wʌn/','một','1️⃣'],'two':['/tuː/','hai','2️⃣'],'three':['/θriː/','ba','3️⃣'],'four':['/fɔr/','bốn','4️⃣'],'five':['/faɪv/','năm','5️⃣'],'six':['/sɪks/','sáu','6️⃣'],'seven':['/ˈsevən/','bảy','7️⃣'],'eight':['/eɪt/','tám','8️⃣'],'nine':['/naɪn/','chín','9️⃣'],'ten':['/ten/','mười','🔟'],'I':['/aɪ/','tôi','👤'],'see':['/siː/','nhìn thấy','👀'],'the':['/ðə/','mạo từ xác định','🔤'],'my':['/maɪ/','của tôi','👉'],'name':['/neɪm/','tên','🏷️'],'feel':['/fiːl/','cảm thấy','💭'],'may':['/meɪ/','có thể / xin phép','🙋'],'drink':['/drɪŋk/','uống','🥤'],'water':['/ˈwɔtər/','nước','💧'],'weather':['/ˈweðər/','thời tiết','🌤️'],'day':['/deɪ/','ngày','📅'],'today':['/təˈdeɪ/','hôm nay','📆'],'many':['/ˈmeni/','nhiều','🔢'],'can':['/kæn/','có thể','✅']};function info(w){return details[w]||['',w,'📘']}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function save(){localStorage.setItem(KEY,JSON.stringify([...selected]))}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),shown=words.filter(w=>(!q||w.toLowerCase().includes(q))&&(!onlySelected||selected.has(w)));document.getElementById('count').textContent=`Đã chọn ${selected.size} / ${words.length} từ`;document.getElementById('list').innerHTML=shown.length?shown.map(w=>{const d=info(w),sel=selected.has(w);return `<article class="word-card"><div class="pic">${d[2]}</div><div><div class="word">${w}</div><div class="ipa">${d[0]}</div><div class="meaning">${d[1]}</div></div><div class="actions"><button class="speak" data-speak="${w.replaceAll('"','&quot;')}">🔊</button><button class="star ${sel?'selected':''}" data-word="${w.replaceAll('"','&quot;')}">★</button></div></article>`}).join(''):'<div class="empty">Không tìm thấy từ phù hợp.</div>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const w=b.dataset.word;selected.has(w)?selected.delete(w):selected.add(w);save();render()})}async function loadWords(){const r=await fetch(URL,{cache:'no-store'});if(!r.ok)throw Error('Không tải được Vocabulary Master List');const j=await r.json();words=[...new Set((j.words||[]).map(x=>x.word).filter(Boolean))];render()}document.getElementById('search').oninput=render;document.getElementById('selectAll').onclick=()=>{words.forEach(w=>selected.add(w));save();render()};document.getElementById('clearAll').onclick=()=>{selected.clear();save();render()};document.getElementById('selectedFilter').onclick=()=>{onlySelected=!onlySelected;document.getElementById('selectedFilter').classList.toggle('active',onlySelected);render()};loadWords().catch(e=>{document.getElementById('sync').textContent=e.message;document.getElementById('sync').style.color='#b42318'});</script><script src="navigation-v2.js?v=20261005"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261005v"></script><script src="auth-guard.js?v=20261005v"></script><script src="vocabulary-sync.js?v=20261005v"></script></body></html>
