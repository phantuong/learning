name: Install shared navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tag = '<script src="navigation-v2.js?v=20261005"></script>'
          pattern = r'\s*<script\s+src=["\']navigation-v2\.js\?v=[^"\']+["\']></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              updated=re.sub(pattern,'',s)
              if '</body>' in updated:
                  updated=updated.replace('</body>',tag+'</body>',1)
              if updated!=s:
                  p.write_text(updated,encoding='utf-8')
                  changed.append(p.name)
          print('Updated:',changed)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' navigation-v2.js
          git diff --cached --quiet || git commit -m 'Refresh shared navigation version'
          git push
