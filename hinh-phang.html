<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hình phẳng · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--pink2:#ffb8d9;--purple:#7467d9;--blue:#6d88c7;--yellow:#ffd35c;--green:#35b978;--red:#ee7180;--ink:#29243b;--muted:#777487;--line:#f0dbe7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff 0 16%,transparent 36%),#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.sub{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open{display:grid;gap:3px}.sub a{font-size:14px;padding:8px 9px;border-radius:9px}.courses{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a{font-size:13px}.main{margin-left:260px;padding:18px 20px 40px;min-height:100vh}.wrap{max-width:920px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012;cursor:pointer}.overlay{display:none}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:48px;letter-spacing:3px}.hero h1{font-size:36px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 12px 32px #d84d9410}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:20px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:15px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;min-height:72px;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:var(--pink)}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80;box-shadow:0 5px 12px #ec5fa422}.choice small{font-size:11px;font-weight:700;color:#777487}.start,.again,.next{width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(135deg,#ed62a8,#df4f98);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px #ec5fa444}.start:hover,.again:hover,.next:hover{transform:translateY(-1px)}.tip{margin-top:15px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800}.bar{height:9px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 24px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff80bb,#ec5fa4);transition:.25s}.question{text-align:center;font-size:24px;font-weight:950;color:#443d50;margin:4px auto 17px;max-width:760px}.visual{min-height:285px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffafd,#fff7fb);border:1px solid #f4dce8;border-radius:22px;margin-bottom:18px;overflow:hidden;position:relative}.visual:before,.visual:after{position:absolute;font-size:23px;opacity:.65}.visual:before{content:'✦';left:18px;top:14px;color:#ffb6d5}.visual:after{content:'✿';right:18px;bottom:12px;color:#ffd35c}.visual svg{width:min(760px,96%);height:260px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px;font-size:18px;font-weight:900;color:#514b5c;cursor:pointer;transition:.12s}.ans:hover{border-color:var(--pink);transform:translateY(-1px)}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.ans:disabled{cursor:default}.feedback{text-align:center;min-height:58px;padding:14px 0 8px;font-weight:900;font-size:18px}.next{display:none}.next.show{display:block}.result{text-align:center}.stars{font-size:50px}.result h2{font-size:30px;margin:8px}.result p{color:var(--muted);font-size:17px}.result .badge{display:inline-block;background:#fff0f7;color:#c83b80;padding:8px 14px;border-radius:99px;font-weight:900;margin-bottom:10px}.hint{margin:0 auto 12px;max-width:700px;color:#756c78;font-size:14px}.scene-label{font-size:24px;font-weight:950;fill:#453e50}.tiny{font-size:17px;font-weight:800;fill:#6c6472}.sun{fill:#ffd35c}.cloud{fill:#fff;stroke:#e9dfe8;stroke-width:2}.grass{fill:#b9e7bd}.tile{filter:drop-shadow(0 4px 3px #5d3b4a18)}@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#2b203855;z-index:15}.main{margin:0;padding:10px 12px 30px}.mobile{display:block}.card{padding:17px;border-radius:23px}.hero h1{font-size:30px}.hero .emoji{font-size:40px}.choices{grid-template-columns:repeat(2,1fr)}.question{font-size:21px}.answers{grid-template-columns:repeat(2,1fr)}.ans{padding:14px 5px}.visual{min-height:235px}.visual svg{height:220px}}
</style></head>
<body>
<aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside>
<div id="overlay" class="overlay" onclick="toggleNav()"></div>
<main class="main"><button class="mobile" onclick="toggleNav()">☰</button><div class="wrap">
<header class="hero"><div class="emoji">🔺 🟦 ⭕ 💗</div><h1>Hình phẳng</h1><p>Khám phá hình học qua những câu đố nhiều màu sắc 🌈</p></header>
<section class="card setup" id="setup"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices" id="levels"></div></div><button class="start" id="startBtn">Bắt đầu luyện tập ✨</button><div class="tip">Mỗi bài gồm 10 câu. Mỗi câu được <b>kiểm tra trước khi hiển thị</b> để tránh đáp án sai.</div></section>
<section class="card quiz" id="quiz"></section></div></main>
<script src="app-nav.js"></script>
<script>
const LEVELS=[
 ['1','Nhận biết hình','🔎'],['2','Hình quanh bé','🏠'],['3','Đoán theo đặc điểm','🧠'],['4','Đúng hay sai','🤔'],['5','Ghép hình','🧩'],
 ['6','Chia hình','✂️'],['7','Đếm hình thông minh','🔢'],['8','Mảnh ghép còn thiếu','🧱'],['9','Hình mở & kín','🔓'],['10','Thử thách tổng hợp','🌟']
];
const NAME={circle:'hình tròn',triangle:'hình tam giác',square:'hình vuông',rectangle:'hình chữ nhật'}, TYPES=Object.keys(NAME);
const COLORS={circle:['#ffd9ec','#ec5fa4'],triangle:['#ffe6a8','#e3a72f'],square:['#dce8ff','#6d88c7'],rectangle:['#d9f5e5','#35a874']};
let level=Number(localStorage.getItem('flatShapeLevel')||1),qs=[],pos=0,score=0,answered=false;
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),pick=()=>TYPES[rnd(TYPES.length)],shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function toggleNav(){const s=$('side'),o=$('overlay');s.classList.toggle('open');o.classList.toggle('show')}
function renderLevels(){$('levels').innerHTML='';LEVELS.forEach(([n,l,ic])=>{const b=document.createElement('button');b.type='button';b.className='choice'+(+n===level?' on':'');b.innerHTML=`<span style="font-size:20px">${ic}</span> Level ${n}<br><small>${l}</small>`;b.onclick=()=>{level=+n;localStorage.setItem('flatShapeLevel',level);renderLevels()};$('levels').appendChild(b)})}
function svgWrap(content,view='0 0 720 300'){return `<svg viewBox="${view}" role="img">${content}</svg>`}
function shape(t,x,y,w,h,fill,stroke,extra=''){const [f,s]=COLORS[t]||[fill||'#fff',stroke||'#777'];fill=fill||f;stroke=stroke||s;if(t==='circle')return `<circle class="tile" cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${fill}" stroke="${stroke}" stroke-width="4" ${extra}/>`;if(t==='triangle')return `<polygon class="tile" points="${x+w/2},${y+h*.08} ${x+w*.08},${y+h*.9} ${x+w*.92},${y+h*.9}" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round" ${extra}/>`;return `<rect class="tile" x="${x+w*.08}" y="${y+h*.08}" width="${w*.84}" height="${h*.84}" rx="${t==='square'?7:3}" fill="${fill}" stroke="${stroke}" stroke-width="4" ${extra}/>`}
function mascot(x,y,emo='😊'){return `<text x="${x}" y="${y}" font-size="42">${emo}</text>`}
function one(t,rot=0){return svgWrap(`<g transform="rotate(${rot} 360 150)">${shape(t,260,40,200,210)}</g>${mascot(35,65,'😊')}${mascot(635,250,'⭐')}`)}
function uniqueOptions(answer,others){return shuffle([String(answer),...others.filter(x=>String(x)!==String(answer))]).slice(0,4)}
function identify(){const t=pick();return{prompt:'🔎 Đây là hình gì?',visual:one(t,[-20,-8,0,12,25][rnd(5)]),answer:NAME[t],opts:shuffle([NAME[t],...shuffle(TYPES.filter(x=>x!==t)).map(x=>NAME[x])])}} 
function scene(){const target=pick();const targetN=2+rnd(3),others=[];for(let i=0;i<3+rnd(3);i++)others.push(TYPES.filter(x=>x!==target)[rnd(3)]);const items=Array(targetN).fill(target).concat(others);shuffle(items);let s='<rect x="0" y="235" width="720" height="65" class="grass"/><circle cx="65" cy="55" r="28" class="sun"/><text x="22" y="102" font-size="34">☁️</text><text x="650" y="90" font-size="34">☁️</text>';items.forEach((t,i)=>{const x=85+(i%5)*125,y=70+Math.floor(i/5)*125;s+=shape(t,x,y,75,75);});return{prompt:`🏠 Hãy tìm: có bao nhiêu ${NAME[target]} trong bức tranh?`,visual:svgWrap(s),answer:String(targetN),opts:uniqueOptions(targetN,[targetN-1,targetN+1,targetN+2].filter(n=>n>0)),verify:{kind:'count',count:targetN}}}
function properties(){const t=pick();let prompt,answer;if(t==='circle'){prompt='🧠 Hình nào không có cạnh thẳng và không có góc?';answer=NAME.circle}else if(t==='triangle'){prompt='🧠 Hình nào có đúng 3 cạnh và 3 góc?';answer=NAME.triangle}else if(t==='square'){prompt='🧠 Hình nào có 4 cạnh bằng nhau?';answer=NAME.square}else{prompt='🧠 Hình nào có 4 cạnh, với hai cạnh dài và hai cạnh ngắn?';answer=NAME.rectangle}return{prompt,visual:svgWrap(`<text x="360" y="58" text-anchor="middle" class="tiny">💡 Hãy đọc kỹ các đặc điểm!</text>${TYPES.map((x,i)=>shape(x,55+i*165,105,105,105)).join('')}${TYPES.map((x,i)=>`<text x="${105+i*165}" y="245" text-anchor="middle" class="tiny">${['A','B','C','D'][i]}</text>`).join('')}`),answer,opts:shuffle(TYPES.map(x=>NAME[x]))}}
function trueFalse(){const t=pick(),truth=Math.random()<.5;let statement;if(t==='square')statement=truth?'Một hình vuông luôn có 4 cạnh bằng nhau.':'Một hình vuông chỉ có 3 cạnh.';else if(t==='rectangle')statement=truth?'Hình chữ nhật có 4 cạnh.':'Hình chữ nhật không có góc.';else if(t==='triangle')statement=truth?'Xoay một hình tam giác thì nó vẫn là hình tam giác.':'Một hình tam giác có 4 góc.';else statement=truth?'Hình tròn không có góc.':'Hình tròn có 4 cạnh thẳng.';return{prompt:`🤔 ${statement}`,visual:one(t,truth?15:-15),answer:truth?'Đúng':'Sai',opts:['Đúng','Sai']}}
function compose(){const kind=rnd(3);let content,answer; if(kind===0){content=`${shape('triangle',110,80,180,160)}${shape('triangle',290,80,180,160,'#dce8ff','#6d88c7')}`;answer='hình tam giác'}else if(kind===1){content=`${shape('square',150,70,170,170)}${shape('square',320,70,170,170,'#dce8ff','#6d88c7')}`;answer='hình chữ nhật'}else{content=`${shape('triangle',190,65,170,150)}${shape('triangle',360,65,170,150,'#dce8ff','#6d88c7')}`;answer='hình tam giác'}return{prompt:'🧩 Các mảnh màu ghép lại tạo thành hình gì?',visual:svgWrap(`${content}${mascot(40,70,'🤖')}`),answer,opts:shuffle(TYPES.map(x=>NAME[x]))}}
function partition(){const t=Math.random()<.5?'circle':'rectangle',parts=Math.random()<.5?2:4;let content;if(t==='circle'){content=`<circle cx="360" cy="150" r="105" fill="#ffd9ec" stroke="#ec5fa4" stroke-width="5"/>${parts===2?'<path d="M360 45V255" stroke="#6d88c7" stroke-width="5"/>':'<path d="M360 45V255M255 150H465" stroke="#6d88c7" stroke-width="5"/>`}`}else{content=`<rect x="235" y="55" width="250" height="190" rx="8" fill="#dce8ff" stroke="#6d88c7" stroke-width="5"/>${parts===2?'<path d="M360 55V245" stroke="#ec5fa4" stroke-width="5"/>':'<path d="M360 55V245M235 150H485" stroke="#ec5fa4" stroke-width="5"/>`}`}return{prompt:`✂️ Hình này được chia thành mấy phần bằng nhau?`,visual:svgWrap(`${content}${mascot(35,65,'✂️')}`),answer:String(parts),opts:shuffle(['2','3','4','5']),verify:{kind:'count',count:parts}}}
function gridCount(){const n=2+rnd(2);const size=210/n,start=255;let lines='';for(let i=0;i<=n;i++){const p=start+i*size;lines+=`<path d="M${start} ${start}V${start+n*size}M${start} ${start+i*size}H${start+n*size}" stroke="#6d88c7" stroke-width="4"/>`;};const squares=n===2?5:n===3?14:5;return{prompt:`🔢 Trong lưới ${n}×${n} này có tất cả bao nhiêu hình vuông?`,visual:svgWrap(`<rect x="${start}" y="${start}" width="${n*size}" height="${n*size}" fill="#fff0f7"/>${lines}${mascot(35,70,'🦊')}`),answer:String(squares),opts:uniqueOptions(squares,[n*n, n*n+1, squares+1]),verify:{kind:'count',count:squares}}}
function missing(){const target=pick();const labels=TYPES.filter(x=>x!==target);let content='';for(let i=0;i<4;i++){const t=i===3?target:labels[i%3];content+=shape(t,100+(i%2)*250,55+Math.floor(i/2)*125,100,100)}return{prompt:'🧱 Ba ô đã có hình. Hình nào cần thêm để đủ bộ 4 hình?',visual:svgWrap(`${content}${mascot(35,65,'🧸')}`),answer:NAME[target],opts:shuffle(TYPES.map(x=>NAME[x]))}}
function openClosed(){const closed=Math.random()<.5;let content;if(closed){content=`<path d="M210 70 L330 70 L360 180 L240 220 L170 145 Z" fill="#ffd9ec" stroke="#ec5fa4" stroke-width="6"/>`; }else{content=`<path d="M170 150 L230 70 L350 105 L315 210" fill="none" stroke="#ec5fa4" stroke-width="7" stroke-linecap="round"/>`;}return{prompt:'🔓 Hình này là hình kín hay hình mở?',visual:svgWrap(`${content}${mascot(35,65,closed?'😊':'😯')}`),answer:closed?'Hình kín':'Hình mở',opts:['Hình kín','Hình mở']}}
function nested(){const type=Math.random()<.5?'rectangle':'square';let content='';if(type==='rectangle'){content=`<rect x="180" y="60" width="360" height="190" fill="#dce8ff" stroke="#6d88c7" stroke-width="5"/><path d="M360 60V250M180 155H540" stroke="#ec5fa4" stroke-width="5"/>`;return{prompt:'🌟 Có tất cả bao nhiêu hình chữ nhật trong hình?',visual:svgWrap(`${content}${mascot(45,70,'🦁')}`),answer:'9',opts:shuffle(['5','7','9','10']),verify:{kind:'count',count:9}}}content=`<rect x="210" y="40" width="300" height="220" fill="#ffd9ec" stroke="#ec5fa4" stroke-width="5"/><path d="M360 40V260M210 150H510" stroke="#6d88c7" stroke-width="5"/>`;return{prompt:'🌟 Có tất cả bao nhiêu hình vuông trong hình?',visual:svgWrap(`${content}${mascot(45,70,'🦁')}`),answer:'5',opts:shuffle(['3','4','5','6']),verify:{kind:'count',count:5}}}
function mixed(){const generators=[identify,scene,properties,trueFalse,compose,partition,gridCount,missing,openClosed,nested];return generators[rnd(generators.length)]()}
function make(){return [identify,scene,properties,trueFalse,compose,partition,gridCount,missing,openClosed,nested][level-1]()} 
function verifyQuestion(q){if(!q||typeof q.prompt!=='string'||!q.visual||!Array.isArray(q.opts)||q.opts.length!==4)return false;const opts=q.opts.map(String),ans=String(q.answer);if(new Set(opts).size!==opts.length)return false;if(!opts.includes(ans))return false;if(q.verify?.kind==='count'&&Number(ans)!==Number(q.verify.count))return false;return true}
function safeMake(){for(let i=0;i<100;i++){const q=make();if(verifyQuestion(q))return q}throw new Error('Không thể tạo câu hợp lệ')}
function build(){qs=[];const seen=new Set();for(let i=0;i<10;i++){let q=null;for(let tries=0;tries<100&&!q;tries++){try{const candidate=safeMake();const sig=level+'|'+candidate.prompt+'|'+candidate.answer;if(!seen.has(sig)){seen.add(sig);q=candidate}}catch(e){}}if(!q)q=safeMake();qs.push(q)}pos=0;score=0}
function render(){const q=qs[pos];answered=false;$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div><div class="visual">${q.visual}</div><div class="answers">${q.opts.map((o,i)=>`<button type="button" class="ans" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button type="button" class="next" id="next">Tiếp theo →</button>`;$('quiz').querySelectorAll('.ans').forEach((b,i)=>b.addEventListener('click',()=>answer(b,q.opts[i])));$('next').addEventListener('click',nextQuestion)}
function answer(btn,v){if(answered)return;answered=true;const q=qs[pos],ok=String(v)===String(q.answer);$('quiz').querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===String(q.answer))b.classList.add('correct')});btn.classList.add(ok?'correct':'wrong');if(ok){score++;$('fb').textContent='🎉 Chính xác!';$('fb').style.color='#087443'}else{$('fb').textContent=`💪 Gần đúng rồi! Đáp án là: ${q.answer}`;$('fb').style.color='#b4232e'}$('next').classList.add('show')}
function nextQuestion(){if(pos<9){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}else showResult()}
function startQuiz(){build();$('setup').classList.add('hide');$('quiz').classList.add('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=9?'🌟🌟🌟':score>=7?'🌟🌟':'🌟'}</div><div class="badge">Level ${level} hoàn thành</div><h2>Giỏi lắm! 🎉</h2><p>Bé trả lời đúng <b>${score}/10</b> câu.</p><button type="button" class="again" id="again">Luyện lại ✨</button></div>`;$('again').addEventListener('click',startQuiz)}
$('startBtn').addEventListener('click',startQuiz);renderLevels();
</script></body></html>
