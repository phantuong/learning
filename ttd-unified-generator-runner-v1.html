<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Unified Generator Runner</title><style>body{font-family:system-ui;margin:16px;background:#f6f7f9;color:#172033}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border-radius:14px;padding:14px}.pass{color:#087443}.fail{color:#b42318}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>TTD Unified Generator Runner v1</h1><p>Generate → Contract → Domain → Duplicate → Distribution</p><button id="run">Run 100 candidates / generator</button><div id="app" class="card">Chưa chạy.</div><script src="ttd-generator-spec-v1.js"></script><script src="ttd-quality-gate-v1.js"></script><script src="ttd-multicondition-generator-v2.js"></script><script src="ttd-relational-generator-v2.js"></script><script src="ttd-spatial-cube-v2.js"></script><script src="ttd-spatial-generator-v3.js"></script><script>const app=document.getElementById('app');function run(){const sets={multi:TTD_MULTICONDITION_GENERATOR_V2.generate(100),relational:TTD_RELATIONAL_GENERATOR_V2.generate(100),spatial:TTD_SPATIAL_GENERATOR_V3.generate(100)};let rows=[];for(const [name,items] of Object.entries(sets)){const contract=items.filter(q=>TTD_GENERATOR_SPEC_V1.validateContract(q).valid);const qg=TTD_QUALITY_GATE_V1.inspect(items);rows.push({name,total:items.length,contract:contract.length,duplicates:qg.exactDuplicates.length,near:qg.nearDuplicates.length,accepted:qg.accepted,rejected:qg.rejected})}app.innerHTML='<div class="grid">'+rows.map(r=>`<div class="card"><h2>${r.name}</h2><p>Total: <b>${r.total}</b></p><p>Contract: <b>${r.contract}</b></p><p>Accepted: <b class="pass">${r.accepted}</b></p><p>Rejected: <b class="fail">${r.rejected}</b></p><p>Exact dup: ${r.duplicates}</p><p>Near dup: ${r.near}</p></div>`).join('')+'</div>'}document.getElementById('run').onclick=run;run();</script></body></html>
