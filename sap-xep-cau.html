<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Sắp Xếp Câu · Tiếng Việt lớp 1</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}.main{min-height:100vh;padding:14px 14px 40px}.wrap{max-width:850px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:10px 0 18px}.hero .emoji{font-size:46px}.hero h1{font-size:34px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 10px 28px #d84d9410}.score{text-align:center;color:var(--muted);font-weight:850;font-size:18px;margin-bottom:12px}.instruction{text-align:center;font-size:21px;font-weight:850;margin:8px 0 18px}.pool,.answer{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:72px}.tile{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid #e7c9d9;background:#fff9fc;border-radius:16px;padding:13px 15px;font-size:22px;font-weight:850;color:#4f485a;cursor:grab;box-shadow:0 3px 8px #29243b0b}.tile.dragging{opacity:.45}.answer{min-height:84px;border:2px dashed #e5c5d7;border-radius:20px;padding:12px;background:#fffafd}.answer .tile{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.hint{text-align:center;color:#8a8290;font-size:14px;margin:12px 0}.feedback{text-align:center;min-height:35px;margin-top:12px;font-size:20px;font-weight:900}.bad{color:#b4232e}.good{color:#087443}.source{text-align:center;color:#aaa;font-size:10px;margin-top:12px}.fireworks{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:life 2s ease-in-out forwards}.firework{position:relative;width:210px;height:210px;opacity:0;transform:scale(.25);animation:burst 2s ease-in-out forwards}.firework:before{content:"🎉";position:absolute;font-size:78px;left:66px;top:65px}.spark{position:absolute;left:50%;top:50%;font-size:34px;animation:out 1.7s ease-out forwards}.s1{--x:-105px;--y:-85px}.s2{--x:0;--y:-125px}.s3{--x:105px;--y:-85px}.s4{--x:125px;--y:5px}.s5{--x:85px;--y:105px}.s6{--x:0;--y:125px}.s7{--x:-95px;--y:95px}.s8{--x:-125px;--y:5px}.s9{--x:-75px;--y:-115px}.s10{--x:75px;--y:-115px}@keyframes life{0%,100%{opacity:0}8%,88%{opacity:1}}@keyframes burst{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.18)}}@keyframes out{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}@media(max-width:760px){.main{padding:10px 12px 35px}.hero h1{font-size:29px}.card{padding:14px}.tile{font-size:18px;padding:11px 12px}.pool,.answer{gap:8px}}
</style></head><body><main class="main"><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap"><header class="hero"><div class="emoji">🧩</div><h1>Sắp Xếp Câu</h1><p>Tiếng Việt lớp 1 · Luyện tập liên tục</p></header><section class="card"><div class="score">Đã làm đúng: <span id="score">0</span> / <span id="total">0</span> câu</div><div class="instruction">Kéo các từ vào ô bên dưới để tạo thành câu hoàn chỉnh có nghĩa.</div><div id="pool" class="pool"></div><div class="hint">Có thể kéo lại các từ đã đặt để đổi vị trí.</div><div id="answer" class="answer"></div><div id="feedback" class="feedback"></div><div id="source" class="source"></div></section></div></main><script>
const DATA_URL='data/grade1/vietnamese/sap-xep-cau.json?v=20261007';
const CLOUD_URL='https://ksqfcwjcijflvzzopkko.supabase.co';
const CLOUD_KEY='sb_publishable_3WEpXJJe1HEgNJ4mfwmhUw_4jV9pQqg';
const PROGRESS_KEY='grade1_sentence_sort_device_id_v1';
let qs=[],index=-1,score=0,total=0,answered=false,resumeIndex=0;
const $=id=>document.getElementById(id);
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function initAudio(){try{if(!window.__sortAudio)window.__sortAudio=new(window.AudioContext||window.webkitAudioContext)();if(window.__sortAudio.state==='suspended')window.__sortAudio.resume()}catch(e){}}
function tone(f,s,d,t,g,e){const c=window.__sortAudio;if(!c)return;const now=c.currentTime+s,o=c.createOscillator(),a=c.createGain();o.type=t;o.frequency.setValueAtTime(f,now);if(e)o.frequency.exponentialRampToValueAtTime(e,now+d);a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(g,now+.006);a.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(a);a.connect(c.destination);o.start(now);o.stop(now+d+.01)}
function correctSound(){initAudio();tone(523,0,.18,'sine',1,659);tone(659,.07,.18,'sine',1,784);tone(784,.14,.30,'sine',1,1047)}
function wrongSound(){initAudio();tone(260,0,.18,'square',1,150);tone(190,.11,.22,'square',1,120)}
function fireworks(){const w=document.createElement('div');w.className='fireworks';const f=document.createElement('div');f.className='firework';f.innerHTML=['🌟','✨','🎊','✨','🌟','✨','🎉','✨','🌟','🎊'].map((x,i)=>'<span class="spark s'+(i+1)+'">'+x+'</span>').join('');w.appendChild(f);document.body.appendChild(w);setTimeout(()=>w.remove(),2050)}
function newQ(){answered=false;index=(index===-1?resumeIndex:(index+1)%qs.length);const q=qs[index];$('pool').innerHTML='';shuffle(q.pool).forEach(v=>$('pool').appendChild(renderTile(v,'pool')));$('answer').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('source').textContent=q.source?'Nguồn: '+q.source:'';$('score').textContent=score;$('total').textContent=total}
function tile(v,where){const e=document.createElement('div');e.className='tile';e.draggable=false;e.dataset.value=v;e.dataset.where=where;e.textContent=v;bind(e);return e.outerHTML}
function renderTile(v,where){const el=document.createElement('div');el.className='tile';el.dataset.value=v;el.dataset.where=where;el.textContent=v;bind(el);return el}
function bind(el){el.addEventListener('click',e=>{if(el.__dragged){el.__dragged=false;return}initAudio();if(el.parentElement?.classList.contains('pool'))place(el.dataset.value,el.parentElement,el);else if(el.parentElement?.classList.contains('answer'))returnPool(el.dataset.value,el)});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();initAudio();const value=el.dataset.value,from=el.parentElement,sx=e.clientX,sy=e.clientY;let active=false,ghost=null;const move=ev=>{if(!active){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;active=true;el.__dragged=true;ghost=el.cloneNode(true);ghost.style.position='fixed';ghost.style.zIndex='99999';ghost.style.pointerEvents='none';ghost.style.width=el.getBoundingClientRect().width+'px';document.body.appendChild(ghost);el.classList.add('dragging')}ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px'};const end=ev=>{document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',end,true);document.removeEventListener('pointercancel',end,true);if(ghost)ghost.remove();el.classList.remove('dragging');if(!active)return;const target=document.elementFromPoint(ev.clientX,ev.clientY),zone=target&&target.closest('.answer');if(zone)place(value,from,el,ev.clientX,ev.clientY);else if(from.classList.contains('answer')&&target&&target.closest('.pool'))returnPool(value,el)};document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true)})}
function place(value,from,original,x,y){const answer=$('answer');let el=original;const movingFromAnswer=from.classList.contains('answer');if(!movingFromAnswer){el=renderTile(value,'answer');original?.remove()}else if(el){el.remove();el.dataset.where='answer'}else el=renderTile(value,'answer');let before=null;if(Number.isFinite(x)&&Number.isFinite(y)){const target=document.elementFromPoint(x,y)?.closest('.answer .tile');if(target&&target!==el){const r=target.getBoundingClientRect();if(x<r.left+r.width/2)before=target;else{const next=target.nextElementSibling;if(next)before=next}}}answer.insertBefore(el,before);check()}
function returnPool(value,original){const el=original||[...$('answer').children].find(x=>x.dataset.value===value);if(!el)return;el.remove();$('pool').appendChild(renderTile(value,'pool'));$('feedback').textContent=''}
async function saveProgress(){
  try{
    const deviceId=getDeviceId();
    await fetch(CLOUD_URL+'/rest/v1/grade1_sentence_sort_progress?on_conflict=device_id',{
      method:'POST',
      headers:{'apikey':CLOUD_KEY,'Authorization':'Bearer '+CLOUD_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({device_id:deviceId,exercise_index:(index+1)%qs.length,score,total,updated_at:new Date().toISOString()})
    });
  }catch(e){}
}
function getDeviceId(){
  let id=localStorage.getItem(PROGRESS_KEY);
  if(!id){id=crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem(PROGRESS_KEY,id)}
  return id;
}
async function loadProgress(){
  try{
    const r=await fetch(CLOUD_URL+'/rest/v1/grade1_sentence_sort_progress?select=exercise_index,score,total&device_id=eq.'+encodeURIComponent(getDeviceId()),{
      headers:{'apikey':CLOUD_KEY,'Authorization':'Bearer '+CLOUD_KEY}
    });
    if(r.ok){
      const rows=await r.json();
      if(rows[0]){
        resumeIndex=Math.max(0,Math.min(Number(rows[0].exercise_index)||0,qs.length-1));
        score=Number(rows[0].score)||0;
        total=Number(rows[0].total)||0;
      }
    }
  }catch(e){}
}
function check(){if(answered)return;const vals=[...document.querySelector('#answer').children].map(x=>x.dataset.value);if(vals.length!==qs[index].answer.length)return;if(vals.join('|')===qs[index].answer.join('|')){answered=true;score++;total++;$('score').textContent=score;$('total').textContent=total;correctSound();fireworks();saveProgress();setTimeout(newQ,2000)}else{wrongSound();$('feedback').textContent='✗ Chưa đúng — hãy sắp xếp lại nhé!';$('feedback').className='feedback bad';setTimeout(()=>{$('feedback').textContent=''},900)}}
async function start(){try{const r=await fetch(DATA_URL,{cache:'no-store'});qs=await r.json();if(!Array.isArray(qs)||!qs.length)throw new Error('empty');await loadProgress();newQ()}catch(e){$('feedback').textContent='Không tải được ngân hàng câu hỏi. Vui lòng tải lại trang.';$('feedback').className='feedback bad'}}
document.addEventListener('pointerdown',initAudio,{once:true});start();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
