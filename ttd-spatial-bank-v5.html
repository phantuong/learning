<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial Bank v5</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.summary,.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #d6dde5;border-radius:12px;padding:5px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Spatial Bank v5</h1><div id="app"></div><script src="ttd-spatial-v1.js"></script><script src="ttd-spatial-view-v2.js"></script><script src="ttd-spatial-validator-v4.js"></script><script src="ttd-spatial-families-v5.js"></script><script src="ttd-spatial-bank-v5.js"></script><script src="ttd-spatial-choice-v2.js"></script><script>const all=[...TTD_SPATIAL_BANK_V5,...TTD_SPATIAL_BANK_V5_REJECTED],app=document.getElementById('app');app.innerHTML=`<div class="summary"><b>Candidate:</b> ${all.length} &nbsp; <b>Published:</b> ${TTD_SPATIAL_BANK_V5.length} &nbsp; <b>Rejected:</b> ${TTD_SPATIAL_BANK_V5_REJECTED.length}</div>`;for(const q of all){app.innerHTML+=`<section class="q"><b>${q.id}</b> — ${q.family} — L${q.level}<div>${q.question}</div><span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'✓ VALID':'✗ REJECTED'}</span><div class="grid">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_SPATIAL_CHOICE_V2.render({type:'projection',cubes:c.cubes,view:c.view},120)}</div>`).join('')}</div></section>`}</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
