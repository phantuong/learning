<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Learning Hub · Lớp 1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid #e2e6ee;padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:#182033;font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;padding:0 10px 7px}.nav{display:grid;gap:4px}.nav a,.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#475467;font-weight:700;border:0;background:transparent;width:100%;font:inherit;text-align:left;cursor:pointer}.nav a:hover,.grade-toggle:hover{background:#f8faff}.nav a.active{background:#182033;color:#fff}.icon{width:24px;text-align:center;font-size:18px}.chev{margin-left:auto;color:#98a2b3}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid #e2e6ee}.subnav.open{display:grid;gap:3px}.subnav a{font-size:14px;padding:8px 9px}.course-list{display:grid;gap:2px;margin:2px 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-size:13px;font-weight:600}.course-list a.active{background:#f0f3ff;color:#182033}.main{margin-left:260px;min-height:100vh;padding:24px}.wrap{max-width:920px;margin:auto}.mobile-btn{display:none;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #18203312}.overlay{display:none}.back{color:#5e6a80;text-decoration:none}.header{text-align:center;padding:20px 0 28px}.emoji{font-size:42px}h1{font-size:34px;margin:5px 0}.subtitle{margin:0;color:#68738a;font-size:17px}.subject{background:#fff;border:1px solid #e2e6ee;border-radius:24px;padding:22px;box-shadow:0 7px 20px #1820330d;margin-bottom:18px}.subject-head{display:flex;align-items:center;gap:13px}.subject-icon{font-size:40px}.subject h2{margin:0;font-size:23px}.subject p{color:#68738a;margin:6px 0 18px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.course{display:block;text-decoration:none;color:#182033;border:1px solid #e2e6ee;border-radius:18px;padding:16px;background:#fbfcff}.course-title{font-weight:800;font-size:17px}.course-desc{font-size:14px;color:#68738a;margin-top:5px;line-height:1.4}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:#eaf7ef;color:#087443;font-size:12px;font-weight:700}.empty{background:#fff;border:1px dashed #cbd2df;border-radius:18px;padding:20px;color:#68738a}@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:.22s;width:270px;box-shadow:12px 0 35px #18203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#18203355;z-index:15}.main{margin-left:0;padding:12px 14px 35px}.mobile-btn{display:block;margin-bottom:8px}.courses{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><div class="layout"><aside id="sidebar" class="sidebar"><a class="brand" href="index.html?home=1"><span>🎓</span>Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile-btn" onclick="toggleNav()">☰</button><div class="wrap"><a class="back" href="index.html?home=1">← Trang chủ</a><header class="header"><div class="emoji">🎓</div><h1>Lớp <span id="gradeTitle">1</span></h1><p class="subtitle">Chọn môn học và khóa học</p></header><section id="subjects"></section></div></main></div><script>const grade=Number(new URLSearchParams(location.search).get('grade')||1);localStorage.setItem('learningLastAccess',JSON.stringify({href:'class.html?grade='+grade,title:'Lớp '+grade,grade,time:Date.now()}));document.title='Lớp '+grade+' · Learning Hub';document.getElementById('gradeTitle').textContent=grade;const data={1:[{icon:'🔤🌈',name:'Tiếng Anh',desc:'Học tiếng Anh theo từng khóa học.',courses:[{title:'Vocabulary Games',desc:'Ghi nhớ cách viết từ vựng bằng trò chơi tương tác.',href:'english.html'},{title:'Vocabulary List',desc:'Xem toàn bộ từ vựng kèm hình minh họa, nghĩa tiếng Việt và phát âm.',href:'vocabulary-list.html'}]},{icon:'📖',name:'Tiếng Việt',desc:'Đọc, viết, từ ngữ và kiến thức Tiếng Việt.',courses:[]},{icon:'➗',name:'Toán tư duy',desc:'Bài học và luyện tập Toán tư duy dành cho học sinh lớp 1.',courses:[{title:'Luyện tập Toán tư duy',desc:'Số, chữ số và phép toán · bài tập tương tác.',href:'math.html'}]},{icon:'🔢',name:'Math',desc:'Mathematics learning in English.',courses:[]}]};function toggleNav(){sidebar.classList.toggle('open');overlay.classList.toggle('show')}function renderNav(){gradeNav.innerHTML=Array.from({length:12},(_,i)=>{const g=i+1,open=g===grade;return `<div><button class="grade-toggle ${open?'active':''}" onclick="toggleGrade(${g})"><span class="icon">${open?'📂':'📁'}</span><span>Lớp ${g}</span><span class="chev">${open?'⌃':'›'}</span></button><div id="sub-${g}" class="subnav ${open?'open':''}"><a href="class.html?grade=${g}" class="${open?'active':''}">🏫 Tổng quan</a>${g===1?`<a href="english.html">🔤🌈 Tiếng Anh</a><div class="course-list"><a href="english.html">↳ Vocabulary Games</a><a href="vocabulary-list.html">↳ Vocabulary List</a></div><a href="math.html">➗ Toán tư duy</a><a href="#">📖 Tiếng Việt</a>`:'<a href="class.html?grade='+g+'">📚 Môn học</a>'}</div></div>`}).join('')}function toggleGrade(g){document.getElementById('sub-'+g)?.classList.toggle('open')}function renderSubjects(){const list=data[grade]||[];subjects.innerHTML=list.map(s=>`<article class="subject"><div class="subject-head"><div class="subject-icon">${s.icon}</div><div><h2>${s.name}</h2><p>${s.desc}</p></div></div>${s.courses.length?`<div class="courses">${s.courses.map(c=>`<a class="course" href="${c.href}"><div class="course-title">${c.title}</div><div class="course-desc">${c.desc}</div><span class="badge">Đang học</span></a>`).join('')}</div>`:'<div class="empty">Các khóa học đang được xây dựng.</div>'}</article>`).join('')}renderNav();renderSubjects();</script></body></html>
