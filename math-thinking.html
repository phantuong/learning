<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toán Tư Duy · Lớp 1</title><style>body{margin:0;background:#f4f6fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 16px 48px}.hero{background:#182033;color:#fff;border-radius:26px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.82}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e6ee;border-radius:20px;padding:20px;text-decoration:none;color:#182033}.icon{font-size:38px}.card h2{margin:8px 0 5px}.card p{margin:0;color:#68738a;line-height:1.5}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>🧠 Toán Tư Duy · Lớp 1</h1><p>Rèn luyện tư duy qua hình ảnh, quy luật, logic và không gian.</p></section><section class="grid" id="groups"></section></main><script>const groups=[['pattern','🔷','Quy luật & Dãy hình','Tìm quy luật và chọn hình tiếp theo.'],['classification','🟢','Phân loại','Tìm điểm giống, khác và nhóm các hình.'],['analogy','🔄','Tương tự','Nhận biết phép biến đổi giữa các hình.'],['matrix','🧩','Ma trận hình ảnh','Tìm quy luật trong bảng hình.'],['spatial','🧭','Tư duy không gian','Vị trí, hướng và phép xoay.'],['counting','🔢','Đếm & Logic','Đếm, thay đổi số lượng và quan hệ.'],['ordering','📏','Sắp xếp & So sánh','Sắp xếp và so sánh các đối tượng.'],['missing-piece','🧩','Mảnh ghép còn thiếu','Hoàn thành hình theo quy luật.']];document.getElementById('groups').innerHTML=groups.map(g=>`<a class="card" href="thinking-practice.html?group=${g[0]}"><div class="icon">${g[1]}</div><h2>${g[2]}</h2><p>${g[3]}</p></a>`).join('');</script></body></html>
