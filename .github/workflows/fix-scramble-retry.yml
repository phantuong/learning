name: Verify scramble retry behavior

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Sắp xếp chữ cái retry behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('voca-scramble.html').read_text(encoding='utf-8')
          assert "💪 Chưa đúng! Hãy thử lại nhé." in s
          assert "speakWord(q.word)" in s
          assert "beep();" in s
          assert "$('nextBtn').classList.add('hidden')" in s
          assert "$('checkBtn').disabled=false" in s
          print('Scramble retry behavior verified.')
          PY

# Deployment trigger verification
