<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Content QA</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#17663f}.bad{color:#9b292d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{padding:10px;border-radius:10px;background:#eef1f6}.good{background:#eaf9f1}.warn{background:#fff4dc}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e8ee;text-align:left}</style></head><body><main class="wrap"><h1>🧪 Toán Tư Duy — Content QA</h1><div class="card" id="summary">Checking…</div><div class="card"><h2>Question coverage</h2><div class="grid" id="coverage"></div></div><div class="card"><h2>Validation errors</h2><div id="errors">Checking…</div></div></main><script src="data/ttd-question-bank.js"></script><script src="data/ttd-question-bank-l2-l3.js"></script><script src="data/ttd-question-bank-production.js"></script><script src="data/ttd-structured-visual-bank.js"></script><script src="data/ttd-content-manifest.js"></script><script>const r=TTD_CONTENT_MANIFEST.build();const min=5;const groups=r.groups;const missing=[];groups.forEach(g=>[1,2,3].forEach(l=>{const n=r.counts[`${g}:${l}`]||0;if(n<min)missing.push(`${g} L${l}: ${n}/${min}`)}));document.getElementById('summary').innerHTML=`<strong>${r.total}</strong> questions loaded · <span class="${r.errors.length?'bad':'ok'}">${r.errors.length} validation errors</span> · <span class="${missing.length?'bad':'ok'}">${missing.length} levels below ${min} questions</span>`;document.getElementById('coverage').innerHTML=groups.flatMap(g=>[1,2,3].map(l=>{const n=r.counts[`${g}:${l}`]||0;return `<div class="cell ${n>=min?'good':'warn'}"><strong>${g}</strong> L${l}<br>${n} questions</div>`})).join('');document.getElementById('errors').innerHTML=r.errors.length?`<ul>${r.errors.map(e=>`<li class="bad">${e}</li>`).join('')}</ul>`:'<span class="ok">✓ No schema or duplicate-ID errors.</span>'+(missing.length?`<h3>Coverage to improve</h3><ul>${missing.map(x=>`<li class="bad">${x}</li>`).join('')}</ul>`:'')}</script></body></html>
