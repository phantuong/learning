<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><title>Cộng Trừ Phạm Vi 10 · Lớp 1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f4f6fb;--line:#e1e6ef;--muted:#68738a;--nav:#182033;--blue:#4d7cff;--green:#18a66a;--red:#e45563;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:#182033;font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;padding:0 10px 7px}.nav{display:grid;gap:4px}.nav a,.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#475467;font-weight:700;border:0;background:transparent;width:100%;font:inherit;text-align:left;cursor:pointer}.nav a:hover,.grade-toggle:hover{background:#f8faff}.nav a.active,.grade-toggle.current{background:var(--nav);color:#fff}.icon{width:24px;text-align:center;font-size:18px}.chev{margin-left:auto;color:#98a2b3}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid var(--line)}.subnav.open{display:grid;gap:3px}.subnav a{font-size:14px;padding:8px 9px;border-radius:9px}.subnav a.active{background:var(--nav);color:#fff}.course-list{display:grid;gap:2px;margin:2px 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-size:13px;font-weight:600}.course-list a.active{background:#eef2ff;color:#182033}.main{margin-left:260px;min-height:100vh;padding:22px}.wrap{max-width:850px;margin:auto}.mobile-btn{display:none;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #18203312}.overlay{display:none}.hero{text-align:center;padding:14px 0 20px}.hero .emoji{font-size:44px}.hero h1{font-size:34px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:16px}.setup,.exam,.result{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 8px 25px #1820330d}.setup h2{margin:0 0 7px;font-size:24px}.setup p{color:var(--muted);margin:0 0 20px}.group{margin:18px 0}.group-title{font-weight:850;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid #dbe1ec;background:#fbfcff;border-radius:16px;padding:14px 10px;font-size:17px;font-weight:800;color:#182033;cursor:pointer}.choice.selected{background:var(--nav);border-color:var(--nav);color:#fff}.start,.next,.restart{width:100%;border:0;border-radius:17px;background:var(--nav);color:#fff;padding:16px;font-size:19px;font-weight:850;cursor:pointer;margin-top:8px}.exam-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.qno{font-weight:850}.score{color:var(--muted);font-weight:750}.progress{height:9px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin:12px 0 30px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s}.question-label{text-align:center;color:var(--muted);font-weight:700;font-size:16px}.equation{text-align:center;font-size:56px;font-weight:950;letter-spacing:2px;margin:22px 0 28px}.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer-btn{min-height:74px;border:2px solid #dbe1ec;background:#fbfcff;border-radius:18px;font-size:27px;font-weight:900;color:#182033;cursor:pointer}.answer-btn:active{transform:scale(.98)}.answer-btn.correct{background:#eaf8f1;border-color:#48bd86;color:#087443}.answer-btn.wrong{background:#fff0f1;border-color:#ef8992;color:#b4232e}.write-area{text-align:center}.number-input{width:100%;max-width:320px;text-align:center;border:2px solid #cbd5e1;border-radius:18px;padding:16px;font-size:34px;font-weight:900;outline:none;background:#fff}.number-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #4d7cff18}.mic-area{text-align:center}.mic{width:100px;height:100px;border-radius:50%;border:0;background:#eef2ff;color:#344b9b;font-size:43px;cursor:pointer;box-shadow:0 7px 0 #d9e1ff}.mic.pressed{background:#d8e3ff;transform:translateY(4px);box-shadow:0 3px 0 #bccbf7}.mic.listening{animation:pulse 1s infinite}.speech-status{margin-top:15px;color:var(--muted);font-weight:700;min-height:24px}.feedback{text-align:center;min-height:34px;margin:16px 0 0;font-size:18px;font-weight:850}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.next{display:none}.next.show{display:block}.result{text-align:center}.result .big{font-size:58px}.result h2{font-size:30px;margin:8px 0}.result p{font-size:18px;color:var(--muted)}.result strong{color:var(--nav)}.hidden{display:none!important}@keyframes pulse{50%{transform:scale(1.06)}}@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:.22s;width:270px;box-shadow:12px 0 35px #18203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#18203355;z-index:15}.main{margin-left:0;padding:12px 14px 35px}.mobile-btn{display:block;margin-bottom:8px}.hero h1{font-size:29px}.setup,.exam,.result{padding:18px;border-radius:22px}.choices{grid-template-columns:1fr}.equation{font-size:46px;margin:20px 0 25px}.answer-grid{grid-template-columns:1fr 1fr}.answer-btn{min-height:68px}.number-input{max-width:none}}
</style></head><body><aside id="sidebar" class="sidebar"><a class="brand" href="index.html?home=1"><span>🎓</span>Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile-btn" onclick="toggleNav()">☰</button><div class="wrap"><header class="hero"><div class="emoji">➕➖</div><h1>Cộng Trừ Phạm Vi 10</h1><p>Lớp 1 · Bài thi 10 câu</p></header><section id="setup" class="setup"><h2>Bắt đầu luyện tập</h2><p>Mỗi lần vào bài sẽ có 10 câu hỏi ngẫu nhiên. Chọn dạng phép tính và cách trả lời trước khi bắt đầu.</p><div class="group"><div class="group-title">Phép tính</div><div class="choices" id="operationChoices"><button class="choice selected" data-value="add">Cộng</button><button class="choice" data-value="sub">Trừ</button><button class="choice" data-value="mixed">Cộng - Trừ</button></div></div><div class="group"><div class="group-title">Cách trả lời</div><div class="choices" id="modeChoices"><button class="choice selected" data-value="choice">Chọn Đáp Án</button><button class="choice" data-value="write">Viết Đáp Án</button><button class="choice" data-value="speak">Nói Đáp Án</button></div></div><button id="startBtn" class="start">Bắt đầu bài thi →</button></section><section id="exam" class="exam hidden"><div class="exam-head"><div class="qno">Câu <span id="qNo">1</span> / 10</div><div class="score">Đúng: <span id="score">0</span></div></div><div class="progress"><i id="progressBar"></i></div><div class="question-label">Tính kết quả</div><div id="equation" class="equation">3 + 4 = ?</div><div id="answerArea"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next">Câu tiếp theo →</button></section><section id="result" class="result hidden"></section></div></main><script>const $=id=>document.getElementById(id);let operation='add',mode='choice',questions=[],current=0,score=0,answered=false,recognition=null;function toggleNav(){sidebar.classList.toggle('open');overlay.classList.toggle('show')}function toggleGrade(g){document.getElementById('sub-'+g)?.classList.toggle('open')}function renderNav(){const page=location.pathname.split('/').pop()||'cong-tru-10.html';gradeNav.innerHTML=Array.from({length:12},(_,i)=>{const g=i+1,open=g===1,mathCurrent=page==='math.html'||page==='cong-tru-10.html',englishCurrent=page==='english.html'||page==='vocabulary-list.html';let links='';if(g===1){links+='<a href="english.html" class="'+(englishCurrent?'active':'')+'">🔤🌈 Tiếng Anh</a><div class="course-list"><a href="english.html" class="'+(page==='english.html'?'active':'')+'">↳ Vocabulary Games</a><a href="vocabulary-list.html" class="'+(page==='vocabulary-list.html'?'active':'')+'">↳ Vocabulary List</a></div><a href="math.html" class="'+(mathCurrent?'active':'')+'">➕ Toán</a><div class="course-list"><a href="cong-tru-10.html" class="'+(page==='cong-tru-10.html'?'active':'')+'">↳ Cộng Trừ Phạm Vi 10</a></div><a href="#">📖 Tiếng Việt</a>'}else{links+='<a href="class.html?grade='+g+'">📚 Môn học</a>'}return '<div><button type="button" class="grade-toggle '+(open?'current':'')+'" onclick="toggleGrade('+g+')"><span class="icon">'+(open?'📂':'📁')+'</span><span>Lớp '+g+'</span><span class="chev">'+(open?'⌃':'›')+'</span></button><div id="sub-'+g+'" class="subnav '+(open?'open':'')+'">'+links+'</div></div>'}).join('')}
function chooseGroup(id,cb){document.getElementById(id).querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.getElementById(id).querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');cb(b.dataset.value)})}chooseGroup('operationChoices',v=>operation=v);chooseGroup('modeChoices',v=>mode=v);function rand(n){return Math.floor(Math.random()*n)}function makeQuestion(){let a,b,op;if(operation==='add'||(operation==='mixed'&&Math.random()<.5)){op='+';a=rand(11);b=rand(11-a)}else{op='−';a=rand(11);b=rand(a+1)}return{a,b,op,answer:op==='+'?a+b:a-b}}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function buildQuestions(){const seen=new Set();questions=[];while(questions.length<10){const q=makeQuestion(),key=q.a+q.op+q.b;if(!seen.has(key)){seen.add(key);questions.push(q)}}}
function start(){buildQuestions();current=0;score=0;answered=false;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('exam').classList.remove('hidden');renderQuestion()}function renderQuestion(){const q=questions[current];answered=false;$('qNo').textContent=current+1;$('score').textContent=score;$('progressBar').style.width=((current)/10*100)+'%';$('equation').textContent=q.a+' '+q.op+' '+q.b+' = ?';$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').classList.remove('show');if(mode==='choice')renderChoices(q);else if(mode==='write')renderWrite(q);else renderSpeak(q)}function renderChoices(q){let values=new Set([q.answer]);while(values.size<4){let d=rand(11);if(Math.abs(d-q.answer)<=10)values.add(d)}const arr=shuffle([...values]);$('answerArea').innerHTML='<div class="answer-grid">'+arr.map(v=>'<button class="answer-btn" data-value="'+v+'">'+v+'</button>').join('')+'</div>';$('answerArea').querySelectorAll('.answer-btn').forEach(b=>b.onclick=()=>submit(Number(b.dataset.value),b))}function renderWrite(q){$('answerArea').innerHTML='<div class="write-area"><input id="numberInput" class="number-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="10" placeholder="?" aria-label="Đáp án"></div>';$('numberInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit(Number(e.target.value),e.target)});$('numberInput').focus()}function renderSpeak(q){$('answerArea').innerHTML='<div class="mic-area"><button id="micBtn" class="mic" aria-label="Nói đáp án">🎙️</button><div id="speechStatus" class="speech-status">Chạm micro và nói số đáp án.</div></div>';const btn=$('micBtn');btn.onclick=startListening}function submit(value,el){if(answered)return;if(!Number.isFinite(value)||value<0||value>10){showFeedback(false,'Hãy nhập một số từ 0 đến 10.');return}answered=true;const q=questions[current],ok=value===q.answer;if(ok){score++;$('feedback').textContent='🎉 Chính xác!';$('feedback').className='feedback good'}else{$('feedback').textContent='💪 Cố gắng lên! Đáp án đúng là '+q.answer+'.';$('feedback').className='feedback bad'}if(el&&el.classList)el.classList.add(ok?'correct':'wrong');if(mode==='choice')document.querySelectorAll('.answer-btn').forEach(b=>{if(Number(b.dataset.value)===q.answer)b.classList.add('correct')});$('score').textContent=score;$('progressBar').style.width=((current+1)/10*100)+'%';$('nextBtn').classList.add('show')}function showFeedback(ok,msg){$('feedback').textContent=msg;$('feedback').className='feedback '+(ok?'good':'bad')}function startListening(){if(answered)return;if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){showFeedback(false,'Trình duyệt này chưa hỗ trợ nhận diện giọng nói. Bạn có thể dùng Chọn Đáp Án hoặc Viết Đáp Án.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='vi-VN';recognition.interimResults=false;recognition.maxAlternatives=3;const btn=$('micBtn'),status=$('speechStatus');btn.classList.add('pressed','listening');status.textContent='Đang nghe… Hãy nói một số.';recognition.onresult=e=>{const text=e.results[0][0].transcript.toLowerCase().trim();const map={'không':0,'zero':0,'một':1,'hai':2,'ba':3,'bốn':4,'tư':4,'năm':5,'sáu':6,'bảy':7,'tám':8,'chín':9,'mười':10};let value=map[text];if(value===undefined){const m=text.match(/\d+/);if(m)value=Number(m[0])}if(value===undefined)showFeedback(false,'Mình chưa nghe rõ. Hãy thử lại.');else submit(value,btn)};recognition.onerror=()=>{status.textContent='Chưa nhận diện được. Hãy thử lại.';btn.classList.remove('pressed','listening')};recognition.onend=()=>{btn.classList.remove('pressed','listening');if(!answered&&status)status.textContent='Chạm micro để thử lại.'};try{recognition.start()}catch(e){btn.classList.remove('pressed','listening');status.textContent='Hãy thử lại.'}}function next(){if(!answered)return;if(current<9){current++;renderQuestion()}else{showResult()}}function showResult(){ $('exam').classList.add('hidden');const perfect=score===10;$('result').classList.remove('hidden');$('result').innerHTML='<div class="big">'+(perfect?'🏆🎉':'💪')+'</div><h2>'+(perfect?'Tuyệt vời!':'Cố gắng lên!')+'</h2><p>Bé làm đúng <strong>'+score+'/10</strong> câu.</p><p>'+(perfect?'Bé đã làm đúng tất cả 10 câu!':'Không sao, mình luyện thêm một chút là sẽ tốt hơn.')+'</p><button class="restart" onclick="location.reload()">Làm bài mới</button>'} $('startBtn').onclick=start;$('nextBtn').onclick=next;renderNav();</script></body></html>
