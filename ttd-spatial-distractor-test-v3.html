<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial Distractor Test</title><style>body{font-family:system-ui;margin:20px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{background:#f8fafc;border:1px solid #ccd5df;border-radius:12px;padding:8px;text-align:center}.tag{font-size:12px;color:#64748b}</style></head><body><h1>Spatial Distractor v3</h1><div id="app"></div><script src="ttd-spatial-v1.js"></script><script src="ttd-spatial-view-v2.js"></script><script src="ttd-spatial-distractors-v3.js"></script><script src="ttd-spatial-choice-v2.js"></script><script>const app=document.getElementById('app');for(const q of TTD_SPATIAL_DISTRACTOR_V3){app.innerHTML+=`<section class="q"><h3>${q.id} — ${q.family}</h3><div class="grid">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_SPATIAL_CHOICE_V2.render({type:'projection',cubes:c.cubes,view:c.view},120)}<div class="tag">${c.reason}</div></div>`).join('')}</div></section>`}</script></body></html>
