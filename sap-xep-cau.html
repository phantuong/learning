function initAudio(){try{if(!window.__sortAudio)window.__sortAudio=new(window.AudioContext||window.webkitAudioContext)();if(window.__sortAudio.state==='suspended')window.__sortAudio.resume()}catch(e){}}
function tone(f,s,d,t,g,e){const c=window.__sortAudio;if(!c)return;const now=c.currentTime+s,o=c.createOscillator(),a=c.createGain();o.type=t;o.frequency.setValueAtTime(f,now);if(e)o.frequency.exponentialRampToValueAtTime(e,now+d);a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(g,now+.006);a.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(a);a.connect(c.destination);o.start(now);o.stop(now+d+.01)}

function bind(el){el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();initAudio();const value=el.dataset.value,from=el.parentElement;const sx=e.clientX,sy=e.clientY;let active=false,ghost=null;const move=ev=>{if(!active){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;active=true;ghost=el.cloneNode(true);ghost.style.position='fixed';ghost.style.zIndex='99999';ghost.style.pointerEvents='none';ghost.style.width=el.getBoundingClientRect().width+'px';document.body.appendChild(ghost);el.classList.add('dragging')}ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px'};const end=ev=>{document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',end,true);document.removeEventListener('pointercancel',end,true);if(ghost)ghost.remove();el.classList.remove('dragging');if(!active)return;const target=document.elementFromPoint(ev.clientX,ev.clientY);const zone=target&&target.closest('.answer');if(zone){place(value,from)}else if(from.classList.contains('answer')&&target&&target.closest('.pool')){returnPool(value)}};
