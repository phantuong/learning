name: Apply English UI polish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Center word and reposition speaker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* english-ui-polish-v2 */'
          if marker not in s:
              css = '''\n/* english-ui-polish-v2 */\n.target-area{position:relative;display:block;text-align:center;min-height:58px}\n.target{display:flex;align-items:center;justify-content:center;width:100%;max-width:100%;margin:0 auto}\n.target-word{justify-content:center;margin:0 auto}\n.speak-inline{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:50px;height:50px;min-width:50px;font-size:26px;z-index:2}\n@media(max-width:760px){.target-area{min-height:54px}.speak-inline{right:2px;width:48px;height:48px;min-width:48px;font-size:24px}}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Add missing Vietnamese meanings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* vocabulary-meaning-fallback-v1 */'
          if marker not in s:
              fallback = '''\n/* vocabulary-meaning-fallback-v1 */\nObject.assign(meaning, {\n  "I":"tôi / mình", "you":"bạn / các bạn", "we":"chúng tôi / chúng ta",\n  "they":"họ / chúng", "he":"anh ấy / cậu ấy", "she":"cô ấy / bạn ấy",\n  "it":"nó / vật đó", "a":"một", "an":"một", "the":"cái / con / vật đó",\n  "am":"là (dùng với I)", "are":"là / ở / thì (dùng với you, we, they)",\n  "is":"là / ở / thì", "and":"và", "or":"hoặc", "to":"đến / để",\n  "have":"có", "has":"có (dùng với he, she, it)", "can":"có thể",\n  "can't":"không thể", "not":"không", "in":"trong", "on":"trên",\n  "under":"bên dưới", "next to":"bên cạnh", "behind":"phía sau",\n  "between":"ở giữa", "front":"phía trước", "set":"đặt / bộ", "see":"nhìn thấy",\n  "my":"của tôi", "your":"của bạn / các bạn"\n});\n'''
              needle = '</script>\n<script src="app-nav.js"></script>'
              if needle in s:
                  s = s.replace(needle, fallback + needle, 1)
              else:
                  raise SystemExit('english.html insertion point not found')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Bust scramble navigation script cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('voca-scramble.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('navigation-hardening.js?v=20261003', 'navigation-hardening.js?v=20261006')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english.html voca-scramble.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add Vietnamese vocabulary meaning fallbacks'
            git push
          fi
