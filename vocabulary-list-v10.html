<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fb"><title>Danh sách Từ Vựng</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f;--soft:#fff0f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px -4px}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.source-trigger .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-actions{display:flex;gap:8px;padding:4px 4px 8px;position:sticky;top:0;background:#fff;z-index:1}.source-actions button,.edit,.save,.cancel{border:1px solid #ead9e4;border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.source-actions button{flex:1;background:#fff7fb;color:var(--pink)}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item .label{font-size:14px;line-height:1.35}.source-item .meta{font-size:11px;color:var(--muted);margin-top:2px}.count,.sync{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 8px}.sync{min-height:18px;font-weight:700}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover;display:block}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;min-height:21px}.edit{background:#fff;color:var(--pink);margin-top:8px}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:var(--soft);color:var(--pink)}.editbox{display:flex;gap:7px;align-items:center;margin-top:7px}.meaning-input{flex:1;border:2px solid #e5dff0;border-radius:10px;padding:9px 10px;font:inherit;font-size:14px}.save{background:#df4f8f;color:#fff;border-color:#df4f8f}.cancel{background:#fff;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:28px}.word{font-size:19px}.meta{font-size:14px}.speak{width:41px;height:41px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary" class="summary">Đang tải nguồn…</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div><div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v2"></script><script src="auth-guard.js?v=20261006v1"></script><script src="vocabulary-source-sync.js?v=20261006v1"></script><script src="vocabulary-db.js?v=20261006v1"></script><script>
let words=[],sources=[],selected=new Set(),editing=null;const $=id=>document.getElementById(id);const IMG_KEY='grade1EnglishVocabImagesV4';const emoji={cat:'🐱',dog:'🐶',bird:'🐦',fish:'🐟',mouse:'🐭',rabbit:'🐰',cow:'🐄',sheep:'🐑',duck:'🦆',chicken:'🐔',elephant:'🐘',giraffe:'🦒',bat:'🦇',squirrel:'🐿️',chameleon:'🦎',hat:'🧢',shirt:'👕',shoes:'👟',socks:'🧦',glasses:'👓',picture:'🖼️',bed:'🛏️',clock:'🕒',bookcase:'📚',plant:'🪴',television:'📺',table:'🪑',sofa:'🛋️',cushion:'🛋️',living:'🛋️',bedroom:'🛏️',bathroom:'🛁',kitchen:'🍳',garden:'🌳',wings:'🪽',beak:'🐦',ears:'👂',tail:'🐈',eyes:'👀',nose:'👃',mouth:'👄',arms:'💪',legs:'🦵',fly:'🪽',walk:'🚶',climb:'🧗',jump:'🦘',swim:'🏊',run:'🏃','play football':'⚽','play tennis':'🎾','ride a horse':'🐴','ride a bike':'🚲',rollerblade:'🛼',old:'👴',young:'👶',tall:'📏',short:'📏',family:'👨‍👩‍👧‍👦',parents:'👨‍👩‍👧',mum:'👩',dad:'👨',grandpa:'👴',grandma:'👵',sister:'👧',brother:'👦',twin:'👯',uncle:'👨',auntie:'👩',cousin:'🧒',circle:'⚪',triangle:'🔺',rectangle:'▭',square:'⬜',oval:'🥚',farm:'🚜'};const imageQuery={old:'elderly person',young:'young child',tall:'tall person',short:'short person',pretty:'pretty girl',handsome:'handsome boy',family:'family parents children',parents:'parents with children',cushion:'sofa cushion',wardrobe:'clothes wardrobe',bookcase:'bookcase',living:'living room',bedroom:'bedroom',bathroom:'bathroom',dining:'dining room',garden:'home garden',wings:'bird wings',beak:'bird beak',tail:'animal tail','play football':'children playing football','play tennis':'children playing tennis','ride a horse':'child riding horse','ride a bike':'child riding bicycle',rollerblade:'child rollerblading',circle:'circle shape',triangle:'triangle shape',rectangle:'rectangle shape',square:'square shape',oval:'oval shape',farm:'farm animals'};const meaning={"stand up":"đứng lên","sit down":"ngồi xuống","open your book":"mở sách","raise your hand":"giơ tay","sit nicely":"ngồi ngay ngắn","be quiet":"giữ im lặng","listen and look":"lắng nghe và nhìn","speak English":"nói tiếng Anh","pencil sharpener":"đồ gọt bút chì","pencil case":"hộp bút","living room":"phòng khách","dining room":"phòng ăn","dark hair":"tóc sẫm màu","blond hair":"tóc vàng","curly hair":"tóc xoăn","straight hair":"tóc thẳng","long hair":"tóc dài","T-shirt":"áo phông","play football":"chơi bóng đá","play tennis":"chơi quần vợt","ride a horse":"cưỡi ngựa","ride a bike":"đi xe đạp","old":"già, lớn tuổi","young":"trẻ, nhỏ tuổi","tall":"cao","short":"thấp, ngắn","pretty":"xinh đẹp","handsome":"đẹp trai","happy":"vui vẻ","sad":"buồn","angry":"tức giận","hungry":"đói","thirsty":"khát","tired":"mệt","scared":"sợ hãi","sunny":"có nắng","rainy":"có mưa","cloudy":"nhiều mây","windy":"có gió","stormy":"có bão","hot":"nóng","cold":"lạnh","window":"cửa sổ","door":"cửa ra vào","chair":"ghế","desk":"bàn học","bin":"thùng rác","poster":"áp phích","board":"bảng","bag":"cặp, túi","book":"sách","cupboard":"tủ","ruler":"thước kẻ","rubber":"cục tẩy","pen":"bút mực","pencil":"bút chì","mum":"mẹ","dad":"bố","grandpa":"ông","grandma":"bà","sister":"chị/em gái","brother":"anh/em trai","twin":"sinh đôi","uncle":"chú/cậu/bác trai","auntie":"cô/dì/bác gái","cousin":"anh/chị/em họ","circle":"hình tròn","triangle":"hình tam giác","rectangle":"hình chữ nhật","square":"hình vuông","oval":"hình bầu dục","farm":"nông trại","cat":"con mèo","dog":"con chó","bird":"con chim","fish":"con cá","mouse":"con chuột","rabbit":"con thỏ","cow":"con bò","sheep":"con cừu","duck":"con vịt","chicken":"con gà","elephant":"con voi","giraffe":"con hươu cao cổ","bat":"con dơi","squirrel":"con sóc","chameleon":"con tắc kè","cheese":"phô mai","meat":"thịt","pasta":"mì pasta","eggs":"trứng","sandwiches":"bánh mì kẹp","bread":"bánh mì","milk":"sữa","juice":"nước ép","rice":"cơm, gạo","apples":"những quả táo","bananas":"những quả chuối","hat":"mũ","shorts":"quần đùi","sweater":"áo len","shirt":"áo sơ mi","jacket":"áo khoác","skirt":"váy","trousers":"quần dài","shoes":"giày","socks":"tất","glasses":"kính","picture":"bức tranh, hình ảnh","bed":"giường","clock":"đồng hồ","bookcase":"tủ sách","plant":"cây cảnh","television":"tivi","table":"cái bàn","sofa":"ghế sofa","cushion":"đệm tựa, gối tựa","wings":"đôi cánh","beak":"mỏ","ears":"tai","tail":"đuôi","eyes":"mắt","nose":"mũi","mouth":"miệng","arms":"cánh tay","legs":"chân","fly":"bay","walk":"đi bộ","climb":"leo trèo","jump":"nhảy","swim":"bơi","run":"chạy","one":"một","two":"hai","three":"ba","four":"bốn","five":"năm","six":"sáu","seven":"bảy","eight":"tám","nine":"chín","ten":"mười","red":"đỏ","yellow":"vàng","green":"xanh lá","pink":"hồng","purple":"tím","orange":"cam","blue":"xanh dương","black":"đen","white":"trắng","brown":"nâu","gray":"xám","like":"thích","I":"tôi / mình","am":"là (dùng với I)","my":"của tôi","the":"cái/con đó","and":"và","it":"nó","to":"đến / để","a":"một","an":"một","have":"có","has":"có (dùng với he/she/it)","can":"có thể","can't":"không thể","in":"trong","on":"trên","under":"bên dưới","next to":"bên cạnh","behind":"phía sau","between":"ở giữa"};function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function fallback(w){return meaning[w]||meaning[w.toLowerCase()]||''}function imgQ(w){return imageQuery[w.toLowerCase()]||w}function imgScore(x,w){const text=((x.title||'')+' '+x.alt_text||'').toLowerCase();const q=imgQ(w).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);return q.reduce((s,t)=>s+(t.length>2&&text.includes(t)?4:0),0)+(text.includes(w.toLowerCase())?8:0)}async function findImage(w){try{const q=encodeURIComponent(imgQ(w));const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*');if(!r.ok)return'';const d=await r.json();const arr=Object.values(d.query?.pages||{}).sort((a,b)=>imgScore(b,w)-imgScore(a,w));const best=arr.find(x=>/public domain|cc0|cc by/i.test(x.imageinfo?.[0]?.extmetadata?.LicenseShortName?.value||''))||arr[0];return best?.imageinfo?.[0]?.thumburl||best?.imageinfo?.[0]?.url||''}catch{return''}}async function saveImage(w,url){if(url)try{await VocabularyDB.updateImage(w,url,'Wikimedia Commons')}catch{}}
function updateSummary(){const n=selected.size,total=sources.length;$('sourceSummary').textContent=!n?'Chưa chọn nguồn':n===total?'Tất cả nguồn':`${n} nguồn được chọn`}async function persistSources(ids){selected=new Set(await VocabularySourceSync.set(ids));updateSummary();render()}function renderSources(){const m=$('sourceMenu');m.innerHTML='<div class="source-actions"><button id="selectAllSources" type="button">✓ Chọn tất cả</button><button id="clearAllSources" type="button">Bỏ chọn tất cả</button></div>'+sources.map(s=>`<label class="source-item"><input type="checkbox" data-source="${s.id}" ${selected.has(s.id)?'checked':''}><span><span class="label">${s.label||s.name||s.id}</span>${s.description?`<div class="meta">${s.description}</div>`:''}</span></label>`).join('');$('selectAllSources').onclick=e=>{e.stopPropagation();persistSources(sources.map(s=>s.id))};$('clearAllSources').onclick=e=>{e.stopPropagation();persistSources([])};m.querySelectorAll('[data-source]').forEach(x=>x.onchange=()=>persistSources([...m.querySelectorAll('[data-source]:checked')].map(i=>i.dataset.source)));updateSummary()}
function filtered(){const t=$('search').value.trim().toLowerCase();return words.filter(w=>(w.source_ids||[]).some(id=>selected.has(id))&&(!t||w.word.toLowerCase().includes(t)))}function render(){const shown=filtered();$('count').textContent=`Hiển thị ${shown.length} từ`;if(!shown.length){$('list').innerHTML='<div class="empty">Không có từ nào thuộc các nguồn đang chọn.</div>';return}$('list').innerHTML=shown.map(w=>{const m=w.vietnamese_meaning||fallback(w.word);return `<article class="word-card" data-word="${w.word.replace(/"/g,'&quot;')}"><div class="pic" data-pic>${emoji[w.word.toLowerCase()]||'📘'}</div><div><div class="word">${w.word}</div><div class="meta" data-meaning>${m||'Chưa có nghĩa tiếng Việt'}</div><div class="editbox" data-editbox style="display:none"><input class="meaning-input" value="${(m||'').replace(/"/g,'&quot;')}" placeholder="Nhập nghĩa tiếng Việt"><button class="save">Lưu</button><button class="cancel">Hủy</button></div><button class="edit" type="button">✏️ Sửa nghĩa</button></div><button class="speak" data-speak="${w.word}" aria-label="Phát âm">🔊</button></article>`}).join('');document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('.word-card').forEach(card=>bindEdit(card));hydrateImages(shown)}function bindEdit(card){const word=card.dataset.word,edit=card.querySelector('.edit'),box=card.querySelector('[data-editbox]'),input=card.querySelector('.meaning-input'),save=card.querySelector('.save'),cancel=card.querySelector('.cancel');edit.onclick=()=>{box.style.display='flex';edit.style.display='none';input.focus();input.select()};cancel.onclick=()=>{box.style.display='none';edit.style.display='inline-block'};save.onclick=async()=>{const value=input.value.trim();save.disabled=true;try{const updated=await VocabularyDB.updateMeaning(word,value);const row=words.find(x=>x.word===word);if(row)row.vietnamese_meaning=updated.vietnamese_meaning||'';card.querySelector('[data-meaning]').textContent=updated.vietnamese_meaning||'Chưa có nghĩa tiếng Việt';box.style.display='none';edit.style.display='inline-block';$('sync').textContent=`Đã lưu nghĩa của “${word}” lên cloud.`}catch(e){console.error(e);alert('Không thể lưu nghĩa. Vui lòng thử lại.')}finally{save.disabled=false}}}
async function hydrateImages(shown){await Promise.all(shown.map(async w=>{const card=[...document.querySelectorAll('.word-card')].find(c=>c.dataset.word===w.word);if(!card)return;let u=w.image_url;if(!u){u=await findImage(w.word);if(u){w.image_url=u;await saveImage(w.word,u)}}if(u){const p=card.querySelector('[data-pic]'),img=new Image();img.alt=w.word;img.loading='lazy';img.onload=()=>p.replaceChildren(img);img.src=u}}))}
(async()=>{try{selected=new Set(await VocabularySourceSync.init());sources=VocabularySourceSync.getSources();renderSources();const sourceWords=await VocabularySourceSync.getData();const seeded=await VocabularyDB.ensureSeed(sourceWords.words||[],fallback);words=await VocabularyDB.list();$('sync').textContent='Từ vựng đã được đồng bộ với cloud.';render();window.addEventListener('vocabularySourcesChanged',async()=>{selected=new Set(VocabularySourceSync.getSelected());renderSources();render()})}catch(e){console.error(e);$('sync').textContent='Không thể tải dữ liệu từ vựng. Vui lòng thử lại.'}})();$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.source-wrap'))$('sourceMenu').classList.remove('open')});$('search').oninput=render;</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
