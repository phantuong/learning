#f0dff0}.pic img{width:100%;height:100%;object-fit:cover;display:block}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;min-height:21px}.meta.loading{opacity:.55}.actions{display:flex;gap:7px}.speak,.star{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer}.speak{background:#fff0f7;color:var(--pink)}.star{background:#f2f4f7;color:#98a2b3}.star.selected{background:#fff3b8;color:#f59e0b}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:28px}.word{font-size:19px}.meta{font-size:14px}.speak,.star{width:41px;height:41px}.actions{flex-direction:column;gap:5px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label" for="sourceFilter">📚 Lọc theo nguồn</label><select id="sourceFilter" class="source-select"><option value="">Tất cả nguồn</option></select></div><div class="controls"><button id="selectAll" class="control">⭐ Chọn tất cả</button><button id="clearAll" class="control">Bỏ chọn tất cả</button><button id="selectedFilter" class="control">⭐ Chỉ hiện từ đã chọn</button></div><div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v1"></script><script src="auth-guard.js?v=20261006v1"></script><script>
const DATA_URL='data/grade1/english/vocabulary.json',SOURCES_URL='data/grade1/english/vocabulary-sources.json',KEY='grade1EnglishSelectedWords',META_KEY='grade1EnglishVocabMetaV1',IMG_KEY='grade1EnglishVocabImagesV1';let words=[],sourceMap=new Map(),selected=new Set(),onlySelected=false,sourceFilter='';
const fallback={'one':['một','/wʌn/','1️⃣'],'two':['hai','/tuː/','2️⃣'],'three':['ba','/θriː/','3️⃣'],'four':['bốn','/fɔr/','4️⃣'],'five':['năm','/faɪv/','5️⃣'],'six':['sáu','/sɪks/','6️⃣'],'seven':['bảy','/ˈsevən/','7️⃣'],'eight':['tám','/eɪt/','8️⃣'],'nine':['chín','/naɪn/','9️⃣'],'ten':['mười','/ten/','🔟'],'red':['đỏ','/red/','🔴'],'yellow':['vàng','/ˈjeloʊ/','🟡'],'green':['xanh lá','/ɡriːn/','🟢'],'pink':['hồng','/pɪŋk/','🩷'],'purple':['tím','/ˈpɜrpəl/','🟣'],'orange':['cam','/ˈɔrɪndʒ/','🟠'],'blue':['xanh dương','/bluː/','🔵'],'black':['đen','/blæk/','⚫'],'white':['trắng','/waɪt/','⚪'],'brown':['nâu','/braʊn/','🟤'],'gray':['xám','/ɡreɪ/','🩶'],'happy':['vui','/ˈhæpi/','😊'],'sad':['buồn','/sæd/','😢'],'angry':['tức giận','/ˈæŋɡri/','😠'],'hungry':['đói','/ˈhʌŋɡri/','😋'],'thirsty':['khát','/ˈθɜrsti/','🥤'],'sunny':['có nắng','/ˈsʌni/','☀️'],'rainy':['có mưa','/ˈreɪni/','🌧️'],'cloudy':['nhiều mây','/ˈklaʊdi/','☁️'],'windy':['nhiều gió','/ˈwɪndi/','💨'],'stormy':['có bão','/ˈstɔrmi/','⛈️'],'hot':['nóng','/hɑt/','🥵'],'cold':['lạnh','/koʊld/','🥶'],'stand up':['đứng lên','/stænd ʌp/','🙋'],'sit down':['ngồi xuống','/sɪt daʊn/','🪑'],'open your book':['mở sách','/ˈoʊpən jʊr bʊk/','📖'],'raise your hand':['giơ tay','/reɪz jʊr hænd/','✋'],'listen and look':['lắng nghe và nhìn','/ˈlɪsən ænd lʊk/','👂'],'sit nicely':['ngồi ngay ngắn','/sɪt ˈnaɪsli/','🪑'],'be quiet':['giữ im lặng','/bi ˈkwaɪət/','🤫'],'speak English':['nói tiếng Anh','/spiːk ˈɪɡlɪʃ/','💬']};
const emojiHints={'cat':'🐱','dog':'🐶','hamster':'🐹','bird':'🐦','snake':'🐍','spider':'🕷️','tortoise':'🐢','fish':'🐟','mouse':'🐭','rabbit':'🐰','pet':'🐾','cow':'🐄','sheep':'🐑','donkey':'🫏','goat':'🐐','duck':'🦆','chicken':'🐔','lion':'🦁','deer':'🦌','elephant':'🐘','giraffe':'🦒','bat':'🦇','squirrel':'🐿️','chameleon':'🦎','doll':'🪆','ball':'⚽','robot':'🤖','boat':'⛵','scooter':'🛴','skateboard':'🛹','kite':'🪁','yoyo':'🪀','teddy':'🧸','cheese':'🧀','meat':'🥩','pasta':'🍝','eggs':'🥚','sandwiches':'🥪','bread':'🍞','milk':'🥛','juice':'🧃','rice':'🍚','apples':'🍎','bananas':'🍌','Santa':'🎅','elf':'🧝','snowman':'⛄','reindeer':'🦌','hat':'🧢','shorts':'🩳','sweater':'🧥','shirt':'👕','jacket':'🧥','skirt':'👗','trousers':'👖','T-shirt':'👕','shoes':'👟','socks':'🧦','glasses':'👓','picture':'🖼️','wardrobe':'🚪','bed':'🛏️','clock':'🕒','bookcase':'📚','plant':'🪴','television':'📺','table':'🪑','sofa':'🛋️','cushion':'🛏️','living room':'🛋️','bedroom':'🛏️','bathroom':'🛁','kitchen':'🍳','dining room':'🍽️','garden':'🌳','wings':'🪽','beak':'🐦','ears':'👂','tail':'🐈','eyes':'👀','head':'🙂','nose':'👃','mouth':'👄','arms':'💪','legs':'🦵','fly':'🪽','walk':'🚶','talk':'💬','climb':'🧗','jump':'🦘','swim':'🏊','football':'⚽','tennis':'🎾','run':'🏃','horse':'🐴','bike':'🚲','rollerblade':'🛼','old':'👴','young':'👶','tall':'📏','short':'📏','pretty':'😊','handsome':'🙂','family':'👨‍👩‍👧‍👦','baby':'👶','father':'👨','mother':'👩','parents':'👨‍👩‍👧','mum':'👩','dad':'👨','grandpa':'👴','grandma':'👵','sister':'👧','brother':'👦','twin':'👯','uncle':'👨','auntie':'👩','cousin':'🧒','play football':'⚽','play tennis':'🎾','ride a horse':'🐴','ride a bike':'🚲','can':'✅',"can't":'❌','football game':'⚽','glue':'🧴','stars':'⭐','counters':'🔢','paper':'📄','circle':'⚪','triangle':'🔺','rectangle':'▭','square':'⬜','oval':'🥚','farm':'🚜'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function metaRead(){try{return JSON.parse(localStorage.getItem(META_KEY)||'{}')}catch{return {}}}function metaWrite(x){localStorage.setItem(META_KEY,JSON.stringify(x))}function imageRead(){try{return JSON.parse(localStorage.getItem(IMG_KEY)||'{}')}catch{return {}}}function imageWrite(x){localStorage.setItem(IMG_KEY,JSON.stringify(x))}function localRead(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return new Set()}}function localWrite(s){localStorage.setItem(KEY,JSON.stringify([...s]))}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function fallbackInfo(w){return fallback[w]||['','',emojiHints[w]||emojiHints[w.toLowerCase()]||'📘']}
async function getMeta(w){const cache=metaRead(),k=w.toLowerCase();if(cache[k])return cache[k];const f=fallbackInfo(w);if(f[0]&&f[1]){cache[k]={meaning:f[0],ipa:f[1]};metaWrite(cache);return cache[k]}try{const r=await fetch('https://dict.minhqnd.com/api/v1/lookup?word='+encodeURIComponent(w)+'&lang=en&def_lang=vi');if(!r.ok)throw Error();const d=await r.json();const en=(d.results||[]).find(x=>x.lang==='en'||x.lang_name==='English')||d.results?.[0];const meaning=(en?.meanings||[]).map(x=>x.definition).filter(Boolean).slice(0,2).join('; ')||w;const ipa=en?.pronunciations?.[0]?.ipa||'';const out={meaning,ipa};cache[k]=out;metaWrite(cache);return out}catch(e){return {meaning:w,ipa:''}}}
async function getImage(w){const cache=imageRead(),k=w.toLowerCase();if(Object.prototype.hasOwnProperty.call(cache,k))return cache[k];try{const url='https://api.openverse.org/v1/images/?q='+encodeURIComponent(w)+'&license=cc0,pdm&filter_dead=true&mature=false&page_size=1&page=1';const r=await fetch(url);if(!r.ok)throw Error();const d=await r.json();const image=d.results?.[0]?.thumbnail||d.results?.[0]?.url||'';cache[k]=image;imageWrite(cache);return image}catch(e){cache[k]='';imageWrite(cache);return ''}}
function buildSourceFilter(sources){sourceMap=new Map((sources||[]).map(s=>[s.id,s]));const sel=document.getElementById('sourceFilter');sel.innerHTML='<option value="">Tất cả nguồn</option>'+(sources||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('');sel.value=sourceFilter}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const shown=words.filter(item=>{const w=item.word||'';return(!q||w.toLowerCase().includes(q))&&(!sourceFilter||(item.sourceIds||[]).includes(sourceFilter))&&(!onlySelected||selected.has(w))});document.getElementById('count').textContent=`Hiển thị ${shown.length} / ${words.length} từ · Đã chọn ${selected.size}`;document.getElementById('list').innerHTML=shown.length?shown.map(item=>{const w=item.word,sel=selected.has(w),hint=emojiHints[w]||emojiHints[w.toLowerCase()]||'📘';return `<article class="word-card" data-word-card="${esc(w)}"><div class="pic" data-image-for="${esc(w)}">${hint}</div><div><div class="word">${esc(w)}</div><div class="meta loading" data-meta-for="${esc(w)}">Đang tải nghĩa · phiên âm…</div></div><div class="actions"><button class="speak" data-speak="${esc(w)}" aria-label="Phát âm">🔊</button><button class="star ${sel?'selected':''}" data-word="${esc(w)}" aria-label="Chọn từ">★</button></div></article>`}).join(''):'<div class="empty">Không tìm thấy từ phù hợp.</div>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>toggle(b.dataset.word));hydrateVisible()}
async function hydrateCard(card){const w=card.dataset.wordCard;const meta=await getMeta(w);const m=card.querySelector('[data-meta-for]');if(m){m.textContent=meta.meaning+(meta.ipa?' · '+meta.ipa:'');m.classList.remove('loading')}const p=card.querySelector('[data-image-for]');if(p){const url=await getImage(w);if(url)p.innerHTML=`<img src="${esc(url)}" alt="${esc(w)}" loading="lazy" referrerpolicy="no-referrer">`}}
function hydrateVisible(){if(!('IntersectionObserver'in window)){document.querySelectorAll('[data-word-card]').forEach(hydrateCard);return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);hydrateCard(e.target)}}),{rootMargin:'500px'});document.querySelectorAll('[data-word-card]').forEach(x=>io.observe(x))}
async function toggle(w){const next=new Set(selected);next.has(w)?next.delete(w):next.add(w);selected=next;localWrite(selected);render();await syncToServer(next)}async function syncToServer(next){const sb=window.learningAuth;if(!sb){setStatus('Chờ đăng nhập...');return}setStatus('Đang đồng bộ...');const before=window.__vocabServerSet||new Set();const add=[...next].filter(w=>!before.has(w));const remove=[...before].filter(w=>!next.has(w));if(add.length){const r=await sb.from('vocabulary_selected_words').upsert(add.map(word=>({word})),{onConflict:'user_id,word'});if(r.error){setStatus('Đồng bộ thất bại: '+r.error.message,true);return}}if(remove.length){const r=await sb.from('vocabulary_selected_words').delete().in('word',remove);if(r.error){setStatus('Đồng bộ thất bại: '+r.error.message,true);return}}window.__vocabServerSet=new Set(next);setStatus(`✓ Đã đồng bộ ${next.size} từ`)}function setStatus(t,error=false){const e=document.getElementById('sync');e.textContent=t;e.style.color=error?'#b42318':'#12a05c'}async function waitAuth(){for(let i=0;i<80;i++){if(window.learningAuth&&window.learningUser)return window.learningAuth;await new Promise(r=>setTimeout(r,250))}throw Error('Không thể kết nối tài khoản')}async function loadRemote(sb){const r=await sb.from('vocabulary_selected_words').select('word');if(r.error)throw r.error;return new Set((r.data||[]).map(x=>x.word).filter(Boolean))}async function boot(){try{await waitAuth();const sb=window.learningAuth;const local=localRead();let remote=await loadRemote(sb);if(remote.size===0&&local.size>0){const r=await sb.from('vocabulary_selected_words').upsert([...local].map(word=>({word})),{onConflict:'user_id,word'});if(r.error)throw r.error;remote=await loadRemote(sb)}selected=new Set(remote);window.__vocabServerSet=new Set(remote);localWrite(selected);render();setStatus(`✓ Đã đồng bộ ${selected.size} từ`);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,15000);async function refresh(){try{const latest=await loadRemote(sb);selected=latest;window.__vocabServerSet=new Set(latest);localWrite(latest);render();setStatus(`✓ Đã đồng bộ ${latest.size} từ`)}catch(e){setStatus('Đồng bộ thất bại: '+e.message,true)}}}catch(e){setStatus('Đồng bộ thất bại: '+e.message,true);render()}}
document.getElementById('search').oninput=render;document.getElementById('sourceFilter').onchange=e=>{sourceFilter=e.target.value;render()};document.getElementById('selectAll').onclick=async()=>{const q=document.getElementById('search').value.trim().toLowerCase();const visible=words.filter(item=>(!q||item.word.toLowerCase().includes(q))&&(!sourceFilter||(item.sourceIds||[]).includes(sourceFilter)));selected=new Set([...selected,...visible.map(x=>x.word)]);localWrite(selected);render();await syncToServer(selected)};document.getElementById('clearAll').onclick=async()=>{selected=new Set();localWrite(selected);render();await syncToServer(selected)};document.getElementById('selectedFilter').onclick=()=>{onlySelected=!onlySelected;document.getElementById('selectedFilter').classList.toggle('active',onlySelected);render()};Promise.all([fetch(DATA_URL,{cache:'no-store'}).then(r=>r.json()),fetch(SOURCES_URL,{cache:'no-store'}).then(r=>r.json())]).then(([data,src])=>{words=(data.words||[]).filter(x=>x&&x.word);buildSourceFilter(src.sources||[]);render();boot()}).catch(e=>setStatus(e.message,true));
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
