<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoàn Thành Từ · Tiếng Việt lớp 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:55px 18px}.wrap{max-width:820px;margin:auto}.top{text-align:center}.icon{font-size:48px}.top h1{margin:4px 0;font-size:32px}.top p{color:#667085;margin:8px 0 22px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:24px;padding:28px;box-shadow:0 12px 35px #1820330c}.rule{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef5ff;color:#2456a6;font-weight:800;font-size:14px}.count{margin:14px 0;color:#667085;font-weight:700}.question{font-size:28px;font-weight:800;text-align:center;line-height:1.55;margin:28px 0 24px}.blank{display:inline-block;min-width:80px;border-bottom:4px solid #8b95a7;color:#2456a6}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.choice{border:2px solid #dfe4ec;background:#fff;border-radius:17px;padding:17px 10px;font-size:24px;font-weight:850;cursor:pointer;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:#8aa7d8}.choice:disabled{cursor:default;opacity:.8}.feedback{text-align:center;min-height:28px;margin-top:20px;font-weight:800}.hint{text-align:center;color:#667085;font-size:14px;margin-top:12px}.fire{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;font-size:26px;animation:boom 900ms ease-out forwards}@keyframes boom{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.15);opacity:0}}@media(max-width:600px){.main{padding:35px 12px}.card{padding:20px 14px}.question{font-size:23px}.choices{grid-template-columns:1fr}.choice{padding:14px}.top h1{font-size:27px}}
</style></head>
<body><main class="main"><div class="wrap">
<header class="top"><div class="icon">✏️</div><h1>Hoàn Thành Từ</h1><p>Tiếng Việt lớp 1 · Luyện quy tắc chính tả</p></header>
<section class="card"><div style="text-align:center"><span class="rule" id="rule"></span><div class="count" id="count"></div></div>
<div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="hint" id="hint"></div></section></div></main><div class="fire" id="fire"></div>
<script>
const DATA=[
["c / k / q","__on cá",["c","k","q"],"c","Con cá"],
["c / k / q","__ái kéo",["c","k","q"],"c","Cái kéo"],
["c / k / q","__uả cam",["c","k","q"],"q","Quả cam"],
["c / k / q","__im khâu",["c","k","q"],"k","Kim khâu"],
["c / k / q","__éo",["c","k","q"],"k","Kéo"],
["g / gh","__ế gỗ",["g","gh"],"gh","Ghế gỗ"],
["g / gh","__à trống",["g","gh"],"g","Gà trống"],
["g / gh","__i nhớ",["g","gh"],"gh","Ghi nhớ"],
["g / gh","__i bàn",["g","gh"],"gh","Ghi bàn"],
["g / gh","__ọn gàng",["g","gh"],"g","Gọn gàng"],
["ng / ngh","__ỉ hè",["ng","ngh"],"ngh","Nghỉ hè"],
["ng / ngh","__ôi nhà",["ng","ngh"],"ng","Ngôi nhà"],
["ng / ngh","__he nhạc",["ng","ngh"],"ng","Nghe nhạc"],
["ng / ngh","__ếch",["ng","ngh"],"ngh","Nghếch"],
["l / n","__á cây",["l","n"],"l","Lá cây"],
["l / n","__ồi cơm",["l","n"],"n","Nồi cơm"],
["l / n","__àm bài",["l","n"],"l","Làm bài"],
["l / n","__ắng nghe",["l","n"],"l","Lắng nghe"],
["ch / tr","__ường học",["ch","tr"],"tr","Trường học"],
["ch / tr","__im sẻ",["ch","tr"],"ch","Chim sẻ"],
["ch / tr","__ơi bóng",["ch","tr"],"ch","Chơi bóng"],
["s / x","__ách vở",["s","x"],"s","Sách vở"],
["s / x","__e đạp",["s","x"],"x","Xe đạp"],
["s / x","__inh đẹp",["s","x"],"x","Xinh đẹp"],
["d / gi / r","__a đình",["d","gi","r"],"gi","Gia đình"],
["d / gi / r","__ỏ hoa",["d","gi","r"],"gi","Giỏ hoa"],
["d / gi / r","__ừng cây",["d","gi","r"],"r","Rừng cây"],
["an / ang","b__",["an","ang"],"an","Bàn"],
["an / ang","m__",["an","ang"],"an","Man"],
["on / ong","c__",["on","ong"],"on","Con"],
["on / ong","c__ viên",["on","ong"],"ong","Công viên"],
["in / inh","x__",["in","inh"],"inh","Xinh"],
["in / inh","t__",["in","inh"],"in","Tin"],
["iên / iêng","ch__",["iên","iêng"],"iêng","Chiêng"],
["iên / iêng","ti__",["iên","iêng"],"iên","Tiên"],
["ôn / ông","c__",["ôn","ông"],"ông","Công"],
["ôn / ông","m__",["ôn","ông"],"ôn","Môn"],
["uôn / uông","chu__",["uôn","uông"],"uông","Chuông"],
["uôn / uông","mu__",["uôn","uông"],"uôn","Muôn"]
];
const examples=[
["c / k / q","__éo",["c","k","q"],"k","Kéo"],
["g / gh","__i",["g","gh"],"gh","Ghi"],
["ng / ngh","__ỉ",["ng","ngh"],"ngh","Nghỉ"],
["l / n","__á",["l","n"],"l","Lá"],
["ch / tr","__ái cây",["ch","tr"],"tr","Trái cây"],
["s / x","__e",["s","x"],"x","Xe"]
];
let items=[...DATA,...examples],i=0,score=0,locked=false;
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){
  locked=false;
  const d=items[i%items.length],prefix=d[1],rule=d[0];
  document.getElementById("rule").textContent="Quy tắc: "+rule;
  document.getElementById("count").textContent="Đã làm đúng "+score+" / "+i+" câu";
  const parts=prefix.split("__");
  document.getElementById("question").innerHTML=esc(parts[0])+'<span class="blank">___</span>'+esc(parts[1]||"");
  const box=document.getElementById("choices");
  box.innerHTML=d[2].map(x=>'<button class="choice" data-v="'+esc(x)+'">'+esc(x)+"</button>").join("");
  document.getElementById("feedback").textContent="";
  document.getElementById("hint").textContent="Chọn phần chữ còn thiếu để hoàn thành từ.";
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>answer(b,d));
}
function answer(btn,d){
  if(locked)return;
  const correct=btn.dataset.v===d[3];
  if(!correct){
    document.getElementById("feedback").textContent="🔊 Chưa đúng — thử lại nhé!";
    document.getElementById("hint").textContent="Hãy đọc lại từ và chọn phần chữ phù hợp.";
    btn.disabled=true;
    return;
  }
  locked=true;
  score++;i++;
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  document.getElementById("count").textContent="Đã làm đúng "+score+" / "+i+" câu";
  document.getElementById("feedback").textContent="🎉 Chính xác!";
  document.getElementById("hint").textContent="Từ đúng: "+d[4];
  fireworks();
  setTimeout(render,1800);
}
function fireworks(){const f=document.getElementById("fire");f.innerHTML="";for(let n=0;n<22;n++){const s=document.createElement("span");s.className="spark";s.textContent=["🎉","✨","⭐","🎊"][n%4];s.style.left="50%";s.style.top="42%";s.style.setProperty("--x",(Math.random()*360-180)+"px");s.style.setProperty("--y",(Math.random()*300-150)+"px");f.appendChild(s)}setTimeout(()=>f.innerHTML="",1000)}
render();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
