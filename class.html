<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lớp · Learning Hub</title><style>body{margin:0;background:#f4f6fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:70px 24px 45px}.wrap{max-width:920px;margin:auto}.head{text-align:center;margin-bottom:28px}.icon{font-size:52px}.head h1{font-size:36px;margin:5px}.head p{color:#68738a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.subject{display:block;background:#fff;border:1px solid #e2e6ee;border-radius:22px;padding:22px;text-decoration:none;color:#182033;box-shadow:0 7px 20px #1820330d}.subject:hover{transform:translateY(-1px)}.subject .sicon{font-size:38px}.subject h2{margin:9px 0 6px;font-size:22px}.subject p{margin:0;color:#68738a;line-height:1.5}.arrow{display:block;margin-top:14px;color:#182033;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.main{padding:65px 14px 35px}}</style></head><body><main class="main"><div class="wrap"><header class="head"><div class="icon">🎓</div><h1>Lớp <span id="grade"></span></h1><p>Chọn môn học</p></header><section class="grid" id="subjects"></section></div></main><script>const g=Number(new URLSearchParams(location.search).get('grade')||1);document.title=`Lớp ${g} · Learning Hub`;document.getElementById('grade').textContent=g;const data=[['Toán','➕','Luyện tập Toán theo từng chủ đề.'],['Tiếng Việt','📖','Đọc, viết và luyện Tiếng Việt.'],['Tiếng Anh','🔤','Từ vựng và các trò chơi tiếng Anh.'],['Toán Tư Duy','🧠','Các bài toán tư duy.'],['Math','🌎','Math bằng tiếng Anh.']];document.getElementById('subjects').innerHTML=data.map(s=>{const href=s[0]==='Toán Tư Duy'&&g===1?'math-thinking.html':`subject.html?grade=${g}&subject=${encodeURIComponent(s[0])}`;return `<a class="subject" href="${href}"><div class="sicon">${s[1]}</div><h2>${s[0]}</h2><p>${s[2]}</p><span class="arrow">Chọn môn →</span></a>`}).join('');</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
