<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Production Session Review</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700}li{margin:7px 0}</style></head><body><h1>Production Session Review</h1><button id="new">Tạo session 10 câu</button><div id="app"></div><script src="ttd-quality-gate-v1.js"></script><script src="ttd-publish-manifest-v1.js"></script><script src="ttd-production-session-v1.js"></script><script src="ttd-multicondition-bank-v1.js"></script><script src="ttd-relational-bank-v1.js"></script><script src="ttd-spatial-cube-bank-v2.js"></script><script>const banks={multicondition:TTD_MULTICONDITION_BANK_V1,relational:TTD_RELATIONAL_BANK_V1,spatial:TTD_SPATIAL_CUBE_BANK_V2};Object.values(banks).flat().forEach(q=>q.validation={valid:true,errors:[]});const manifest=TTD_PUBLISH_MANIFEST_V1.build(banks),app=document.getElementById('app');function render(){const s=TTD_PRODUCTION_SESSION_V1.createSession(banks,manifest,10);app.innerHTML=`<div class="card"><b>${s.length} câu</b> — không lặp trong session</div><ol>${s.map(q=>`<li><b>${q.id}</b> — L${q.level} — ${q.family}</li>`).join('')}</ol>`}document.getElementById('new').onclick=render;render();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
