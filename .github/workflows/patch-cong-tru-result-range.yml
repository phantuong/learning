name: Patch Cong Tru result 0-10

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch cong-tru-10.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('cong-tru-10.html')
          s = path.read_text(encoding='utf-8')

          s = s.replace(
              "const RANGES=[10,50,100,1000,Infinity];",
              "const RANGES=[10,50,100,1000,Infinity,'result10'];"
          )
          s = s.replace(
              "const RANGE_LABELS=['0–10','0–50','0–100','0–1000','Không giới hạn'];",
              "const RANGE_LABELS=['0–10','0–50','0–100','0–1000','Không giới hạn','Kết quả 0 - 10'];"
          )
          s = s.replace(
              "if([10,50,100,1000,'inf'].includes(p.range))range=p.range==='inf'?Infinity:p.range;",
              "if([10,50,100,1000,'inf','result10'].includes(p.range))range=p.range==='inf'?Infinity:p.range;"
          )
          s = s.replace(
              "function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range:Number.isFinite(range)?range:'inf',operation,mode}))}catch(e){}}",
              "function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range:Number.isFinite(range)?range:(range==='result10'?'result10':'inf'),operation,mode}))}catch(e){}}"
          )
          s = s.replace(
              "function maxOperand(){if(Number.isFinite(range))return range;return 9999}",
              "function maxOperand(){if(range==='result10')return 10;if(Number.isFinite(range))return range;return 9999}"
          )

          old = '''function makeQuestion(){\n if(level==='three'||level==='four'){const count=level==='three'?3:4;const q=makeMulti(count);return{display:q.nums.map((n,i)=>i?` ${q.ops[i-1]} ${n}`:String(n)).join(''),answer:q.value,nums:q.nums,ops:q.ops};}\n const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const [a,b]=pairFor(level,op==='−'?'sub':'add');const value=op==='+'?a+b:a-b;return{display:`${a} ${op} ${b}`,answer:value,nums:[a,b],ops:[op]};\n}'''

          new = '''function makeQuestion(){\n for(let attempt=0;attempt<10000;attempt++){\n  let q;\n  if(level==='three'||level==='four'){const count=level==='three'?3:4;const m=makeMulti(count);q={display:m.nums.map((n,i)=>i?` ${m.ops[i-1]} ${n}`:String(n)).join(''),answer:m.value,nums:m.nums,ops:m.ops};}\n  else {const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const [a,b]=pairFor(level,op==='−'?'sub':'add');const value=op==='+'?a+b:a-b;q={display:`${a} ${op} ${b}`,answer:value,nums:[a,b],ops:[op]};}\n  if(range!=='result10'||(q.answer>=0&&q.answer<=10))return q;\n }\n return {display:'5 + 5',answer:10,nums:[5,5],ops:['+']};\n}'''

          if old not in s:
              raise SystemExit('Expected makeQuestion block not found; aborting without changes.')
          s = s.replace(old, new)

          path.write_text(s, encoding='utf-8')
          print('Patched result 0-10 range.')
          PY

      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('cong-tru-10.html').read_text(encoding='utf-8')
          checks = [
              "'result10'",
              "Kết quả 0 - 10",
              "range==='result10'",
              "q.answer>=0&&q.answer<=10",
          ]
          for x in checks:
              assert x in s, x
          print('Verification passed.')
          PY

      - name: Commit patched page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cong-tru-10.html
          git commit -m "Add result 0-10 practice range" || exit 0
          git push

      - name: Remove one-shot patch workflow
        if: success()
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/patch-cong-tru-result-range.yml
          git commit -m "Remove one-shot math patch workflow"
          git push
