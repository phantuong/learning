<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đọc Hiểu · Tiếng Việt · Lớp 1</title>
<style>
:root{--pink:#e85aa5;--ink:#29233f;--muted:#77677a;--line:#efd5e3;--good:#0b8f5a;--bad:#d62f45}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:24px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:14px;z-index:1250;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #18203312;cursor:pointer}.hero{text-align:center;padding:46px 0 18px}.hero-icon{font-size:52px}.hero h1{font-size:36px;margin:4px 0}.hero p{margin:0;color:var(--muted);font-size:16px}.story-card{background:#fffdfd;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px #dca9c522;overflow:hidden}.story-head{padding:18px 24px 12px;border-bottom:1px solid #f3e3eb;display:flex;align-items:center;justify-content:space-between}.story-number{font-weight:850;color:var(--pink)}.story-icon{font-size:40px}.story-body{padding:26px 34px 22px}.story-title{text-align:center;font-size:27px;margin:0 0 18px}.illustration{display:flex;align-items:center;justify-content:center;gap:14px;font-size:46px;min-height:92px;margin:0 auto 22px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#fff0f7,#fff9df);border:1px solid #f4dbe8}.story-text{font-size:19px;line-height:1.9;letter-spacing:.01em}.questions{margin-top:26px;padding:20px;background:#fff6fa;border-radius:18px}.questions h2{font-size:20px;margin:0 0 14px}.q{padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:11px 0}.q-text{font-weight:750;line-height:1.5}.option{width:100%;margin-top:8px;padding:10px 12px;border:1px solid #e9cada;background:#fff;border-radius:11px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.option:disabled{cursor:default}.option.correct{border-color:#28ad77;background:#eafaf2;color:var(--good);font-weight:750}.option.wrong{border-color:#f06a7b;background:#fff0f2;color:var(--bad)}.feedback{margin-top:8px;font-size:14px;font-weight:750}.actions{display:flex;justify-content:center;padding:18px 24px 26px;border-top:1px solid #f3e3eb}.next{width:100%;max-width:520px;border:0;border-radius:16px;padding:15px 22px;background:var(--pink);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 18px #e85aa544}.progress{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}.sync-status{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--muted);box-shadow:0 5px 18px #18203315;z-index:60;cursor:pointer}.sync-modal{display:none;position:fixed;inset:0;background:#18203355;z-index:1400;align-items:center;justify-content:center;padding:20px}.sync-modal.open{display:flex}.sync-box{width:min(430px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 60px #18203333}.sync-box h2{margin:0 0 8px}.sync-box p{color:var(--muted);line-height:1.5;margin:8px 0 16px}.sync-box input{display:block;width:100%;padding:12px 14px;margin:9px 0;border:1px solid var(--line);border-radius:12px;font:inherit}.sync-actions{display:grid;gap:9px;margin-top:14px}.sync-actions button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer}.sync-login{background:var(--pink);color:#fff}.sync-signup{background:#f8e8f1;color:var(--ink)}.sync-close{background:#f1f2f5;color:var(--ink)}.sync-message{font-size:13px;min-height:20px;margin-top:10px;color:var(--muted)}.sync-account{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:760px){.main{padding:12px 14px 55px}.story-body{padding:22px 20px 18px}.story-title{font-size:23px}.story-text{font-size:18px;line-height:1.8}.story-head{padding:16px 18px}.hero{padding-top:52px}.hero h1{font-size:30px}.illustration{font-size:38px}}
</style>
</head>
<body>
<script>history.replaceState(null,'','doc-hieu.html');</script>
<button class="mobile-btn" id="menuBtn" type="button" aria-label="Mở navigation">☰</button>
<main class="main"><div class="wrap">
<header class="hero"><div class="hero-icon">📖✨</div><h1>Đọc Hiểu</h1><p>500 câu chuyện nguyên bản, nhiều chủ đề cho bé lớp 1</p></header>
<article class="story-card"><div class="story-head"><div class="story-number" id="storyNumber">Đang tải...</div><div class="story-icon" id="storyIcon">📖</div></div>
<div class="story-body"><h2 class="story-title" id="storyTitle">Đang tải câu chuyện...</h2><div class="illustration" id="illustration">📖 ✨</div><div class="story-text" id="storyText">Đang tải nội dung...</div>
<section class="questions"><h2>🧠 Câu hỏi đọc hiểu</h2><div id="questions"></div></section></div>
<div class="actions"><button class="next" id="nextBtn" type="button">Tiếp theo →</button></div></article><div class="progress" id="progress"></div></div></main>
<button class="sync-status" id="syncStatus" type="button">☁️ Đang kiểm tra đồng bộ...</button>
<div class="sync-modal" id="syncModal"><div class="sync-box"><h2>☁️ Đồng bộ giữa các trình duyệt</h2><p>Đăng nhập cùng một tài khoản trên Safari, Opera hoặc thiết bị khác để tiếp tục đúng câu chuyện đang học.</p><input id="syncEmail" type="email" autocomplete="email" placeholder="Email"><input id="syncPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu (tối thiểu 6 ký tự)"><div class="sync-actions"><button class="sync-login" id="loginBtn" type="button">Đăng nhập & đồng bộ</button><button class="sync-signup" id="signupBtn" type="button">Tạo tài khoản mới</button><button class="sync-close" id="closeSync" type="button">Đóng</button></div><div class="sync-message" id="syncMessage"></div><div class="sync-account" id="syncAccount"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.LEARNING_SUPABASE_CONFIG={url:'https://ksqfcwjcijflvzzopkko.supabase.co',publishableKey:'sb_publishable_3WEpXJJe1HEgNJ4mfwmhUw_4jV9pQqg'};</script>
<script src="sync-v2.js?v=20261005"></script>
<script src="doc-hieu-data-v5.js?v=20261004"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const next=$('nextBtn'),num=$('storyNumber'),title=$('storyTitle'),icon=$('storyIcon'),ill=$('illustration'),txt=$('storyText'),qs=$('questions'),prog=$('progress'),status=$('syncStatus'),modal=$('syncModal'),email=$('syncEmail'),password=$('syncPassword'),message=$('syncMessage'),account=$('syncAccount');
const KEY='docHieuNextStory';let current=Number(localStorage.getItem(KEY)||1);if(!Number.isInteger(current)||current<1||current>500)current=1;
function setCurrent(n){current=n;localStorage.setItem(KEY,String(n));}
function render(){const s=window.DOC_HIEU_STORIES?.[current-1];if(!s){num.textContent='Lỗi dữ liệu';title.textContent='Không tải được câu chuyện';txt.textContent='Bộ truyện chưa sẵn sàng. Hãy tải lại trang.';return}num.textContent=`Câu chuyện ${current}/500`;title.textContent=s.title;icon.textContent=s.icon;ill.textContent=s.illustration;txt.textContent=s.text;qs.innerHTML='';(s.questions||[]).forEach((q,qi)=>{const box=document.createElement('div');box.className='q';const qt=document.createElement('div');qt.className='q-text';qt.textContent=`${qi+1}. ${q.q}`;box.appendChild(qt);q.options.forEach((o,oi)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+oi)+'. '+o;b.onclick=()=>{box.querySelectorAll('.option').forEach(x=>x.disabled=true);if(oi===q.answer)b.classList.add('correct');else{b.classList.add('wrong');box.querySelectorAll('.option')[q.answer]?.classList.add('correct')}fb.textContent=oi===q.answer?'🎉 Chính xác!':'💡 Đáp án đúng: '+String.fromCharCode(65+q.answer)};box.appendChild(b)});const fb=document.createElement('div');fb.className='feedback';box.appendChild(fb);qs.appendChild(box)});prog.textContent=`Câu chuyện ${current}/500 · Tiến độ lưu tự động`}
async function save(){const r=await window.learningSyncV2?.save({last_page:'doc-hieu.html',last_subject:'Tiếng Việt',last_course:'Đọc Hiểu',reading_story_current:current});updateStatus(r);}
function updateStatus(r){status.textContent=r?._cloud?'☁️ Đã đồng bộ':'☁️ Đăng nhập để đồng bộ giữa các trình duyệt';}
async function bootstrap(){render();try{const api=window.learningSyncV2;if(!api){updateStatus();return}const u=await api.user();if(u){const cloud=await api.loadCloud();if(cloud?.reading_story_current){const n=Number(cloud.reading_story_current);if(n>=1&&n<=500)setCurrent(n);render();status.textContent='☁️ Đã đồng bộ';account.textContent='Đang đăng nhập: '+(u.email||'');}else{await save();}}else updateStatus();}catch(e){console.warn(e);updateStatus()}}
next.onclick=()=>{setCurrent(current===500?1:current+1);render();save();window.scrollTo({top:0,behavior:'smooth'})};
status.onclick=async()=>{modal.classList.add('open');message.textContent='';try{const u=await window.learningSyncV2?.user();if(u){email.value=u.email||'';account.textContent='Đang đăng nhập: '+(u.email||'');}else account.textContent='Chưa đăng nhập';}catch(_){account.textContent='Không kiểm tra được tài khoản';}};
$('closeSync').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
$('loginBtn').onclick=async()=>{message.textContent='Đang đăng nhập...';try{const u=await window.learningSyncV2.signIn(email.value,password.value);const cloud=await window.learningSyncV2.loadCloud();if(cloud?.reading_story_current){const n=Number(cloud.reading_story_current);if(n>=1&&n<=500)setCurrent(n);render();}else await save();status.textContent='☁️ Đã đồng bộ';account.textContent='Đang đăng nhập: '+(u.email||email.value);message.textContent='Đăng nhập thành công. Tiến độ đã đồng bộ.';}catch(e){message.textContent='Không đăng nhập được: '+(e?.message||e);}};
$('signupBtn').onclick=async()=>{message.textContent='Đang tạo tài khoản...';try{const r=await window.learningSyncV2.signUp(email.value,password.value);if(r.session){await save();status.textContent='☁️ Đã đồng bộ';account.textContent='Đang đăng nhập: '+(r.user?.email||email.value);message.textContent='Tạo tài khoản thành công và đã lưu tiến độ.';}else message.textContent='Tài khoản đã tạo. Hãy kiểm tra email để xác nhận, sau đó đăng nhập ở cả Safari và Opera.';}catch(e){message.textContent='Không tạo được tài khoản: '+(e?.message||e);}};
bootstrap();
})();
</script>
<script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
