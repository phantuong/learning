a7}.progress{height:9px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin:10px 0 22px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}.qno{color:var(--muted);font-weight:750;font-size:15px}.question{font-size:23px;font-weight:800;line-height:1.35;margin:8px 0 18px}.visual{min-height:105px;display:flex;justify-content:center;align-items:center;gap:12px;margin:6px 0 18px;font-size:46px}.number-row{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.big-number{font-size:46px;font-weight:900}.equation{font-size:38px;font-weight:900;letter-spacing:2px}.flower{font-size:52px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{min-height:70px;border:2px solid #d8deea;background:#fbfcff;border-radius:18px;padding:12px 14px;font-size:20px;font-weight:800;color:#182033;cursor:pointer;transition:.16s}.option:hover{border-color:#9eb5ff;transform:translateY(-1px)}.option:active{transform:scale(.98)}.option.correct{background:#eaf8f1;border-color:#49bd86;color:#087443}.option.wrong{background:#fff0f1;border-color:#f08b93;color:#b4232e}.letter{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:#eef2ff;color:#4d62b5;margin-right:8px;font-size:14px}.option.correct .letter{background:#c9f0dc;color:#087443}.option.wrong .letter{background:#ffd4d8;color:#b4232e}.feedback{min-height:38px;text-align:center;font-weight:800;font-size:17px;padding:14px 0 2px}.next{display:none;width:100%;border:0;border-radius:17px;background:var(--nav);color:white;font-size:19px;font-weight:800;padding:16px;margin-top:12px;cursor:pointer}.next.show{display:block}.result{text-align:center;padding:28px 10px}.stars{font-size:46px;letter-spacing:4px}.result h2{font-size:30px;margin:10px 0}.result p{color:var(--muted);font-size:17px}.restart{border:0;border-radius:16px;background:var(--nav);color:#fff;padding:14px 22px;font-size:17px;font-weight:800;cursor:pointer}.mini-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{color:#5e6a80;text-decoration:none;font-weight:700}.score{font-weight:850}.tip{background:#f4f7ff;border-radius:17px;padding:13px 15px;margin-top:18px;color:#52617b;font-size:14px;line-height:1.45}
@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:.22s;width:270px;box-shadow:12px 0 35px #18203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#18203355;z-index:15}.main{margin-left:0;padding:12px 14px 35px}.mobile-btn{display:block;margin-bottom:8px}.hero h1{font-size:31px}.lesson{padding:18px;border-radius:22px}.options{grid-template-columns:1fr}.question{font-size:21px}.option{min-height:66px}.lesson-top{align-items:flex-start}.source-note{max-width:160px;text-align:right}}

<header class="hero"><div class="emoji">🧠🔢</div><h1>Toán tư duy</h1><p>Lớp 1 · Luyện tập bằng trò chơi tương tác</p></header>
<section class="lesson" id="lesson"></section>
</div></main></div>
<script>
const questions=[
 {q:'Số nào là số lớn nhất có hai chữ số mà chữ số hàng đơn vị là 1?',options:['90','91','11','71'],answer:1,visual:'🔢'},
 {q:'Điền số còn thiếu vào ô trống: 49 − □5 = 24',options:['4','3','2'],answer:2,visual:'49 − □5 = 24'},
 {q:'Con thỏ nào mang đáp án đúng?  8 < □ < 10',options:['8','9','10','7'],answer:1,visual:'🐰'},
 {q:'Chọn dấu thích hợp: 6 □ 10',options:['−','>','<'],answer:2,visual:'6   □   10'},
 {q:'Viết số thích hợp để các số được sắp xếp từ bé đến lớn:  □  2  3',options:['4','5','3'],answer:0,visual:'□  2  3'},
 {q:'Bông hoa mang số thích hợp điền vào chỗ chấm là: 2 < □',options:['🌻 3 · 🌻 4','🌻 1 · 🌻 3','🌻 3','🌻 4'],answer:0,visual:'🌻 2 < □'},
 {q:'Số bút chì như thế nào so với số cục tẩy?',options:['Nhiều hơn','Bằng nhau','Ít hơn'],answer:2,visual:'✏️   🧽 🧽 🧽'},
 {q:'79 là số liền trước của số nào?',options:['70','78','80','81'],answer:1,visual:'79  →  ?'},
 {q:'Điền số thích hợp: 4 = □',options:['4','3','5','2'],answer:0,visual:'4  =  □'},
 {q:'Số nào có thể thay vào vị trí con heo?  5 < 🐷 < 8',options:['6','7','Cả 6 và 7 đều đúng'],answer:2,visual:'5  <  🐷  <  8'},
 {q:'Tổng số quả chuối là bao nhiêu?',options:['7','8','9'],answer:1,visual:'🍌🍌🍌🍌   🍌🍌🍌🍌'},
 {q:'Con cua đã che mất số nào?  🦀 > 7',options:['8','9','Cả 8 và 9'],answer:2,visual:'🦀  >  7'},
 {q:'Điền dấu thích hợp: 6 □ 8',options:['<','>','='],answer:0,visual:'6  □  8'},
 {q:'Kết quả của phép tính 5 − 2 + 4 là:',options:['8','9','7','10'],answer:2,visual:'5 − 2 + 4 = ?'},
 {q:'So sánh hai phép tính: 6 − 1 − 4  □  8 − 3 − 4',options:['<','>','='],answer:2,visual:'6−1−4   □   8−3−4'},
 {q:'Phép trừ phù hợp để tìm số viên kẹo không bị gạch bỏ là:',options:['9 − 4 = 5','9 − 5 = 4','Cả A và B đều đúng'],answer:1,visual:'🍬🍬🍬🍬🍬  ✕   🍬🍬🍬🍬'}
];
let index=0,score=0,answered=false;
const lesson=document.getElementById('lesson');
function render(){const x=questions[index];answered=false;lesson.innerHTML=`<div class="lesson-top"><div><div class="topic">Chủ đề 1 · Số, chữ số và phép toán</div><div class="qno">Câu ${index+1} / ${questions.length}</div></div><div class="source-note">Bài luyện tập được dựng lại bằng code từ tài liệu học tập đã cung cấp</div></div><div class="progress"><i style="width:${(index/questions.length)*100}%"></i></div><div class="question">${x.q}</div><div class="visual">${x.visual}</div><div class="options">${x.options.map((o,i)=>`<button class="option" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="next()">Tiếp theo →</button><div class="tip">💡 Hãy tự suy nghĩ trước khi chạm vào đáp án. Mỗi câu chỉ có một lần chọn.</div>`;}
function answer(i){if(answered)return;answered=true;const x=questions[index],buttons=document.querySelectorAll('.option');buttons.forEach((b,n)=>{if(n===x.answer)b.classList.add('correct');if(n===i&&i!==x.answer)b.classList.add('wrong')});if(i===x.answer){score++;document.getElementById('feedback').textContent='🎉 Chính xác!';}else{document.getElementById('feedback').textContent='💪 Chưa đúng. Đáp án đúng đã được đánh dấu.'}document.getElementById('score').textContent='⭐ '+score;document.getElementById('next').classList.add('show');}
function next(){if(index<questions.length-1){index++;render()}else{showResult()}}
function showResult(){const pct=Math.round(score/questions.length*100);const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';lesson.innerHTML=`<div class="result"><div class="stars">${stars}</div><h2>Hoàn thành!</h2><p>Bé làm đúng <strong>${score}/${questions.length}</strong> câu (${pct}%).</p><p>${pct>=90?'Tuyệt vời! Bé đang suy luận rất tốt.':pct>=70?'Rất tốt! Bé hãy luyện thêm một chút nữa.':'Không sao! Mình cùng luyện lại từng câu nhé.'}</p><button class="restart" onclick="restart()">Làm lại</button></div>`}
function restart(){index=0;score=0;document.getElementById('score').textContent='⭐ 0';render()}
function toggleNav(){sidebar.classList.toggle('open');overlay.classList.toggle('show')}
function toggleGrade(){document.querySelector('.subnav').classList.toggle('open')}
render();
</script>
</body>
