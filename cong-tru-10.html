<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5fa">
<title>Cộng Trừ · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}
*{box-sizing:border-box}body{margin:0;background:#fff5fa}main{min-height:100vh;padding:12px 14px 40px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:36px;margin:6px 0;color:var(--ink)}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:15px}.setting h3{margin:0 0 11px;font-size:17px}.choices{display:grid;gap:8px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(3,minmax(0,1fr))}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;line-height:1.15;min-width:0}.choice small{font-size:12px;font-weight:700}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start,.next,.again{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.tip{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800}.bar{height:8px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 28px}.bar i{display:block;height:100%;background:var(--pink);transition:.2s}.question{text-align:center;color:var(--muted);font-weight:750;font-size:17px}.equation{text-align:center;font-size:52px;font-weight:950;letter-spacing:1px;color:var(--ink);margin:24px 0 30px;word-break:break-word}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:70px;border:2px solid #ead3df;background:#fff;border-radius:18px;font-size:27px;font-weight:900;color:#514b5c;cursor:pointer}.answer.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.answer.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.write{text-align:center}.number-input{width:100%;max-width:360px;text-align:center;border:2px solid #cbd5e1;border-radius:18px;padding:15px;font-size:34px;font-weight:900;outline:none;background:#fff}.number-input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ec6fa825}.submit{width:100%;max-width:360px;margin:12px auto 0;display:block;border:0;border-radius:18px;padding:15px;font-size:19px;font-weight:900;color:#fff;background:#d9dce3;cursor:not-allowed}.submit.enabled{background:var(--pink);cursor:pointer}.mic-area{text-align:center}.mic{width:100px;height:100px;border:0;border-radius:50%;background:#eef2ff;color:#344b9b;font-size:43px;cursor:pointer;box-shadow:0 7px 0 #d9e1ff}.status{text-align:center;min-height:26px;margin-top:13px;color:var(--muted);font-weight:700}.feedback{text-align:center;min-height:38px;padding:15px 0;font-size:18px;font-weight:850}.feedback.good{color:#087443}.feedback.bad{color:#b4232e}.next{display:none;background:var(--ink);box-shadow:none}.next.show{display:block}.result{text-align:center}.result .big{font-size:58px}.result h2{font-size:30px;margin:8px}.result p{color:var(--muted);font-size:18px}.hidden{display:none!important}
@media(max-width:760px){main{padding:12px 14px 35px}.hero h1{font-size:30px}.card{padding:16px;border-radius:22px}.settings{grid-template-columns:1fr;gap:12px}.setting{padding:12px;border-radius:18px}.setting h3{font-size:15px;margin-bottom:9px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges .choice:last-child{grid-column:1/-1}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{font-size:14px;padding:9px 5px}.choice small{font-size:11px}.equation{font-size:43px;margin:20px 0 25px}.answers{grid-template-columns:repeat(2,1fr)}.answer{min-height:68px;font-size:24px}.number-input,.submit{max-width:none}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside>
<div id="overlay" class="overlay"></div>
<main><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap">
<header class="hero"><div class="emoji">➕➖</div><h1>Cộng Trừ</h1><p>Lớp 1 · 10 câu mỗi bài</p></header>
<section id="setup" class="card">
<div class="settings">
<div class="setting"><h3>🎯 Chọn level</h3><div class="choices levels" id="levels"></div></div>
<div class="setting"><h3>🔢 Phạm vi số</h3><div class="choices ranges" id="ranges"></div></div>
<div class="setting"><h3>➕➖ Phép tính</h3><div class="choices operations" id="operations"></div></div>
<div class="setting"><h3>✍️ Cách trả lời</h3><div class="choices modes" id="modes"></div></div>
</div>
<button id="startBtn" class="start">Bắt đầu luyện tập ✨</button>
<div class="tip">Mỗi bài gồm 10 câu. Câu hỏi được tạo tự động theo level, phạm vi số và phép tính bé chọn.</div>
</section>
<section id="quiz" class="card quiz"></section>
<section id="result" class="card result hidden"></section>
</div></main>
<script>
const $=id=>document.getElementById(id);
const PREF='learning_math_add_sub_preferences_v2';
const LEVELS=[['no-carry','Không Nhớ','Cộng/trừ theo từng hàng, không cần nhớ hoặc mượn'],['carry','Có Nhớ','Có ít nhất một lần nhớ hoặc mượn'],['three','3 Số','Biểu thức gồm 3 số'],['four','4 Số','Biểu thức gồm 4 số']];
const RANGES=[10,50,100,1000,Infinity,'result10'];
const RANGE_LABELS=['0–10','0–50','0–100','0–1000','Không giới hạn','Kết quả 0 - 10'];
const OPS=[['add','Cộng'],['sub','Trừ'],['mixed','Cộng - Trừ']];
const MODES=[['choice','Chọn Đáp Án'],['write','Viết Đáp Án'],['speak','Nói Đáp Án']];
let level='no-carry',range=10,operation='add',mode='choice',questions=[],pos=0,score=0,answered=false,recognition=null;
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(LEVELS.some(x=>x[0]===p.level))level=p.level;if([10,50,100,1000,'inf','result10'].includes(p.range))range=p.range==='inf'?Infinity:p.range;if(OPS.some(x=>x[0]===p.operation))operation=p.operation;if(MODES.some(x=>x[0]===p.mode))mode=p.mode}catch(e){}
function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range:Number.isFinite(range)?range:(range==='result10'?'result10':'inf'),operation,mode}))}catch(e){}}
function renderChoices(){
 $('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${x[0]===level?'on':''}" onclick="pickLevel('${x[0]}')">${x[1]}<br><small>${x[2]}</small></button>`).join('');
 $('ranges').innerHTML=RANGES.map((x,i)=>`<button class="choice ${x===range?'on':''}" onclick="pickRange(${i})">${RANGE_LABELS[i]}</button>`).join('');
 $('operations').innerHTML=OPS.map(x=>`<button class="choice ${x[0]===operation?'on':''}" onclick="pickOperation('${x[0]}')">${x[1]}</button>`).join('');
 $('modes').innerHTML=MODES.map(x=>`<button class="choice ${x[0]===mode?'on':''}" onclick="pickMode('${x[0]}')">${x[1]}</button>`).join('');
}
function pickLevel(v){level=v;save();renderChoices()}function pickRange(i){range=RANGES[i];save();renderChoices()}function pickOperation(v){operation=v;save();renderChoices()}
function pickMode(v){mode=v;save();renderChoices()}
function rand(max){return Math.floor(Math.random()*(max+1))}
function maxOperand(){if(range==='result10')return 10;if(Number.isFinite(range))return range;return 9999}
function digits(n){return String(Math.abs(n)).split('').reverse().map(Number)}
function noCarryPair(max,sub=false){for(let i=0;i<5000;i++){let a=rand(max),b=rand(max);if(sub&&a<b)[a,b]=[b,a];if(sub&&a===b)continue;const da=digits(a),db=digits(b),len=Math.max(da.length,db.length);let ok=true;for(let j=0;j<len;j++){const x=da[j]??0,y=db[j]??0;if(sub?x<y:x+y>9){ok=false;break}}if(ok&&(sub?a!==b:true))return[a,b]}return sub?[9,1]:[11,22]}
function carryPair(max,sub=false){for(let i=0;i<8000;i++){let a=rand(max),b=rand(max);if(sub&&a<b)[a,b]=[b,a];if(sub&&a===b)continue;const da=digits(a),db=digits(b),len=Math.max(da.length,db.length);let carry=false;for(let j=0;j<len;j++){const x=da[j]??0,y=db[j]??0;if(sub?x<y:x+y>=10){carry=true;break}}if(carry)return[a,b]}return sub?[20,15]:[6,7]}
function pairFor(levelKey,op){const max=maxOperand(),sub=op==='sub';if(levelKey==='no-carry')return noCarryPair(max,sub);if(levelKey==='carry')return carryPair(max,sub);return [rand(max),rand(max)]}
function validExpression(numbers,ops){let value=numbers[0];for(let i=0;i<ops.length;i++)value=ops[i]==='+'?value+numbers[i+1]:value-numbers[i+1];return value}
function makeMulti(count){const max=maxOperand();for(let attempt=0;attempt<5000;attempt++){const nums=[],ops=[];let value=operation==='sub'&&max>0?rand(max-1)+1:rand(max);nums.push(value);for(let i=1;i<count;i++){const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const n=op==='−'?rand(value):rand(max);nums.push(n);ops.push(op);value=op==='+'?value+n:value-n}if(value>=0)return{nums,ops,value}}const nums=Array(count).fill(1);const ops=Array(count-1).fill('+');return{nums,ops,value:count} }
function makeQuestion(){
 for(let attempt=0;attempt<10000;attempt++){
  let q;
  if(level==='three'||level==='four'){const count=level==='three'?3:4;const m=makeMulti(count);q={display:m.nums.map((n,i)=>i?` ${m.ops[i-1]} ${n}`:String(n)).join(''),answer:m.value,nums:m.nums,ops:m.ops};}
  else {const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const [a,b]=pairFor(level,op==='−'?'sub':'add');const value=op==='+'?a+b:a-b;q={display:`${a} ${op} ${b}`,answer:value,nums:[a,b],ops:[op]};}
  if(range!=='result10'||(q.answer>=0&&q.answer<=10))return q;
 }
 return {display:'5 + 5',answer:10,nums:[5,5],ops:['+']};
}
function build(){questions=[];const seen=new Set();while(questions.length<10){const q=makeQuestion();const key=q.display;if(!seen.has(key)){seen.add(key);questions.push(q)}}pos=0;score=0}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){stopRecognition();build();$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.add('show');render()}
function render(){stopRecognition();answered=false;const q=questions[pos];$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1} / 10</span><span>Đúng: ${score}</span></div><div class="bar"><i style="width:${pos/10*100}%"></i></div><div class="question">Tính kết quả</div><div class="equation">${q.display} = ?</div><div id="answerArea"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next">Câu tiếp theo →</button>`;if(mode==='choice')renderAnswers(q);else if(mode==='write')renderWrite(q);else renderSpeak()}
function renderAnswers(q){let values=new Set([q.answer]);const span=Number.isFinite(range)?Math.max(12,Math.min(100,range)):100;while(values.size<4)values.add(Math.floor(Math.random()*(span+1)));const arr=shuffle([...values]);$('answerArea').innerHTML='<div class="answers">'+arr.map(v=>`<button class="answer" data-value="${v}">${v}</button>`).join('')+'</div>';$('answerArea').querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(Number(b.dataset.value),b))}
function renderWrite(q){$('answerArea').innerHTML='<div class="write"><input id="numberInput" class="number-input" type="number" inputmode="numeric" placeholder="Đáp án"><button id="submitBtn" class="submit" disabled>Trả lời</button></div>';const input=$('numberInput'),btn=$('submitBtn');input.oninput=()=>{const ok=input.value.trim()!=='';btn.disabled=!ok;btn.classList.toggle('enabled',ok)};input.onkeydown=e=>{if(e.key==='Enter'&&input.value.trim()!=='')submit(Number(input.value),btn)};input.focus()}
function renderSpeak(){ $('answerArea').innerHTML='<div class="mic-area"><button id="micBtn" class="mic" aria-label="Nói đáp án">🎙️</button><div id="status" class="status">Chạm micro và nói đáp án.</div></div>';$('micBtn').onclick=startListening}
function submit(value,el){if(answered)return;if(!Number.isFinite(value)){feedback(false,'Hãy nhập một số hợp lệ.');return}answered=true;const q=questions[pos],ok=value===q.answer;if(ok)score++;const fb=$('feedback');fb.textContent=ok?'🎉 Chính xác!':`💪 Chưa đúng. Đáp án là ${q.answer}.`;fb.className='feedback '+(ok?'good':'bad');if(el?.classList)el.classList.add(ok?'correct':'wrong');if(mode==='choice')document.querySelectorAll('.answer').forEach(b=>{if(Number(b.dataset.value)===q.answer)b.classList.add('correct')});if(mode==='write'){const input=$('numberInput'),btn=$('submitBtn');if(input)input.disabled=true;if(btn){btn.disabled=true;btn.classList.remove('enabled')}}$('quiz').querySelector('.top').lastElementChild.textContent=`Đúng: ${score}`;$('quiz').querySelector('.bar i').style.width=((pos+1)/10*100)+'%';$('nextBtn').classList.add('show');if(mode==='speak')document.getElementById('status').textContent=ok?'Đã nhận đáp án chính xác.':'Đã nhận đáp án.'}
function feedback(ok,msg){const fb=$('feedback');fb.textContent=msg;fb.className='feedback '+(ok?'good':'bad')}
function parseSpoken(text){const s=text.toLowerCase().trim().replace(/[.,!?]/g,'');const m=s.match(/-?\d+/);if(m)return Number(m[0]);const map={'không':0,'zero':0,'một':1,'mot':1,'one':1,'hai':2,'two':2,'ba':3,'three':3,'bốn':4,'bon':4,'four':4,'năm':5,'nam':5,'five':5,'sáu':6,'sau':6,'six':6,'bảy':7,'bay':7,'seven':7,'tám':8,'tam':8,'eight':8,'chín':9,'chin':9,'nine':9,'mười':10,'muoi':10};if(s in map)return map[s];return null}
function startListening(){if(answered)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){feedback(false,'Trình duyệt này chưa hỗ trợ nhận diện giọng nói.');return}stopRecognition();recognition=new SR();recognition.lang='vi-VN';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=3;const btn=$('micBtn'),status=$('status');btn.classList.add('pressed');status.textContent='🎧 Đang nghe...';recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=(e.results[i][0]?.transcript||'')+' ';const v=parseSpoken(t);if(v===null)feedback(false,'Mình chưa nhận ra số. Hãy thử lại.');else submit(v,btn)};recognition.onend=()=>{btn.classList.remove('pressed');recognition=null};recognition.onerror=e=>{if(e.error!=='aborted')status.textContent=e.error==='not-allowed'?'Hãy cho phép trình duyệt dùng micro.':'Không nghe rõ. Hãy thử lại.'};try{recognition.start()}catch(e){btn.classList.remove('pressed')}}
function stopRecognition(){if(recognition){try{recognition.onend=null;recognition.stop()}catch(e){}recognition=null}}
function result(){stopRecognition();$('quiz').classList.remove('show');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="big">${score===10?'🏆':'💪'}</div><h2>${score===10?'Tuyệt vời!':'Cố gắng lên!'}</h2><p>Bé trả lời đúng <strong>${score}/10</strong> câu.</p><button id="again" class="again">Làm bài tiếp theo →</button>`;$('again').onclick=start}
$('startBtn').onclick=start;renderChoices();
$('quiz').addEventListener('click',e=>{if(e.target.id==='nextBtn'){if(pos<9){pos++;render()}else result()}});
</script>
<script src="app-nav.js"></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
