<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Quality Dashboard v1</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:14px;padding:14px}.ok{color:#16734a}.warn{color:#b54708}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}code{font-size:.85em}</style></head><body><h1>TTD Question Bank Quality Dashboard</h1><div id="app">Loading...</div><script src="ttd-quality-gate-v1.js"></script><script src="ttd-publish-manifest-v1.js"></script><script>
const banks={};
const files=['ttd-counting-hidden-v2.js','ttd-multicondition-bank-v1.js','ttd-relational-bank-v1.js','ttd-spatial-cube-bank-v2.js'];
const app=document.getElementById('app');
Promise.all(files.map(src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)}))).then(()=>{
 if(window.TTD_COUNTING_HIDDEN_BANK_V2)banks.counting=TTD_COUNTING_HIDDEN_BANK_V2;
 if(window.TTD_MULTICONDITION_BANK_V1)banks.multicondition=TTD_MULTICONDITION_BANK_V1;
 if(window.TTD_RELATIONAL_BANK_V1)banks.relational=TTD_RELATIONAL_BANK_V1;
 if(window.TTD_SPATIAL_CUBE_BANK_V2)banks.spatial=TTD_SPATIAL_CUBE_BANK_V2;
 const all=Object.values(banks).flat();const r=TTD_QUALITY_GATE_V1.inspect(all);const manifest=TTD_PUBLISH_MANIFEST_V1.build(banks);
 app.innerHTML=`<div class="grid"><div class="card"><b>Total</b><h2>${r.total}</h2></div><div class="card"><b>Accepted</b><h2 class="ok">${r.accepted}</h2></div><div class="card"><b>Rejected</b><h2 class="bad">${r.rejected}</h2></div><div class="card"><b>Exact duplicates</b><h2 class="warn">${r.exactDuplicates.length}</h2></div></div><div class="card" style="margin-top:12px"><b>Near duplicates:</b> ${r.nearDuplicates.length} &nbsp; <b>Families:</b> ${Object.keys(r.byFamily).length} &nbsp; <b>Manifest:</b> ${manifest.total}</div><h2>By family</h2><table><tr><th>Family</th><th>Count</th></tr>${Object.entries(r.byFamily).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table><h2>Answer distribution</h2><table><tr><th>Answer index</th><th>Count</th></tr>${Object.entries(r.answerDistribution).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>${r.invalid.length?'<h2>Rejected questions</h2><table><tr><th>ID</th><th>Errors</th></tr>'+r.invalid.map(x=>`<tr><td><code>${x.id}</code></td><td>${x.errors.join(', ')}</td></tr>`).join('')+'</table>':'<p class="ok"><b>No validation failures reported by the loaded banks.</b></p>'}`;
}).catch(e=>app.innerHTML=`<p class="bad">Dashboard could not load a bank: ${e}</p>`);
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
