<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toán Tư Duy · Lớp 1</title><style>:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--line:#e2e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 16px 50px}.hero{background:linear-gradient(135deg,#182033,#35466c);color:#fff;border-radius:26px;padding:26px;margin-bottom:20px}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.84}.overall{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:20px}.overall-row{display:flex;justify-content:space-between;gap:12px}.bar{height:9px;background:#e8ebf1;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#4f7cff;width:0;transition:width .3s}.section-title{margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:var(--navy);box-shadow:0 6px 18px #1820330a}.card-top{display:flex;align-items:center;gap:12px}.icon{font-size:36px}.card h2{margin:0;font-size:19px}.card p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.4}.levels{display:flex;gap:7px;margin-top:14px}.level{flex:1;text-align:center;border-radius:10px;padding:8px 3px;font-size:13px;font-weight:750;background:#eef1f6;color:#68738a}.level.open{background:#eaf0ff;color:#315bd6}.level.done{background:#eaf9f1;color:#17663f}.level.locked{opacity:.55}.cta{display:block;margin-top:12px;background:var(--navy);color:#fff;text-align:center;border-radius:12px;padding:10px;font-weight:750}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{border-radius:22px}.card{padding:16px}}</style></head><body><main class="wrap"><section class="hero"><h1>🧠 Toán Tư Duy · Lớp 1</h1><p>Học theo kỹ năng, luyện từng cấp độ và theo dõi tiến bộ của bé.</p></section><section class="overall"><div class="overall-row"><strong>Tiến độ tổng thể</strong><strong id="percent">0%</strong></div><div class="bar"><div class="fill" id="fill"></div></div></section><h2 class="section-title">8 kỹ năng tư duy</h2><section class="grid" id="groups"></section></main><script src="data/ttd-progress.js"></script><script>const groups=[['pattern','🔷','Quy luật & Dãy hình','Tìm quy luật và hình tiếp theo.'],['classification','🟢','Phân loại','Tìm điểm giống và khác.'],['analogy','🔄','Tương tự','Nhận biết phép biến đổi.'],['matrix','🧩','Ma trận hình ảnh','Tìm quy luật trong bảng hình.'],['spatial','🧭','Tư duy không gian','Vị trí, hướng và phép xoay.'],['counting','🔢','Đếm & Logic','Đếm và tìm quan hệ.'],['ordering','📏','Sắp xếp & So sánh','Sắp xếp theo quy luật.'],['missing','🧩','Mảnh ghép còn thiếu','Hoàn thành hình theo quy luật.']];const progress=window.TTD_PROGRESS;function get(k,l){try{return progress?.get?.(k,l)||progress?.data?.[k]?.[l]||null}catch(e){return null}}function card(g){let levels='';for(let l=1;l<=3;l++){const p=get(g[0],l);const score=typeof p==='number'?p:p?.bestScore||0;const done=score>=100;levels+=`<span class="level ${done?'done':l===1?'open':'locked'}">L${l}${done?' ✓':l===1?' ▶':' 🔒'}</span>`}return `<a class="card" href="thinking-practice.html?group=${g[0]}&level=1"><div class="card-top"><div class="icon">${g[1]}</div><div><h2>${g[2]}</h2><p>${g[3]}</p></div></div><div class="levels">${levels}</div><span class="cta">Luyện tập →</span></a>`}document.getElementById('groups').innerHTML=groups.map(card).join('');let completed=0,total=groups.length*3;groups.forEach(g=>{for(let l=1;l<=3;l++){const p=get(g[0],l);const s=typeof p==='number'?p:p?.bestScore||0;if(s>=100)completed++}});const pct=Math.round(completed/total*100);document.getElementById('percent').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
