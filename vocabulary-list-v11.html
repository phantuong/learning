<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Danh sách Từ Vựng</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f;--soft:#fff0f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search,.meaning-input{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted)}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-actions{display:flex;gap:8px;padding:4px 4px 8px;position:sticky;top:0;background:#fff}.source-actions button,.edit,.save,.cancel{border:1px solid #ead9e4;border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.source-actions button{flex:1;background:#fff7fb;color:var(--pink)}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item label{font-size:14px;line-height:1.35}.source-item small{display:block;color:var(--muted);margin-top:2px}.count,.status{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 8px}.status{min-height:18px;font-weight:700}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4}.edit{background:#fff;color:var(--pink);margin-top:8px}.editbox{display:flex;gap:7px;margin-top:8px}.meaning-input{padding:9px 10px;font-size:14px}.save{background:var(--pink);color:#fff}.cancel{background:#fff;color:var(--muted)}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:var(--soft);color:var(--pink)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:56px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px}.word{font-size:19px}.speak{width:41px;height:41px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary">Đang tải nguồn…</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div><div id="count" class="count">Đang tải...</div><div id="status" class="status">Đang tải dữ liệu...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v2"></script><script src="auth-guard.js?v=20261006v1"></script><script src="vocabulary-source-sync.js?v=20261006v1"></script><script src="vocabulary-db.js?v=20261006v2"></script><script>
const $=id=>document.getElementById(id);let words=[],sources=[],selected=new Set(),editing=null;const emoji={cat:'🐱',dog:'🐶',bird:'🐦',fish:'🐟',mouse:'🐭',rabbit:'🐰',cow:'🐄',sheep:'🐑',duck:'🦆',chicken:'🐔',hat:'🧢',shirt:'👕',shoes:'👟',socks:'🧦',glasses:'👓',picture:'🖼️',bed:'🛏️',clock:'🕒',bookcase:'📚',plant:'🪴',television:'📺',table:'🪑',sofa:'🛋️',cushion:'🛋️',living:'🛋️',bedroom:'🛏️',bathroom:'🛁',kitchen:'🍳',garden:'🌳',circle:'⚪',triangle:'🔺',rectangle:'▭',square:'⬜',oval:'🥚',family:'👨‍👩‍👧‍👦',old:'👴',young:'👶',tall:'📏',short:'📏','play football':'⚽','play tennis':'🎾','ride a horse':'🐴','ride a bike':'🚲'};const meaning={"stand up":"đứng lên","sit down":"ngồi xuống","open your book":"mở sách","raise your hand":"giơ tay","sit nicely":"ngồi ngay ngắn","be quiet":"giữ im lặng","listen and look":"lắng nghe và nhìn","speak English":"nói tiếng Anh","pencil sharpener":"đồ gọt bút chì","pencil case":"hộp bút","living room":"phòng khách","dining room":"phòng ăn","dark hair":"tóc sẫm màu","blond hair":"tóc vàng","curly hair":"tóc xoăn","straight hair":"tóc thẳng","long hair":"tóc dài","T-shirt":"áo phông","play football":"chơi bóng đá","play tennis":"chơi quần vợt","ride a horse":"cưỡi ngựa","ride a bike":"đi xe đạp","old":"già, lớn tuổi","young":"trẻ, nhỏ tuổi","tall":"cao","short":"thấp, ngắn","pretty":"xinh đẹp","handsome":"đẹp trai","happy":"vui vẻ","sad":"buồn","angry":"tức giận","hungry":"đói","thirsty":"khát","tired":"mệt","scared":"sợ hãi","sunny":"có nắng","rainy":"có mưa","cloudy":"nhiều mây","windy":"có gió","stormy":"có bão","hot":"nóng","cold":"lạnh","window":"cửa sổ","door":"cửa ra vào","chair":"ghế","desk":"bàn học","bin":"thùng rác","poster":"áp phích","board":"bảng","bag":"cặp, túi","book":"sách","cupboard":"tủ","ruler":"thước kẻ","rubber":"cục tẩy","pen":"bút mực","pencil":"bút chì","mum":"mẹ","dad":"bố","grandpa":"ông","grandma":"bà","sister":"chị/em gái","brother":"anh/em trai","twin":"sinh đôi","uncle":"chú/cậu/bác trai","auntie":"cô/dì/bác gái","cousin":"anh/chị/em họ","circle":"hình tròn","triangle":"hình tam giác","rectangle":"hình chữ nhật","square":"hình vuông","oval":"hình bầu dục","farm":"nông trại","cat":"con mèo","dog":"con chó","bird":"con chim","fish":"con cá","mouse":"con chuột","rabbit":"con thỏ","cow":"con bò","sheep":"con cừu","duck":"con vịt","chicken":"con gà","elephant":"con voi","giraffe":"con hươu cao cổ","hat":"mũ","shorts":"quần đùi","sweater":"áo len","shirt":"áo sơ mi","jacket":"áo khoác","skirt":"váy","trousers":"quần dài","shoes":"giày","socks":"tất","glasses":"kính","picture":"bức tranh, hình ảnh","bed":"giường","clock":"đồng hồ","bookcase":"tủ sách","plant":"cây cảnh","television":"tivi","table":"cái bàn","sofa":"ghế sofa","cushion":"đệm tựa, gối tựa","wings":"đôi cánh","beak":"mỏ","ears":"tai","tail":"đuôi","eyes":"mắt","nose":"mũi","mouth":"miệng","arms":"cánh tay","legs":"chân","fly":"bay","walk":"đi bộ","climb":"leo trèo","jump":"nhảy","swim":"bơi","run":"chạy","one":"một","two":"hai","three":"ba","four":"bốn","five":"năm","six":"sáu","seven":"bảy","eight":"tám","nine":"chín","ten":"mười","red":"đỏ","yellow":"vàng","green":"xanh lá","pink":"hồng","purple":"tím","orange":"cam","blue":"xanh dương","black":"đen","white":"trắng","brown":"nâu","gray":"xám","like":"thích","I":"tôi / mình","am":"là (dùng với I)","my":"của tôi","the":"cái/con đó","and":"và","it":"nó","to":"đến / để","a":"một","an":"một","have":"có","has":"có (dùng với he/she/it)","can":"có thể","can't":"không thể","in":"trong","on":"trên","under":"bên dưới","next to":"bên cạnh","behind":"phía sau","between":"ở giữa"};
function localMeaning(w){return meaning[w]||meaning[w.toLowerCase()]||''}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
async function loadJson(){const [a,b]=await Promise.all([fetch('data/grade1/english/vocabulary.json',{cache:'no-store'}),fetch('data/grade1/english/vocabulary-sources.json',{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error('Không tải được dữ liệu vocabulary');return{v:await a.json(),s:await b.json()}}
function renderSources(){const menu=$('sourceMenu');menu.innerHTML='<div class="source-actions"><button id="allBtn" type="button">✓ Chọn tất cả</button><button id="noneBtn" type="button">Bỏ chọn tất cả</button></div>'+sources.map(s=>`<div class="source-item"><input type="checkbox" data-source="${s.id}" ${selected.has(s.id)?'checked':''}><label><b>${s.name||s.id}</b><small>${s.description||''}</small></label></div>`).join('');$('sourceSummary').textContent=selected.size===sources.length?'Tất cả nguồn':selected.size?`${selected.size} nguồn được chọn`:'Không có nguồn nào';$('allBtn').onclick=()=>VocabularySourceSync.set(sources.map(s=>s.id));$('noneBtn').onclick=()=>VocabularySourceSync.set([]);menu.querySelectorAll('input[data-source]').forEach(x=>x.onchange=()=>VocabularySourceSync.toggle(x.dataset.source))}
function render(){const q=$('search').value.trim().toLowerCase();const list=words.filter(w=>{const ok=!q||w.word.toLowerCase().includes(q)||(w.vietnamese_meaning||localMeaning(w.word)).toLowerCase().includes(q);return ok});$('count').textContent=`${list.length} từ`;const el=$('list');if(!list.length){el.innerHTML='<div class="empty">Không có từ nào phù hợp với nguồn đã chọn.</div>';return}el.innerHTML=list.map((w,i)=>{const key=w.word.replace(/"/g,'&quot;');const m=w.vietnamese_meaning||localMeaning(w.word)||'Chưa có nghĩa tiếng Việt';const pic=w.image_url?`<img src="${w.image_url}" alt="${key}" loading="lazy">`:(emoji[w.word.toLowerCase()]||'🔤');return `<article class="word-card"><div class="pic">${pic}</div><div><div class="word">${w.word}</div>${editing===w.word?`<div class="editbox"><input class="meaning-input" data-edit="${key}" value="${(w.vietnamese_meaning||localMeaning(w.word)||'').replace(/"/g,'&quot;')}"><button class="save" data-save="${key}">Lưu</button><button class="cancel" data-cancel="${key}">Hủy</button></div>`:`<div class="meta">${m}</div><button class="edit" data-edit-btn="${key}">✏️ Sửa nghĩa</button>`}</div><button class="speak" data-speak="${key}" aria-label="Phát âm">🔊</button></article>`}).join('');el.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));el.querySelectorAll('[data-edit-btn]').forEach(b=>b.onclick=()=>{editing=b.dataset.editBtn;render()});el.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editing=null;render()});el.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const w=words.find(x=>x.word===b.dataset.save);const input=el.querySelector(`[data-edit="${CSS.escape(b.dataset.save)}"]`);if(!w||!input)return;const val=input.value.trim();$('status').textContent='Đang lưu nghĩa…';try{if(window.VocabularyDB){const updated=await VocabularyDB.updateMeaning(w.word,val);Object.assign(w,updated)}else{w.vietnamese_meaning=val}editing=null;$('status').textContent='Đã lưu nghĩa lên cloud.';render()}catch(e){$('status').textContent='Không thể lưu: '+(e.message||e)}})}
async function refresh(){selected=new Set(VocabularySourceSync.getSelected());renderSources();const base=await loadJson();let db=[];try{if(window.VocabularyDB){await VocabularyDB.ensureSeed(base.v.words||[],localMeaning);db=await VocabularyDB.list()}}catch(e){console.warn('VocabularyDB unavailable, using JSON fallback',e)}const byWord=new Map(db.map(x=>[x.word.toLowerCase(),x]));const merged=(base.v.words||[]).map(x=>{const d=byWord.get(String(x.word).toLowerCase());return d?{...x,...d,sourceIds:d.source_ids?.length?d.source_ids:x.sourceIds||[]}:({...x,vietnamese_meaning:x.vietnameseMeaning||localMeaning(x.word)})});words=merged.filter(w=>(w.sourceIds||[]).some(id=>selected.has(id)));$('status').textContent=db.length?'Đã đồng bộ vocabulary với cloud.':'Đang dùng dữ liệu vocabulary cục bộ.';render()}
$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.source-wrap'))$('sourceMenu').classList.remove('open')});$('search').oninput=render;window.addEventListener('vocabularySourcesChanged',refresh);
(async()=>{try{await VocabularySourceSync.init();sources=VocabularySourceSync.getSources();selected=new Set(VocabularySourceSync.getSelected());await refresh()}catch(e){$('status').textContent='Lỗi tải dữ liệu: '+(e.message||e);$('list').innerHTML='<div class="empty">Không thể tải danh sách từ vựng. Vui lòng thử tải lại trang.</div>'}})();
</script></body></html>
