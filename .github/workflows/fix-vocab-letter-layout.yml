name: Fix vocabulary letter layout
on:
  push:
    paths:
      - '.github/workflows/fix-vocab-letter-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch english.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.target{font-size:34px;font-weight:800;letter-spacing:0;margin:12px 0 20px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.target-char{display:inline-flex;align-items:center;justify-content:center;width:.82em;min-width:.82em;height:1.15em;line-height:1}.target-char.space{width:.42em;min-width:.42em}.target-char.missing{color:transparent;border-bottom:3px solid #b9c4e8;border-radius:2px}.target-char.correct{color:#16a34a;font-weight:900}'
          new_css = '.target{font-size:34px;font-weight:800;letter-spacing:0;margin:12px 0 20px;display:flex;justify-content:center;flex-wrap:nowrap;gap:8px}.target-char{display:inline-flex;align-items:center;justify-content:center;width:42px;min-width:42px;height:48px;line-height:1;flex:0 0 42px}.target-char.space{width:20px;min-width:20px;flex-basis:20px}.target-char.missing{color:transparent;border-bottom:3px solid #b9c4e8;border-radius:2px}.target-char.correct{color:#16a34a;font-weight:900}'
          if old_css not in s:
              raise SystemExit('Expected target CSS was not found')
          s = s.replace(old_css, new_css, 1)

          old_js = "if(slot){slot.textContent=word[state.missingIndex];slot.classList.remove('missing');slot.classList.add('correct')}"
          new_js = "if(slot){slot.classList.remove('missing');slot.classList.add('correct');slot.textContent=word[state.missingIndex];slot.style.width='42px';slot.style.minWidth='42px';slot.style.flex='0 0 42px'}"
          if old_js not in s:
              raise SystemExit('Expected missing-letter reveal code was not found')
          s = s.replace(old_js, new_js, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english.html
          git commit -m 'fix: keep missing letter position stable' || exit 0
          git push
