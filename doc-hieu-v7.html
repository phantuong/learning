<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đọc Hiểu · Tiếng Việt · Lớp 1</title>
<style>
:root{--pink:#e85aa5;--ink:#29233f;--muted:#77677a;--line:#efd5e3;--good:#0b8f5a;--bad:#d62f45}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:24px}.wrap{max-width:900px;margin:auto}.hero{text-align:center;padding:32px 0 18px}.hero-icon{font-size:52px}.hero h1{font-size:34px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.source-note{margin:18px 0;padding:14px 18px;background:#fff8df;border:1px solid #f0dfaa;border-radius:14px;font-size:14px;line-height:1.55}.story-card{background:#fffdfd;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px #dca9c522;overflow:hidden}.story-head{padding:18px 24px 12px;border-bottom:1px solid #f3e3eb;display:flex;align-items:center;justify-content:space-between}.story-number{font-weight:850;color:var(--pink)}.story-icon{font-size:40px}.story-body{padding:26px 34px 22px}.story-title{text-align:center;font-size:27px;margin:0 0 18px}.story-meta{text-align:center;color:var(--muted);font-size:13px;margin:-8px 0 18px}.story-text{font-size:19px;line-height:1.9;letter-spacing:.01em;white-space:pre-line}.questions{margin-top:26px;padding:20px;background:#fff6fa;border-radius:18px}.questions h2{font-size:20px;margin:0 0 14px}.q{padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:11px 0}.q-text{font-weight:750;line-height:1.5}.option{width:100%;margin-top:8px;padding:10px 12px;border:1px solid #e9cada;background:#fff;border-radius:11px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.option:disabled{cursor:default}.option.correct{border-color:#28ad77;background:#eafaf2;color:var(--good);font-weight:750}.option.wrong{border-color:#f06a7b;background:#fff0f2;color:var(--bad)}.answer-input{width:100%;margin-top:10px;padding:11px 12px;border:1px solid #e9cada;border-radius:11px;font:inherit;min-height:46px}.actions{display:flex;justify-content:center;padding:18px 24px 26px;border-top:1px solid #f3e3eb}.next{width:100%;max-width:520px;border:0;border-radius:16px;padding:15px 22px;background:var(--pink);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.progress{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}@media(max-width:760px){.main{padding:12px 14px 55px}.story-body{padding:22px 20px 18px}.story-title{font-size:23px}.story-text{font-size:18px;line-height:1.8}}
</style></head><body>
<main class="main"><div class="wrap"><header class="hero"><div class="hero-icon">📖✨</div><h1>Đọc Hiểu</h1><p>Tiếng Việt · Lớp 1</p></header>
<div class="source-note"><b>Nguồn:</b> Bài Đọc Cuối Tuần Lớp 1 – Cô Giang Tiền Tiểu Học.<br>14 bài trong tài liệu này có phần câu hỏi đọc hiểu. Nội dung bài đọc và câu hỏi được giữ nguyên theo tài liệu gốc; các câu hỏi tự luận được để bé tự trả lời.</div>
<article class="story-card"><div class="story-head"><div class="story-number" id="storyNumber">Đang tải...</div><div class="story-icon">📖</div></div><div class="story-body"><h2 class="story-title" id="storyTitle"></h2><div class="story-meta" id="storyMeta"></div><div class="story-text" id="storyText"></div><section class="questions"><h2>🧠 Câu hỏi đọc hiểu</h2><div id="questions"></div></section></div><div class="actions"><button class="next" id="nextBtn">Bài tiếp theo →</button></div></article><div class="progress" id="progress"></div></div></main>
<script>window.DOC_HIEU_STORIES = [];</script>
<script src="doc-hieu-data-giang.js?v=20261005"></script>
<script>
(()=>{const stories=window.DOC_HIEU_STORIES;const KEY='docHieuCurrent';let current=Number(localStorage.getItem(KEY)||1);if(!Number.isInteger(current)||current<1||current>stories.length)current=1;const $=id=>document.getElementById(id);
function render(){const s=stories[current-1];$('storyNumber').textContent=`Bài ${current}/${stories.length} · Level ${s.level}`;$('storyTitle').textContent=s.title;$('storyMeta').textContent=(s.attribution?s.attribution+' · ':'')+s.source;$('storyText').textContent=s.text;const qs=$('questions');qs.innerHTML='';s.questions.forEach((q,i)=>{const box=document.createElement('div');box.className='q';const qt=document.createElement('div');qt.className='q-text';qt.textContent=`${i+1}. ${q.q}`;box.appendChild(qt);if(q.type==='mc'){q.options.forEach((o,oi)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(97+oi)+'. '+o;b.onclick=()=>{box.querySelectorAll('.option').forEach(x=>x.disabled=true);if(oi===q.answer)b.classList.add('correct');else{b.classList.add('wrong');box.querySelectorAll('.option')[q.answer]?.classList.add('correct')}};box.appendChild(b)})}else{const input=document.createElement('textarea');input.className='answer-input';input.placeholder='Bé tự trả lời...';box.appendChild(input)}qs.appendChild(box)});$('progress').textContent='Tiến độ được lưu trên thiết bị';window.scrollTo({top:0,behavior:'smooth'})}
$('nextBtn').onclick=()=>{current=current===stories.length?1:current+1;localStorage.setItem(KEY,String(current));render()};render();})();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
