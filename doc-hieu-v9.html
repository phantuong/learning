<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc Hiểu · Tiếng Việt · Lớp 1</title>
</head>
<body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;text-align:center">Đang tải Đọc Hiểu...</div>
<script>
(async function(){
  try {
    const response = await fetch('doc-hieu-v8.html?patch=20261005', {cache:'no-store'});
    if (!response.ok) throw new Error('Cannot load doc-hieu-v8.html: '+response.status);
    let html = await response.text();

    // v8 accidentally loaded read progress without filtering by the logged-in user.
    // That can make a story appear as "Đã đọc" because another user's row is read.
    html = html.replace(
      ".select('story_id,is_read').eq('is_read',true)",
      ".select('story_id,is_read').eq('user_id',user.id).eq('is_read',true)"
    );

    // Ignore any stale local state created by previous versions.
    html = html.replace(/docHieuReadV3/g, 'docHieuReadV4');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<div style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:24px;text-align:center;color:#c62828">Không thể tải trang Đọc Hiểu. Vui lòng thử lại.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
