<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc Hiểu · Tiếng Việt · Lớp 1</title>
<style>
:root{--pink:#e85aa5;--ink:#29233f;--muted:#77677a;--line:#efd5e3;--good:#0b8f5a;--bad:#d62f45}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:16px}.wrap{max-width:900px;margin:auto}.hero{text-align:center;padding:20px 0 14px}.hero-icon{font-size:46px}.hero h1{font-size:32px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.controls{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 8px 22px #dca9c518}.controls-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls-label{font-weight:800}.size-options{display:flex;gap:7px;flex-wrap:wrap}.size-btn{min-width:40px;padding:7px 10px;border:1px solid #e6cad8;background:#fff;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:700}.size-btn.active{background:var(--pink);border-color:var(--pink);color:#fff}.list-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 28px #dca9c518}.story-item{width:100%;border:0;border-bottom:1px solid #f1e1e9;background:#fff;text-align:left;padding:14px 18px;cursor:pointer;color:var(--ink)}.story-item:last-child{border-bottom:0}.story-item:hover{background:#fff8fc}.story-item-title{display:flex;align-items:center;gap:8px;font-weight:850;font-size:18px;line-height:1.35}.story-item-number{color:var(--pink);min-width:42px}.story-item-status{margin-top:5px;margin-left:50px;color:var(--muted);font-size:14px}.story-item-status.read{color:var(--good);font-weight:700}.reader{display:none}.reader.show{display:block}.list-view.hidden{display:none}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;margin-bottom:12px}.story-card{background:#fffdfd;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px #dca9c522;overflow:hidden}.story-head{padding:14px 20px 12px;border-bottom:1px solid #f3e3eb;display:flex;align-items:center;justify-content:space-between}.story-number{font-weight:850;color:var(--pink)}.story-icon{font-size:36px}.story-body{padding:24px 30px 20px}.story-title{text-align:center;font-size:27px;margin:0 0 18px}.story-meta{text-align:center;color:var(--muted);font-size:13px;margin:-8px 0 18px}.story-text{font-size:19px;line-height:1.9;letter-spacing:.01em;white-space:pre-line}.questions{margin-top:26px;padding:20px;background:#fff6fa;border-radius:18px}.questions h2{font-size:20px;margin:0 0 14px}.q{padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:11px 0}.q-text{font-weight:750;line-height:1.5}.option{width:100%;margin-top:8px;padding:11px 12px;border:1px solid #e9cada;background:#fff;border-radius:11px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.option:disabled{cursor:default}.option.correct{border-color:#28ad77;background:#eafaf2;color:var(--good);font-weight:750}.option.wrong{border-color:#f06a7b;background:#fff0f2;color:var(--bad)}.q-result{margin-top:9px;font-size:14px;font-weight:700}.q-result.good{color:var(--good)}.q-result.bad{color:var(--bad)}.actions{display:flex;justify-content:center;padding:18px 24px 26px;border-top:1px solid #f3e3eb;gap:10px}.next{width:100%;max-width:520px;border:0;border-radius:16px;padding:15px 22px;background:var(--pink);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.progress{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}.sync-status{text-align:center;font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}@media(max-width:760px){.main{padding:10px 10px 45px}.hero h1{font-size:29px}.controls-row{align-items:flex-start;flex-direction:column}.size-options{width:100%}.size-btn{flex:1}.story-body{padding:20px 17px 16px}.story-title{font-size:23px}.story-text{font-size:18px;line-height:1.8}.story-item{padding:14px}.story-item-title{font-size:18px}.story-item-status{margin-left:42px}}
</style>
</head>
<body>
<main class="main"><div class="wrap">
<header class="hero"><div class="hero-icon">📖✨</div><h1>Đọc Hiểu</h1><p>Tiếng Việt · Lớp 1</p></header>
<section id="listView" class="list-view">
<div class="controls"><div class="controls-row"><div class="controls-label">Cỡ chữ bài đọc</div><div class="size-options" id="sizeOptions"></div></div></div>
<div class="list-card" id="storyList"></div>
</section>
<section id="readerView" class="reader">
<button class="back" id="backBtn">← Danh sách truyện</button>
<article class="story-card"><div class="story-head"><div class="story-number" id="storyNumber">Đang tải...</div><div class="story-icon">📖</div></div><div class="story-body"><h2 class="story-title" id="storyTitle"></h2><div class="story-meta" id="storyMeta"></div><div class="story-text" id="storyText"></div><section class="questions"><h2>🧠 Câu hỏi đọc hiểu</h2><div id="questions"></div></section></div><div class="actions"><button class="next" id="nextBtn">Bài tiếp theo →</button></div></article><div class="progress" id="progress"></div><div class="sync-status" id="syncStatus"></div>
</section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20261005"></script>
<script src="auth-guard.js?v=20261005"></script>
<script src="doc-hieu-data-100.js?v=20261005"></script>
<script>
(async()=>{
'use strict';
const stories=await window.DOC_HIEU_READY;
const READ_KEY='docHieuReadV2';const SIZE_KEY='docHieuFontSizeV2';const CURRENT_KEY='docHieuCurrentV2';
let readSet=new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]').map(Number));
let fontSize=Number(localStorage.getItem(SIZE_KEY)||22);if(![18,20,22,24,26].includes(fontSize))fontSize=22;
let current=Number(localStorage.getItem(CURRENT_KEY)||1);if(!Number.isInteger(current)||current<1||current>stories.length)current=1;
const $=id=>document.getElementById(id);let sb=null,user=null,realtimeChannel=null;
function setSyncStatus(text,bad=false){const el=$('syncStatus');el.textContent=text||'';el.style.color=bad?'var(--bad)':'var(--muted)'}
async function waitForAuth(){for(let i=0;i<200;i++){if(window.learningAuth&&window.learningUser){sb=window.learningAuth;user=window.learningUser;return true}await new Promise(r=>setTimeout(r,50))}setSyncStatus('Không kết nối được tài khoản để đồng bộ.',true);return false}
function saveRead(){localStorage.setItem(READ_KEY,JSON.stringify([...readSet]))}
async function loadRemoteRead(){if(!sb||!user)return false;const {data,error}=await sb.from('user_story_progress').select('story_id,is_read').eq('user_id',user.id).eq('is_read',true);if(error){console.error(error);setSyncStatus('Không tải được tiến độ đồng bộ.',true);return false}data.forEach(row=>{const n=Number(row.story_id);if(Number.isInteger(n)&&n>=1&&n<=stories.length)readSet.add(n)});saveRead();renderList();return true}
async function markReadRemote(n){if(!sb||!user)return false;setSyncStatus('Đang đồng bộ…');const {error}=await sb.rpc('mark_story_read',{p_story_id:String(n)});if(error){console.error('mark_story_read failed:',error);setSyncStatus('Đồng bộ thất bại: '+error.message,true);return false}setSyncStatus('✓ Đã đồng bộ');return true}
function subscribeRemote(){if(!sb||!user)return;realtimeChannel=sb.channel('story-progress-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'user_story_progress',filter:'user_id=eq.'+user.id},payload=>{const n=Number(payload.new?.story_id||payload.old?.story_id);if(!Number.isInteger(n))return;if(payload.eventType==='DELETE'||payload.new?.is_read===false)readSet.delete(n);else if(payload.new?.is_read===true)readSet.add(n);saveRead();renderList()}).subscribe()}
async function syncNow(){await loadRemoteRead()}
function renderSize(){const box=$('sizeOptions');box.innerHTML='';[18,20,22,24,26].forEach(size=>{const b=document.createElement('button');b.className='size-btn'+(size===fontSize?' active':'');b.textContent=size+'px';b.onclick=()=>{fontSize=size;localStorage.setItem(SIZE_KEY,String(size));renderSize();if($('readerView').classList.contains('show'))applyFont()};box.appendChild(b)})}
function renderList(){const list=$('storyList');list.innerHTML='';stories.forEach((s,i)=>{const n=i+1;const b=document.createElement('button');b.className='story-item';const title=document.createElement('div');title.className='story-item-title';const num=document.createElement('span');num.className='story-item-number';num.textContent='Bài '+String(n).padStart(2,'0');const name=document.createElement('span');name.textContent=s.title;title.append(num,name);const status=document.createElement('div');status.className='story-item-status'+(readSet.has(n)?' read':'');status.textContent=readSet.has(n)?'✓ Đã đọc':'○ Chưa đọc';b.append(title,status);b.onclick=()=>openStory(n);list.appendChild(b)})}
function applyFont(){$('storyText').style.fontSize=fontSize+'px';$('storyText').style.lineHeight=fontSize>=24?'1.75':'1.9'}
async function openStory(n){current=n;localStorage.setItem(CURRENT_KEY,String(n));readSet.add(n);saveRead();renderList();$('listView').classList.add('hidden');$('readerView').classList.add('show');renderStory();window.scrollTo({top:0,behavior:'smooth'});await markReadRemote(n)}
async function showList(){await syncNow();$('readerView').classList.remove('show');$('listView').classList.remove('hidden');renderList();window.scrollTo({top:0,behavior:'smooth'})}
function renderStory(){const s=stories[current-1];$('storyNumber').textContent=`Bài ${current}/${stories.length} · Level ${s.level}`;$('storyTitle').textContent=s.title;$('storyMeta').textContent=(s.attribution?s.attribution+' · ':'')+s.source;$('storyText').textContent=s.text;applyFont();const qs=$('questions');qs.innerHTML='';s.questions.forEach((q,i)=>{const box=document.createElement('div');box.className='q';const qt=document.createElement('div');qt.className='q-text';qt.textContent=`${i+1}. ${q.q}`;box.appendChild(qt);q.options.forEach((o,oi)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+oi)+'. '+o;b.onclick=()=>{box.querySelectorAll('.option').forEach(x=>x.disabled=true);const result=document.createElement('div');result.className='q-result';if(oi===q.answer){b.classList.add('correct');result.classList.add('good');result.textContent='✓ Chính xác!'}else{b.classList.add('wrong');box.querySelectorAll('.option')[q.answer]?.classList.add('correct');result.classList.add('bad');result.textContent='✗ Chưa đúng. Đáp án đúng được đánh dấu màu xanh.'}box.appendChild(result)};box.appendChild(b)});qs.appendChild(box)});$('progress').textContent=`Bài ${current}/${stories.length}`}
$('backBtn').onclick=showList;$('nextBtn').onclick=()=>openStory(current===stories.length?1:current+1);
renderSize();renderList();
const authed=await waitForAuth();
if(authed){setSyncStatus('Đang tải tiến độ…');await loadRemoteRead();subscribeRemote();document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});window.addEventListener('focus',syncNow);setInterval(syncNow,30000)}
const params=new URLSearchParams(location.search);if(params.has('story')){const n=Number(params.get('story'));if(n>=1&&n<=stories.length)openStory(n)}
})();
</script>
<script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
