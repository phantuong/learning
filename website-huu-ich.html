<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Website Hữu Ích · Learning Hub</title>
<style>
:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--card:#fff;--line:#e2e6ee;--pink:#e85aa5;--good:#0b8f5a;--danger:#d62f45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.main{min-height:100vh;padding:28px 18px 50px}.wrap{max-width:920px;margin:auto}.hero{text-align:center;padding:24px 8px}.hero-icon{font-size:48px}.hero h1{margin:7px 0 5px;font-size:32px}.hero p{margin:0;color:var(--muted)}.form-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 24px #1820330b;margin-bottom:22px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:12px 13px;border:1px solid #d9deea;border-radius:12px;background:#fff;color:var(--navy);font:inherit;outline:none}.field input:focus{border-color:#d66aa7;box-shadow:0 0 0 3px #e85aa51c}.form-actions{display:flex;gap:9px;justify-content:flex-end}.btn{border:0;border-radius:12px;padding:11px 17px;font:inherit;font-weight:800;cursor:pointer}.btn-primary{background:var(--pink);color:#fff}.btn-primary:disabled{background:#d9dce4;color:#9298a5;cursor:not-allowed}.btn-secondary{background:#eef1f7;color:#394257}.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 12px}.list-head h2{font-size:21px;margin:0}.count{color:var(--muted);font-size:14px}.hint{font-size:12px;color:var(--muted);margin:0 2px 12px}.empty{background:#fff;border:1px dashed #ccd3df;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.website-list{display:grid;gap:13px}.website-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;grid-template-columns:30px 58px minmax(0,1fr) auto;gap:12px;align-items:start;box-shadow:0 5px 18px #18203308;transition:.15s}.website-item.dragging{opacity:.45;transform:scale(.99)}.drag-handle{width:30px;height:58px;border:0;background:transparent;color:#a1a9b8;font-size:20px;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none}.drag-handle:active{cursor:grabbing}.thumb{width:58px;height:58px;border-radius:14px;background:#f3f5fa;border:1px solid #e5e8ef;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:34px;height:34px;object-fit:contain}.thumb-fallback{font-size:27px}.site-name{display:block;color:#182033;font-size:18px;font-weight:850;line-height:1.35;text-decoration:none}.site-name:hover{color:#244da8}.site-domain{margin-top:3px;color:#8a93a5;font-size:12px;overflow-wrap:anywhere}.description{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:#4d586d;line-height:1.6;font-size:15px}.item-actions{display:flex;gap:7px}.icon-btn{border:1px solid #dfe4ed;background:#fff;color:#4b556a;border-radius:10px;padding:8px 10px;font-weight:750;cursor:pointer}.icon-btn:hover{background:#f6f7fa}.icon-btn.delete{color:var(--danger);border-color:#f0cbd1}.loading{text-align:center;color:var(--muted);padding:24px}@media(max-width:650px){.main{padding:15px 11px 40px}.hero h1{font-size:28px}.form-card{padding:16px}.website-item{grid-template-columns:28px 48px minmax(0,1fr);gap:10px}.thumb{width:48px;height:48px}.thumb img{width:28px;height:28px}.drag-handle{height:48px}.item-actions{grid-column:3;justify-content:flex-end}.site-name{font-size:16px}.hint{line-height:1.5}}
</style>
</head>
<body>
<main class="main"><div class="wrap">
<header class="hero"><div class="hero-icon">🔗✨</div><h1>Website Hữu Ích</h1><p>Lưu lại những website bạn muốn sử dụng và truy cập nhanh trên mọi thiết bị.</p></header>
<section class="form-card"><form id="websiteForm">
<div class="field"><label for="urlInput">Nhập Link</label><input id="urlInput" type="url" inputmode="url" placeholder="https://example.com" autocomplete="url" required></div>
<div class="field"><label for="descriptionInput">Miêu tả</label><input id="descriptionInput" type="text" placeholder="Ví dụ: Website luyện Toán lớp 1" autocomplete="off" required></div>
<div class="form-actions"><button class="btn btn-secondary" type="button" id="cancelBtn" hidden>Hủy</button><button class="btn btn-primary" type="submit" id="submitBtn" disabled>Thêm</button></div>
</form></section>
<section><div class="list-head"><h2>Danh sách Website</h2><span class="count" id="count"></span></div><p class="hint">Kéo biểu tượng ⋮⋮ để sắp xếp lại thứ tự. Thứ tự được lưu trên cloud và đồng bộ giữa các thiết bị.</p><div id="websiteList" class="website-list"><div class="loading">Đang tải...</div></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20261005"></script>
<script src="auth-guard.js?v=20261005"></script>
<script>
(async()=>{'use strict';
const $=id=>document.getElementById(id),form=$('websiteForm'),urlInput=$('urlInput'),descriptionInput=$('descriptionInput'),submitBtn=$('submitBtn'),cancelBtn=$('cancelBtn'),list=$('websiteList'),count=$('count');let sb=null,user=null,editingId=null,items=[];
async function waitForAuth(){for(let i=0;i<200;i++){if(window.learningAuth&&window.learningUser){sb=window.learningAuth;user=window.learningUser;return true}await new Promise(r=>setTimeout(r,50))}return false}
function validUrl(value){try{const u=new URL(value.trim());return ['http:','https:'].includes(u.protocol)}catch{return false}}
function updateButton(){submitBtn.disabled=!urlInput.value.trim()||!descriptionInput.value.trim()||!validUrl(urlInput.value)}
function resetForm(){editingId=null;form.reset();submitBtn.textContent='Thêm';cancelBtn.hidden=true;updateButton()}
function domain(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return ''}}
function siteName(url){const d=domain(url);return d||'Website'}
function render(){count.textContent=`${items.length} website`;if(!items.length){list.innerHTML='<div class="empty">Chưa có website nào. Hãy thêm website đầu tiên ở phía trên.</div>';return}list.innerHTML='';items.forEach(item=>{const card=document.createElement('article');card.className='website-item';card.dataset.id=item.id;const handle=document.createElement('button');handle.type='button';handle.className='drag-handle';handle.textContent='⋮⋮';handle.title='Kéo để sắp xếp';handle.setAttribute('aria-label','Kéo để sắp xếp');const thumb=document.createElement('div');thumb.className='thumb';const img=document.createElement('img');img.src=`https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain(item.url))}&sz=128`;img.alt='';img.onerror=()=>{thumb.innerHTML='<span class="thumb-fallback">🌐</span>'};thumb.appendChild(img);const body=document.createElement('div');const a=document.createElement('a');a.className='site-name';a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=siteName(item.url);const d=document.createElement('div');d.className='site-domain';d.textContent=domain(item.url);const desc=document.createElement('div');desc.className='description';desc.textContent=item.description;body.append(a,d,desc);const actions=document.createElement('div');actions.className='item-actions';const edit=document.createElement('button');edit.className='icon-btn';edit.type='button';edit.textContent='Sửa';edit.onclick=()=>startEdit(item);const del=document.createElement('button');del.className='icon-btn delete';del.type='button';del.textContent='Xóa';del.onclick=()=>removeItem(item);actions.append(edit,del);card.append(handle,thumb,body,actions);list.appendChild(card)})}
async function saveOrderFromDom(){const ids=[...list.querySelectorAll('.website-item')].map(x=>x.dataset.id);const byId=new Map(items.map(x=>[String(x.id),x]));items=ids.map(id=>byId.get(String(id))).filter(Boolean);try{await Promise.all(items.map((item,index)=>sb.from('user_useful_websites').update({sort_order:index}).eq('id',item.id)));}catch(e){console.error('save order failed',e)}}
async function load(){const {data,error}=await sb.from('user_useful_websites').select('id,url,description,sort_order,created_at,updated_at').order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(error){console.error(error);list.innerHTML='<div class="empty">Không thể tải danh sách website. Vui lòng thử lại.</div>';return}items=data||[];render()}
function startEdit(item){editingId=item.id;urlInput.value=item.url;descriptionInput.value=item.description;submitBtn.textContent='Lưu thay đổi';cancelBtn.hidden=false;updateButton();window.scrollTo({top:0,behavior:'smooth'});urlInput.focus()}
async function removeItem(item){if(!confirm(`Xóa website này?\n\n${siteName(item.url)}`))return;const {error}=await sb.from('user_useful_websites').delete().eq('id',item.id);if(error){alert('Không thể xóa website.');console.error(error);return}items=items.filter(x=>x.id!==item.id);await saveOrderFromDom();render()}
form.addEventListener('submit',async e=>{e.preventDefault();if(submitBtn.disabled)return;submitBtn.disabled=true;const url=urlInput.value.trim(),description=descriptionInput.value.trim();try{if(editingId){const {data,error}=await sb.from('user_useful_websites').update({url,description}).eq('id',editingId).select('id,url,description,sort_order,created_at,updated_at').single();if(error)throw error;items=items.map(x=>x.id===editingId?data:x)}else{const nextOrder=items.length?Math.max(...items.map(x=>Number(x.sort_order)||0))+1:0;const {data,error}=await sb.from('user_useful_websites').insert({user_id:user.id,url,description,sort_order:nextOrder}).select('id,url,description,sort_order,created_at,updated_at').single();if(error)throw error;items=[...items,data]}resetForm();render()}catch(err){console.error(err);alert('Không thể lưu website. Vui lòng thử lại.')}finally{updateButton()}});
[urlInput,descriptionInput].forEach(el=>el.addEventListener('input',updateButton));cancelBtn.onclick=resetForm;
const ok=await waitForAuth();if(!ok){list.innerHTML='<div class="empty">Vui lòng đăng nhập để quản lý Website Hữu Ích.</div>';return}await load();
})();
</script>
<script src="website-dnd-fix.js?v=20261005"></script>
<script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
