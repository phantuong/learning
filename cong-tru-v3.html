<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Cộng Trừ · Toán lớp 1</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}main{min-height:100vh;padding:12px 14px 40px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:36px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:15px}.setting h3{margin:0 0 11px;font-size:17px}.choices{display:grid;gap:8px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(3,minmax(0,1fr))}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;line-height:1.15;min-width:0}.choice small{font-size:12px;font-weight:700}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.tip{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.top{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}.equation{text-align:center;font-size:52px;font-weight:950;letter-spacing:1px;color:#29243b;margin:35px 0;word-break:break-word}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:72px;border:2px solid #ead3df;background:#fff;border-radius:18px;font-size:27px;font-weight:900;color:#514b5c;cursor:pointer}.answer.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.answer.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.write{text-align:center}.number-input{width:100%;max-width:360px;text-align:center;border:2px solid #cbd5e1;border-radius:18px;padding:15px;font-size:34px;font-weight:900}.submit{width:100%;max-width:360px;margin:12px auto 0;display:block;border:0;border-radius:18px;padding:15px;font-size:19px;font-weight:900;color:#fff;background:#d9dce3}.submit.enabled{background:var(--pink)}.mic-area{text-align:center}.mic{width:100px;height:100px;border:0;border-radius:50%;background:#eef2ff;color:#344b9b;font-size:43px;cursor:pointer}.status{text-align:center;min-height:26px;margin-top:13px;color:var(--muted);font-weight:700}.feedback{text-align:center;min-height:42px;padding:14px 0;font-size:20px;font-weight:900}.feedback.bad{color:#b4232e}.fireworks{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:life 2s ease-in-out forwards}.firework{position:relative;width:210px;height:210px;opacity:0;transform:scale(.25);animation:burst 2s ease-in-out forwards}.firework:before{content:"🎉";position:absolute;font-size:78px;left:66px;top:65px}.spark{position:absolute;left:50%;top:50%;font-size:34px;animation:out 1.7s ease-out forwards}.s1{--x:-105px;--y:-85px}.s2{--x:0;--y:-125px}.s3{--x:105px;--y:-85px}.s4{--x:125px;--y:5px}.s5{--x:85px;--y:105px}.s6{--x:0;--y:125px}.s7{--x:-95px;--y:95px}.s8{--x:-125px;--y:5px}.s9{--x:-75px;--y:-115px}.s10{--x:75px;--y:-115px}@keyframes life{0%,100%{opacity:0}8%,88%{opacity:1}}@keyframes burst{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.18)}}@keyframes out{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}@media(max-width:760px){main{padding:12px 14px 35px}.hero h1{font-size:30px}.card{padding:16px;border-radius:22px}.settings{grid-template-columns:1fr}.ranges{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges .choice:last-child{grid-column:1/-1}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{font-size:14px;padding:9px 5px}.choice small{font-size:11px}.equation{font-size:43px}.answer{min-height:68px;font-size:24px}}
</style></head><body><aside id="sidebar" class="sidebar"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay"></div><main><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap"><header class="hero"><div class="emoji">➕➖</div><h1>Cộng Trừ</h1><p>Lớp 1 · Luyện tập liên tục</p></header><section id="setup" class="card"><div class="settings"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices levels" id="levels"></div></div><div class="setting"><h3>🔢 Phạm vi số</h3><div class="choices ranges" id="ranges"></div></div><div class="setting"><h3>➕➖ Phép tính</h3><div class="choices operations" id="operations"></div></div><div class="setting"><h3>✍️ Cách trả lời</h3><div class="choices modes" id="modes"></div></div></div><button id="startBtn" class="start">Bắt đầu luyện tập ✨</button><div class="tip">Không giới hạn số câu. Trả lời đúng sẽ tự động chuyển sang câu tiếp theo.</div></section><section id="quiz" class="card quiz"></section></div></main><script>
const $=id=>document.getElementById(id);const PREF='learning_math_add_sub_preferences_v5';const LEVELS=[['no-carry','Không Nhớ','Cộng/trừ theo từng hàng, không cần nhớ hoặc mượn'],['carry','Có Nhớ','Có ít nhất một lần nhớ hoặc mượn'],['three','3 Số','Biểu thức gồm 3 số'],['four','4 Số','Biểu thức gồm 4 số'],['sequential','Tuần Tự','Các phép tính xuất hiện lần lượt, không bỏ sót']];const RANGES=[10,50,100,1000,'inf','result10'];const RANGE_LABELS=['0–10','0–50','0–100','0–1000','Không giới hạn','Kết quả 0 - 10'];const OPS=[['add','Cộng'],['sub','Trừ'],['mixed','Cộng - Trừ']];const MODES=[['choice','Chọn Đáp Án'],['write','Viết Đáp Án'],['speak','Nói Đáp Án']];let level='no-carry',range=10,operation='add',mode='choice',current=null,pos=0,score=0,answered=false,cursor=0,opCursor=0,recognition=null,audioCtx=null;try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(LEVELS.some(x=>x[0]===p.level))level=p.level;if(RANGES.includes(p.range))range=p.range;if(OPS.some(x=>x[0]===p.operation))operation=p.operation;if(MODES.some(x=>x[0]===p.mode))mode=p.mode}catch(e){}
function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range,operation,mode}))}catch(e){}}function renderChoices(){$('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${x[0]===level?'on':''}" onclick="pickLevel('${x[0]}')">${x[1]}<br><small>${x[2]}</small></button>`).join('');$('ranges').innerHTML=RANGES.map((x,i)=>`<button class="choice ${x===range?'on':''}" onclick="pickRange('${x}')">${RANGE_LABELS[i]}</button>`).join('');$('operations').innerHTML=OPS.map(x=>`<button class="choice ${x[0]===operation?'on':''}" onclick="pickOperation('${x[0]}')">${x[1]}</button>`).join('');$('modes').innerHTML=MODES.map(x=>`<button class="choice ${x[0]===mode?'on':''}" onclick="pickMode('${x[0]}')">${x[1]}</button>`).join('')}function pickLevel(v){level=v;save();renderChoices()}function pickRange(v){range=v;save();renderChoices()}function pickOperation(v){operation=v;save();renderChoices()}function pickMode(v){mode=v;save();renderChoices()}
function maxN(){return range==='inf'?30:10**Math.ceil(Math.log10(range+1))-1}function allowed(v){return range!=='result10'||(v>=0&&v<=10)}function pair(a,b,op){return{display:`${a} ${op} ${b}`,answer:op==='+'?a+b:a-b}}function digits(n){return String(Math.abs(n)).split('').reverse().map(Number)}function noCarry(a,b,sub){const x=digits(a),y=digits(b),l=Math.max(x.length,y.length);for(let i=0;i<l;i++){if(sub?(x[i]||0)<(y[i]||0):(x[i]||0)+(y[i]||0)>9)return false}return true}function hasCarry(a,b,sub){const x=digits(a),y=digits(b),l=Math.max(x.length,y.length);for(let i=0;i<l;i++){if(sub?(x[i]||0)<(y[i]||0):(x[i]||0)+(y[i]||0)>=10)return true}return false}
function nextPair(){const n=maxN(),total=n+1;while(true){const a=Math.floor(cursor/total),b=cursor%total;if(a>n){cursor=0;opCursor=0;continue}let op=operation==='add'?'+':operation==='sub'?'−':opCursor===0?'+':'−';if(op==='−'&&b>a){if(operation==='mixed'&&opCursor===0){opCursor=1;continue}cursor++;continue}const q=pair(a,b,op);const ok=allowed(q.answer)&&(level!=='no-carry'||noCarry(a,b,op==='−'))&&(level!=='carry'||hasCarry(a,b,op==='−'));if(ok){if(operation==='mixed')opCursor=opCursor?0:1;else cursor++;return q}if(operation==='mixed'&&opCursor===0){opCursor=1}else{cursor++;opCursor=0}}}
function multi(count){const n=Math.min(maxN(),1000);for(let k=0;k<5000;k++){let nums=[Math.floor(Math.random()*(n+1))],ops=[],v=nums[0];for(let i=1;i<count;i++){let op=operation==='add'?'+':operation==='sub'?'−':Math.random()<.5?'+':'−';let b=op==='−'?Math.floor(Math.random()*(v+1)):Math.floor(Math.random()*(n+1));nums.push(b);ops.push(op);v=op==='+'?v+b:v-b}if(allowed(v))return{display:nums.map((x,i)=>i?` ${ops[i-1]} ${x}`:x).join(''),answer:v}}return{display:'1 + 1',answer:2}}
function nextQuestion(){if(level==='three'||level==='four')return multi(level==='three'?3:4);return nextPair()}
function initAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function tone(f,start,dur,type,gain,end){if(!audioCtx)return;const t=audioCtx.currentTime+start,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.01)}function correctSound(){initAudio();tone(523,0,.18,'sine',1,659);tone(659,.07,.18,'sine',1,784);tone(784,.14,.30,'sine',1,1047)}function wrongSound(){initAudio();tone(260,0,.18,'square',1,150);tone(190,.11,.22,'square',1,120)}
function fireworks(){const w=document.createElement('div');w.className='fireworks';const f=document.createElement('div');f.className='firework';f.innerHTML=['🌟','✨','🎊','✨','🌟','✨','🎉','✨','🌟','🎊'].map((x,i)=>`<span class="spark s${i+1}">${x}</span>`).join('');w.appendChild(f);document.body.appendChild(w);setTimeout(()=>w.remove(),2050)}
function render(){stopRecognition();answered=false;current=nextQuestion();$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}</span><span>Đúng: ${score}</span></div><div class="equation">${current.display} = ?</div><div id="answerArea"></div><div id="feedback" class="feedback"></div>`;if(mode==='choice')choice();else if(mode==='write')write();else speak()}
function choice(){let s=new Set([current.answer]);let limit=range==='result10'?10:(range==='inf'?20:Number(range));while(s.size<4)s.add(Math.floor(Math.random()*(limit+1)));$('answerArea').innerHTML='<div class="answers">'+[...s].sort(()=>Math.random()-.5).map(v=>`<button class="answer" onclick="submit(${v},this)">${v}</button>`).join('')+'</div>'}function write(){$('answerArea').innerHTML='<div class="write"><input id="numberInput" class="number-input" type="number" inputmode="numeric" placeholder="Đáp án"><button id="submitBtn" class="submit">Trả lời</button></div>';const i=$('numberInput');$('submitBtn').onclick=()=>submit(Number(i.value),$('submitBtn'));i.onkeydown=e=>{if(e.key==='Enter')submit(Number(i.value),$('submitBtn'))};setTimeout(()=>i.focus(),50)}function speak(){if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){$('answerArea').innerHTML='<div class="status">Trình duyệt không hỗ trợ trả lời bằng giọng nói.</div>';return}$('answerArea').innerHTML='<div class="mic-area"><button class="mic" onclick="startRecognition()">🎤</button><div id="speechStatus" class="status">Nhấn micro rồi nói đáp án</div></div>'}function startRecognition(){stopRecognition();const C=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new C();recognition.lang='vi-VN';recognition.onresult=e=>{const s=e.results[0][0].transcript.trim();const n=/^\d+$/.test(s)?Number(s):null;if(n!==null)submit(n,null);else $('speechStatus').textContent='Không nhận ra số, hãy thử lại.'};recognition.onerror=()=>{$('speechStatus').textContent='Không nghe rõ, hãy thử lại.'};recognition.onend=()=>recognition=null;recognition.start()}function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}}
function submit(v,b){if(answered)return;if(Number(v)===Number(current.answer)){answered=true;score++;correctSound();fireworks();if(b)b.classList.add('correct');setTimeout(()=>{pos++;render()},2000)}else{wrongSound();if(b)b.classList.add('wrong');const f=$('feedback');f.className='feedback bad';f.textContent='✗ Chưa đúng — thử lại nhé!';setTimeout(()=>b&&b.classList.remove('wrong'),500)}}$('startBtn').onclick=()=>{initAudio();cursor=0;opCursor=0;pos=0;score=0;$('setup').style.display='none';$('quiz').classList.add('show');render()};renderChoices();</script><script src="navigation-v2.js?v=20261006"></script><script src="navigation-hardening.js?v=20261006"></script><script src="navigation-math-extra.js?v=20261006"></script></body></html>
