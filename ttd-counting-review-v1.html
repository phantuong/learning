<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Counting v1</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.visual{margin:8px 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #d6dde5;border-radius:10px;padding:14px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Counting v1</h1><div id="app"></div><script src="ttd-counting-engine-v1.js"></script><script src="ttd-counting-bank-v1.js"></script><script src="ttd-counting-validator-v1.js"></script><script>const qs=TTD_COUNTING_VALIDATOR_V1.validateBank(TTD_COUNTING_BANK_V1),app=document.getElementById('app');app.innerHTML=`<p><b>${qs.filter(q=>q.validation.valid).length}/${qs.length}</b> valid</p>`;for(const q of qs){app.innerHTML+=`<section class="q"><b>${q.id}</b> — L${q.level} — <span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'VALID':'REJECTED'}</span><p>${q.question}</p><div class="visual">${TTD_COUNTING_V1.render(q.problem)}</div><div class="choices">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b><br>${c}</div>`).join('')}</div><small>${q.validation.errors.join(', ')}</small></section>`}</script></body></html>
