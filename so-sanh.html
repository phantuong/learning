<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>So sánh · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25253a;background:#fff5fa;--pink:#ec5fa4;--pink2:#ff9bc9;--ink:#29243b;--muted:#777487;--line:#f0dbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.grade.active{background:#fff0f7;color:var(--pink)}.sub,.subnav{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open,.subnav.open{display:grid;gap:3px}.sub a,.subnav a{font-size:14px;padding:8px 9px;border-radius:9px}.courses,.course-list{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a,.course-list a{font-size:13px}.main{margin-left:260px;padding:20px;min-height:100vh}.wrap{max-width:900px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012}.hero{text-align:center;padding:18px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:35px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 13px;font-weight:750;color:#625c6c;cursor:pointer}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start{width:100%;border:0;border-radius:16px;padding:14px;background:var(--pink);color:white;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:750}.bar{height:8px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 28px}.bar i{display:block;height:100%;background:var(--pink);transition:.2s}.question{text-align:center;font-size:22px;font-weight:850;color:#575163;margin-bottom:18px}.visual-groups{display:flex;justify-content:center;gap:clamp(18px,7vw,70px);align-items:flex-start;margin:4px 0 22px}.group{flex:1;max-width:330px;min-width:0;text-align:center}.group-icons{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:7px;min-height:150px;padding:10px;background:linear-gradient(180deg,#fffafd,#fff);border:1px solid #f4e2eb;border-radius:22px}.group-label{font-size:18px;font-weight:850;color:#62566a;margin-top:8px}.animal{width:46px;height:46px;display:block}.numbers{display:flex;align-items:center;justify-content:center;gap:24px;margin:8px 0 24px}.num{font-size:64px;font-weight:950;color:var(--ink);min-width:110px}.versus{font-size:22px;color:#c7a9b8}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:17px 8px;font-size:19px;font-weight:850;color:#514b5c;cursor:pointer}.ans:hover{border-color:var(--pink)}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.feedback{text-align:center;min-height:38px;padding:15px 0;font-weight:850;font-size:18px}.next{display:none;width:100%;border:0;border-radius:16px;padding:15px;background:var(--ink);color:white;font-weight:850;font-size:18px;cursor:pointer}.next.show{display:block}.result{text-align:center}.stars{font-size:46px}.result h2{font-size:29px;margin:8px}.result p{color:var(--muted);font-size:17px}.again{border:0;border-radius:15px;padding:13px 20px;background:var(--pink);color:#fff;font-weight:850;font-size:17px}.tip{margin-top:16px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}
@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#2b203855;z-index:15}.main{margin:0;padding:12px 14px 35px}.mobile{display:block}.settings{grid-template-columns:1fr}.card{padding:18px;border-radius:22px}.hero h1{font-size:30px}.visual-groups{gap:7px}.group-icons{gap:4px;min-height:125px;padding:5px}.animal{width:34px;height:34px}.group-label{font-size:15px}.numbers{gap:12px}.num{font-size:54px;min-width:85px}.answers{grid-template-columns:1fr}.ans{padding:14px}}
</style></head>
<body><aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile" onclick="toggleNav()">☰</button><div class="wrap"><header class="hero"><div class="emoji">🔢💗</div><h1>So sánh</h1><p>Học cách so sánh số và số lượng qua trò chơi</p></header><section class="card setup" id="setup"><div class="settings"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices" id="levels"></div></div><div class="setting"><h3>🔢 Phạm vi số</h3><div class="choices" id="ranges"></div></div></div><button class="start" onclick="startQuiz()">Bắt đầu luyện tập ✨</button><div class="tip">Mỗi bài gồm 10 câu. Câu hỏi được tạo tự động mỗi lần bắt đầu.</div></section><section class="card quiz" id="quiz"></section></div></main>
<script>
const LEVELS=[['1','So sánh 2 số'],['2','So sánh bằng hình ảnh'],['3','Tìm lớn nhất / nhỏ nhất'],['4','Tìm số ở giữa'],['5','Sắp xếp 3 số'],['6','Luyện tập tổng hợp']];const RANGES=[10,20,50,100];let level=Number(localStorage.getItem('compareLevel')||1),range=Number(localStorage.getItem('compareRange')||10),qs=[],pos=0,score=0,answered=false;const $=id=>document.getElementById(id);
function choices(){levels.innerHTML=LEVELS.map(x=>`<button class="choice ${+x[0]===level?'on':''}" onclick="pickLevel(${x[0]})">Level ${x[0]}<br><small>${x[1]}</small></button>`).join('');ranges.innerHTML=RANGES.map(x=>`<button class="choice ${x===range?'on':''}" onclick="pickRange(${x})">0–${x}</button>`).join('')}
function pickLevel(v){level=+v;localStorage.setItem('compareLevel',level);choices()}function pickRange(v){range=+v;localStorage.setItem('compareRange',range);choices()}function rnd(max=range){return Math.floor(Math.random()*(max+1))}function distinct(n,max=range){let a=[];while(a.length<n){let x=rnd(max);if(!a.includes(x))a.push(x)}return a}function cmp(a,b){return a>b?'Lớn hơn':a<b?'Nhỏ hơn':'Bằng nhau'}
function makeQuestion(type){if(type===1){let a=rnd(),b=rnd();return{type,nums:[a,b],prompt:'Hai số này so với nhau thế nào?',answer:cmp(a,b),opts:['Lớn hơn','Bằng nhau','Nhỏ hơn']}}if(type===2){let max=Math.min(range,20),a=rnd(max),b=rnd(max);let answer=a>b?'Thỏ nhiều hơn':a<b?'Cà rốt nhiều hơn':'Thỏ bằng cà rốt';return{type,nums:[a,b],prompt:'Nhóm nào có nhiều hơn?',answer,opts:['Thỏ nhiều hơn','Thỏ bằng cà rốt','Cà rốt nhiều hơn'],image:true}}if(type===3){let a=distinct(3),want=Math.random()<.5?'max':'min';return{type,nums:a,prompt:want==='max'?'Số nào lớn nhất?':'Số nào nhỏ nhất?',answer:String(want==='max'?Math.max(...a):Math.min(...a)),opts:a.map(String).sort(()=>Math.random()-.5)}}if(type===4){let a=rnd(),b=rnd();if(a>b)[a,b]=[b,a];if(b-a<2){b=Math.min(range,a+2);if(b-a<2)a=Math.max(0,b-2)}let m=Math.floor((a+b)/2);let opts=new Set([String(m)]);while(opts.size<4)opts.add(String(rnd()));return{type,nums:[a,b],prompt:'Số nào có thể nằm ở giữa hai số?',answer:String(m),opts:[...opts].sort(()=>Math.random()-.5)}}if(type===5){let a=distinct(3),sorted=[...a].sort((x,y)=>x-y),correct=sorted.join(' < '),wrong1=[...sorted].reverse().join(' < '),wrong2=[sorted[1],sorted[0],sorted[2]].join(' < '),wrong3=[sorted[0],sorted[2],sorted[1]].join(' < ');return{type,nums:a,prompt:'Sắp xếp từ bé đến lớn',answer:correct,opts:[correct,wrong1,wrong2,wrong3].sort(()=>Math.random()-.5)}}return makeQuestion(Math.floor(Math.random()*5)+1)}
function build(){qs=[];for(let i=0;i<10;i++)qs.push(makeQuestion(level===6?Math.floor(Math.random()*5)+1:level));pos=0;score=0}
function startQuiz(){build();setup.classList.add('hide');quiz.classList.add('show');render()}
function bunnySVG(){return `<svg class="animal" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="40" rx="19" ry="15" fill="#fff" stroke="#d8dce8" stroke-width="2"/><ellipse cx="23" cy="15" rx="7" ry="18" fill="#fff" stroke="#d8dce8" stroke-width="2" transform="rotate(-10 23 15)"/><ellipse cx="41" cy="15" rx="7" ry="18" fill="#fff" stroke="#d8dce8" stroke-width="2" transform="rotate(10 41 15)"/><circle cx="25" cy="38" r="2.5" fill="#29243b"/><circle cx="39" cy="38" r="2.5" fill="#29243b"/><path d="M30 43q2 3 4 0" fill="none" stroke="#ec5fa4" stroke-width="2" stroke-linecap="round"/></svg>`}function carrotSVG(){return `<svg class="animal" viewBox="0 0 64 64" aria-hidden="true"><path d="M31 17c-8-9-15-4-14 3 5-4 9-2 12 3M33 19c7-10 15-7 15 1-5-3-9-1-12 4" fill="none" stroke="#62b847" stroke-width="6" stroke-linecap="round"/><path d="M25 20c8-3 18 1 18 9 0 11-9 24-14 27-6-4-15-17-14-27 0-4 4-8 10-9z" fill="#ff8b45"/><path d="M24 26l10 20" stroke="#f26d35" stroke-width="2" opacity=".6"/></svg>`}
function render(){answered=false;let q=qs[pos];let visual=q.image?`<div class="visual-groups"><div class="group"><div class="group-icons">${Array.from({length:q.nums[0]},()=>bunnySVG()).join('')}</div><div class="group-label">🐰 Thỏ</div></div><div class="group"><div class="group-icons">${Array.from({length:q.nums[1]},()=>carrotSVG()).join('')}</div><div class="group-label">🥕 Cà rốt</div></div></div>`:'';let nums=q.image?'':q.nums.map((n,i)=>`<span class="num">${n}</span>${i<q.nums.length-1?'<span class="versus">'+(q.type===5?'·':'VS')+'</span>':''}`).join('');quiz.innerHTML=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div>${visual}<div class="numbers">${nums}</div><div class="answers">${q.opts.map((o,i)=>`<button class="ans" onclick="answer(${i})">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="next" id="nx" onclick="next()">Tiếp theo →</button><div class="tip">💡 Hãy suy nghĩ thật kỹ trước khi chọn nhé!</div>`}
function answer(i){if(answered)return;answered=true;let q=qs[pos],buttons=document.querySelectorAll('.ans'),ok=buttons[i].textContent.trim()===q.answer.trim();buttons.forEach((b,n)=>{if(b.textContent.trim()===q.answer.trim())b.classList.add('correct');if(n===i&&!ok)b.classList.add('wrong')});if(ok){score++;fb.textContent='🎉 Chính xác!';fb.style.color='#087443'}else{fb.textContent='💪 Cố gắng lên!';fb.style.color='#b4232e'}nx.classList.add('show')}
function next(){if(pos<9){pos++;render()}else result()}function result(){let pct=score*10;quiz.innerHTML=`<div class="result"><div class="stars">${pct===100?'🌟🌟🌟':pct>=70?'🌟🌟':'🌟'}</div><h2>${pct===100?'Tuyệt vời!':'Cố gắng lên nhé!'}</h2><p>Bé làm đúng <strong>${score}/10</strong> câu.</p><button class="again" onclick="startQuiz()">Làm bài tiếp theo ✨</button></div>`}function toggleNav(){side.classList.toggle('open');overlay.classList.toggle('show')}choices();
</script><script src="app-nav.js"></script></body></html>
