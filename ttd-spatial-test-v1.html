<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial Test v1</title><style>body{font-family:system-ui;margin:20px;background:#f5f7fa;color:#243447}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}.ok{color:#16734a}.bad{color:#b42318}code{background:#eef2f6;padding:2px 5px;border-radius:5px}</style></head><body><h1>Spatial Engine v1</h1><div id="out"></div><script src="ttd-spatial-v1.js"></script><script src="ttd-spatial-generator-v1.js"></script><script>const out=document.getElementById('out');let passed=0;for(const q of TTD_SPATIAL_GENERATED_V1){const actual=TTD_SPATIAL_V1.solve(q.problem);const expected=q.family==='rotation_invariant_count'?6:q.answer.value;const ok=actual===expected;if(ok)passed++;out.innerHTML+=`<div class="card"><b>${q.id}</b> — ${q.question}<br>Expected: <code>${expected}</code> | Solver: <code>${actual}</code><br><span class="${ok?'ok':'bad'}">${ok?'✓ PASS':'✗ FAIL'}</span></div>`}out.innerHTML=`<h2>${passed}/${TTD_SPATIAL_GENERATED_V1.length} passed</h2>`+out.innerHTML;</script></body></html>
