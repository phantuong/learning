<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Môn học · Learning Hub</title><style>body{margin:0;background:#f4f6fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{min-height:100vh;padding:70px 24px 45px}.wrap{max-width:900px;margin:auto}.head{text-align:center;margin-bottom:28px}.icon{font-size:52px}.head h1{font-size:34px;margin:5px}.head p{color:#68738a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.course{display:block;background:#fff;border:1px solid #e2e6ee;border-radius:20px;padding:20px;text-decoration:none;color:#182033;box-shadow:0 7px 20px #1820330b}.course:hover{transform:translateY(-1px)}.course h2{margin:0 0 7px;font-size:20px}.course p{margin:0;color:#68738a;line-height:1.5}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:99px;background:#eef8f2;color:#087443;font-size:12px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.main{padding:65px 14px 35px}}</style></head><body><main class="main"><div class="wrap"><header class="head"><div class="icon" id="icon">📘</div><h1 id="title">Môn học</h1><p id="sub">Chọn bài học</p></header><section class="grid" id="courses"></section></div></main><script>const p=new URLSearchParams(location.search),g=Number(p.get('grade')||1),s=p.get('subject')||'Toán';const icons={'Toán':'➕','Tiếng Việt':'📖','Tiếng Anh':'🔤','Toán Tư Duy':'🧠','Math':'🌎'};const grade1={'Toán':[['Công Trừ Phạm Vi 10','cong-tru-10.html'],['So Sánh','so-sanh.html'],['Hình Phẳng','hinh-phang.html'],['Hình Khối',null]],'Tiếng Việt':[['Đọc Hiểu','doc-hieu.html'],['Hoàn Thành Từ',null],['Sắp Xếp Câu',null]],'Tiếng Anh':[['Danh Sách Từ Vựng','vocabulary-list.html'],['Hoàn Thành Từ','english.html'],['Sắp Xếp Câu','voca-scramble.html']], 'Toán Tư Duy':[['Toán Tư Duy',null]],'Math':[['Math',null]]};const arr=g===1?(grade1[s]||[]):[[s,null]];document.title=`${s} · Lớp ${g} · Learning Hub`;icon.textContent=icons[s]||'📘';title.textContent=s;sub.textContent=`Lớp ${g} · Chọn bài học`;courses.innerHTML=arr.map(([n,h])=>{const href=h||`coming-soon.html?grade=${g}&subject=${encodeURIComponent(s)}&course=${encodeURIComponent(n)}`;return `<a class="course" href="${href}"><h2>${n}</h2><p>${h?'Mở bài học và luyện tập.':'Nội dung bài học đang được xây dựng.'}</p><span class="badge">${h?'Đang học':'Đang phát triển'}</span></a>`}).join('');</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-v2.js?v=20261005"></script></body></html>
