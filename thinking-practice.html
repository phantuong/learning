<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toán Tư Duy — Luyện tập</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.progress{height:8px;background:#e4e8f0;border-radius:8px;overflow:hidden}.bar{height:100%;background:#4f7cff;width:0}.card{background:white;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 30px #0000000d}.visual{min-height:190px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:56px;white-space:pre-wrap;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid #e2e6ef;background:#fff;border-radius:16px;padding:18px;font-size:34px;min-height:80px;cursor:pointer}.choice:hover{border-color:#4f7cff}.choice.correct{border-color:#22a06b;background:#eaf9f1}.choice.wrong{border-color:#e5484d;background:#fff0f0}.next{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:#172033;color:white;font-size:18px;display:none}.muted{color:#68738a}.result{text-align:center;font-size:24px}.restart{padding:13px 20px;border:0;border-radius:12px;background:#4f7cff;color:white;font-size:17px}</style></head><body><main class="app"><div class="top"><div><strong id="group">Toán Tư Duy</strong><div class="muted" id="level">Level 1</div></div><strong id="score">0 điểm</strong></div><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="card"><h2 id="question">Câu hỏi</h2><div class="visual" id="visual"></div><div class="choices" id="choices"></div><button class="next" id="next">Câu tiếp theo →</button></section></main><script src="data/ttd-question-bank.js"></script><script>const params=new URLSearchParams(location.search),key=params.get('group')||'pattern',level=Number(params.get('level')||1);const bank=(window.TTD_QUESTION_BANK?.questions||[]).filter(x=>x.group===key&&x.level===level);let q=0,score=0,answered=false;const total=Math.min(5,bank.length||5);const names={pattern:'Quy luật & Dãy hình',classification:'Phân loại',analogy:'Tương tự',matrix:'Ma trận hình ảnh',spatial:'Tư duy không gian',counting:'Đếm & Logic',ordering:'Sắp xếp & So sánh',missing:'Mảnh ghép còn thiếu'};function render(){answered=false;document.getElementById('group').textContent=names[key]||'Toán Tư Duy';document.getElementById('level').textContent='Level '+level+' · Câu '+(q+1)+' / '+total;document.getElementById('score').textContent=score+' điểm';document.getElementById('bar').style.width=(q/total*100)+'%';const item=bank[q%bank.length];document.getElementById('question').textContent='Hãy chọn đáp án đúng';document.getElementById('visual').textContent=Array.isArray(item.visual)?item.visual.join('   '):item.visual;document.getElementById('choices').innerHTML=item.choices.map((x,i)=>`<button class="choice" data-index="${i}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,item));document.getElementById('next').style.display='none'}function answer(btn,item){if(answered)return;answered=true;const ok=Number(btn.dataset.index)===item.answer;if(ok)score+=20;document.querySelectorAll('.choice').forEach(b=>{if(Number(b.dataset.index)===item.answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');document.getElementById('score').textContent=score+' điểm';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{q++;if(q>=total){document.getElementById('card').innerHTML=`<div class="result"><h2>Hoàn thành! 🎉</h2><p>Bé đạt <strong>${score}/${total*20}</strong> điểm</p><button class="restart" onclick="location.reload()">Làm lại</button></div>`;document.getElementById('bar').style.width='100%'}else render()};if(!bank.length){document.getElementById('card').innerHTML='<div class="result"><h2>Chưa có câu hỏi</h2><p>Nhóm này đang được xây dựng.</p></div>'}else render();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
