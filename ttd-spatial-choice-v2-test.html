<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial Visual Choices v2</title><style>body{font-family:system-ui;margin:20px;background:#f5f7fa;color:#243447}.card{background:#fff;border-radius:16px;padding:16px;margin:14px 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{border:2px solid #d7dee7;border-radius:12px;padding:8px;text-align:center}.ok{color:#16734a;font-weight:700}@media(max-width:600px){.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Spatial Visual Choices v2</h1><p>Đây là test: cả 4 đáp án đều là hình chiếu, không dùng tên hình.</p><div id="out"></div><script src="ttd-spatial-v1.js"></script><script src="ttd-spatial-view-v2.js"></script><script src="ttd-spatial-choice-v2.js"></script><script src="ttd-spatial-choice-generator-v2.js"></script><script>const out=document.getElementById('out');for(const q of TTD_SPATIAL_VISUAL_BANK_V2){let html=`<div class="card"><b>${q.id}</b><p>${q.question}</p><div class="choices">`;q.choices.forEach((c,i)=>html+=`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_SPATIAL_CHOICE_V2.render(c,120)}</div>`);html+=`</div><p class="ok">✓ Correct choice: ${String.fromCharCode(65+q.answer)}</p></div>`;out.innerHTML+=html;}</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
