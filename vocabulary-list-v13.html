<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Danh sách Từ Vựng</title>
<style>
:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f;--soft:#fff0f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search,.meaning-input{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted)}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-actions{display:flex;gap:8px;padding:4px 4px 8px;position:sticky;top:0;background:#fff;z-index:2}.source-actions button,.edit,.save,.cancel{border:1px solid #ead9e4;border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.source-actions button{flex:1;background:#fff7fb;color:var(--pink)}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item label{font-size:14px;line-height:1.35}.source-item small{display:block;color:var(--muted);margin-top:2px}.count,.status{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 8px}.status{min-height:18px;font-weight:700}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4}.edit{background:#fff;color:var(--pink);margin-top:8px}.editbox{display:flex;gap:7px;margin-top:8px}.meaning-input{padding:9px 10px;font-size:14px}.save{background:var(--pink);color:#fff}.cancel{background:#fff;color:var(--muted)}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:var(--soft);color:var(--pink)}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:56px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px}.word{font-size:19px}.speak{width:41px;height:41px}}
</style>
</head>
<body>
<main class="main"><div class="card">
<header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary">Đang tải nguồn...</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div>
<div id="count" class="count">Đang tải...</div><div id="status" class="status">Đang tải dữ liệu...</div><section id="list" class="list"></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20261006v4"></script>
<script src="vocabulary-source-sync.js?v=20261006v3"></script>
<script src="vocabulary-db.js?v=20261006v4"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let words=[],sources=[],selected=new Set(),editing=null,dbByWord=new Map();
const fallbackMeaning={"am":"là (dùng với I)","I":"tôi / mình","my":"của tôi","the":"cái/con đó","and":"và","it":"nó","to":"đến / để","a":"một","an":"một","have":"có","has":"có (dùng với he/she/it)","can":"có thể","can't":"không thể","in":"trong","on":"trên","under":"bên dưới","next to":"bên cạnh","behind":"phía sau","between":"ở giữa","stand up":"đứng lên","sit down":"ngồi xuống","open your book":"mở sách","raise your hand":"giơ tay","pencil sharpener":"đồ gọt bút chì","pencil case":"hộp bút","living room":"phòng khách","dining room":"phòng ăn","dark hair":"tóc sẫm màu","blond hair":"tóc vàng","curly hair":"tóc xoăn","straight hair":"tóc thẳng","long hair":"tóc dài","play football":"chơi bóng đá","play tennis":"chơi quần vợt","ride a horse":"cưỡi ngựa","ride a bike":"đi xe đạp"};
const emoji={cat:'🐱',dog:'🐶',bird:'🐦',fish:'🐟',mouse:'🐭',rabbit:'🐰',cow:'🐄',sheep:'🐑',duck:'🦆',chicken:'🐔',hat:'🧢',shirt:'👕',shoes:'👟',socks:'🧦',glasses:'👓',bed:'🛏️',clock:'🕒',bookcase:'📚',plant:'🪴',television:'📺',table:'🪑',sofa:'🛋️',cushion:'🛋️',circle:'⚪',triangle:'🔺',rectangle:'▭',square:'⬜',oval:'🥚',family:'👨‍👩‍👧‍👦',old:'👴',young:'👶',tall:'📏',short:'📏','play football':'⚽','play tennis':'🎾','ride a horse':'🐴','ride a bike':'🚲'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localMeaning(w){return fallbackMeaning[w]||fallbackMeaning[String(w).toLowerCase()]||''}
function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
async function loadBase(){const [a,b]=await Promise.all([fetch('data/grade1/english/vocabulary.json',{cache:'no-store'}),fetch('data/grade1/english/vocabulary-sources.json',{cache:'no-store'})]);if(!a.ok)throw Error('Không tải được vocabulary.json');if(!b.ok)throw Error('Không tải được vocabulary-sources.json');return{v:await a.json(),s:await b.json()}}
function renderSources(){const menu=$('sourceMenu');menu.innerHTML='<div class="source-actions"><button id="allBtn" type="button">✓ Chọn tất cả</button><button id="noneBtn" type="button">Bỏ chọn tất cả</button></div>'+sources.map(s=>`<div class="source-item"><input type="checkbox" data-source="${esc(s.id)}" ${selected.has(s.id)?'checked':''}><label><b>${esc(s.name||s.id)}</b><small>${esc(s.description||'')}</small></label></div>`).join('');updateSummary();$('allBtn').onclick=()=>changeSources(sources.map(s=>s.id));$('noneBtn').onclick=()=>changeSources([]);menu.querySelectorAll('input[data-source]').forEach(x=>x.onchange=()=>{const n=new Set(selected);x.checked?n.add(x.dataset.source):n.delete(x.dataset.source);changeSources([...n])})}
function updateSummary(){ $('sourceSummary').textContent=selected.size===sources.length?'Tất cả nguồn':selected.size?`${selected.size} nguồn được chọn`:'Không có nguồn nào'; }
async function changeSources(ids){selected=new Set(ids);renderSources();render();try{if(window.VocabularySourceSync)await VocabularySourceSync.set([...selected]);$('status').textContent='Đã lưu nguồn học.'}catch(e){$('status').textContent='Đã cập nhật trên thiết bị; Cloud tạm thời không khả dụng.';console.warn(e)}}
function mergedWord(w){const d=dbByWord.get(String(w.word).toLowerCase())||{};return Object.assign({},w,d,{sourceIds:Array.from(new Set([...(w.sourceIds||[]),...(d.source_ids||[])]))})}
function render(){const q=$('search').value.trim().toLowerCase();const list=words.map(mergedWord).filter(w=>{const src=(w.sourceIds||[]).some(id=>selected.has(id));const text=String(w.word||'').toLowerCase();const m=String(w.vietnamese_meaning||localMeaning(w.word)||'').toLowerCase();return src&&(!q||text.includes(q)||m.includes(q))});$('count').textContent=`${list.length} từ`;const el=$('list');if(!list.length){el.innerHTML='<div class="empty">Không có từ nào phù hợp với nguồn đã chọn.</div>';return}el.innerHTML=list.map(w=>{const m=w.vietnamese_meaning||localMeaning(w.word)||'Chưa có nghĩa tiếng Việt';const pic=w.image_url?`<img src="${esc(w.image_url)}" alt="${esc(w.word)}" loading="lazy">`:(emoji[String(w.word).toLowerCase()]||'🔤');if(editing===w.word)return `<article class="word-card"><div class="pic">${pic}</div><div><div class="word">${esc(w.word)}</div><div class="editbox"><input class="meaning-input" id="meaningEdit" value="${esc(m==='Chưa có nghĩa tiếng Việt'?'':m)}"><button class="save" data-save="${esc(w.word)}">Lưu</button><button class="cancel" data-cancel>Hủy</button></div></div><button class="speak" data-speak="${esc(w.word)}">🔊</button></article>`;return `<article class="word-card"><div class="pic">${pic}</div><div><div class="word">${esc(w.word)}</div><div class="meta">${esc(m)}${w.ipa?' · '+esc(w.ipa):''}</div><button class="edit" data-edit="${esc(w.word)}">✏️ Sửa nghĩa</button></div><button class="speak" data-speak="${esc(w.word)}">🔊</button></article>`}).join('');el.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render();setTimeout(()=>{const i=$('meaningEdit');i?.focus();i?.select()},0)});el.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editing=null;render()});el.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const input=$('meaningEdit');const word=b.dataset.save;try{b.disabled=true;await VocabularyDB.updateMeaning(word,input.value);const d=dbByWord.get(word.toLowerCase())||{};d.vietnamese_meaning=input.value.trim()||null;dbByWord.set(word.toLowerCase(),d);editing=null;render();$('status').textContent='Đã lưu nghĩa tiếng Việt lên Cloud.'}catch(e){b.disabled=false;$('status').textContent='Không thể lưu nghĩa: '+(e.message||e);console.error(e)}})}
$('search').oninput=render;$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!$('sourceMenu').contains(e.target)&&e.target!==$('sourceTrigger'))$('sourceMenu').classList.remove('open')});
(async function init(){try{$('status').textContent='Đang tải danh sách...';const base=await loadBase();words=base.v.words||[];sources=base.s.sources||[];try{if(window.VocabularyDB){const dbRows=await VocabularyDB.list();dbRows.forEach(r=>dbByWord.set(String(r.word).toLowerCase(),r))}}catch(e){console.warn('Vocabulary DB unavailable',e)}try{if(window.VocabularySourceSync){await VocabularySourceSync.init();selected=new Set(VocabularySourceSync.getSelected().filter(id=>sources.some(s=>s.id===id)))}}catch(e){console.warn('Source cloud sync unavailable',e)}if(!selected.size)selected=new Set(sources.map(s=>s.id));renderSources();render();$('status').textContent='';}catch(e){$('status').textContent='Không thể tải danh sách từ vựng: '+(e.message||e);$('list').innerHTML='<div class="empty">Vui lòng thử tải lại trang.</div>';console.error(e)}})();
})();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body>
</html>
