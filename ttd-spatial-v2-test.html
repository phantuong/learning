<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial v2 Test</title><style>body{font-family:system-ui;margin:20px;background:#f5f7fa;color:#243447}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.ok{color:#16734a}.bad{color:#b42318}svg{display:block;margin:8px 0}</style></head><body><h1>Spatial Projection v2</h1><div id="out"></div><script src="ttd-spatial-view-v2.js"></script><script src="ttd-spatial-families-v2.js"></script><script>const out=document.getElementById('out');let pass=0;for(const q of TTD_SPATIAL_FAMILIES_V2){let ok=true,actual='';if(q.family==='top_view'||q.family==='front_view'||q.family==='side_view'){actual=q.family.split('_')[0];actual=actual==='top'?'top':actual==='front'?'front':'side';out.innerHTML+=`<div class="card"><b>${q.id}</b><p>${q.question}</p>${TTD_SPATIAL_VIEW_V2.render(q.cubes,actual)}<span class="ok">✓ projection rendered</span></div>`;pass++;continue}if(q.family==='projection_compare'){actual=TTD_SPATIAL_VIEW_V2.sameStructure(q.cubes,q.cubes,'top');ok=actual===q.answer}else if(q.family==='missing_cube'){actual=q.missing;ok=JSON.stringify(actual)===JSON.stringify(q.answer)}if(ok)pass++;out.innerHTML+=`<div class="card"><b>${q.id}</b><p>${q.question}</p><span class="${ok?'ok':'bad'}">${ok?'✓ PASS':'✗ FAIL'}</span></div>`}out.innerHTML=`<h2>${pass}/${TTD_SPATIAL_FAMILIES_V2.length} checks passed</h2>`+out.innerHTML;</script></body></html>
