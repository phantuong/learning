<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fb"><title>Danh sách Từ Vựng</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px -4px}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.source-trigger .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-actions{display:flex;gap:8px;padding:4px 4px 8px;position:sticky;top:0;background:#fff;z-index:1}.source-actions button{flex:1;border:1px solid #ead9e4;background:#fff7fb;color:var(--pink);border-radius:10px;padding:9px 8px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item .label{font-size:14px;line-height:1.35}.source-item .meta{font-size:11px;color:var(--muted);margin-top:2px}.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 8px}.sync{text-align:center;min-height:18px;font-size:12px;font-weight:700;color:var(--muted);padding:0 20px 10px}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover;display:block}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;min-height:21px}.meta.loading{opacity:.55}.source-note{font-size:11px;color:#98a2b3;margin-top:3px}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:#fff0f7;color:var(--pink)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:28px}.word{font-size:19px}.meta{font-size:14px}.speak{width:41px;height:41px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary" class="summary">Đang tải nguồn…</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div><div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v2"></script><script src="auth-guard.js?v=20261006v1"></script><script src="vocabulary-source-sync.js?v=20261006v1"></script><script>
const IMG_KEY='grade1EnglishVocabImagesV3',META_KEY='grade1EnglishVocabMetaV2';let words=[],sources=[],selected=new Set();const $=id=>document.getElementById(id);const emoji={cat:'🐱',dog:'🐶',bird:'🐦',fish:'🐟',mouse:'🐭',rabbit:'🐰',cow:'🐄',sheep:'🐑',duck:'🦆',chicken:'🐔',elephant:'🐘',giraffe:'🦒',bat:'🦇',squirrel:'🐿️',chameleon:'🦎',cheese:'🧀',bread:'🍞',milk:'🥛',juice:'🧃',rice:'🍚',apples:'🍎',bananas:'🍌',hat:'🧢',shirt:'👕',shoes:'👟',socks:'🧦',glasses:'👓',picture:'🖼️',bed:'🛏️',clock:'🕒',bookcase:'📚',plant:'🪴',television:'📺',table:'🪑',sofa:'🛋️',cushion:'🛋️',living:'🛋️',bedroom:'🛏️',bathroom:'🛁',kitchen:'🍳',garden:'🌳',wings:'🪽',beak:'🐦',ears:'👂',tail:'🐈',eyes:'👀',nose:'👃',mouth:'👄',arms:'💪',legs:'🦵',fly:'🪽',walk:'🚶',climb:'🧗',jump:'🦘',swim:'🏊',run:'🏃','play football':'⚽','play tennis':'🎾','ride a horse':'🐴','ride a bike':'🚲',rollerblade:'🛼',old:'👴',young:'👶',tall:'📏',short:'📏',family:'👨‍👩‍👧‍👦',baby:'👶',father:'👨',mother:'👩',parents:'👨‍👩‍👧',mum:'👩',dad:'👨',grandpa:'👴',grandma:'👵',sister:'👧',brother:'👦',twin:'👯',uncle:'👨',auntie:'👩',cousin:'🧒',circle:'⚪',triangle:'🔺',rectangle:'▭',square:'⬜',oval:'🥚',farm:'🚜'};
const imageQuery={old:'elderly person',young:'young child',tall:'tall person',short:'short person',pretty:'pretty girl',handsome:'handsome boy',family:'family parents children',parents:'parents with children',cushion:'sofa cushion',wardrobe:'clothes wardrobe',bookcase:'bookcase',living:'living room',bedroom:'bedroom',bathroom:'bathroom',dining:'dining room',garden:'home garden',wings:'bird wings',beak:'bird beak',tail:'animal tail','play football':'children playing football','play tennis':'children playing tennis','ride a horse':'child riding horse','ride a bike':'child riding bicycle',rollerblade:'child rollerblading',circle:'circle shape',triangle:'triangle shape',rectangle:'rectangle shape',square:'square shape',oval:'oval shape',farm:'farm animals'};
const meaning={"stand up":"đứng lên","sit down":"ngồi xuống","open your book":"mở sách","raise your hand":"giơ tay","sit nicely":"ngồi ngay ngắn","be quiet":"giữ im lặng","listen and look":"lắng nghe và nhìn","speak English":"nói tiếng Anh","pencil sharpener":"đồ gọt bút chì","pencil case":"hộp bút","living room":"phòng khách","dining room":"phòng ăn","dark hair":"tóc sẫm màu","blond hair":"tóc vàng","curly hair":"tóc xoăn","straight hair":"tóc thẳng","long hair":"tóc dài","T-shirt":"áo phông","play football":"chơi bóng đá","play tennis":"chơi quần vợt","ride a horse":"cưỡi ngựa","ride a bike":"đi xe đạp","old":"già, lớn tuổi","young":"trẻ, nhỏ tuổi","tall":"cao","short":"thấp, ngắn","pretty":"xinh đẹp","handsome":"đẹp trai","happy":"vui vẻ","sad":"buồn","angry":"tức giận","hungry":"đói","thirsty":"khát","tired":"mệt","scared":"sợ hãi","sunny":"có nắng","rainy":"có mưa","cloudy":"nhiều mây","windy":"có gió","stormy":"có bão","hot":"nóng","cold":"lạnh","window":"cửa sổ","door":"cửa ra vào","chair":"ghế","desk":"bàn học","bin":"thùng rác","poster":"áp phích","board":"bảng","bag":"cặp, túi","book":"sách","cupboard":"tủ","ruler":"thước kẻ","rubber":"cục tẩy","pen":"bút mực","pencil":"bút chì","mum":"mẹ","dad":"bố","grandpa":"ông","grandma":"bà","sister":"chị/em gái","brother":"anh/em trai","twin":"sinh đôi","uncle":"chú/cậu/bác trai","auntie":"cô/dì/bác gái","cousin":"anh/chị/em họ","circle":"hình tròn","triangle":"hình tam giác","rectangle":"hình chữ nhật","square":"hình vuông","oval":"hình bầu dục","farm":"nông trại","cat":"con mèo","dog":"con chó","bird":"con chim","fish":"con cá","mouse":"con chuột","rabbit":"con thỏ","cow":"con bò","sheep":"con cừu","duck":"con vịt","chicken":"con gà","elephant":"con voi","giraffe":"con hươu cao cổ","bat":"con dơi","squirrel":"con sóc","chameleon":"con tắc kè","cheese":"phô mai","meat":"thịt","pasta":"mì pasta","eggs":"trứng","sandwiches":"bánh mì kẹp","bread":"bánh mì","milk":"sữa","juice":"nước ép","rice":"cơm, gạo","apples":"những quả táo","bananas":"những quả chuối","hat":"mũ","shorts":"quần đùi","sweater":"áo len","shirt":"áo sơ mi","jacket":"áo khoác","skirt":"váy","trousers":"quần dài","T-shirt":"áo phông","shoes":"giày","socks":"tất","glasses":"kính","picture":"bức tranh, hình ảnh","bed":"giường","clock":"đồng hồ","bookcase":"tủ sách","plant":"cây cảnh","television":"tivi","table":"cái bàn","sofa":"ghế sofa","cushion":"đệm tựa, gối tựa","wings":"đôi cánh","beak":"mỏ","ears":"tai","tail":"đuôi","eyes":"mắt","nose":"mũi","mouth":"miệng","arms":"cánh tay","legs":"chân","fly":"bay","walk":"đi bộ","climb":"leo trèo","jump":"nhảy","swim":"bơi","run":"chạy","one":"một","two":"hai","three":"ba","four":"bốn","five":"năm","six":"sáu","seven":"bảy","eight":"tám","nine":"chín","ten":"mười","red":"đỏ","yellow":"vàng","green":"xanh lá","pink":"hồng","purple":"tím","orange":"cam","blue":"xanh dương","black":"đen","white":"trắng","brown":"nâu","gray":"xám","like":"thích","window":"cửa sổ","door":"cửa ra vào"};
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function fallbackMeaning(w){return meaning[w]||meaning[w.toLowerCase()]||''}function query(w){const k=w.toLowerCase();return imageQuery[k]||w}function imgScore(x,w){const text=((x.title||'')+' '+(x.alt_text||'')+' '+(x.description||'')+' '+(x.categories||[]).join(' ')).toLowerCase();const q=query(w).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);let s=0;q.forEach(t=>{if(t.length>2&&text.includes(t))s+=4});if(text.includes(w.toLowerCase()))s+=8;return s}
async function image(w){const c=read(IMG_KEY),k=w.toLowerCase();if(Object.prototype.hasOwnProperty.call(c,k))return c[k];try{const q=encodeURIComponent(query(w));const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*';const r=await fetch(url);if(!r.ok)throw Error();const d=await r.json();const arr=Object.values(d.query?.pages||{}).map(x=>({x,s:imgScore(x,w)})).sort((a,b)=>b.s-a.s);const best=arr.find(o=>{const m=o.x.imageinfo?.[0]?.extmetadata||{};const lic=(m.LicenseShortName?.value||'').toLowerCase();return /public domain|cc0|cc by/.test(lic)})?.x||arr[0]?.x;const info=best?.imageinfo?.[0],u=info?.thumburl||info?.url||'';c[k]=u;write(IMG_KEY,c);return u}catch{c[k]='';write(IMG_KEY,c);return''}}
async function meta(w){const c=read(META_KEY),k=w.toLowerCase();if(c[k])return c[k];try{const r=await fetch('https://dict.minhqnd.com/api/v1/lookup?word='+encodeURIComponent(w)+'&lang=en&def_lang=vi');if(!r.ok)throw Error();const d=await r.json();const en=(d.results||[]).find(x=>x.lang_code==='en'||x.lang==='en'||/English/i.test(x.lang_name||''));const viMeaning=(en?.meanings||[]).find(x=>x.definition_lang==='vi')?.definition||fallbackMeaning(w);const m={meaning:viMeaning||fallbackMeaning(w)||w,ipa:en?.pronunciations?.[0]?.ipa||''};c[k]=m;write(META_KEY,c);return m}catch{return{meaning:fallbackMeaning(w)||w,ipa:''}}}
function updateSummary(){const n=selected.size,total=sources.length;$('sourceSummary').textContent=!n?'Chưa chọn nguồn':n===total?'Tất cả nguồn':`${n} nguồn được chọn`}async function saveSelected(){selected=new Set(await VocabularySourceSync.set([...selected]));updateSummary();loadWords()}async function selectAll(){selected=new Set(sources.map(s=>s.id));await saveSelected();renderSources()}async function clearAll(){selected=new Set();await saveSelected();renderSources()}function renderSources(){const m=$('sourceMenu');m.innerHTML='<div class="source-actions"><button type="button" id="selectAllSources">✓ Chọn tất cả</button><button type="button" id="clearAllSources">Bỏ chọn tất cả</button></div>'+sources.map(s=>`<label class="source-item"><input type="checkbox" data-source="${s.id}" ${selected.has(s.id)?'checked':''}><span><span class="label">${s.label||s.name||s.id}</span>${s.description?`<div class="meta">${s.description}</div>`:''}</span></label>`).join('');$('selectAllSources').onclick=e=>{e.stopPropagation();selectAll()};$('clearAllSources').onclick=e=>{e.stopPropagation();clearAll()};m.querySelectorAll('input[data-source]').forEach(x=>x.onchange=async()=>{selected=new Set(await VocabularySourceSync.set([...m.querySelectorAll('input[data-source]:checked')].map(i=>i.dataset.source)));updateSummary();loadWords()});updateSummary()}
function render(){const term=$('search').value.trim().toLowerCase(),shown=words.filter(w=>!term||w.word.toLowerCase().includes(term));$('count').textContent=`Hiển thị ${shown.length} / ${words.length} từ`;if(!shown.length){$('list').innerHTML='<div class="empty">Không có từ nào thuộc các nguồn đang chọn.</div>';return}$('list').innerHTML=shown.map(w=>`<article class="word-card"><div class="pic" data-img="${w.word}">${emoji[w.word.toLowerCase()]||'📘'}</div><div><div class="word">${w.word}</div><div class="meta loading" data-meta="${w.word}">Đang tải nghĩa…</div></div><button class="speak" data-speak="${w.word}" aria-label="Phát âm">🔊</button></article>`).join('');document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));hydrate(shown)}
async function hydrate(shown){await Promise.all(shown.map(async w=>{const c=[...document.querySelectorAll('.word-card')].find(x=>x.querySelector('.word')?.textContent===w.word);if(!c)return;const m=await meta(w.word),u=await image(w.word),mm=c.querySelector('[data-meta]');mm.textContent=m.meaning+(m.ipa?' · '+m.ipa:'');mm.classList.remove('loading');if(u){const p=c.querySelector('[data-img]'),img=new Image();img.alt=w.word;img.loading='lazy';img.onload=()=>p.replaceChildren(img);img.src=u}}))}
async function loadWords(){const data=await VocabularySourceSync.getData();words=(data.words||[]).filter(w=>(w.sourceIds||[]).some(id=>selected.has(id)));render()}$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.source-wrap'))$('sourceMenu').classList.remove('open')});$('search').oninput=render;(async()=>{try{selected=new Set(await VocabularySourceSync.init());sources=VocabularySourceSync.getSources();renderSources();await loadWords();$('sync').textContent='Nguồn học đã được đồng bộ trên cloud.';window.addEventListener('vocabularySourcesChanged',()=>{selected=new Set(VocabularySourceSync.getSelected());renderSources();loadWords()})}catch(e){$('sync').textContent='Không thể tải nguồn. Vui lòng thử lại.';console.error(e)}})();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
