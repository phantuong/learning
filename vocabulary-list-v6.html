<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5fb"><title>Vocabulary List · Tiếng Anh lớp 1</title>
<style>
:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:hidden}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search,.source-select{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none;background:#fff;color:var(--ink)}.source-select{cursor:pointer}.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px -4px}.controls{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px}.control{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-weight:750;background:#eef2ff;color:var(--ink);cursor:pointer}.control.active{background:#fce7f3;color:#b42318}.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 8px}.sync{text-align:center;min-height:18px;font-size:12px;font-weight:700;padding:0 20px 10px}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover;display:block}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;min-height:21px}.meta.loading{opacity:.55}.actions{display:flex;gap:7px}.speak,.star{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer}.speak{background:#fff0f7;color:var(--pink)}.star{background:#f2f4f7;color:#98a2b3}.star.selected{background:#fff3b8;color:#f59e0b}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:28px}.word{font-size:19px}.meta{font-size:14px}.speak,.star{width:41px;height:41px}.actions{flex-direction:column;gap:5px}}
</style></head>
<body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1</p></header>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label" for="sourceFilter">📚 Lọc theo nguồn</label><select id="sourceFilter" class="source-select"><option value="">Tất cả nguồn</option></select></div>
<div class="controls"><button id="selectAll" class="control">⭐ Chọn tất cả</button><button id="clearAll" class="control">Bỏ chọn tất cả</button><button id="selectedFilter" class="control">⭐ Chỉ hiện từ đã chọn</button></div>
<div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v1"></script><script src="auth-guard.js?v=20261006v1"></script>
<script>
const DATA_URL='data/grade1/english/vocabulary.json',SOURCES_URL='data/grade1/english/vocabulary-sources.json',KEY='grade1EnglishSelectedWords',META_KEY='grade1EnglishVocabMetaV1',IMG_KEY='grade1EnglishVocabImagesV2';let words=[],selected=new Set(),onlySelected=false,sourceFilter='';
const emojiHints={'one':'1️⃣','two':'2️⃣','three':'3️⃣','four':'4️⃣','five':'5️⃣','six':'6️⃣','seven':'7️⃣','eight':'8️⃣','nine':'9️⃣','ten':'🔟','red':'🔴','yellow':'🟡','green':'🟢','pink':'🩷','purple':'🟣','orange':'🟠','blue':'🔵','black':'⚫','white':'⚪','brown':'🟤','gray':'🩶','happy':'😊','sad':'😢','angry':'😠','hungry':'😋','thirsty':'🥤','sunny':'☀️','rainy':'🌧️','cloudy':'☁️','windy':'💨','stormy':'⛈️','hot':'🥵','cold':'🥶','cat':'🐱','dog':'🐶','hamster':'🐹','bird':'🐦','snake':'🐍','spider':'🕷️','tortoise':'🐢','fish':'🐟','mouse':'🐭','rabbit':'🐰','pet':'🐾','cow':'🐄','sheep':'🐑','donkey':'🫏','goat':'🐐','duck':'🦆','chicken':'🐔','lion':'🦁','deer':'🦌','elephant':'🐘','giraffe':'🦒','bat':'🦇','squirrel':'🐿️','chameleon':'🦎','doll':'🪆','ball':'⚽','robot':'🤖','boat':'⛵','scooter':'🛴','skateboard':'🛹','kite':'🪁','yoyo':'🪀','teddy':'🧸','cheese':'🧀','meat':'🥩','pasta':'🍝','eggs':'🥚','sandwiches':'🥪','bread':'🍞','milk':'🥛','juice':'🧃','rice':'🍚','apples':'🍎','bananas':'🍌','Santa':'🎅','elf':'🧝','snowman':'⛄','reindeer':'🦌','hat':'🧢','shorts':'🩳','sweater':'🧥','shirt':'👕','jacket':'🧥','skirt':'👗','trousers':'👖','T-shirt':'👕','shoes':'👟','socks':'🧦','glasses':'👓','picture':'🖼️','wardrobe':'🚪','bed':'🛏️','clock':'🕒','bookcase':'📚','plant':'🪴','television':'📺','table':'🪑','sofa':'🛋️','cushion':'🛏️','living room':'🛋️','bedroom':'🛏️','bathroom':'🛁','kitchen':'🍳','dining room':'🍽️','garden':'🌳','wings':'🪽','beak':'🐦','ears':'👂','tail':'🐈','eyes':'👀','head':'🙂','nose':'👃','mouth':'👄','arms':'💪','legs':'🦵','fly':'🪽','walk':'🚶','talk':'💬','climb':'🧗','jump':'🦘','swim':'🏊','play football':'⚽','play tennis':'🎾','run':'🏃','ride a horse':'🐴','ride a bike':'🚲','rollerblade':'🛼','old':'👴','young':'👶','tall':'📏','short':'📏','pretty':'😊','handsome':'🙂','family':'👨‍👩‍👧‍👦','baby':'👶','father':'👨','mother':'👩','parents':'👨‍👩‍👧','mum':'👩','dad':'👨','grandpa':'👴','grandma':'👵','sister':'👧','brother':'👦','twin':'👯','uncle':'👨','auntie':'👩','cousin':'🧒','can':'✅',"can't":'❌','football game':'⚽','glue':'🧴','stars':'⭐','counters':'🔢','paper':'📄','circle':'⚪','triangle':'🔺','rectangle':'▭','square':'⬜','oval':'🥚','farm':'🚜'};
const exactQueries={'old':'elderly person','young':'young child','tall':'tall person','short':'short person','pretty':'pretty girl portrait','handsome':'handsome boy portrait','family':'family with parents and children','parents':'parents with children','twin':'twin children','blond hair':'blond hair child','dark hair':'dark hair child','curly hair':'curly hair child','straight hair':'straight hair child','long hair':'long hair child','glasses':'child wearing glasses','picture':'framed picture on wall','wardrobe':'clothes wardrobe furniture','bookcase':'bookcase furniture','cushion':'cushion on sofa','living room':'living room interior','bedroom':'bedroom interior','bathroom':'bathroom interior','dining room':'dining room interior','garden':'home garden','wings':'bird wings','beak':'bird beak','tail':'animal tail','eyes':'human eyes','head':'human head','arms':'human arms','legs':'human legs','fly':'bird flying','walk':'person walking','talk':'child talking','climb':'person climbing','jump':'child jumping','swim':'child swimming','play football':'children playing football','play tennis':'children playing tennis','run':'child running','ride a horse':'child riding horse','ride a bike':'child riding bicycle','rollerblade':'child rollerblading','skipping rope':'child skipping rope','ride a bike':'child riding bicycle','can':'check mark symbol',"can't":'cross mark symbol','football game':'football game','counters':'math counters','farm':'farm animals','circle':'circle shape','triangle':'triangle shape','rectangle':'rectangle shape','square':'square shape','oval':'oval shape'};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function localSelected(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return new Set()}}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function hint(w){return emojiHints[w]||emojiHints[w.toLowerCase()]||'📘'}
async function getMeta(w){const c=read(META_KEY),k=w.toLowerCase();if(c[k])return c[k];try{const r=await fetch('https://dict.minhqnd.com/api/v1/lookup?word='+encodeURIComponent(w)+'&lang=en&def_lang=vi');if(!r.ok)throw Error();const d=await r.json(),en=(d.results||[]).find(x=>x.lang==='en'||x.lang_name==='English')||d.results?.[0];const out={meaning:(en?.meanings||[]).map(x=>x.definition).filter(Boolean).slice(0,2).join('; ')||w,ipa:en?.pronunciations?.[0]?.ipa||''};c[k]=out;write(META_KEY,c);return out}catch{return {meaning:w,ipa:''}}}
function queryFor(w){return exactQueries[w]||exactQueries[w.toLowerCase()]||w}
function scoreResult(x,w){const text=((x.title||'')+' '+(x.alt_text||'')+' '+(x.description||'')+' '+(x.tags||[]).map(t=>t.name||t).join(' ')).toLowerCase();const q=queryFor(w).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);let s=0;q.forEach(t=>{if(text.includes(t))s+=3});if(text.includes(w.toLowerCase()))s+=8;return s}
async function getImage(w){const c=read(IMG_KEY),k=w.toLowerCase();if(Object.prototype.hasOwnProperty.call(c,k))return c[k];if(['can',"can't"].includes(k)){c[k]='';write(IMG_KEY,c);return ''}try{const q=queryFor(w),url='https://api.openverse.org/v1/images/?q='+encodeURIComponent(q)+'&license=cc0,pdm&filter_dead=true&mature=false&page_size=20&page=1';const r=await fetch(url);if(!r.ok)throw Error();const d=await r.json(),best=(d.results||[]).map(x=>({x,s:scoreResult(x,w)})).sort((a,b)=>b.s-a.s)[0]?.x;const image=best?.thumbnail||best?.url||'';c[k]=image;write(IMG_KEY,c);return image}catch{c[k]='';write(IMG_KEY,c);return ''}}
function sourceOptions(sources){const s=document.getElementById('sourceFilter');s.innerHTML='<option value="">Tất cả nguồn</option>'+(sources||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('');s.value=sourceFilter}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const shown=words.filter(x=>(!q||x.word.toLowerCase().includes(q))&&(!sourceFilter||(x.sourceIds||[]).includes(sourceFilter))&&(!onlySelected||selected.has(x.word)));document.getElementById('count').textContent=`Hiển thị ${shown.length} / ${words.length} từ · Đã chọn ${selected.size}`;document.getElementById('list').innerHTML=shown.length?shown.map(x=>{const w=x.word;return `<article class="word-card" data-word-card="${esc(w)}"><div class="pic" data-image-for="${esc(w)}">${hint(w)}</div><div><div class="word">${esc(w)}</div><div class="meta loading" data-meta-for="${esc(w)}">Đang tải nghĩa · phiên âm…</div></div><div class="actions"><button class="speak" data-speak="${esc(w)}" aria-label="Phát âm">🔊</button><button class="star ${selected.has(w)?'selected':''}" data-word="${esc(w)}" aria-label="Chọn từ">★</button></div></article>`}).join(''):'<div class="empty">Không tìm thấy từ phù hợp.</div>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>toggle(b.dataset.word));hydrate()}
async function card(card){const w=card.dataset.wordCard;const [m,url]=await Promise.all([getMeta(w),getImage(w)]);const meta=card.querySelector('[data-meta-for]');if(meta){meta.textContent=m.meaning+(m.ipa?' · '+m.ipa:'');meta.classList.remove('loading')}const p=card.querySelector('[data-image-for]');if(p&&url)p.innerHTML=`<img src="${esc(url)}" alt="${esc(w)}" loading="lazy" referrerpolicy="no-referrer">`}
function hydrate(){if(!('IntersectionObserver'in window)){document.querySelectorAll('[data-word-card]').forEach(card);return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);card(e.target)}}),{rootMargin:'500px'});document.querySelectorAll('[data-word-card]').forEach(x=>io.observe(x))}
async function toggle(w){const n=new Set(selected);n.has(w)?n.delete(w):n.add(w);selected=n;localStorage.setItem(KEY,JSON.stringify([...n]));render();await sync(n)}
function status(t,bad=false){const e=document.getElementById('sync');e.textContent=t;e.style.color=bad?'#b42318':'#12a05c'}
async function sync(n){const sb=window.learningAuth;if(!sb)return;const before=window.__vocabServerSet||new Set(),add=[...n].filter(w=>!before.has(w)),remove=[...before].filter(w=>!n.has(w));status('Đang đồng bộ...');if(add.length){const r=await sb.from('vocabulary_selected_words').upsert(add.map(word=>({word})),{onConflict:'user_id,word'});if(r.error)return status(r.error.message,true)}if(remove.length){const r=await sb.from('vocabulary_selected_words').delete().in('word',remove);if(r.error)return status(r.error.message,true)}window.__vocabServerSet=new Set(n);status(`✓ Đã đồng bộ ${n.size} từ`)}
async function boot(){for(let i=0;i<80;i++){if(window.learningAuth&&window.learningUser)break;await new Promise(r=>setTimeout(r,250))}if(!window.learningAuth){status('Chưa đăng nhập · đang dùng thiết bị này');return}try{const sb=window.learningAuth,r=await sb.from('vocabulary_selected_words').select('word');if(r.error)throw r.error;const remote=new Set((r.data||[]).map(x=>x.word));selected=remote.size?remote:localSelected();localStorage.setItem(KEY,JSON.stringify([...selected]));window.__vocabServerSet=new Set(selected);render();status(`✓ Đã đồng bộ ${selected.size} từ`)}catch(e){status('Đồng bộ thất bại: '+e.message,true)}}
document.getElementById('search').oninput=render;document.getElementById('sourceFilter').onchange=e=>{sourceFilter=e.target.value;render()};document.getElementById('selectAll').onclick=async()=>{const q=document.getElementById('search').value.trim().toLowerCase(),visible=words.filter(x=>(!q||x.word.toLowerCase().includes(q))&&(!sourceFilter||(x.sourceIds||[]).includes(sourceFilter)));selected=new Set([...selected,...visible.map(x=>x.word)]);localStorage.setItem(KEY,JSON.stringify([...selected]));render();await sync(selected)};document.getElementById('clearAll').onclick=async()=>{selected=new Set();localStorage.setItem(KEY,'[]');render();await sync(selected)};document.getElementById('selectedFilter').onclick=()=>{onlySelected=!onlySelected;document.getElementById('selectedFilter').classList.toggle('active',onlySelected);render()};
Promise.all([fetch(DATA_URL,{cache:'no-store'}).then(r=>r.json()),fetch(SOURCES_URL,{cache:'no-store'}).then(r=>r.json())]).then(([d,s])=>{words=(d.words||[]).filter(x=>x&&x.word);sourceOptions(s.sources||[]);selected=localSelected();render();boot()}).catch(e=>status(e.message,true));
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script>
</body></html>
