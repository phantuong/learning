<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hình phẳng · Toán lớp 1</title><style>body{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#fff5fa;color:#29243b}.main{max-width:900px;margin:auto;padding:24px}.hero{text-align:center}.hero h1{font-size:36px;margin:8px}.hero p{color:#777487}.card{background:#fff;border:1px solid #f0dbe7;border-radius:24px;padding:22px;box-shadow:0 10px 28px #d84d9410}.setting{background:#fff9fc;border:1px solid #f0dbe7;border-radius:18px;padding:16px;margin-bottom:20px}.setting h3{margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice,.start,.again,.next,.ans{font-family:inherit;cursor:pointer}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:11px 6px;font-weight:800;color:#625c6c;min-height:62px}.choice.on{background:#ffe0ef;border-color:#ec5fa4;color:#c83b80}.start,.again,.next{width:100%;border:0;border-radius:16px;padding:15px;background:#ec5fa4;color:#fff;font-size:18px;font-weight:850}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;color:#777487;font-weight:750}.bar{height:8px;background:#f1e4eb;border-radius:99px;margin:10px 0 25px;overflow:hidden}.bar i{display:block;height:100%;background:#ec5fa4}.question{text-align:center;font-size:22px;font-weight:850;margin-bottom:16px}.visual{min-height:240px;display:flex;align-items:center;justify-content:center;background:#fffafd;border:1px solid #f4e2eb;border-radius:20px;margin-bottom:18px}.visual svg{width:min(650px,90%);height:235px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px;font-size:18px;font-weight:850;color:#514b5c}.ans.correct{background:#e9f9f0;border-color:#35b978;color:#087443}.ans.wrong{background:#fff0f2;border-color:#ee7180;color:#b4232e}.ans:disabled{cursor:default}.feedback{text-align:center;min-height:50px;padding:12px 0;font-weight:850;font-size:18px}.next{display:none}.next.show{display:block}.hint{margin-top:14px;background:#fff5fa;border-radius:15px;padding:12px;text-align:center;color:#756c78;font-size:13px}.result{text-align:center}.stars{font-size:46px}@media(max-width:760px){.main{padding:14px}.choices{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}}</style></head><body><main class="main"><header class="hero"><div style="font-size:46px">🔺🟦⭕💗</div><h1>Hình phẳng</h1><p>Nhận biết, đếm, chia và ghép các hình phẳng cơ bản</p></header><section class="card setup" id="setup"><div class="setting"><h3>🎯 Chọn mức luyện tập</h3><div class="choices" id="levels"></div></div><button class="start" id="startBtn">Bắt đầu luyện tập ✨</button><div class="hint">Mỗi bài gồm 10 câu. Nội dung tăng dần theo các kỹ năng hình học lớp 1.</div></section><section class="card quiz" id="quiz"></section></main><script src="app-nav.js"></script><script>const LEVELS=[['1','Nhận biết hình'],['2','Đếm hình'],['3','Đặc điểm hình'],['4','Chia hình'],['5','Ghép & đếm hình'],['6','Tổng hợp']];const NAME={circle:'hình tròn',triangle:'hình tam giác',square:'hình vuông',rectangle:'hình chữ nhật'},TYPES=Object.keys(NAME);let level=Number(localStorage.getItem('flatShapeLevel')||1),qs=[],pos=0,score=0,answered=false;const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),pick=()=>TYPES[rnd(4)],shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};function renderLevels(){$('levels').innerHTML='';LEVELS.forEach(([n,l])=>{let b=document.createElement('button');b.type='button';b.className='choice'+(+n===level?' on':'');b.innerHTML=`Mức ${n}<br><small>${l}</small>`;b.onclick=()=>{level=+n;localStorage.setItem('flatShapeLevel',level);renderLevels()};$('levels').appendChild(b)})}function shape(t,x,y,w,h,f='#ffd7e9',s='#ec5fa4'){if(t==='circle')return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${f}" stroke="${s}" stroke-width="4"/>`;if(t==='triangle')return `<polygon points="${x+w/2},${y+h*.08} ${x+w*.08},${y+h*.9} ${x+w*.92},${y+h*.9}" fill="${f}" stroke="${s}" stroke-width="4" stroke-linejoin="round"/>`;return `<rect x="${x+w*.08}" y="${y+h*.08}" width="${w*.84}" height="${h*.84}" rx="${t==='square'?5:2}" fill="${f}" stroke="${s}" stroke-width="4"/>`}function one(t,r=0){return `<svg viewBox="0 0 260 190"><g transform="rotate(${r} 130 95)">${shape(t,50,20,160,150)}</g></svg>`}function identify(){let t=pick();return{prompt:'Đây là hình gì?',visual:one(t,[-15,0,12,25][rnd(4)]),answer:NAME[t],opts:shuffle([NAME[t],...TYPES.filter(x=>x!==t).map(x=>NAME[x])])}}function count(){let w=pick(),a=[],n=3+rnd(4);for(let i=0;i<n;i++)a.push(w);for(let i=0;i<3+rnd(3);i++)a.push(TYPES.filter(x=>x!==w)[rnd(3)]);shuffle(a);let s='<svg viewBox="0 0 700 280">';a.forEach((t,i)=>s+=shape(t,25+(i%5)*135,30+Math.floor(i/5)*110,75,75,t===w?'#ffd7e9':'#e7efff',t===w?'#ec5fa4':'#7187bf'));s+='</svg>';let k=a.filter(x=>x===w).length;return{prompt:`Có bao nhiêu ${NAME[w]} trong hình?`,visual:s,answer:String(k),opts:shuffle([k,Math.max(1,k-1),k+1,k+2].map(String))}}function overlap(){let t=pick(),s='<svg viewBox="0 0 520 240">';for(let i=0;i<4;i++)s+=shape(t,90+i*65,55+(i%2)*35,120,100,t==='circle'?'#ffd7e9':'#e7efff',t==='circle'?'#ec5fa4':'#7187bf');s+='</svg>';return{prompt:`Có bao nhiêu ${NAME[t]}?`,visual:s,answer:'4',opts:['2','3','4','5']}}function property(){let t=pick();if(t==='circle')return{prompt:'Hình tròn có bao nhiêu góc?',visual:one(t),answer:'0',opts:['0','1','2','4']};if(t==='triangle')return{prompt:'Hình tam giác có bao nhiêu cạnh?',visual:one(t),answer:'3',opts:['2','3','4','5']};if(t==='square')return{prompt:'Hình vuông có bao nhiêu cạnh bằng nhau?',visual:one(t),answer:'4',opts:['2','3','4','5']};return{prompt:'Hình chữ nhật có bao nhiêu góc?',visual:one(t),answer:'4',opts:['2','3','4','5']}}function partition(){let q=Math.random()<.5,c=Math.random()<.5,s='<svg viewBox="0 0 320 210">';if(c){s+=`<circle cx="160" cy="105" r="75" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/>`;s+=q?`<path d="M160 30V180M85 105H235" stroke="#7187bf" stroke-width="4"/>`:`<path d="M160 30V180" stroke="#7187bf" stroke-width="4"/>`}else{s+=`<rect x="75" y="35" width="170" height="140" fill="#e7efff" stroke="#7187bf" stroke-width="4"/>`;s+=q?`<path d="M160 35V175M75 105H245" stroke="#ec5fa4" stroke-width="4"/>`:`<path d="M160 35V175" stroke="#ec5fa4" stroke-width="4"/>`}s+='</svg>';return{prompt:`Hình được chia thành ${q?'mấy phần bằng nhau':'mấy phần'}?`,visual:s,answer:q?'4':'2',opts:q?['2','3','4','5']:['1','2','3','4']}}function rectCount(){return{prompt:'Có tất cả bao nhiêu hình chữ nhật trong hình?',visual:`<svg viewBox="0 0 360 220"><rect x="55" y="45" width="250" height="130" fill="#e7efff" stroke="#7187bf" stroke-width="4"/><path d="M180 45V175" stroke="#ec5fa4" stroke-width="4"/></svg>`,answer:'3',opts:['1','2','3','4']}}function squareCount(){return{prompt:'Có tất cả bao nhiêu hình vuông trong hình?',visual:`<svg viewBox="0 0 360 220"><rect x="70" y="15" width="220" height="190" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><path d="M180 15V205M70 110H290" stroke="#7187bf" stroke-width="4"/></svg>`,answer:'5',opts:['3','4','5','6']}}function compose(){return{prompt:'Hai hình tam giác có thể ghép thành hình gì?',visual:`<svg viewBox="0 0 360 220"><polygon points="80,170 180,40 180,170" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><polygon points="180,40 280,170 180,170" fill="#e7efff" stroke="#7187bf" stroke-width="4"/></svg>`,answer:'hình vuông',opts:shuffle(['hình vuông','hình tròn','hình tam giác','hình chữ nhật'])}}function make(){if(level===1)return identify();if(level===2)return rnd(4)?count():overlap();if(level===3)return property();if(level===4)return partition();if(level===5)return rnd(2)?squareCount():rectCount();let all=[identify,count,property,partition,rectCount,squareCount,compose,overlap];return all[rnd(all.length)]()}function build(){qs=Array.from({length:10},make);pos=0;score=0}function render(){let q=qs[pos];answered=false;$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div><div class="visual">${q.visual}</div><div class="answers">${q.opts.map((o,i)=>`<button type="button" class="ans" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button type="button" class="next" id="next">Tiếp theo →</button>`;$('quiz').querySelectorAll('.ans').forEach((b,i)=>b.onclick=()=>answer(b,q.opts[i]));$('next').onclick=nextQuestion}function answer(btn,v){if(answered)return;answered=true;let q=qs[pos],ok=v===q.answer;$('quiz').querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});btn.classList.add(ok?'correct':'wrong');if(ok){score++;$('fb').textContent='🎉 Chính xác!';$('fb').style.color='#087443'}else{$('fb').textContent=`💪 Chưa đúng. Đáp án: ${q.answer}`;$('fb').style.color='#b4232e'}$('next').classList.add('show')}function nextQuestion(){pos<9?(pos++,render()):showResult()}function startQuiz(){build();$('setup').classList.add('hide');$('quiz').classList.add('show');render();scrollTo(0,0)}function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=9?'🌟🌟🌟':score>=7?'🌟🌟':'🌟'}</div><h2>Hoàn thành!</h2><p>Bé trả lời đúng <b>${score}/10</b> câu.</p><button type="button" class="again" id="again">Luyện lại ✨</button></div>`;$('again').onclick=startQuiz}$('startBtn').onclick=startQuiz;renderLevels();</script></body></html>
