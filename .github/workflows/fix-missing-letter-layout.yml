name: Fix missing-letter layout

on:
  push:
    paths:
      - '.github/workflows/fix-missing-letter-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep missing-letter position stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".target{font-size:34px;font-weight:800;letter-spacing:.08em;margin:12px 0 20px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}"
          new_css = ".target{font-size:34px;font-weight:800;letter-spacing:0;margin:12px 0 20px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.target-char{display:inline-flex;align-items:center;justify-content:center;width:.82em;min-width:.82em;height:1.15em;line-height:1}.target-char.space{width:.42em;min-width:.42em}.target-char.missing{color:transparent;border-bottom:3px solid #b9c4e8;border-radius:2px}.target-char.correct{color:#16a34a;font-weight:900}"
          if old_css not in s:
              raise SystemExit('Expected target CSS was not found; no changes made.')
          s = s.replace(old_css, new_css, 1)

          old_missing = "$('target').textContent=letters.map((c,i)=>i===state.missingIndex?'_':c).join(' ');let options=[letters[state.missingIndex].toLowerCase()];"
          new_missing = "$('target').innerHTML=letters.map((c,i)=>{const cls=c===' '?'target-char space':'target-char'+(i===state.missingIndex?' missing':'');return '<span class=\"'+cls+'\" data-index=\"'+i+'\">'+(i===state.missingIndex?'&nbsp;':c)+'</span>'}).join('');let options=[letters[state.missingIndex].toLowerCase()];"
          if old_missing not in s:
              raise SystemExit('Expected renderMissing markup was not found; no changes made.')
          s = s.replace(old_missing, new_missing, 1)

          old_choose = "$('target').textContent=word;$('choices').innerHTML='';$('nextBtn').classList.remove('hidden')}else"
          new_choose = "const slot=document.querySelector('#target .target-char[data-index=\\\"'+state.missingIndex+'\\\"]');if(slot){slot.textContent=word[state.missingIndex];slot.classList.remove('missing');slot.classList.add('correct')}$('choices').innerHTML='';$('nextBtn').classList.remove('hidden')}else"
          if old_choose not in s:
              raise SystemExit('Expected chooseMissing success handler was not found; no changes made.')
          s = s.replace(old_choose, new_choose, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-missing-letter-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english.html .github/workflows/fix-missing-letter-layout.yml
          git commit -m 'Fix missing letter layout stability'
          git push
