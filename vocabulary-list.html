.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--navy);font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;letter-spacing:.08em;padding:0 10px 7px}.nav{display:grid;gap:4px}.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;color:#475467;font-weight:700;cursor:pointer}.grade-toggle.active{background:#eef2ff;color:var(--navy)}.icon{width:24px;text-align:center;font-size:18px}.chev{margin-left:auto;color:#98a2b3}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid var(--line)}.subnav.open{display:grid;gap:3px}.subnav a{display:block;text-decoration:none;color:#667085;font-weight:650;font-size:14px;padding:8px 9px;border-radius:9px}.subnav a:hover{background:#f8faff}.subnav a.active{background:var(--navy);color:#fff}.course-list{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-size:13px;font-weight:700}.course-list a.active{background:#f0f3ff;color:var(--navy)}

<header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1 · Chọn những từ bé cần học</p></header>

<script>
const VOCAB_URL='data/grade1/english/vocabulary.json';
const SELECTED_KEY='grade1EnglishSelectedWords';
const data={
"stand up":["/stænd ʌp/","đứng lên","🙋"],"sit down":["/sɪt daʊn/","ngồi xuống","🪑"],"open":["/ˈoʊpən/","mở","📖"],"look":["/lʊk/","nhìn","👀"],"listen":["/ˈlɪsən/","lắng nghe","👂"],"happy":["/ˈhæpi/","vui, hạnh phúc","😊"],"sad":["/sæd/","buồn","😢"],"angry":["/ˈæŋɡri/","tức giận","😠"],"hungry":["/ˈhʌŋɡri/","đói","😋"],"tired":["/ˈtaɪərd/","mệt","😴"],"scared":["/skerd/","sợ hãi","😨"],"sunny":["/ˈsʌni/","có nắng","☀️"],"rainy":["/ˈreɪni/","có mưa","🌧️"],"cloudy":["/ˈklaʊdi/","nhiều mây","☁️"],"windy":["/ˈwɪndi/","nhiều gió","💨"],"stormy":["/ˈstɔrmi/","có bão","⛈️"],"hot":["/hɑt/","nóng","🥵"],"cold":["/koʊld/","lạnh","🥶"],"monday":["/ˈmʌndeɪ/","thứ Hai","📅"],"tuesday":["/ˈtuːzdeɪ/","thứ Ba","📅"],"wednesday":["/ˈwenzdeɪ/","thứ Tư","📅"],"thursday":["/ˈθɜrzdeɪ/","thứ Năm","📅"],"friday":["/ˈfraɪdeɪ/","thứ Sáu","📅"],"saturday":["/ˈsætərdeɪ/","thứ Bảy","📅"],"sunday":["/ˈsʌndeɪ/","Chủ nhật","📅"],"one":["/wʌn/","một","1️⃣"],"two":["/tuː/","hai","2️⃣"],"three":["/θriː/","ba","3️⃣"],"four":["/fɔr/","bốn","4️⃣"],"five":["/faɪv/","năm","5️⃣"],"six":["/sɪks/","sáu","6️⃣"],"seven":["/ˈsevən/","bảy","7️⃣"],"eight":["/eɪt/","tám","8️⃣"],"nine":["/naɪn/","chín","9️⃣"],"ten":["/ten/","mười","🔟"],"window":["/ˈwɪndoʊ/","cửa sổ","🪟"],"door":["/dɔr/","cửa ra vào","🚪"],"chair":["/tʃer/","ghế","🪑"],"desk":["/desk/","bàn học","🖥️"],"bin":["/bɪn/","thùng rác","🗑️"],"poster":["/ˈpoʊstər/","áp phích, tranh treo tường","🖼️"],"board":["/bɔrd/","bảng","📋"],"bag":["/bæɡ/","cặp, túi","🎒"],"book":["/bʊk/","sách","📚"],"cupboard":["/ˈkʌbərd/","tủ đựng đồ","🗄️"],"ruler":["/ˈruːlər/","thước kẻ","📏"],"rubber":["/ˈrʌbər/","cục tẩy","🧽"],"pencil sharpener":["/ˈpensəl ˌʃɑrpənər/","gọt bút chì","🔧"],"pencil case":["/ˈpensəl keɪs/","hộp bút","🖍️"],"pen":["/pen/","bút mực","🖊️"],"pencil":["/ˈpensəl/","bút chì","✏️"],"red":["/red/","đỏ","#ef4444"],"yellow":["/ˈjeloʊ/","vàng","#facc15"],"green":["/ɡriːn/","xanh lá cây","#22c55e"],"pink":["/pɪŋk/","hồng","#ec4899"],"purple":["/ˈpɜrpəl/","tím","#a855f7"],"orange":["/ˈɔrɪndʒ/","cam","#f97316"],"blue":["/bluː/","xanh dương","#3b82f6"],"black":["/blæk/","đen","#111827"],"white":["/waɪt/","trắng","#ffffff"],"brown":["/braʊn/","nâu","#92400e"],"gray":["/ɡreɪ/","xám","#9ca3af"],"mum":["/mʌm/","mẹ","👩"],"dad":["/dæd/","bố","👨"],"grandpa":["/ˈɡrænˌpɑ/","ông","👴"],"grandma":["/ˈɡrænˌmɑ/","bà","👵"],"sister":["/ˈsɪstər/","chị/em gái","👧"],"brother":["/ˈbrʌðər/","anh/em trai","👦"],"twin":["/twɪn/","anh/chị/em sinh đôi","👯"],"uncle":["/ˈʌŋkəl/","chú, bác, cậu","🧔"],"auntie":["/ˈænti/","cô, dì, thím, mợ","👩"],"cousin":["/ˈkʌzən/","anh/chị/em họ","🧒"],"father":["/ˈfɑðər/","cha, bố","👨"],"mother":["/ˈmʌðər/","mẹ","👩"],"parents":["/ˈperənts/","bố mẹ","👨‍👩‍👧"],"old":["/oʊld/","già, lớn tuổi","👴"],"young":["/jʌŋ/","trẻ, trẻ tuổi","🧒"],"tall":["/tɔl/","cao","🧍"],"short":["/ʃɔrt/","thấp, ngắn","🧍‍♀️"],"pretty":["/ˈprɪti/","xinh đẹp","🌸"],"handsome":["/ˈhænsəm/","đẹp trai","😊"],"he":["/hiː/","anh ấy, cậu ấy","👦"],"she":["/ʃiː/","cô ấy, bạn ấy","👧"],"this":["/ðɪs/","cái này, đây","👉"],"is":["/ɪz/","là, thì, ở","🔗"],"my":["/maɪ/","của tôi","💗"],"what":["/wʌt/","cái gì, gì","❓"],"who":["/huː/","ai","🕵️"],"lion":["/ˈlaɪən/","sư tử","🦁"],"duck":["/dʌk/","con vịt","🦆"],"deer":["/dɪr/","con hươu","🦌"],"family":["/ˈfæməli/","gia đình","👨‍👩‍👧‍👦"],"baby":["/ˈbeɪbi/","em bé","👶"],"doll":["/dɑl/","búp bê","🪆"],"skipping rope":["/ˈskɪpɪŋ roʊp/","dây nhảy","🪢"],"ball":["/bɔl/","quả bóng","⚽"],"robot":["/ˈroʊbɑt/","rô-bốt","🤖"],"boat":["/boʊt/","thuyền","⛵"],"scooter":["/ˈskuːtər/","xe trượt scooter","🛴"],"skateboard":["/ˈskeɪtˌbɔrd/","ván trượt","🛹"],"kite":["/kaɪt/","diều","🪁"],"yoyo":["/ˈjoʊjoʊ/","yo-yo","🪀"],"teddy":["/ˈtedi/","gấu bông","🧸"]};
let words=[];let selected=new Set();let showSelectedOnly=false;const $=id=>document.getElementById(id);
function toggleNav(){$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')}
function renderNav(){const nav=$('gradeNav');nav.innerHTML=Array.from({length:12},(_,i)=>{const g=i+1,open=g===1;return '<div><div class="grade-toggle '+(open?'active':'')+'" onclick="toggleGrade('+g+')"><span class="icon">'+(open?'📂':'📁')+'</span><span>Lớp '+g+'</span><span class="chev">'+(open?'⌃':'›')+'</span></div><div id="sub-'+g+'" class="subnav '+(open?'open':'')+'"><a href="class.html?grade='+g+'">🏫 Tổng quan</a>'+(g===1?'<a href="english.html">🔤🌈 Tiếng Anh</a><div class="course-list"><a href="english.html">↳ Vocabulary Games</a><a class="active" href="vocabulary-list.html">↳ Vocabulary List</a></div><a href="class.html?grade=1#math">➗ Toán tư duy</a><a href="#">📖 Tiếng Việt</a>':'<a href="class.html?grade='+g+'">📚 Môn học</a>')+'</div></div>'}).join('')}
function toggleGrade(g){document.getElementById('sub-'+g)?.classList.toggle('open')}
function loadSelection(){try{const raw=localStorage.getItem(SELECTED_KEY);if(raw===null){selected=new Set(words);saveSelection()}else{const saved=JSON.parse(raw);selected=new Set(Array.isArray(saved)?saved.filter(w=>words.includes(w)):[]);saveSelection()}}catch(e){selected=new Set(words);saveSelection()}}
function saveSelection(){localStorage.setItem(SELECTED_KEY,JSON.stringify([...selected]))}
function toggleWord(word){if(selected.has(word))selected.delete(word);else selected.add(word);saveSelection();render()}
function setAll(on){selected=on?new Set(words):new Set();saveSelection();render()}
function render(){const q=$('search').value.trim().toLowerCase();let filtered=words.filter(w=>w.includes(q));if(showSelectedOnly)filtered=filtered.filter(w=>selected.has(w));$('count').textContent=selected.size+' / '+words.length+' từ được chọn · '+filtered.length+' đang hiển thị';$('hint').innerHTML=showSelectedOnly?'Đang lọc: chỉ hiển thị các từ đã ⭐ chọn.':'⭐ = từ sẽ xuất hiện trong Vocabulary Games.';$('selectedFilter').classList.toggle('active',showSelectedOnly);const allSelected=words.length>0&&selected.size===words.length;const noneSelected=selected.size===0;$('selectAll').classList.toggle('primary',allSelected);$('clearAll').classList.toggle('primary',noneSelected);$('list').innerHTML=filtered.length?filtered.map(w=>{const d=data[w];const pic=d[2].startsWith('#')?'<div class="pic color" style="background:'+d[2]+'"></div>':'<div class="pic">'+d[2]+'</div>';const on=selected.has(w);return '<article class="word-card">'+pic+'<div><div class="word">'+w+'</div><div class="ipa">'+d[0]+'</div><div class="meaning">'+d[1]+'</div></div><div class="actions"><button type="button" class="speak" data-speak="'+esc(w)+'" aria-label="Nghe phát âm">🔊</button><button type="button" class="star '+(on?'selected':'')+'" data-star="'+esc(w)+'" aria-pressed="'+on+'" aria-label="'+(on?'Bỏ chọn ':'Chọn ')+esc(w)+'">'+(on?'★':'☆')+'</button></div></article>'}).join(''):'<div class="empty">'+(showSelectedOnly?'Chưa có từ nào được chọn. ⭐':'Không tìm thấy từ này 🌸')+'</div>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function speak(word){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;window.speechSynthesis.speak(u)}
$('list').addEventListener('click',e=>{const star=e.target.closest('[data-star]');if(star){e.preventDefault();e.stopPropagation();toggleWord(star.dataset.star);return}const speakBtn=e.target.closest('[data-speak]');if(speakBtn){e.preventDefault();e.stopPropagation();speak(speakBtn.dataset.speak)}});
$('search').addEventListener('input',render);$('selectAll').onclick=()=>setAll(true);$('clearAll').onclick=()=>setAll(false);$('selectedFilter').onclick=()=>{showSelectedOnly=!showSelectedOnly;render()};renderNav();
async function load(){try{const r=await fetch(VOCAB_URL,{cache:'no-store'});if(!r.ok)throw new Error('Không tải được vocabulary.json');const j=await r.json();words=[...new Set((j.words||[]).map(x=>String(typeof x==='string'?x:x.word||'').trim().toLowerCase()).filter(w=>data[w]))];loadSelection();render();localStorage.setItem('learningLastAccess',JSON.stringify({href:'vocabulary-list.html',title:'Vocabulary List',grade:1,subject:'english',course:'vocabulary-list',time:Date.now()}))}catch(e){$('count').textContent='Không tải được danh sách từ vựng';$('list').innerHTML='<div class="empty">'+e.message+'</div>'}}
load();
</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-v2.js?v=20261005"></script></body></html>
