<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hình phẳng · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#f0dbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff 0 16%,transparent 36%),#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.sub{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open{display:grid;gap:3px}.sub a{font-size:14px;padding:8px 9px;border-radius:9px}.courses{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a{font-size:13px}.main{margin-left:260px;padding:18px 20px 40px;min-height:100vh}.wrap{max-width:920px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012;cursor:pointer}.overlay{display:none}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:48px;letter-spacing:3px}.hero h1{font-size:36px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 12px 32px #d84d9410}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:20px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:15px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;min-height:72px;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:var(--pink)}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80;box-shadow:0 5px 12px #ec5fa422}.choice small{font-size:11px;font-weight:700;color:#777487}.start,.again,.next{width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(135deg,#ed62a8,#df4f98);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px #ec5fa444}.start:hover,.again:hover,.next:hover{transform:translateY(-1px)}.tip{margin-top:15px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800}.bar{height:9px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 24px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff80bb,#ec5fa4);transition:.25s}.question{text-align:center;font-size:24px;font-weight:950;color:#443d50;margin:4px auto 17px;max-width:760px}.visual{min-height:285px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffafd,#fff7fb);border:1px solid #f4dce8;border-radius:22px;margin-bottom:18px;overflow:hidden;position:relative}.visual:before,.visual:after{position:absolute;font-size:23px;opacity:.65}.visual:before{content:'✦';left:18px;top:14px;color:#ffb6d5}.visual:after{content:'✿';right:18px;bottom:12px;color:#ffd35c}.visual svg{width:min(760px,96%);height:260px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px;font-size:18px;font-weight:900;color:#514b5c;cursor:pointer;transition:.12s}.ans:hover{border-color:var(--pink);transform:translateY(-1px)}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.ans:disabled{cursor:default}.feedback{text-align:center;min-height:58px;padding:14px 0 8px;font-weight:900;font-size:18px}.next{display:none}.next.show{display:block}.result{text-align:center}.stars{font-size:50px}.result h2{font-size:30px;margin:8px}.result p{color:var(--muted);font-size:17px}.badge{display:inline-block;background:#fff0f7;color:#c83b80;padding:8px 14px;border-radius:99px;font-weight:900;margin-bottom:10px}.tiny{font-size:17px;font-weight:800;fill:#6c6472}.tile{filter:drop-shadow(0 4px 3px #5d3b4a18)}@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#2b203855;z-index:15}.main{margin:0;padding:10px 12px 30px}.mobile{display:block}.card{padding:17px;border-radius:23px}.hero h1{font-size:30px}.hero .emoji{font-size:40px}.choices{grid-template-columns:repeat(2,1fr)}.question{font-size:21px}.answers{grid-template-columns:repeat(2,1fr)}.ans{padding:14px 5px}.visual{min-height:235px}.visual svg{height:220px}}
</style></head>
<body>
<aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside><div id="overlay" class="overlay"></div>
<main class="main"><button id="mobileNav" class="mobile" type="button">☰</button><div class="wrap"><header class="hero"><div class="emoji">🔺 🟦 ⭕ 💗</div><h1>Hình phẳng</h1><p>Khám phá hình học qua những câu đố nhiều màu sắc 🌈</p></header>
<section class="card setup" id="setup"><div class="setting"><h3>🎯 Chọn level</h3><div class="choices" id="levels"></div></div><button class="start" id="startBtn" type="button">Bắt đầu luyện tập ✨</button><div class="tip">Mỗi bài gồm 10 câu. Mỗi câu được <b>kiểm tra trước khi hiển thị</b> để tránh đáp án sai.</div></section>
<section class="card quiz" id="quiz"></section></div></main>
<script src="app-nav.js"></script>
<script>
(function(){
'use strict';
const LEVELS=[['1','Nhận biết hình','🔎'],['2','Hình quanh bé','🏠'],['3','Đoán theo đặc điểm','🧠'],['4','Đúng hay sai','🤔'],['5','Ghép hình','🧩'],['6','Chia hình','✂️'],['7','Đếm hình thông minh','🔢'],['8','Mảnh ghép còn thiếu','🧱'],['9','Hình mở & kín','🔓'],['10','Thử thách tổng hợp','🌟']];
const NAME={circle:'hình tròn',triangle:'hình tam giác',square:'hình vuông',rectangle:'hình chữ nhật'};
const TYPES=Object.keys(NAME);
const COLORS={circle:['#ffd9ec','#ec5fa4'],triangle:['#ffe6a8','#e3a72f'],square:['#dce8ff','#6d88c7'],rectangle:['#d9f5e5','#35a874']};
let level=1,questions=[],index=0,score=0,answered=false;
try{level=Math.min(10,Math.max(1,Number(localStorage.getItem('flatShapeLevel')||1)));}catch(e){}
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=()=>TYPES[rnd(TYPES.length)];
function toggleNav(){ $('side').classList.toggle('open');$('overlay').classList.toggle('show'); }
$('mobileNav').addEventListener('click',toggleNav);$('overlay').addEventListener('click',toggleNav);
function renderLevels(){const host=$('levels');host.innerHTML='';LEVELS.forEach(([n,label,icon])=>{const b=document.createElement('button');b.type='button';b.className='choice'+(+n===level?' on':'');b.innerHTML=`<span style="font-size:20px">${icon}</span> Level ${n}<br><small>${label}</small>`;b.addEventListener('click',()=>{level=+n;try{localStorage.setItem('flatShapeLevel',level);}catch(e){}renderLevels();});host.appendChild(b);});}
function svg(content,view='0 0 720 300'){return `<svg viewBox="${view}" role="img">${content}</svg>`;}
function shape(t,x,y,w,h,extra=''){const c=COLORS[t];if(t==='circle')return `<circle class="tile" cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${c[0]}" stroke="${c[1]}" stroke-width="4" ${extra}/>`;if(t==='triangle')return `<polygon class="tile" points="${x+w/2},${y+h*.08} ${x+w*.08},${y+h*.9} ${x+w*.92},${y+h*.9}" fill="${c[0]}" stroke="${c[1]}" stroke-width="4" stroke-linejoin="round" ${extra}/>`;if(t==='square'){const s=Math.min(w,h),ox=x+(w-s)/2,oy=y+(h-s)/2;return `<rect class="tile" x="${ox+s*.08}" y="${oy+s*.08}" width="${s*.84}" height="${s*.84}" rx="7" fill="${c[0]}" stroke="${c[1]}" stroke-width="4" ${extra}/>`;}return `<rect class="tile" x="${x+w*.08}" y="${y+h*.08}" width="${w*.84}" height="${h*.84}" rx="3" fill="${c[0]}" stroke="${c[1]}" stroke-width="4" ${extra}/>`;}
function decor(){return `<text x="30" y="55" font-size="34">😊</text><text x="645" y="260" font-size="34">⭐</text><text x="335" y="35" font-size="25">✨</text>`;}
function single(t,rot=0){return svg(`${decor()}<g transform="rotate(${rot} 360 150)">${shape(t,t==='rectangle'?245:270,45,t==='rectangle'?230:180,t==='rectangle'?150:180)}</g>`);}
function opts(answer,others){return shuffle([String(answer),...others.map(String).filter(x=>x!==String(answer))]).slice(0,4);}
function q1(){const t=pick(),rot=[-18,-8,0,10,18][rnd(5)];return{prompt:'🔎 Đây là hình gì?',visual:single(t,rot),answer:NAME[t],options:shuffle([NAME[t],...TYPES.filter(x=>x!==t).map(x=>NAME[x])]),meta:{kind:'identify',type:t}};}
function q2(){const target=pick(),n=2+rnd(3),items=shuffle(Array(n).fill(target).concat(Array.from({length:4},()=>TYPES.filter(x=>x!==target)[rnd(3)])));let s=`<rect x="0" y="240" width="720" height="60" fill="#b9e7bd"/><circle cx="60" cy="55" r="27" fill="#ffd35c"/>`;items.forEach((t,i)=>{const x=65+(i%5)*130,y=70+Math.floor(i/5)*115;s+=shape(t,x,y,78,78);});return{prompt:`🏠 Có bao nhiêu ${NAME[target]} trong bức tranh?`,visual:svg(s),answer:String(n),options:opts(n,[n-1,n+1,n+2].filter(x=>x>0)),meta:{kind:'count',count:n}};}
function q3(){const t=pick();const prompts={circle:'Hình nào không có cạnh thẳng và không có góc?',triangle:'Hình nào có đúng 3 cạnh và 3 góc?',square:'Hình nào có 4 cạnh bằng nhau?',rectangle:'Hình nào có 4 cạnh, với hai cạnh dài và hai cạnh ngắn?'};return{prompt:'🧠 '+prompts[t],visual:svg(`${decor()}${TYPES.map((x,i)=>shape(x,38+i*170,95,110,110)).join('')}${TYPES.map((x,i)=>`<text x="${93+i*170}" y="245" text-anchor="middle" class="tiny">${'ABCD'[i]}</text>`).join('')}`),answer:NAME[t],options:shuffle(TYPES.map(x=>NAME[x])),meta:{kind:'property',type:t}};}
function q4(){const t=pick(),truth=Math.random()<.5;let statement;if(t==='square')statement=truth?'Một hình vuông luôn có 4 cạnh bằng nhau.':'Một hình vuông chỉ có 3 cạnh.';else if(t==='rectangle')statement=truth?'Hình chữ nhật có 4 cạnh.':'Hình chữ nhật không có góc.';else if(t==='triangle')statement=truth?'Xoay một hình tam giác thì nó vẫn là hình tam giác.':'Một hình tam giác có 4 góc.';else statement=truth?'Hình tròn không có góc.':'Hình tròn có 4 cạnh thẳng.';return{prompt:`🤔 ${statement}`,visual:single(t,truth?12:-12),answer:truth?'Đúng':'Sai',options:['Đúng','Sai'],meta:{kind:'boolean'}};}
function q5(){const type=rnd(3);if(type===0)return{prompt:'🧩 Hai hình tam giác bằng nhau ghép cạnh đáy sẽ tạo thành hình gì?',visual:svg(`${shape('triangle',145,55,180,180)}${shape('triangle',325,55,180,180,'')}`),answer:'hình vuông',options:['hình vuông','hình tròn','hình tam giác','hình chữ nhật'],meta:{kind:'compose'}};if(type===1)return{prompt:'🧩 Hai hình vuông giống nhau đặt cạnh nhau tạo thành hình gì?',visual:svg(`${shape('square',145,70,150,150)}${shape('square',295,70,150,150)}`),answer:'hình chữ nhật',options:['hình tròn','hình tam giác','hình vuông','hình chữ nhật'],meta:{kind:'compose'}};return{prompt:'🧩 Hai hình chữ nhật giống nhau đặt cạnh nhau theo chiều dài tạo thành hình gì?',visual:svg(`${shape('rectangle',125,80,220,110)}${shape('rectangle',345,80,220,110)}`),answer:'hình chữ nhật',options:['hình tròn','hình tam giác','hình vuông','hình chữ nhật'],meta:{kind:'compose'}};}
function q6(){const parts=[2,4][rnd(2)];const kind=rnd(2)?'rectangle':'circle';let content='';if(kind==='circle'){content=`<circle cx="360" cy="150" r="105" fill="#ffd9ec" stroke="#ec5fa4" stroke-width="4"/><path d="M360 45V255M255 150H465" stroke="#ec5fa4" stroke-width="4"/>`;if(parts===2)content=`<circle cx="360" cy="150" r="105" fill="#ffd9ec" stroke="#ec5fa4" stroke-width="4"/><path d="M360 45V255" stroke="#ec5fa4" stroke-width="4"/>`;}else{content=`<rect x="240" y="55" width="240" height="190" rx="5" fill="#d9f5e5" stroke="#35a874" stroke-width="4"/><path d="M360 55V245M240 150H480" stroke="#35a874" stroke-width="4"/>`;if(parts===2)content=`<rect x="240" y="55" width="240" height="190" rx="5" fill="#d9f5e5" stroke="#35a874" stroke-width="4"/><path d="M360 55V245" stroke="#35a874" stroke-width="4"/>`;}return{prompt:`✂️ Hình này được chia thành bao nhiêu phần?`,visual:svg(content),answer:String(parts),options:parts===2?['2','3','4','5']:['2','3','4','6'],meta:{kind:'parts',count:parts}};}
function q7(){const cols=2+rnd(2),rows=2;let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<rect x="${180+c*100}" y="${55+r*100}" width="100" height="100" fill="#dce8ff" stroke="#6d88c7" stroke-width="4"/>`;const squares=rows*cols+(cols-1);return{prompt:`🔢 Có bao nhiêu hình vuông trong lưới này, tính cả hình vuông lớn tạo bởi các ô nhỏ?`,visual:svg(s),answer:String(squares),options:opts(squares,[squares-1,squares+1,squares+2]),meta:{kind:'grid',count:squares}};}
function q8(){const missing=TYPES[rnd(4)];const cells=[missing,...TYPES.filter(x=>x!==missing).slice(0,3)];let s='';cells.forEach((t,i)=>{const x=225+(i%2)*135,y=55+Math.floor(i/2)*105;s+=shape(t,x,y,95,95);});s+='<rect x="360" y="160" width="95" height="95" fill="#fff" stroke="#ec5fa4" stroke-width="4" stroke-dasharray="8 6"/><text x="407" y="220" text-anchor="middle" font-size="28">?</text>';return{prompt:'🧱 Mảnh ghép nào còn thiếu để hoàn thành bộ 4 hình?',visual:svg(s),answer:NAME[missing],options:shuffle(TYPES.map(x=>NAME[x])),meta:{kind:'missing',type:missing}};}
function q9(){const closed=Math.random()<.5;const content=closed?`<rect x="250" y="70" width="220" height="150" fill="#dce8ff" stroke="#6d88c7" stroke-width="8"/>`:`<path d="M250 70H470V220" fill="none" stroke="#6d88c7" stroke-width="8" stroke-linecap="round"/>`;return{prompt:`🔓 Hình này là hình ${closed?'kín':'mở'}?`,visual:svg(content),answer:closed?'Hình kín':'Hình mở',options:['Hình kín','Hình mở'],meta:{kind:'openClosed'}};}
function makeQuestion(l){if(l===1)return q1();if(l===2)return q2();if(l===3)return q3();if(l===4)return q4();if(l===5)return q5();if(l===6)return q6();if(l===7)return q7();if(l===8)return q8();if(l===9)return q9();return [q1,q2,q3,q4,q5,q6,q7,q8,q9][rnd(9)]();}
function verify(q){if(!q||!q.prompt||!q.visual||!q.answer||!Array.isArray(q.options))return false;const a=String(q.answer);const os=q.options.map(String);if(os.length!==4&&!(os.length===2&&q.meta&&q.meta.kind==='boolean'))return false;if(new Set(os).size!==os.length||!os.includes(a))return false;if(q.meta&&q.meta.kind==='count'&&Number(q.meta.count)!==Number(a))return false;if(q.meta&&q.meta.kind==='grid'&&Number(q.meta.count)!==Number(a))return false;if(q.meta&&q.meta.kind==='parts'&&Number(q.meta.count)!==Number(a))return false;return true;}
function buildSet(){const out=[];let guard=0;while(out.length<10&&guard<200){guard++;const q=makeQuestion(level);if(verify(q))out.push(q);}if(out.length<10)throw new Error('Không thể tạo đủ câu hợp lệ cho level '+level);return out;}
function renderQuestion(){const q=questions[index];answered=false;const pct=((index)/10)*100;$('quiz').innerHTML=`<div class="top"><span>Câu ${index+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="question">${q.prompt}</div><div class="visual">${q.visual}</div><div class="answers">${q.options.map((x,i)=>`<button type="button" class="ans" data-i="${i}">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="nextBtn" type="button" class="next">Tiếp theo →</button>`;document.querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));$('nextBtn').addEventListener('click',next);}
function answer(i){if(answered)return;answered=true;const q=questions[index],buttons=[...document.querySelectorAll('.ans')],ok=String(q.options[i])===String(q.answer);buttons.forEach(b=>b.disabled=true);buttons[i].classList.add(ok?'correct':'wrong');const right=buttons.find(b=>String(b.textContent)===String(q.answer));if(right)right.classList.add('correct');if(ok){score++;$('feedback').textContent='🎉 Chính xác!';$('feedback').style.color='#087443';}else{$('feedback').textContent=`💪 Gần đúng! Đáp án là: ${q.answer}`;$('feedback').style.color='#b4232e';}$('nextBtn').classList.add('show');}
function next(){index++;if(index>=10)showResult();else renderQuestion();}
function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=8?'🌟🌟🌟':score>=5?'🌟🌟':'🌟'}</div><div class="badge">Hoàn thành Level ${level}</div><h2>Con đã làm ${score}/10 câu đúng!</h2><p>👏 Mỗi lần luyện tập là một lần con khám phá thêm về các hình.</p><button id="againBtn" type="button" class="again">Luyện lại 🔄</button></div>`;$('againBtn').addEventListener('click',start);}
function start(){try{questions=buildSet();index=0;score=0;answered=false;$('setup').classList.add('hide');$('quiz').classList.add('show');renderQuestion();$('quiz').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){console.error(err);alert('Có lỗi khi tạo bài luyện tập. Vui lòng thử lại.');}}
$('startBtn').addEventListener('click',start);
window.startFlatShapes=start;
renderLevels();
})();
</script>
