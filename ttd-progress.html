<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiến độ Toán Tư Duy</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}.app{max-width:760px;margin:auto;padding:20px}.hero,.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 30px #0000000b}.hero h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.name{font-weight:700}.meta{color:#68738a;font-size:14px;margin-top:6px}.meter{height:7px;background:#e7ebf2;border-radius:8px;margin-top:12px;overflow:hidden}.fill{height:100%;background:#4f7cff}.levels{display:flex;gap:6px;margin-top:12px}.level{flex:1;text-align:center;border-radius:10px;padding:8px;background:#f1f3f7;font-size:12px}.level.done{background:#eaf9f1}.btn{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:12px;padding:12px;margin-top:14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><h1>🧠 Tiến độ Toán Tư Duy</h1><div class="meta">Theo dõi kết quả luyện tập trên thiết bị này.</div></section><div class="grid" id="grid"></div><a class="btn" href="math-thinking.html">← Quay lại Toán Tư Duy</a></main><script src="data/ttd-progress.js"></script><script src="data/ttd-dashboard.js"></script><script>const data=TTD_DASHBOARD.get();document.getElementById('grid').innerHTML=data.map(x=>{const completed=x.levels.filter(l=>l.attempts>0).length,percent=Math.round(completed/3*100);return `<section class="card"><div class="name">${x.name}</div><div class="meta">${x.attempts} lần luyện · Best ${x.best} điểm</div><div class="meter"><div class="fill" style="width:${percent}%"></div></div><div class="levels">${x.levels.map((l,i)=>`<div class="level ${l.attempts?'done':''}">L${i+1}<br>${l.attempts?'✓':'—'}</div>`).join('')}</div><a class="btn" href="thinking-practice.html?group=${x.group}&level=1">Luyện tập</a></section>`}).join('')</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
