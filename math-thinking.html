<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toán Tư Duy · Lớp 1</title><style>:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--line:#e2e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 16px 50px}.hero{background:linear-gradient(135deg,#182033,#35466c);color:#fff;border-radius:26px;padding:26px;margin-bottom:20px}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.84}.overall{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:20px}.overall-row{display:flex;justify-content:space-between}.bar{height:9px;background:#e8ebf1;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#4f7cff;width:0;transition:width .3s}.section-title{margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;color:var(--navy);box-shadow:0 6px 18px #1820330a}.card-top{display:flex;align-items:center;gap:12px}.icon{font-size:36px}.card h2{margin:0;font-size:19px}.card p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.4}.levels{display:flex;gap:7px;margin-top:14px}.level{flex:1;text-align:center;border:0;border-radius:10px;padding:9px 3px;font-size:13px;font-weight:750;background:#eef1f6;color:#68738a;cursor:pointer}.level.open{background:#eaf0ff;color:#315bd6}.level.done{background:#eaf9f1;color:#17663f}.level.locked{opacity:.5;cursor:not-allowed}.hint{margin-top:9px;color:var(--muted);font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{border-radius:22px}.card{padding:16px}}</style></head><body><main class="wrap"><section class="hero"><h1>🧠 Toán Tư Duy · Lớp 1</h1><p>Chọn kỹ năng và cấp độ phù hợp để luyện tập.</p></section><section class="overall"><div class="overall-row"><strong>Tiến độ tổng thể</strong><strong id="percent">0%</strong></div><div class="bar"><div class="fill" id="fill"></div></div></section><h2 class="section-title">8 kỹ năng tư duy</h2><section class="grid" id="groups"></section></main><script src="data/ttd-progress.js"></script><script>const groups=[['pattern','🔷','Quy luật & Dãy hình','Tìm quy luật và hình tiếp theo.'],['classification','🟢','Phân loại','Tìm điểm giống và khác.'],['analogy','🔄','Tương tự','Nhận biết phép biến đổi.'],['matrix','🧩','Ma trận hình ảnh','Tìm quy luật trong bảng hình.'],['spatial','🧭','Tư duy không gian','Vị trí, hướng và phép xoay.'],['counting','🔢','Đếm & Logic','Đếm và tìm quan hệ.'],['ordering','📏','Sắp xếp & So sánh','Sắp xếp theo quy luật.'],['missing','🧩','Mảnh ghép còn thiếu','Hoàn thành hình theo quy luật.']];function state(g,l){const p=TTD_PROGRESS.get(g,l);return p?.completed?'done':TTD_PROGRESS.canAccess(g,l)?'open':'locked'}function openLevel(g,l){if(!TTD_PROGRESS.canAccess(g,l)){alert('Hãy hoàn thành Level '+(l-1)+' trước nhé!');return}location.href=`thinking-practice.html?group=${g}&level=${l}`}function card(g){let levels='';for(let l=1;l<=3;l++){const s=state(g[0],l);levels+=`<button class="level ${s}" onclick="openLevel('${g[0]}',${l})">L${l}${s==='done'?' ✓':s==='locked'?' 🔒':' ▶'}</button>`}return `<article class="card"><div class="card-top"><div class="icon">${g[1]}</div><div><h2>${g[2]}</h2><p>${g[3]}</p></div></div><div class="levels">${levels}</div></article>`}document.getElementById('groups').innerHTML=groups.map(card).join('');let completed=0,total=groups.length*3;groups.forEach(g=>{for(let l=1;l<=3;l++)if(TTD_PROGRESS.get(g[0],l)?.completed)completed++});const pct=Math.round(completed/total*100);document.getElementById('percent').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
