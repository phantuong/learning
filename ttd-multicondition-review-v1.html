<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Multi-Condition v1</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.conditions{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:6px 9px;border-radius:999px;background:#eef2f6}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #d6dde5;border-radius:12px;padding:5px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Multi-Condition Logic v1</h1><div id="app"></div><script src="ttd-multicondition-v1.js"></script><script src="ttd-multicondition-bank-v1.js"></script><script src="ttd-multicondition-validator-v1.js"></script><script>const qs=TTD_MULTICONDITION_VALIDATOR_V1.validateBank(TTD_MULTICONDITION_BANK_V1),app=document.getElementById('app');app.innerHTML=`<p><b>${qs.filter(q=>q.validation.valid).length}/${qs.length}</b> valid</p>`;for(const q of qs){const cond=q.problem.conditions.map(c=>Object.entries(c).map(([k,v])=>`${k}: ${v}`).join(' · ')).join(' | ');app.innerHTML+=`<section class="q"><b>${q.id}</b> — L${q.level} — <span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'VALID':'REJECTED'}</span><p>${q.question}</p><div class="conditions">${q.problem.conditions.map(c=>`<span class="tag">${Object.entries(c).map(([k,v])=>k+': '+v).join(' · ')}</span>`).join('')}</div><div class="choices">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_MULTICONDITION_V1.render(c)}</div>`).join('')}</div><small>${q.validation.errors.join(', ')}</small></section>`}</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
