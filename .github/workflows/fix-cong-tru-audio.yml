name: Fix Cong Tru Audio
on:
  push:
    paths:
      - 'cong-tru-audio-fix.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cong-tru-v2.html')
          s=p.read_text()
          old="""function soundCorrect(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(523.25,c.currentTime);o.frequency.exponentialRampToValueAtTime(783.99,c.currentTime+.16);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.46)}catch(e){}}\nfunction soundWrong(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[220,165].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.12)})}catch(e){}}"""
          new="""let audioCtx=null,audioMaster=null;
function initAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();audioMaster=audioCtx.createGain();audioMaster.gain.value=1.8;const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.12;audioMaster.connect(comp);comp.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();g.gain.value=.00001;o.connect(g);g.connect(audioMaster);o.start();o.stop(audioCtx.currentTime+.01)}catch(e){}}
function tone(freq,start,duration,type,gain,endFreq){if(!audioCtx||!audioMaster)return;const t=audioCtx.currentTime+start,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration);g.gain.setValueAtTime(.00001,t);g.gain.exponentialRampToValueAtTime(gain,t+.004);g.gain.exponentialRampToValueAtTime(.00001,t+duration);o.connect(g);g.connect(audioMaster);o.start(t);o.stop(t+duration+.01)}
function soundCorrect(){initAudio();tone(523.25,0,.16,'sine',1.0,659.25);tone(659.25,.08,.17,'sine',.95,783.99);tone(783.99,.16,.30,'sine',1.0,1046.5)}
function soundWrong(){initAudio();tone(300,0,.14,'square',1.0,190);tone(220,.12,.20,'square',1.0,145)}"""
          if old not in s:
              raise SystemExit('expected audio functions not found')
          s=s.replace(old,new)
          s=s.replace("function start(){stopRecognition();cursorB=0;", "function start(){stopRecognition();initAudio();cursorB=0;")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cong-tru-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Increase Cong Tru audio volume and sync timing'
          git push