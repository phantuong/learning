<head>

<style>
:root{--navy:#172033;--muted:#667085;--line:#e7eaf2;--bg:#f6f8ff;--pink:#f56fa8;--pink2:#ff9bc4;--soft:#fff5fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh}body{background:var(--bg);color:var(--navy);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--navy);font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;letter-spacing:.08em;padding:0 10px 7px}.nav{display:grid;gap:4px}.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;color:#475467;font-weight:700;cursor:pointer}.grade-toggle.active{background:#eef2ff;color:var(--navy)}.icon{width:24px;text-align:center;font-size:18px}.chev{margin-left:auto;color:#98a2b3}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid var(--line)}.subnav.open{display:grid;gap:3px}.subnav a{display:block;text-decoration:none;color:#667085;font-weight:650;font-size:14px;padding:8px 9px;border-radius:9px}.subnav a:hover{background:#f8faff}.subnav a.active{background:var(--navy);color:#fff}.course-list{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-size:13px;font-weight:700}.course-list a.active{background:#f0f3ff;color:var(--navy)}
.main{margin-left:260px;min-height:100vh;padding:18px 22px 42px}.wrap{max-width:820px;margin:auto}.mobile-btn{display:none;border:0;background:#fff;color:var(--navy);width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #17203312;cursor:pointer}.overlay{display:none}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:hidden}.top{text-align:center;padding:25px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 16px;display:flex;gap:10px}.search{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none}.search:focus{border-color:var(--pink2)}.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 16px}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:72px;height:72px;border-radius:20px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;font-size:44px;border:2px solid #f0dff0}.pic.color{border-radius:50%;width:62px;height:62px;margin:5px}.word{font-size:22px;font-weight:850}.ipa{font-size:16px;color:#667085;margin-top:3px}.meaning{font-size:18px;font-weight:700;margin-top:5px}.speak{border:0;background:#fff0f7;color:#df4f8f;width:48px;height:48px;border-radius:15px;font-size:22px;cursor:pointer}.speak:active{transform:scale(.94)}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:transform .22s ease;width:270px;box-shadow:12px 0 35px #17203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#17203355;z-index:15}.main{margin-left:0;padding:12px 12px 35px}.mobile-btn{display:block;margin-bottom:10px}.title{font-size:28px}.toolbar{padding:0 14px 14px}.list{padding:0 12px 18px}.word-card{grid-template-columns:62px 1fr auto;gap:11px;padding:11px}.pic{width:60px;height:60px;font-size:36px}.word{font-size:20px}.meaning{font-size:17px}.ipa{font-size:15px}.speak{width:44px;height:44px}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"><a class="brand" href="index.html?home=1"><span>🎓</span>Learning Hub</a><div class="nav-label">Lớp học</div><nav class="nav" id="gradeNav"></nav></aside>
<div id="overlay" class="overlay" onclick="toggleNav()"></div>
<main class="main"><button class="mobile-btn" onclick="toggleNav()" aria-label="Mở menu">☰</button><div class="wrap"><div class="card">
<header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1 · Hình minh họa · Phát âm · Nghĩa tiếng Việt</p></header>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"></div><div id="count" class="count"></div><section id="list" class="list"></section>
</div></div></main>
<script>
const VOCAB_URL='data/grade1/english/vocabulary.json';
const data={
"stand up":["/stænd ʌp/","đứng lên","🙋"],"sit down":["/sɪt daʊn/","ngồi xuống","🪑"],"open":["/ˈoʊpən/","mở","📖"],"look":["/lʊk/","nhìn","👀"],"listen":["/ˈlɪsən/","lắng nghe","👂"],
"happy":["/ˈhæpi/","vui, hạnh phúc","😊"],"sad":["/sæd/","buồn","😢"],"angry":["/ˈæŋɡri/","tức giận","😠"],"hungry":["/ˈhʌŋɡri/","đói","😋"],"tired":["/ˈtaɪərd/","mệt","😴"],"scared":["/skerd/","sợ hãi","😨"],
"sunny":["/ˈsʌni/","có nắng","☀️"],"rainy":["/ˈreɪni/","có mưa","🌧️"],"cloudy":["/ˈklaʊdi/","nhiều mây","☁️"],"windy":["/ˈwɪndi/","nhiều gió","💨"],"stormy":["/ˈstɔrmi/","có bão","⛈️"],"hot":["/hɑt/","nóng","🥵"],"cold":["/koʊld/","lạnh","🥶"],
"monday":["/ˈmʌndeɪ/","thứ Hai","📅"],"tuesday":["/ˈtuːzdeɪ/","thứ Ba","📅"],"wednesday":["/ˈwenzdeɪ/","thứ Tư","📅"],"thursday":["/ˈθɜrzdeɪ/","thứ Năm","📅"],"friday":["/ˈfraɪdeɪ/","thứ Sáu","📅"],"saturday":["/ˈsætərdeɪ/","thứ Bảy","📅"],"sunday":["/ˈsʌndeɪ/","Chủ nhật","📅"],
"one":["/wʌn/","một","1️⃣"],"two":["/tuː/","hai","2️⃣"],"three":["/θriː/","ba","3️⃣"],"four":["/fɔr/","bốn","4️⃣"],"five":["/faɪv/","năm","5️⃣"],"six":["/sɪks/","sáu","6️⃣"],"seven":["/ˈsevən/","bảy","7️⃣"],"eight":["/eɪt/","tám","8️⃣"],"nine":["/naɪn/","chín","9️⃣"],"ten":["/ten/","mười","🔟"],
"window":["/ˈwɪndoʊ/","cửa sổ","🪟"],"door":["/dɔr/","cửa ra vào","🚪"],"chair":["/tʃer/","ghế","🪑"],"desk":["/desk/","bàn học","🖥️"],"bin":["/bɪn/","thùng rác","🗑️"],"poster":["/ˈpoʊstər/","áp phích, tranh treo tường","🖼️"],"board":["/bɔrd/","bảng","📋"],"bag":["/bæɡ/","cặp, túi","🎒"],"book":["/bʊk/","sách","📚"],"cupboard":["/ˈkʌbərd/","tủ đựng đồ","🗄️"],
"ruler":["/ˈruːlər/","thước kẻ","📏"],"rubber":["/ˈrʌbər/","cục tẩy","🧽"],"pencil sharpener":["/ˈpensəl ˌʃɑrpənər/","gọt bút chì","🔧"],"pencil case":["/ˈpensəl keɪs/","hộp bút","🖍️"],"pen":["/pen/","bút mực","🖊️"],"pencil":["/ˈpensəl/","bút chì","✏️"],
"red":["/red/","đỏ","#ef4444"],"yellow":["/ˈjeloʊ/","vàng","#facc15"],"green":["/ɡriːn/","xanh lá cây","#22c55e"],"pink":["/pɪŋk/","hồng","#ec4899"],"purple":["/ˈpɜrpəl/","tím","#a855f7"],"orange":["/ˈɔrɪndʒ/","cam","#f97316"],"blue":["/bluː/","xanh dương","#3b82f6"],"black":["/blæk/","đen","#111827"],"white":["/waɪt/","trắng","#ffffff"],"brown":["/braʊn/","nâu","#92400e"],"gray":["/ɡreɪ/","xám","#9ca3af"],
"mum":["/mʌm/","mẹ","👩"],"dad":["/dæd/","bố","👨"],"grandpa":["/ˈɡrænˌpɑ/","ông","👴"],"grandma":["/ˈɡrænˌmɑ/","bà","👵"],"sister":["/ˈsɪstər/","chị/em gái","👧"],"brother":["/ˈbrʌðər/","anh/em trai","👦"],"twin":["/twɪn/","anh/chị/em sinh đôi","👯"],"uncle":["/ˈʌŋkəl/","chú, bác, cậu","🧔"],"auntie":["/ˈænti/","cô, dì, thím, mợ","👩"],"cousin":["/ˈkʌzən/","anh/chị/em họ","🧒"],"father":["/ˈfɑðər/","cha, bố","👨"],"mother":["/ˈmʌðər/","mẹ","👩"],"parents":["/ˈperənts/","bố mẹ","👨‍👩‍👧"],
"old":["/oʊld/","già, lớn tuổi","👴"],"young":["/jʌŋ/","trẻ, trẻ tuổi","🧒"],"tall":["/tɔl/","cao","🧍"],"short":["/ʃɔrt/","thấp, ngắn","🧍‍♀️"],"pretty":["/ˈprɪti/","xinh đẹp","🌸"],"handsome":["/ˈhænsəm/","đẹp trai","😊"],
"he":["/hiː/","anh ấy, cậu ấy","👦"],"she":["/ʃiː/","cô ấy, bạn ấy","👧"],"this":["/ðɪs/","cái này, đây","👉"],"is":["/ɪz/","là, thì, ở","🔗"],"my":["/maɪ/","của tôi","💗"],"what":["/wʌt/","cái gì, gì","❓"],"who":["/huː/","ai","🕵️"],
"lion":["/ˈlaɪən/","sư tử","🦁"],"duck":["/dʌk/","con vịt","🦆"],"deer":["/dɪr/","con hươu","🦌"],"family":["/ˈfæməli/","gia đình","👨‍👩‍👧‍👦"],"baby":["/ˈbeɪbi/","em bé","👶"],
"doll":["/dɑl/","búp bê","🪆"],"skipping rope":["/ˈskɪpɪŋ roʊp/","dây nhảy","🪢"],"ball":["/bɔl/","quả bóng","⚽"],"robot":["/ˈroʊbɑt/","rô-bốt","🤖"],"boat":["/boʊt/","thuyền","⛵"],"scooter":["/ˈskuːtər/","xe trượt scooter","🛴"],"skateboard":["/ˈskeɪtˌbɔrd/","ván trượt","🛹"],"kite":["/kaɪt/","diều","🪁"],"yoyo":["/ˈjoʊjoʊ/","yo-yo","🪀"],"teddy":["/ˈtedi/","gấu bông","🧸"]
};
let words=[];
const $=id=>document.getElementById(id);
function toggleNav(){$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')}
function toggleGrade(g){document.getElementById('sub-'+g)?.classList.toggle('open')}
function renderNav(){const nav=$('gradeNav');nav.innerHTML=Array.from({length:12},(_,i)=>{const g=i+1,open=g===1;return '<div><div class="grade-toggle '+(open?'active':'')+'" onclick="toggleGrade('+g+')"><span class="icon">'+(open?'📂':'📁')+'</span><span>Lớp '+g+'</span><span class="chev">'+(open?'⌃':'›')+'</span></div><div id="sub-'+g+'" class="subnav '+(open?'open':'')+'"><a href="class.html?grade='+g+'">🏫 Tổng quan</a>'+(g===1?'<a href="english.html">🔤🌈 Tiếng Anh</a><div class="course-list"><a href="english.html">↳ Vocabulary Games</a><a class="active" href="vocabulary-list.html">↳ Vocabulary List</a></div><a href="class.html?grade=1#math">➗ Toán tư duy</a><a href="#">📖 Tiếng Việt</a>':'<a href="class.html?grade='+g+'">📚 Môn học</a>')+'</div></div>'}).join('')}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=words.filter(w=>w.includes(q));$('count').textContent=filtered.length+' từ vựng';$('list').innerHTML=filtered.length?filtered.map(w=>{const d=data[w];const pic=d[2].startsWith('#')?'<div class="pic color" style="background:'+d[2]+'"></div>':'<div class="pic">'+d[2]+'</div>';return '<article class="word-card">'+pic+'<div><div class="word">'+w+'</div><div class="ipa">'+d[0]+'</div><div class="meaning">'+d[1]+'</div></div><button class="speak" onclick="speak('+JSON.stringify(w)+')" aria-label="Nghe phát âm">🔊</button></article>'}).join(''):'<div class="empty">Không tìm thấy từ này 🌸</div>'}
function speak(word){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;window.speechSynthesis.speak(u)}
async function load(){try{const r=await fetch(VOCAB_URL,{cache:'no-store'});if(!r.ok)throw new Error('Không tải được vocabulary.json');const j=await r.json();words=[...new Set((j.words||[]).map(x=>String(typeof x==='string'?x:x.word||'').trim().toLowerCase()).filter(Boolean))];words=words.filter(w=>data[w]);render();localStorage.setItem('learningLastAccess',JSON.stringify({href:'vocabulary-list.html',title:'Vocabulary List',grade:1,subject:'english',course:'vocabulary-list',time:Date.now()}))}catch(e){$('count').textContent='Không tải được danh sách từ vựng';$('list').innerHTML='<div class="empty">'+e.message+'</div>'}}
$('search').addEventListener('input',render);renderNav();load();
</script>
</body>
</html>
