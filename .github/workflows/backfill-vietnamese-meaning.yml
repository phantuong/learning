name: Backfill vocabulary Vietnamese meanings

on:
  push:
    paths:
      - 'scripts/backfill-vietnamese-meaning.py'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Backfill Vietnamese meanings
        run: python scripts/backfill-vietnamese-meaning.py
      - name: Commit updated vocabulary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grade1/english/vocabulary.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add Vietnamese meaning field to vocabulary'
            git push
          fi
