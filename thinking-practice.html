<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toán Tư Duy — Luyện tập</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.progress{height:8px;background:#e4e8f0;border-radius:8px;overflow:hidden}.bar{height:100%;background:#4f7cff;width:0}.card{background:white;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 30px #0000000d}.visual{min-height:190px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:72px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid #e2e6ef;background:#fff;border-radius:16px;padding:18px;font-size:34px;min-height:80px;cursor:pointer}.choice:hover{border-color:#4f7cff}.choice.correct{border-color:#22a06b;background:#eaf9f1}.choice.wrong{border-color:#e5484d;background:#fff0f0}.next{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:#172033;color:white;font-size:18px;display:none}.muted{color:#68738a}.result{text-align:center;font-size:24px}.restart{padding:13px 20px;border:0;border-radius:12px;background:#4f7cff;color:white;font-size:17px}</style></head><body><main class="app"><div class="top"><div><strong id="group">Toán Tư Duy</strong><div class="muted" id="level">Level 1</div></div><strong id="score">0 điểm</strong></div><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="card"><h2 id="question">Câu hỏi</h2><div class="visual" id="visual"></div><div class="choices" id="choices"></div><button class="next" id="next">Câu tiếp theo →</button></section></main><script>const DATA={pattern:{name:'Quy luật & Dãy hình',items:[['🔴','🔵','🔴','🔵'],['⭐','⭐','🔺','⭐']]},classification:{name:'Phân loại',items:[['🔴','🔴','🔵','🔴'],['🔺','🔺','⭐','🔺']]},analogy:{name:'Tương tự',items:[['🔴 ○','🔴 □','🔵 ○','?'],['🔺','🔵 🔺','⭐','?']]},matrix:{name:'Ma trận hình ảnh',items:[['🔴 ○','🔴 □','🔵 ○','?']]},spatial:{name:'Tư duy không gian',items:[['⬆️','➡️','⬇️','?']]},counting:{name:'Đếm & Logic',items:[['🍎 🍎','🍎 🍎 🍎','?']]},ordering:{name:'Sắp xếp & So sánh',items:[['1️⃣ 2️⃣ 3️⃣','?']]},missing:{name:'Mảnh ghép còn thiếu',items:[['🔵','🟢','🔴','?']]}};const params=new URLSearchParams(location.search),key=params.get('group')||'pattern',level=Number(params.get('level')||1),set=DATA[key]||DATA.pattern;let q=0,score=0,answered=false;const total=5;function render(){answered=false;document.getElementById('group').textContent=set.name;document.getElementById('level').textContent='Level '+level+' · Câu '+(q+1)+' / '+total;document.getElementById('score').textContent=score+' điểm';document.getElementById('bar').style.width=(q/total*100)+'%';const v=set.items[q%set.items.length];document.getElementById('question').textContent='Hãy chọn đáp án đúng';document.getElementById('visual').textContent=v.join('   ');const correct=key==='spatial'?'⬅️':key==='counting'?'🍎 🍎 🍎 🍎':key==='ordering'?'4️⃣':key==='classification'?'🔵':key==='analogy'?'🔵 □':key==='pattern'?'🔵':'🟡';const choices=[correct,'🔴','🟢','⭐'].sort(()=>Math.random()-.5);document.getElementById('choices').innerHTML=choices.map((x,i)=>`<button class="choice" data-answer="${x===correct}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));document.getElementById('next').style.display='none'}function answer(btn){if(answered)return;answered=true;const ok=btn.dataset.answer==='true';if(ok)score+=20;document.querySelectorAll('.choice').forEach(b=>{if(b.dataset.answer==='true')b.classList.add('correct')});if(!ok)btn.classList.add('wrong');document.getElementById('score').textContent=score+' điểm';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{q++;if(q>=total){document.getElementById('card').innerHTML=`<div class="result"><h2>Hoàn thành! 🎉</h2><p>Bé đạt <strong>${score}/${total*20}</strong> điểm</p><button class="restart" onclick="location.reload()">Làm lại</button></div>`;document.getElementById('bar').style.width='100%'}else render()};render();</script></body></html>
