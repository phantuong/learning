<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><title>Learning Hub · Lớp 1</title><style>:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--card:#fff;--line:#e2e6ee;--soft:#eef2ff;--green:#087443}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.layout{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--navy);font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;letter-spacing:.08em;padding:0 10px 7px}.nav{display:grid;gap:4px}.nav a,.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#475467;font-weight:700;border:0;background:transparent;width:100%;font:inherit;text-align:left;cursor:pointer}.nav a:hover,.grade-toggle:hover{background:#f8faff}.nav a.active{background:var(--navy);color:#fff}.icon{width:24px;text-align:center;font-size:18px}.chev{margin-left:auto;font-size:12px;color:#98a2b3}.grade-block{margin-bottom:3px}.grade-toggle.active{background:#eef2ff;color:var(--navy)}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid var(--line)}.subnav.open{display:grid;gap:3px}.subnav a{font-size:14px;padding:8px 9px}.course-list{display:grid;gap:2px;margin:2px 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-weight:600;color:#667085;font-size:13px}.course-list a.active{color:#182033;background:#f0f3ff}.main{margin-left:260px;min-height:100vh;padding:24px}.wrap{max-width:920px;margin:auto}.mobile-btn{display:none;border:0;background:#fff;color:var(--navy);width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #18203312}.overlay{display:none}.back{color:#5e6a80;text-decoration:none;font-size:15px}.header{text-align:center;padding:20px 0 28px}.emoji{font-size:42px;margin-bottom:8px}h1{font-size:34px;margin:0 0 7px;letter-spacing:-.8px}.subtitle{margin:0;color:var(--muted);font-size:17px}.subject{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 7px 20px #1820330d;margin-bottom:18px}.subject-head{display:flex;align-items:center;gap:13px}.subject-icon{font-size:38px}.subject h2{margin:0;font-size:23px}.subject p{color:var(--muted);margin:6px 0 18px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.course{display:block;text-decoration:none;color:var(--navy);border:1px solid var(--line);border-radius:18px;padding:16px;background:#fbfcff}.course:hover{border-color:#bfc8da;background:#f8faff}.course-title{font-weight:800;font-size:17px}.course-desc{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.4}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:#eef1f7;color:#667187;font-size:12px;font-weight:700}.ready{background:#eaf7ef;color:var(--green)}.empty{background:#fff;border:1px dashed #cbd2df;border-radius:18px;padding:20px;color:var(--muted)}@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:transform .22s ease;width:270px;box-shadow:12px 0 35px #18203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#18203355;z-index:15}.main{margin-left:0;padding:12px 14px 35px}.mobile-btn{display:block;margin-bottom:8px}.courses{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><div class="layout"><aside id="sidebar" class="sidebar"><a class="brand" href="index.html"><span>🎓</span>Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile-btn" onclick="toggleNav()">☰</button><div class="wrap"><a class="back" href="index.html">← Trang chủ</a><header class="header"><div class="emoji">🎓</div><h1 id="gradeTitle">Lớp 1</h1><p class="subtitle">Chọn môn học và khóa học</p></header><section id="subjects"></section></div></main></div><script>
const grade=Number(new URLSearchParams(location.search).get('grade')||1);document.title=`Lớp ${grade} · Learning Hub`;document.getElementById('gradeTitle').textContent=`Lớp ${grade}`;
const data={1:[{icon:'🇬🇧',name:'Tiếng Anh',desc:'Học tiếng Anh theo từng khóa học.',courses:[{title:'Vocabulary Games',desc:'Ghi nhớ cách viết từ vựng bằng trò chơi tương tác.',href:'english.html',ready:true}]},{icon:'📖',name:'Tiếng Việt',desc:'Đọc, viết, từ ngữ và kiến thức Tiếng Việt.',courses:[]},{icon:'➗',name:'Toán tư duy',desc:'Bài học và luyện tập Toán tư duy dành cho học sinh lớp 1.',courses:[]},{icon:'🔢',name:'Math',desc:'Mathematics learning in English.',courses:[]}]};
function toggleNav(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function renderSubjects(){const list=data[grade]||[];const el=document.getElementById('subjects');if(!list.length){el.innerHTML='<div class="empty">Các môn học của lớp này đang được chuẩn bị.</div>';return}el.innerHTML=list.map(s=>`<article class="subject"><div class="subject-head"><div class="subject-icon">${s.icon}</div><div><h2>${s.name}</h2><p>${s.desc}</p></div></div>${s.courses.length?`<div class="courses">${s.courses.map(c=>`<a class="course" href="${c.href}"><div class="course-title">${c.title}</div><div class="course-desc">${c.desc}</div><span class="badge ${c.ready?'ready':''}">${c.ready?'Đang học':'Sắp triển khai'}</span></a>`).join('')}</div>`:'<div class="empty">Các khóa học đang được xây dựng.</div>'}</article>`).join('')}
function renderNav(){const nav=document.getElementById('gradeNav');nav.innerHTML=Array.from({length:12},(_,i)=>{const g=i+1,open=g===grade;return `<div class="grade-block"><button class="grade-toggle ${open?'active':''}" onclick="toggleGrade(${g})"><span class="icon">${open?'📂':'📁'}</span><span>Lớp ${g}</span><span class="chev">${open?'⌃':'›'}</span></button><div id="sub-${g}" class="subnav ${open?'open':''}"><a href="class.html?grade=${g}" class="${open?'active':''}">🏫 Tổng quan</a>${g===1?`<a href="english.html">🇬🇧 Tiếng Anh</a><div class="course-list"><a href="english.html">↳ Vocabulary Games</a></div><a href="#">➗ Toán tư duy</a><a href="#">📖 Tiếng Việt</a>`:'<a href="class.html?grade='+g+'">📚 Môn học</a>'}</div></div>`}).join('')}
function toggleGrade(g){const el=document.getElementById('sub-'+g);if(el)el.classList.toggle('open')}
renderNav();renderSubjects();</script></body></html>
