<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Shape Composition v2</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.box{border:1px solid #d6dde5;border-radius:12px;padding:4px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #d6dde5;border-radius:12px;padding:4px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.choices{grid-template-columns:repeat(2,1fr)}}svg{max-width:100%;height:auto}</style></head><body><h1>Shape Composition v2</h1><div id="app"></div><script src="ttd-shape-composition-v2.js"></script><script src="ttd-shape-composition-bank-v2.js"></script><script src="ttd-shape-composition-validator-v2.js"></script><script>const qs=TTD_COMPOSITION_VALIDATOR_V2.validateBank(TTD_COMPOSITION_BANK_V2),app=document.getElementById('app');app.innerHTML=`<p><b>${qs.filter(q=>q.validation.valid).length}/${qs.length}</b> valid</p>`;for(const q of qs){app.innerHTML+=`<section class="q"><b>${q.id}</b> — L${q.level} — <span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'VALID':'REJECTED'}</span><p>${q.question}</p><div class="row"><div><small>Hình đích</small>${TTD_COMPOSITION_V2.render(q.problem.target)}</div><div><small>Mảnh đã biết</small>${TTD_COMPOSITION_V2.render(q.problem.known)}</div></div><p>Đáp án:</p><div class="choices">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_COMPOSITION_V2.render(c)}</div>`).join('')}</div><small>${q.validation.errors.join(', ')}</small></section>`}</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
