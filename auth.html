<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><title>Đăng nhập · Learning Hub</title><style>:root{--navy:#182033;--muted:#68738a;--bg:#f4f6fb;--card:#fff;--line:#e2e6ee;--accent:#7c3aed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 14px 40px #18203312}.brand{text-align:center;font-size:30px;font-weight:850;margin-bottom:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4f8;border-radius:12px;padding:4px;margin-bottom:20px}.tab{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:750;color:var(--muted);cursor:pointer}.tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 7px #18203312}label{display:block;font-size:14px;font-weight:700;margin:13px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d6dbe5;border-radius:12px;font-size:16px;outline:0}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c3aed18}.submit{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.45;display:none}.msg.show{display:block}.msg.error{background:#fff1f2;color:#b42318}.msg.ok{background:#ecfdf3;color:#067647}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}</style></head><body><main class="card"><div class="brand">📚 Learning Hub</div><div class="tabs"><button id="loginTab" class="tab active">Đăng nhập</button><button id="signupTab" class="tab">Đăng ký</button></div><form id="authForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submit" class="submit" type="submit">Đăng nhập</button></form><div id="msg" class="msg"></div><div class="hint">Tài khoản được lưu phiên đăng nhập để bạn có thể tiếp tục học trên thiết bị này.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let mode='login';const form=document.getElementById('authForm'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),submit=document.getElementById('submit'),msg=document.getElementById('msg');function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');submit.textContent=m==='login'?'Đăng nhập':'Tạo tài khoản';msg.className='msg';msg.textContent='';}function show(text,type){msg.textContent=text;msg.className='msg show '+type}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.replace('index.html')})();form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;show('Đang xử lý…','ok');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;try{if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;location.replace('index.html')}else{const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(data.session){show('Đăng ký thành công. Đang mở Learning Hub…','ok');setTimeout(()=>location.replace('index.html'),500)}else show('Đăng ký thành công. Hãy kiểm tra email để xác nhận tài khoản rồi đăng nhập.','ok')} }catch(err){show(err.message||'Không thể thực hiện thao tác.','error')}finally{submit.disabled=false}};</script></body></html>
