<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách Từ Vựng</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f;--soft:#fff0f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search,.meaning-input{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted)}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-actions{display:flex;gap:8px;padding:4px 4px 8px;position:sticky;top:0;background:#fff;z-index:2}.source-actions button,.edit,.save,.cancel{border:1px solid #ead9e4;border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.source-actions button{flex:1;background:#fff7fb;color:var(--pink)}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item label{font-size:14px;line-height:1.35}.source-item small{display:block;color:var(--muted);margin-top:2px}.count,.status{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 8px}.status{min-height:18px;font-weight:700}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4}.editbox{display:flex;gap:7px;margin-top:8px}.meaning-input{padding:9px 10px;font-size:14px}.edit{background:#fff;color:var(--pink);margin-top:8px}.save{background:var(--pink);color:#fff}.cancel{background:#fff;color:var(--muted)}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:var(--soft);color:var(--pink)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:56px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px}.word{font-size:19px}.speak{width:41px;height:41px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary">Đang tải nguồn...</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div><div id="count" class="count">Đang tải...</div><div id="status" class="status">Đang tải dữ liệu...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v6"></script><script src="vocabulary-source-sync.js?v=20261006v5"></script><script src="vocabulary-db.js?v=20261006v6"></script><script>(async function(){'use strict';const $=id=>document.getElementById(id);let baseWords=[],dbRows=[],sources=[],selected=new Set(),editing=null;const fallback={"am":"là (dùng với I)","I":"tôi / mình","my":"của tôi","the":"cái/con đó","and":"và","it":"nó","to":"đến / để","a":"một","an":"một","have":"có","has":"có (dùng với he/she/it)","can":"có thể","can't":"không thể"};const emoji={cat:'🐱',dog:'🐶',bird:'🐦',fish:'🐟',rabbit:'🐰',duck:'🦆',chicken:'🐔',cow:'🐄',horse:'🐴',pig:'🐷',ball:'⚽',book:'📖',pencil:'✏️',apple:'🍎',banana:'🍌',cake:'🍰',milk:'🥛',water:'💧',shirt:'👕',shoes:'👟',hat:'🧢',bed:'🛏️',house:'🏠',family:'👨‍👩‍👧‍👦'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function meaning(w){return fallback[w]||fallback[String(w).toLowerCase()]||''}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}async function restList(){const url=`${window.SUPABASE_URL}/rest/v1/vocabulary_entries?select=${encodeURIComponent('id,word,vietnamese_meaning,ipa,source_ids,image_url,image_source,updated_at')}&order=word`;const r=await fetch(url,{cache:'no-store',headers:{apikey:window.SUPABASE_ANON_KEY,Authorization:`Bearer ${window.SUPABASE_ANON_KEY}`}});if(!r.ok)throw Error('Supabase REST '+r.status);return r.json()}async function load(){const [v,s]=await Promise.all([fetch('data/grade1/english/vocabulary.json',{cache:'no-store'}),fetch('data/grade1/english/vocabulary-sources.json',{cache:'no-store'})]);if(!v.ok||!s.ok)throw Error('Không tải được dữ liệu vocabulary');baseWords=(await v.json()).words||[];sources=(await s.json()).sources||[];dbRows=await restList()}function merged(){const m=new Map();for(const x of baseWords){const k=String(x.word||'').toLowerCase();if(k)m.set(k,{...x,sourceIds:[...(x.sourceIds||[])]})}for(const x of dbRows){const k=String(x.word||'').toLowerCase();if(!k)continue;const old=m.get(k)||{word:x.word,sourceIds:[]};m.set(k,{...old,...x,sourceIds:[...new Set([...(old.sourceIds||[]),...(x.source_ids||[])])]})}return [...m.values()]}function summary(){const n=$('sourceSummary');n.textContent=selected.size===sources.length?'Tất cả nguồn':selected.size?`${selected.size} nguồn được chọn`:'Không có nguồn nào'}function renderSources(){const menu=$('sourceMenu');menu.innerHTML='<div class="source-actions"><button id="allBtn" type="button">✓ Chọn tất cả</button><button id="noneBtn" type="button">Bỏ chọn tất cả</button></div>'+sources.map(s=>`<div class="source-item"><input type="checkbox" data-source="${esc(s.id)}" ${selected.has(s.id)?'checked':''}><label><b>${esc(s.label||s.name||s.id)}</b><small>${esc(s.description||'')}</small></label></div>`).join('');summary();$('allBtn').onclick=()=>setSources(sources.map(s=>s.id));$('noneBtn').onclick=()=>setSources([]);menu.querySelectorAll('[data-source]').forEach(c=>c.onchange=()=>{const n=new Set(selected);c.checked?n.add(c.dataset.source):n.delete(c.dataset.source);setSources([...n])})}async function setSources(ids){selected=new Set(ids);renderSources();render();try{if(window.VocabularySourceSync)await VocabularySourceSync.set([...selected]);$('status').textContent='Đã lưu nguồn học.'}catch(e){$('status').textContent='Đã cập nhật trên thiết bị; Cloud tạm thời không khả dụng.'}}async function saveMeaning(word){const input=$('meaningEdit');const val=input.value.trim();if(!window.VocabularyDB)throw Error('Vocabulary DB chưa sẵn sàng');await VocabularyDB.updateMeaning(word,val);const row=dbRows.find(x=>String(x.word).toLowerCase()===word.toLowerCase());if(row)row.vietnamese_meaning=val;else dbRows.push({word,vietnamese_meaning:val,source_ids:[]});editing=null;render();$('status').textContent='Đã lưu nghĩa tiếng Việt lên Cloud.'}function render(){const q=$('search').value.trim().toLowerCase();const arr=merged().filter(x=>(x.sourceIds||[]).some(id=>selected.has(id))).filter(x=>{if(!q)return true;return String(x.word||'').toLowerCase().includes(q)||String(x.vietnamese_meaning||meaning(x.word)||'').toLowerCase().includes(q)});$('count').textContent=`${arr.length} từ`;if(!arr.length){$('list').innerHTML='<div class="empty">Không có từ nào phù hợp với nguồn đã chọn.</div>';return}$('list').innerHTML=arr.map(x=>{const m=x.vietnamese_meaning||meaning(x.word)||'Chưa có nghĩa tiếng Việt';const p=x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.word)}" loading="lazy">`:(emoji[String(x.word).toLowerCase()]||'🔤');if(editing===x.word)return `<article class="word-card"><div class="pic">${p}</div><div><div class="word">${esc(x.word)}</div><div class="editbox"><input id="meaningEdit" class="meaning-input" value="${esc(m==='Chưa có nghĩa tiếng Việt'?'':m)}"><button class="save" data-save="${esc(x.word)}">Lưu</button><button class="cancel" data-cancel>Hủy</button></div></div><button class="speak" data-speak="${esc(x.word)}">🔊</button></article>`;return `<article class="word-card"><div class="pic">${p}</div><div><div class="word">${esc(x.word)}</div><div class="meta">${esc(m)}${x.ipa?' · '+esc(x.ipa):''}</div><button class="edit" data-edit="${esc(x.word)}">✏️ Sửa nghĩa</button></div><button class="speak" data-speak="${esc(x.word)}">🔊</button></article>`}).join('');$('list').querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));$('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render();setTimeout(()=>{$('meaningEdit')?.focus();$('meaningEdit')?.select()},0)});$('list').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editing=null;render()});$('list').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await saveMeaning(b.dataset.save)}catch(e){b.disabled=false;$('status').textContent='Không thể lưu nghĩa: '+(e.message||e)}})}$('search').oninput=render;$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!$('sourceMenu').contains(e.target)&&e.target!==$('sourceTrigger'))$('sourceMenu').classList.remove('open')});try{$('status').textContent='Đang tải danh sách...';await load();if(window.VocabularySourceSync){try{await VocabularySourceSync.init();selected=new Set(VocabularySourceSync.getSelected().filter(id=>sources.some(s=>s.id===id)))}catch{}}if(!selected.size)selected=new Set(sources.map(s=>s.id));renderSources();render();$('status').textContent='';}catch(e){console.error(e);$('status').textContent='Lỗi tải dữ liệu: '+e.message;$('list').innerHTML='<div class="empty">Không thể tải danh sách. Vui lòng thử lại.</div>'}})();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
