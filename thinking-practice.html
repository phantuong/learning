<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toán Tư Duy — Luyện tập</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}.app{width:min(720px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;background:#e4e8f0;border-radius:8px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#4f7cff;width:0;transition:width .25s}.card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 8px 30px #0000000d}.visual{min-height:190px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:48px;overflow:auto}.visual svg{width:82px;height:82px;flex:none}.ttd-sequence{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}.ttd-item svg{width:72px;height:72px}.ttd-arrow{font-size:28px}.matrix,.ttd-matrix{display:grid;grid-template-columns:repeat(3,minmax(62px,82px));gap:7px;justify-content:center}.matrix .cell,.ttd-cell{width:100%;aspect-ratio:1;border:1px solid #e7eaf0;border-radius:12px;display:flex;align-items:center;justify-content:center}.matrix .cell svg,.ttd-cell svg{width:68px;height:68px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:2px solid #e2e6ef;background:#fff;border-radius:16px;padding:12px;font-size:30px;min-height:82px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.choice svg{width:62px;height:62px}.choice:hover{border-color:#4f7cff}.choice.correct{border-color:#22a06b;background:#eaf9f1}.choice.wrong{border-color:#e5484d;background:#fff0f0}.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;line-height:1.45;display:none}.feedback.show{display:block}.feedback.good{background:#eaf9f1;color:#17663f}.feedback.try{background:#fff0f0;color:#9b292d}.next{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#172033;color:#fff;font-size:18px;min-height:50px}.result{text-align:center;font-size:22px}.stars{font-size:42px;letter-spacing:4px;margin:8px}.restart{padding:13px 20px;border:0;border-radius:12px;background:#4f7cff;color:#fff;font-size:17px}.muted{color:#68738a}@media(max-width:520px){.app{padding:12px}.card{padding:16px}.visual{min-height:165px}.visual svg{width:70px;height:70px}.ttd-item svg{width:58px;height:58px}.choice{font-size:26px;min-height:76px}.matrix,.ttd-matrix{grid-template-columns:repeat(3,minmax(54px,72px))}.matrix .cell svg,.ttd-cell svg{width:58px;height:58px}}</style></head><body><main class="app"><div class="top"><div><strong id="group">Toán Tư Duy</strong><div class="muted" id="level">Level 1</div></div><strong id="score">0 điểm</strong></div><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="card"><h2 id="question">Câu hỏi</h2><div class="visual" id="visual"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next" style="display:none">Câu tiếp theo →</button></section></main><script src="data/ttd-question-bank.js"></script><script src="data/ttd-question-bank-l2-l3.js"></script><script src="data/ttd-structured-visual-bank.js"></script><script src="data/ttd-visual-renderer.js"></script><script src="data/ttd-visual-renderer-v2.js"></script><script src="data/ttd-progress.js"></script><script>const params=new URLSearchParams(location.search),key=params.get('group')||'pattern',level=Number(params.get('level')||1);if(!TTD_PROGRESS.canAccess(key,level)){location.replace(`math-thinking.html?locked=${level}&group=${encodeURIComponent(key)}`)}const base=window.TTD_QUESTION_BANK?.questions||[],extra=window.TTD_QUESTION_BANK_EXTRA?.questions||[],structured=window.TTD_STRUCTURED_VISUAL_BANK?.questions||[],bank=[...base,...extra,...structured].filter(x=>x.group===key&&x.level===level);let q=0,score=0,answered=false;const total=Math.min(5,bank.length);const names={pattern:'Quy luật & Dãy hình',classification:'Phân loại',analogy:'Tương tự',matrix:'Ma trận hình ảnh',spatial:'Tư duy không gian',counting:'Đếm & Logic',ordering:'Sắp xếp & So sánh',missing:'Mảnh ghép còn thiếu'};const visualObject=x=>x&&typeof x==='object'&&x.shape;function draw(target,x){if(visualObject(x))target.innerHTML=TTD_VISUAL_V2.svg(x);else if(x===null)target.textContent='?';else target.textContent=x}function renderItem(target,item){if(Array.isArray(item)){target.className='visual';TTD_VISUAL_V2.render(target,item)}else draw(target,item)}function render(){answered=false;document.getElementById('group').textContent=names[key]||'Toán Tư Duy';document.getElementById('level').textContent='Level '+level+' · Câu '+(q+1)+' / '+total;document.getElementById('score').textContent=score+' điểm';document.getElementById('bar').style.width=(q/total*100)+'%';const item=bank[q];document.getElementById('question').textContent='Hãy chọn đáp án đúng';renderItem(document.getElementById('visual'),item.visual);const choices=document.getElementById('choices');choices.innerHTML='';item.choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.dataset.index=i;renderItem(b,x);b.onclick=()=>answer(b,item);choices.appendChild(b)});const f=document.getElementById('feedback');f.className='feedback';f.textContent='';document.getElementById('next').style.display='none'}function answer(btn,item){if(answered)return;answered=true;const ok=Number(btn.dataset.index)===item.answer;if(ok)score+=20;document.querySelectorAll('.choice').forEach(b=>{if(Number(b.dataset.index)===item.answer)b.classList.add('correct');b.disabled=true});if(!ok)btn.classList.add('wrong');const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'try');f.innerHTML=ok?'🌟 Rất tốt! Bé đã tìm đúng quy luật.':'💡 Gần đúng rồi! Hãy quan sát lại hình, màu sắc và hướng của các hình.';document.getElementById('score').textContent=score+' điểm';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{q++;if(q>=total){window.TTD_PROGRESS?.record(key,level,score,total*20);const stars=score===total*20?'⭐⭐⭐':score>=total*20*.6?'⭐⭐':'⭐';document.getElementById('card').innerHTML=`<div class="result"><h2>Hoàn thành! 🎉</h2><div class="stars">${stars}</div><p>Bé đạt <strong>${score}/${total*20}</strong> điểm</p><p class="muted">Hãy luyện lại để phá kỷ lục của mình nhé!</p><button class="restart" onclick="location.reload()">Làm lại</button></div>`;document.getElementById('bar').style.width='100%'}else render()};if(!bank.length){document.getElementById('card').innerHTML='<div class="result"><h2>Chưa có câu hỏi</h2><p>Nhóm này đang được xây dựng.</p></div>'}else render();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
