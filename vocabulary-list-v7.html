<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fb"><title>Danh sách Từ Vựng · Tiếng Anh lớp 1</title><style>:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:visible}.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none}.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px -4px}.source-wrap{position:relative}.source-trigger{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.source-trigger .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:50;background:#fff;border:1px solid #e5dff0;border-radius:18px;box-shadow:0 16px 36px #17203324;padding:8px;max-height:360px;overflow:auto}.source-menu.open{display:block}.source-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer}.source-item:hover{background:#faf5f9}.source-item input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pink)}.source-item .label{font-size:14px;line-height:1.35}.source-item .meta{font-size:11px;color:var(--muted);margin-top:2px}.source-actions{display:flex;gap:7px;padding:7px 6px 9px;border-bottom:1px solid var(--line);margin-bottom:4px}.source-actions button{border:0;background:#f4f1f6;border-radius:10px;padding:8px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 8px}.sync{text-align:center;min-height:18px;font-size:12px;font-weight:700;color:var(--muted);padding:0 20px 10px}.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}.pic{width:68px;height:68px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;border:2px solid #f0dff0}.pic img{width:100%;height:100%;object-fit:cover;display:block}.word{font-size:21px;font-weight:850}.meta{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;min-height:21px}.meta.loading{opacity:.55}.speak{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer;background:#fff0f7;color:var(--pink)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:28px}.word{font-size:19px}.meta{font-size:14px}.speak{width:41px;height:41px}}</style></head><body><main class="main"><div class="card"><header class="top"><h1 class="title">📚 Danh sách Từ Vựng</h1><p class="subtitle">Chọn một hoặc nhiều nguồn để học và luyện tập</p></header><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off"><label class="filter-label">📚 Lọc theo nguồn</label><div class="source-wrap"><button id="sourceTrigger" class="source-trigger" type="button"><span id="sourceSummary" class="summary">Đang tải nguồn…</span><span>⌄</span></button><div id="sourceMenu" class="source-menu"></div></div></div><div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261006v2"></script><script src="auth-guard.js?v=20261006v1"></script><script src="vocabulary-source-sync.js?v=20261006v1"></script><script>
const IMG_KEY='grade1EnglishVocabImagesV2',META_KEY='grade1EnglishVocabMetaV1';let words=[],sources=[],selected=new Set();const $=id=>document.getElementById(id);const emoji={'cat':'🐱','dog':'🐶','bird':'🐦','fish':'🐟','mouse':'🐭','rabbit':'🐰','cow':'🐄','sheep':'🐑','duck':'🦆','chicken':'🐔','lion':'🦁','deer':'🦌','elephant':'🐘','giraffe':'🦒','bat':'🦇','squirrel':'🐿️','chameleon':'🦎','ball':'⚽','robot':'🤖','boat':'⛵','kite':'🪁','teddy':'🧸','cheese':'🧀','bread':'🍞','milk':'🥛','juice':'🧃','rice':'🍚','apples':'🍎','bananas':'🍌','hat':'🧢','shirt':'👕','shoes':'👟','socks':'🧦','glasses':'👓','picture':'🖼️','bed':'🛏️','clock':'🕒','bookcase':'📚','plant':'🪴','television':'📺','table':'🪑','sofa':'🛋️','cushion':'🛋️','living room':'🛋️','bedroom':'🛏️','bathroom':'🛁','kitchen':'🍳','garden':'🌳','wings':'🪽','beak':'🐦','ears':'👂','tail':'🐈','eyes':'👀','nose':'👃','mouth':'👄','arms':'💪','legs':'🦵','fly':'🪽','walk':'🚶','climb':'🧗','jump':'🦘','swim':'🏊','play football':'⚽','play tennis':'🎾','run':'🏃','ride a horse':'🐴','ride a bike':'🚲','rollerblade':'🛼','old':'👴','young':'👶','tall':'📏','short':'📏','pretty':'😊','handsome':'🙂','family':'👨‍👩‍👧‍👦','baby':'👶','father':'👨','mother':'👩','parents':'👨‍👩‍👧','mum':'👩','dad':'👨','grandpa':'👴','grandma':'👵','sister':'👧','brother':'👦','twin':'👯','uncle':'👨','auntie':'👩','cousin':'🧒','circle':'⚪','triangle':'🔺','rectangle':'▭','square':'⬜','oval':'🥚','farm':'🚜'};const exact={'old':'elderly person','young':'young child','tall':'tall person','short':'short person','pretty':'pretty girl portrait','handsome':'handsome boy portrait','family':'family parents children','parents':'parents children','cushion':'cushion sofa','wardrobe':'clothes wardrobe furniture','bookcase':'bookcase furniture','living room':'living room interior','bedroom':'bedroom interior','bathroom':'bathroom interior','dining room':'dining room interior','garden':'home garden','wings':'bird wings','beak':'bird beak','tail':'animal tail','play football':'children playing football','play tennis':'children playing tennis','ride a horse':'child riding horse','ride a bike':'child riding bicycle','rollerblade':'child rollerblading','circle':'circle shape','triangle':'triangle shape','rectangle':'rectangle shape','square':'square shape','oval':'oval shape','farm':'farm animals'};function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function hint(w){return emoji[w]||emoji[w.toLowerCase()]||'📘'}function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function query(w){return exact[w]||exact[w.toLowerCase()]||w}function score(x,w){const t=((x.title||'')+' '+(x.alt_text||'')+' '+(x.description||'')+' '+(x.tags||[]).map(a=>a.name||a).join(' ')).toLowerCase();return query(w).toLowerCase().split(/[^a-z0-9]+/).filter(a=>a.length>2).reduce((n,a)=>n+(t.includes(a)?3:0),t.includes(w.toLowerCase())?8:0)}async function image(w){const c=read(IMG_KEY),k=w.toLowerCase();if(Object.prototype.hasOwnProperty.call(c,k))return c[k];try{const r=await fetch('https://api.openverse.org/v1/images/?q='+encodeURIComponent(query(w))+'&license=cc0,pdm&filter_dead=true&mature=false&page_size=20');if(!r.ok)throw Error();const d=await r.json(),best=(d.results||[]).map(x=>({x,s:score(x,w)})).sort((a,b)=>b.s-a.s)[0]?.x,u=best?.thumbnail||best?.url||'';c[k]=u;write(IMG_KEY,c);return u}catch{c[k]='';write(IMG_KEY,c);return''}}async function meta(w){const c=read(META_KEY),k=w.toLowerCase();if(c[k])return c[k];try{const r=await fetch('https://dict.minhqnd.com/api/v1/lookup?word='+encodeURIComponent(w)+'&lang=en&def_lang=vi');if(!r.ok)throw Error();const d=await r.json(),en=(d.results||[]).find(x=>x.lang==='en'||x.lang_name==='English')||d.results?.[0],m={meaning:(en?.meanings||[]).map(x=>x.definition).filter(Boolean).slice(0,2).join('; ')||w,ipa:en?.pronunciations?.[0]?.ipa||''};c[k]=m;write(META_KEY,c);return m}catch{return{meaning:w,ipa:''}}}function updateSummary(){const n=selected.size;const total=sources.length;$('sourceSummary').textContent=!n?'Chưa chọn nguồn':n===total?'Tất cả nguồn':`${n} nguồn được chọn`}function renderSources(){const m=$('sourceMenu');m.innerHTML='<div class="source-actions"><button id="allSources" type="button">Chọn tất cả nguồn</button><button id="noSources" type="button">Bỏ chọn tất cả nguồn</button></div>'+sources.map(s=>`<label class="source-item"><input type="checkbox" data-source="${s.id}" ${selected.has(s.id)?'checked':''}><span><span class="label">${s.label||s.name||s.id}</span>${s.description?`<div class="meta">${s.description}</div>`:''}</span></label>`).join('');m.querySelectorAll('input[data-source]').forEach(x=>x.onchange=async()=>{selected=new Set(await VocabularySourceSync.set([...m.querySelectorAll('input[data-source]:checked')].map(i=>i.dataset.source)));updateSummary();render()});$('allSources').onclick=async()=>{selected=new Set(await VocabularySourceSync.set(sources.map(s=>s.id)));renderSources();render()};$('noSources').onclick=async()=>{selected=new Set(await VocabularySourceSync.set([]));renderSources();render()};updateSummary()}function render(){const term=$('search').value.trim().toLowerCase(),shown=words.filter(w=>!term||w.word.toLowerCase().includes(term));$('count').textContent=`Hiển thị ${shown.length} / ${words.length} từ`;if(!shown.length){$('list').innerHTML='<div class="empty">Không có từ nào thuộc các nguồn đang chọn.</div>';return}$('list').innerHTML=shown.map(w=>`<article class="word-card"><div class="pic" data-img="${w.word}">${hint(w.word)}</div><div><div class="word">${w.word}</div><div class="meta loading" data-meta="${w.word}">Đang tải nghĩa · phiên âm…</div></div><button class="speak" data-speak="${w.word}" aria-label="Phát âm">🔊</button></article>`).join('');document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));hydrate()}async function hydrate(){await Promise.all([...document.querySelectorAll('.word-card')].map(async c=>{const w=c.querySelector('.word').textContent,m=await meta(w),u=await image(w),mm=c.querySelector('[data-meta]');mm.textContent=m.meaning+(m.ipa?' · '+m.ipa:'');mm.classList.remove('loading');if(u){const p=c.querySelector('[data-img]'),img=new Image();img.alt=w;img.onload=()=>p.replaceChildren(img);img.src=u}}))}$('sourceTrigger').onclick=()=>$('sourceMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.source-wrap'))$('sourceMenu').classList.remove('open')});$('search').oninput=render;(async()=>{try{selected=new Set(await VocabularySourceSync.init());sources=VocabularySourceSync.getSources();const data=await VocabularySourceSync.getData();words=(data.words||[]).filter(w=>(w.sourceIds||[]).some(id=>selected.has(id)));renderSources();render();$('sync').textContent='Nguồn học đã được đồng bộ trên cloud.';window.addEventListener('vocabularySourcesChanged',()=>{selected=new Set(VocabularySourceSync.getSelected());words=(data.words||[]).filter(w=>(w.sourceIds||[]).some(id=>selected.has(id)));renderSources();render()})}catch(e){$('sync').textContent='Không thể tải nguồn. Vui lòng thử lại.';console.error(e)}})();</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
