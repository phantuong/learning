<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đọc Hiểu · Tiếng Việt · Lớp 1</title><style>:root{--pink:#e85aa5;--ink:#29233f;--muted:#77677a;--line:#efd5e3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid #e2e6ee;padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:#182033;font-weight:850;font-size:21px;padding:8px 10px 18px}.brand span{font-size:26px;margin-right:6px}.nav-label{font-size:11px;font-weight:800;color:#98a2b3;text-transform:uppercase;padding:0 10px 7px}.nav{display:grid;gap:4px}.nav a,.grade-toggle{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#475467;font-weight:700;border:0;background:transparent;width:100%;font:inherit;text-align:left;cursor:pointer}.nav a:hover,.grade-toggle:hover{background:#f8faff}.nav a.active,.grade-toggle.current{background:#182033;color:#fff}.subnav{display:none;margin:1px 0 5px 15px;padding-left:13px;border-left:1px solid #e2e6ee}.subnav.open{display:grid;gap:3px}.subnav a{font-size:14px;padding:8px 9px}.course-list{display:grid;gap:2px;margin:2px 0 4px 12px;padding-left:12px;border-left:1px dashed #d7dce5}.course-list a{font-size:13px;font-weight:600}.course-list a.active{background:#f0f3ff;color:#182033}.main{margin-left:260px;min-height:100vh;padding:24px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:none;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #18203312}.overlay{display:none}.hero{text-align:center;padding:10px 0 18px}.hero-icon{font-size:52px}.hero h1{font-size:36px;margin:4px 0}.hero p{margin:0;color:var(--muted);font-size:16px}.story-card{background:#fffdfd;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px #dca9c522;overflow:hidden}.story-head{padding:20px 24px 14px;border-bottom:1px solid #f3e3eb;display:flex;align-items:center;justify-content:space-between}.story-number{font-weight:850;color:var(--pink)}.story-icon{font-size:44px}.story-body{padding:28px 34px 22px}.story-title{text-align:center;font-size:28px;margin:0 0 22px}.story-text{font-size:19px;line-height:1.9;letter-spacing:.01em}.questions{margin-top:26px;padding:20px;background:#fff6fa;border-radius:18px}.questions h2{font-size:20px;margin:0 0 14px}.q{padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:9px 0;font-weight:650;line-height:1.5}.actions{display:flex;justify-content:center;padding:18px 24px 26px;border-top:1px solid #f3e3eb}.next{width:100%;max-width:520px;border:0;border-radius:16px;padding:15px 22px;background:var(--pink);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 18px #e85aa544}.progress{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}.sync-status{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--muted);box-shadow:0 5px 18px #18203315;z-index:30}.sync-status button{border:0;background:var(--pink);color:#fff;border-radius:8px;padding:6px 9px;font-weight:700;margin-left:7px}@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:.22s;width:270px;box-shadow:12px 0 35px #18203322}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#18203355;z-index:15}.main{margin-left:0;padding:12px 14px 55px}.mobile-btn{display:block;margin-bottom:8px}.story-body{padding:22px 20px 18px}.story-title{font-size:24px}.story-text{font-size:18px;line-height:1.8}.story-head{padding:16px 18px}.hero h1{font-size:30px}}</style></head><body><div class="layout"><aside id="sidebar" class="sidebar"><a class="brand" href="index.html?home=1"><span>🎓</span>Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay" onclick="toggleNav()"></div><main class="main"><button class="mobile-btn" onclick="toggleNav()">☰</button><div class="wrap"><header class="hero"><div class="hero-icon">📖✨</div><h1>Đọc Hiểu</h1><p>500 câu chuyện khác nhau dành cho bé lớp 1</p></header><article class="story-card"><div class="story-head"><div class="story-number" id="storyNumber"></div><div class="story-icon" id="storyIcon"></div></div><div class="story-body"><h2 class="story-title" id="storyTitle"></h2><div class="story-text" id="storyText"></div><section class="questions"><h2>🧠 Câu hỏi đọc hiểu</h2><div id="questions"></div></section></div><div class="actions"><button class="next" id="nextBtn">Tiếp theo →</button></div></article><div class="progress" id="progress"></div></div></main></div><div id="syncStatus" class="sync-status">Chưa đăng nhập</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.LEARNING_SUPABASE_CONFIG={url:'https://ksqfcwjcijflvzzopkko.supabase.co',publishableKey:window.LEARNING_SUPABASE_PUBLISHABLE_KEY||''};</script><script src="sync.js"></script><script src="doc-hieu-data-v2.js"></script><script>const STORAGE_KEY="docHieuNextStory";let current=Number(localStorage.getItem(STORAGE_KEY)||1);if(!Number.isInteger(current)||current<1||current>500)current=1;const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));async function saveStory(){localStorage.setItem(STORAGE_KEY,current);if(window.learningSync)await learningSync.save({last_page:'doc-hieu.html',last_subject:'Tiếng Việt',last_course:'Đọc Hiểu',reading_story_current:current,reading_story_completed:Math.max(0,current-1)})}function render(){const s=DOC_HIEU_STORIES[current-1];if(!s)return;storyNumber.textContent=`Câu chuyện ${s.id}/500`;storyIcon.textContent=s.icon;storyTitle.textContent=s.title;storyText.innerHTML=`<p>${esc(s.text)}</p>`;questions.innerHTML=s.questions.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q)}</div>`).join("");progress.textContent=`Câu chuyện ${s.id} · Tiến độ được lưu tự động.`}nextBtn.onclick=async()=>{current=current===500?1:current+1;await saveStory();render();window.scrollTo({top:0,behavior:'smooth'})};function toggleNav(){sidebar.classList.toggle('open');overlay.classList.toggle('show')}function buildNav(){gradeNav.innerHTML='<div><button type="button" class="grade-toggle current" id="gradeBtn">📂 <span>Lớp 1</span><span style="margin-left:auto">⌃</span></button><div class="subnav open" id="grade1"><a href="english.html">🔤🌈 Tiếng Anh</a><div class="course-list"><a href="english.html">↳ Vocabulary Games</a><a href="vocabulary-list.html">↳ Vocabulary List</a></div><a href="math.html">➕ Toán</a><div class="course-list"><a href="cong-tru-10.html">↳ Cộng Trừ Phạm Vi 10</a><a href="so-sanh.html">↳ So sánh</a><a href="hinh-phang.html">↳ Hình phẳng</a></div><a href="doc-hieu.html" class="active">📖 Tiếng Việt · Đọc Hiểu</a><a href="class.html?grade=1">📚 Các môn học</a></div></div>'+Array.from({length:11},(_,i)=>`<div><a href="class.html?grade=${i+2}">📁 Lớp ${i+2}</a></div>`).join('');gradeBtn.onclick=()=>grade1.classList.toggle('open')}async function initSync(){if(!window.learningSync){syncStatus.textContent='Đồng bộ chưa cấu hình';return}const u=await learningSync.getUser().catch(()=>null);syncStatus.innerHTML=u?'☁️ Đã đăng nhập · đồng bộ tự động':'Chưa đăng nhập · chỉ lưu trên máy';if(u){const p=await learningSync.load().catch(()=>null);if(p&&Number.isInteger(p.reading_story_current)&&p.reading_story_current>=1&&p.reading_story_current<=500){current=p.reading_story_current;localStorage.setItem(STORAGE_KEY,current);render()}}await saveStory().catch(()=>{})}buildNav();render();initSync();</script></body></html>
