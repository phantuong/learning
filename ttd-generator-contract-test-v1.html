<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Generator Contract Test</title><style>body{font-family:system-ui;margin:16px;background:#f6f7f9}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}.ok{color:#087443}.bad{color:#b42318}</style></head><body><h1>Generator Contract Test</h1><div id="app">Running…</div><script src="ttd-generator-spec-v1.js"></script><script src="ttd-bank-audit-v2.js"></script><script src="ttd-multicondition-generator-v2.js"></script><script>const qs=TTD_MULTICONDITION_GENERATOR_V2.generate(32);const contract=qs.map(TTD_GENERATOR_SPEC_V1.validateContract);const audit=TTD_BANK_AUDIT_V2.audit({generated:qs},null);const passedContract=contract.filter(x=>x.valid).length;const passedAudit=audit.filter(x=>x.validation.valid).length;const dup=new Set(qs.map(q=>JSON.stringify({problem:q.problem,choices:q.choices}))).size;document.getElementById('app').innerHTML=`<div class="card"><h2 class="${passedContract===qs.length?'ok':'bad'}">Contract: ${passedContract}/${qs.length} PASS</h2><p>Every generated question has the required schema and 4 choices.</p></div><div class="card"><h2 class="${passedAudit===qs.length?'ok':'bad'}">Domain validation: ${passedAudit}/${qs.length} PASS</h2><p>Exactly one choice satisfies all conditions.</p></div><div class="card"><h2 class="${dup===qs.length?'ok':'bad'}">Uniqueness: ${dup}/${qs.length}</h2><p>Unique problem + choice signatures.</p></div><div class="card"><h3>Generator families</h3><p>shape + color · shape + position · three attributes · count</p></div>`;</script></body></html>
