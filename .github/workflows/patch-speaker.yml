name: Patch speaker interaction
on:
  push:
    paths:
      - '.github/workflows/patch-speaker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch speaker
        shell: python
        run: |
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.speak-inline:active{transform:scale(.93)}'
          new_css = '''.speak-inline:active{transform:scale(.93)}
          .speak-inline.pressed{background:#dbe4ff;border-color:#7c8edb;transform:scale(.94);box-shadow:inset 0 2px 5px #17203322,0 2px 6px #17203318}
          .speak-inline:disabled{cursor:default;opacity:1}'''
          if old_css in s and '.speak-inline.pressed{' not in s:
              s = s.replace(old_css, new_css, 1)
          old_js = '''function speak(word){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;u.pitch=1;window.speechSynthesis.speak(u)}'''
          new_js = '''let speakResetTimer=null,speakToken=0;
          function setSpeakerIdle(token){if(token!==speakToken)return;const b=$('speakBtn');if(!b)return;b.classList.remove('pressed');b.disabled=false;if(speakResetTimer){clearTimeout(speakResetTimer);speakResetTimer=null}}
          function speak(word){
            const b=$('speakBtn');
            if(!('speechSynthesis'in window)){if(b){b.classList.remove('pressed');b.disabled=false}return}
            if(!word)return;
            if(b){b.classList.add('pressed');b.disabled=true}
            const token=++speakToken;
            if(speakResetTimer)clearTimeout(speakResetTimer);
            window.speechSynthesis.cancel();
            const u=new SpeechSynthesisUtterance(word);
            u.lang='en-US';u.rate=.82;u.pitch=1;
            const done=()=>setSpeakerIdle(token);
            u.onend=done;u.onerror=done;
            const estimated=Math.max(900,Math.min(5000,word.length*95+700));
            speakResetTimer=setTimeout(done,estimated);
            setTimeout(()=>{if(token===speakToken)window.speechSynthesis.speak(u)},60);
          }'''
          if old_js not in s:
              raise SystemExit('Expected speak() implementation was not found; aborting to avoid damaging english.html')
          s = s.replace(old_js, new_js, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english.html
          git diff --cached --quiet || git commit -m 'Improve speaker pressed state and playback reliability'
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-speaker.yml
          git commit -m 'Remove one-time speaker patch workflow'
          git push
