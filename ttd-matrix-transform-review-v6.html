<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Matrix Transform v6</title><style>body{font-family:system-ui;margin:16px;background:#f5f7fa;color:#243447}.q{background:#fff;border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,100px);gap:5px}.cell{min-height:100px;border:1px solid #d6dde5;border-radius:10px;display:grid;place-items:center}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{border:1px solid #d6dde5;border-radius:10px;padding:5px;text-align:center}.ok{color:#16734a}.bad{color:#b42318}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:repeat(2,1fr)}svg{max-width:100%;height:auto}}</style></head><body><h1>Matrix Transform v6</h1><div id="app"></div><script src="ttd-matrix-transform-v6.js"></script><script src="ttd-matrix-transform-bank-v6.js"></script><script src="ttd-matrix-transform-validator-v6.js"></script><script>const qs=TTD_MATRIX_TRANSFORM_VALIDATOR_V6.validateBank(TTD_MATRIX_TRANSFORM_BANK_V6),app=document.getElementById('app');app.innerHTML=`<p><b>${qs.filter(q=>q.validation.valid).length}/${qs.length}</b> valid</p>`;for(const q of qs){app.innerHTML+=`<section class="q"><b>${q.id}</b> — L${q.level} — <span class="${q.validation.valid?'ok':'bad'}">${q.validation.valid?'VALID':'REJECTED'}</span><p>${q.question}</p><div class="grid">${q.problem.grid.flat().map(c=>`<div class="cell">${TTD_MATRIX_TRANSFORM_V6.render(c)}</div>`).join('')}</div><p>Đáp án:</p><div class="choices">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_MATRIX_TRANSFORM_V6.render(c)}</div>`).join('')}</div><small>${q.validation.errors.join(', ')}</small></section>`}</script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
