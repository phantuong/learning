<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTD Spatial Validator v4</title><style>body{font-family:system-ui;margin:20px;background:#f5f7fa;color:#243447}.summary,.q{background:#fff;border-radius:16px;padding:16px;margin:12px 0}.ok{color:#16734a}.bad{color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #d6dde5;border-radius:12px;padding:6px;text-align:center}svg{max-width:100%;height:auto}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Spatial Validator v4</h1><div id="app"></div><script src="ttd-spatial-v1.js"></script><script src="ttd-spatial-view-v2.js"></script><script src="ttd-spatial-validator-v4.js"></script><script src="ttd-spatial-bank-v4.js"></script><script src="ttd-spatial-choice-v2.js"></script><script>const all=[...TTD_SPATIAL_BANK_V4,...TTD_SPATIAL_BANK_V4_REJECTED],app=document.getElementById('app');app.innerHTML=`<div class="summary"><b>Published:</b> ${TTD_SPATIAL_BANK_V4.length} &nbsp; <b>Rejected:</b> ${TTD_SPATIAL_BANK_V4_REJECTED.length}</div>`;for(const q of all){const v=q.validation;app.innerHTML+=`<section class="q"><b>${q.id}</b> <span class="${v.valid?'ok':'bad'}">${v.valid?'✓ VALID':'✗ REJECTED'}</span><div>${v.errors.join(', ')||'No validation errors'}</div><div class="grid">${q.choices.map((c,i)=>`<div class="choice"><b>${String.fromCharCode(65+i)}</b>${TTD_SPATIAL_CHOICE_V2.render({type:'projection',cubes:c.cubes,view:c.view},120)}</div>`).join('')}</div></section>`}</script></body></html>
