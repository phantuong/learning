<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Cộng Trừ · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29243b;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#efdbe7;--green:#35b978;--red:#ee7180}*{box-sizing:border-box}body{margin:0;background:#fff5fa}main{min-height:100vh;padding:12px 14px 40px}.wrap{max-width:900px;margin:auto}.mobile-btn{display:block;border:0;background:#fff;width:44px;height:44px;border-radius:13px;font-size:23px;box-shadow:0 4px 15px #29243b12;cursor:pointer;margin-bottom:8px}.hero{text-align:center;padding:12px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:36px;margin:6px 0;color:var(--ink)}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:15px}.setting h3{margin:0 0 11px;font-size:17px}.choices{display:grid;gap:8px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(3,minmax(0,1fr))}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 7px;font-weight:800;color:#625c6c;cursor:pointer;line-height:1.15;min-width:0}.choice small{font-size:12px;font-weight:700}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start,.next{width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#fff;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.tip{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.quiz{display:none}.quiz.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800}.question{text-align:center;color:var(--muted);font-weight:750;font-size:17px}.equation{text-align:center;font-size:52px;font-weight:950;letter-spacing:1px;color:var(--ink);margin:24px 0 30px;word-break:break-word}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:70px;border:2px solid #ead3df;background:#fff;border-radius:18px;font-size:27px;font-weight:900;color:#514b5c;cursor:pointer}.answer.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.answer.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.write{text-align:center}.number-input{width:100%;max-width:360px;text-align:center;border:2px solid #cbd5e1;border-radius:18px;padding:15px;font-size:34px;font-weight:900;outline:none;background:#fff}.number-input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ec6fa825}.submit{width:100%;max-width:360px;margin:12px auto 0;display:block;border:0;border-radius:18px;padding:15px;font-size:19px;font-weight:900;color:#fff;background:#d9dce3;cursor:not-allowed}.submit.enabled{background:var(--pink);cursor:pointer}.mic-area{text-align:center}.mic{width:100px;height:100px;border:0;border-radius:50%;background:#eef2ff;color:#344b9b;font-size:43px;cursor:pointer;box-shadow:0 7px 0 #d9e1ff}.status{text-align:center;min-height:26px;margin-top:13px;color:var(--muted);font-weight:700}.feedback{text-align:center;min-height:38px;padding:15px 0;font-size:18px;font-weight:850}.feedback.good{color:#087443}.feedback.bad{color:#b4232e}.next{display:none;background:var(--ink);box-shadow:none}.next.show{display:block}.sequence-note{margin-top:12px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:760px){main{padding:12px 14px 35px}.hero h1{font-size:30px}.card{padding:16px;border-radius:22px}.settings{grid-template-columns:1fr;gap:12px}.setting{padding:12px;border-radius:18px}.setting h3{font-size:15px;margin-bottom:9px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges{grid-template-columns:repeat(2,minmax(0,1fr))}.ranges .choice:last-child{grid-column:1/-1}.operations,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{font-size:14px;padding:9px 5px}.choice small{font-size:11px}.equation{font-size:43px;margin:20px 0 25px}.answers{grid-template-columns:repeat(2,1fr)}.answer{min-height:68px;font-size:24px}.number-input,.submit{max-width:none}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="nav-label">Các lớp</div><nav class="nav" id="gradeNav"></nav></aside><div id="overlay" class="overlay"></div>
<main><button id="menuBtn" class="mobile-btn" aria-label="Mở navigation">☰</button><div class="wrap">
<header class="hero"><div class="emoji">➕➖</div><h1>Cộng Trừ</h1><p>Lớp 1 · Luyện tập liên tục</p></header>
<section id="setup" class="card"><div class="settings">
<div class="setting"><h3>🎯 Chọn level</h3><div class="choices levels" id="levels"></div></div>
<div class="setting"><h3>🔢 Phạm vi số</h3><div class="choices ranges" id="ranges"></div></div>
<div class="setting"><h3>➕➖ Phép tính</h3><div class="choices operations" id="operations"></div></div>
<div class="setting"><h3>✍️ Cách trả lời</h3><div class="choices modes" id="modes"></div></div>
</div><button id="startBtn" class="start">Bắt đầu luyện tập ✨</button><div class="tip">Không giới hạn số câu. Hệ thống tiếp tục tạo bài cho đến khi bé dừng lại.</div></section>
<section id="quiz" class="card quiz"></section>
</div></main>
<script>
const $=id=>document.getElementById(id);const PREF='learning_math_add_sub_preferences_v3';
const LEVELS=[['no-carry','Không Nhớ','Cộng/trừ theo từng hàng, không cần nhớ hoặc mượn'],['carry','Có Nhớ','Có ít nhất một lần nhớ hoặc mượn'],['three','3 Số','Biểu thức gồm 3 số'],['four','4 Số','Biểu thức gồm 4 số'],['sequential','Tuần Tự','Các phép tính xuất hiện lần lượt, không bỏ sót']];
const RANGES=[10,50,100,1000,Infinity,'result10'];const RANGE_LABELS=['0–10','0–50','0–100','0–1000','Không giới hạn','Kết quả 0 - 10'];
const OPS=[['add','Cộng'],['sub','Trừ'],['mixed','Cộng - Trừ']];const MODES=[['choice','Chọn Đáp Án'],['write','Viết Đáp Án'],['speak','Nói Đáp Án']];
let level='no-carry',range=10,operation='add',mode='choice',current=null,pos=0,score=0,answered=false,recognition=null;let cursorB=0,cursorOp=0;
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(LEVELS.some(x=>x[0]===p.level))level=p.level;if([10,50,100,1000,'inf','result10'].includes(p.range))range=p.range==='inf'?Infinity:p.range;if(OPS.some(x=>x[0]===p.operation))operation=p.operation;if(MODES.some(x=>x[0]===p.mode))mode=p.mode}catch(e){}
function save(){try{localStorage.setItem(PREF,JSON.stringify({level,range:Number.isFinite(range)?range:(range==='result10'?'result10':'inf'),operation,mode}))}catch(e){}}
function renderChoices(){$('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${x[0]===level?'on':''}" onclick="pickLevel('${x[0]}')">${x[1]}<br><small>${x[2]}</small></button>`).join('');$('ranges').innerHTML=RANGES.map((x,i)=>`<button class="choice ${x===range?'on':''}" onclick="pickRange(${i})">${RANGE_LABELS[i]}</button>`).join('');$('operations').innerHTML=OPS.map(x=>`<button class="choice ${x[0]===operation?'on':''}" onclick="pickOperation('${x[0]}')">${x[1]}</button>`).join('');$('modes').innerHTML=MODES.map(x=>`<button class="choice ${x[0]===mode?'on':''}" onclick="pickMode('${x[0]}')">${x[1]}</button>`).join('')}
function pickLevel(v){level=v;save();renderChoices()}function pickRange(i){range=RANGES[i];save();renderChoices()}function pickOperation(v){operation=v;save();renderChoices()}function pickMode(v){mode=v;save();renderChoices()}
function maxOperand(){if(range==='result10')return 10;if(Number.isFinite(range))return range;return 9999}function rand(max){return Math.floor(Math.random()*(max+1))}function digits(n){return String(Math.abs(n)).split('').reverse().map(Number)}
function resultAllowed(v){return range!=='result10'||(v>=0&&v<=10)}function pairQuestion(a,b,op){const v=op==='+'?a+b:a-b;return{display:`${a} ${op} ${b}`,answer:v,nums:[a,b],ops:[op]}}
function isNoCarry(a,b,sub){const da=digits(a),db=digits(b),len=Math.max(da.length,db.length);for(let i=0;i<len;i++){const x=da[i]??0,y=db[i]??0;if(sub?x<y:x+y>9)return false}return true}
function isCarry(a,b,sub){const da=digits(a),db=digits(b),len=Math.max(da.length,db.length);for(let i=0;i<len;i++){const x=da[i]??0,y=db[i]??0;if(sub?x<y:x+y>=10)return true}return false}
function nextSequential(){const max=maxOperand(),total=max+1;while(true){let op=operation==='add'?'+':operation==='sub'?'−':(cursorOp++%2===0?'+':'−');const a=Math.floor(cursorB/total),b=cursorB%total;cursorB++;if(a>max){cursorB=0;cursorOp=0;continue}if(op==='−'&&b>a)continue;const q=pairQuestion(a,b,op);if(resultAllowed(q.answer))return q}}
function nextCoveredPair(){const max=maxOperand(),total=max+1;while(true){const a=Math.floor(cursorB/total),b=cursorB%total;if(a>max){cursorB=0;cursorOp=0;continue}cursorB++;let op=operation==='add'?'+':operation==='sub'?'−':(cursorOp++%2===0?'+':'−');if(op==='−'&&b>a)continue;const q=pairQuestion(a,b,op);if(!resultAllowed(q.answer))continue;if(level==='no-carry'&&!isNoCarry(a,b,op==='−'))continue;if(level==='carry'&&!isCarry(a,b,op==='−'))continue;return q}}
function makeMulti(count){const max=maxOperand();for(let attempt=0;attempt<10000;attempt++){const nums=[],ops=[];let value=rand(max);nums.push(value);for(let i=1;i<count;i++){const op=operation==='add'?'+':operation==='sub'?'−':(Math.random()<.5?'+':'−');const n=op==='−'?rand(value):rand(max);nums.push(n);ops.push(op);value=op==='+'?value+n:value-n}if(resultAllowed(value))return{nums,ops,value}}return{nums:Array(count).fill(1),ops:Array(count-1).fill('+'),value:count}}
function nextQuestion(){if(level==='sequential')return nextSequential();if(level==='three'||level==='four'){const m=makeMulti(level==='three'?3:4);return{display:m.nums.map((n,i)=>i?` ${m.ops[i-1]} ${n}`:String(n)).join(''),answer:m.value,nums:m.nums,ops:m.ops}}return nextCoveredPair()}
function start(){stopRecognition();cursorB=0;cursorOp=0;pos=0;score=0;$('setup').classList.add('hidden');$('quiz').classList.add('show');render()}
function render(){stopRecognition();answered=false;current=nextQuestion();$('quiz').innerHTML=`<div class="top"><span>Câu ${pos+1}</span><span>Đúng: ${score}</span></div><div class="question">Tính kết quả</div><div class="equation">${current.display} = ?</div><div id="answerArea"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next">Câu tiếp theo →</button><div class="sequence-note">Bé có thể luyện tập liên tục, không giới hạn số câu.</div>`;if(mode==='choice')renderAnswers(current);else if(mode==='write')renderWrite();else renderSpeak()}
function renderAnswers(q){let values=new Set([q.answer]);const span=Number.isFinite(range)?Math.max(12,Math.min(100,range)):100;while(values.size<4)values.add(Math.floor(Math.random()*(span+1)));const arr=[...values].sort(()=>Math.random()-.5);$('answerArea').innerHTML='<div class="answers">'+arr.map(v=>`<button class="answer" data-value="${v}">${v}</button>`).join('')+'</div>'
$('answerArea').querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(Number(b.dataset.value),b))}
function renderWrite(){$('answerArea').innerHTML='<div class="write"><input id="numberInput" class="number-input" type="number" inputmode="numeric" placeholder="Đáp án"><button id="submitBtn" class="submit" disabled>Trả lời</button></div>';const input=$('numberInput'),btn=$('submitBtn');input.oninput=()=>{const ok=input.value.trim()!=='';btn.disabled=!ok;btn.classList.toggle('enabled',ok)};input.onkeydown=e=>{if(e.key==='Enter'&&input.value.trim()!=='')submit(Number(input.value),btn)};btn.onclick=()=>{if(input.value.trim()!=='')submit(Number(input.value),btn)};input.focus()}
function renderSpeak(){$('answerArea').innerHTML='<div class="mic-area"><button id="micBtn" class="mic" aria-label="Nói đáp án">🎙️</button><div id="status" class="status">Chạm micro và nói đáp án.</div></div>';$('micBtn').onclick=startListening}
function submit(value,el){if(answered)return;answered=true;const ok=value===current.answer;if(ok)score++;const fb=$('feedback');fb.textContent=ok?'🎉 Chính xác!':`💪 Chưa đúng. Đáp án là ${current.answer}.`;fb.className='feedback '+(ok?'good':'bad');if(el?.classList)el.classList.add(ok?'correct':'wrong');if(mode==='choice')document.querySelectorAll('.answer').forEach(b=>{if(Number(b.dataset.value)===current.answer)b.classList.add('correct')});if(mode==='write'){const input=$('numberInput'),btn=$('submitBtn');if(input)input.disabled=true;if(btn){btn.disabled=true;btn.classList.remove('enabled')}}$('quiz').querySelector('.top').lastElementChild.textContent=`Đúng: ${score}`;$('nextBtn').classList.add('show');if(mode==='speak')$('status').textContent=ok?'Đã nhận đáp án chính xác.':'Đã nhận đáp án.'}
function parseSpoken(text){const s=text.toLowerCase().trim().replace(/[.,!?]/g,'');const m=s.match(/-?\d+/);if(m)return Number(m[0]);const map={'không':0,'zero':0,'một':1,'mot':1,'one':1,'hai':2,'two':2,'ba':3,'three':3,'bốn':4,'bon':4,'four':4,'năm':5,'nam':5,'five':5,'sáu':6,'sau':6,'six':6,'bảy':7,'bay':7,'seven':7,'tám':8,'tam':8,'eight':8,'chín':9,'chin':9,'nine':9,'mười':10,'muoi':10};return s in map?map[s]:null}
function startListening(){if(answered)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('feedback').textContent='Trình duyệt này chưa hỗ trợ nhận diện giọng nói.';return}stopRecognition();recognition=new SR();recognition.lang='vi-VN';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=3;$('status').textContent='🎧 Đang nghe...';recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=(e.results[i][0]?.transcript||'')+' ';const v=parseSpoken(t);if(v===null){$('feedback').textContent='Mình chưa nhận ra số. Hãy thử lại.';answered=false}else submit(v,$('micBtn'))};recognition.onend=()=>{recognition=null};recognition.onerror=()=>{$('status').textContent='Không nghe rõ. Hãy thử lại.'};try{recognition.start()}catch(e){}}
function stopRecognition(){if(recognition){try{recognition.onend=null;recognition.stop()}catch(e){}recognition=null}}
$('startBtn').onclick=start;renderChoices();$('quiz').addEventListener('click',e=>{if(e.target.id==='nextBtn'){pos++;render()}});
</script><script src="app-nav.js"></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
