<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fb"><title>Sắp xếp chữ cái</title><style>body{font-family:system-ui;margin:0;background:#fff7fb;color:#172033}.main{max-width:860px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #eadce7;border-radius:28px;overflow:hidden}.panel{padding:20px}.top{text-align:center}.title{font-size:34px}.game{text-align:center;background:#fff8fc;border-radius:24px;padding:20px}.score{color:#667085}.progress{height:9px;background:#f0e3eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#ec5fa4}.meaning{font-size:20px;font-weight:750;color:#58657c}.picture{font-size:58px;min-height:65px}.speaker{border:0;background:#fff0f7;border:1px solid #f2bdd8;width:52px;height:52px;border-radius:50%;font-size:25px;cursor:pointer}.scrambled,.slots{display:grid;grid-template-columns:repeat(var(--letter-count,1),minmax(0,1fr));gap:clamp(4px,1.6vw,10px);width:100%;box-sizing:border-box;margin:15px 0}.letter,.slot{width:100%;min-width:0;box-sizing:border-box;height:clamp(42px,12vw,52px);border:2px solid #cbd5f5;background:#fff;border-radius:14px;font-size:clamp(18px,5.2vw,24px);font-weight:900;padding:0}.letter{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.letter.dragging{opacity:.3;cursor:grabbing}.slot{touch-action:none;-webkit-user-select:none;user-select:none}.slot.filled{cursor:grab;background:#ffe2f0;border-color:#ec5fa4}.letter.used{opacity:.22}.slots{padding:12px;border-radius:20px;background:#fff3f9;border:2px dashed #efb9d5;min-height:55px}.slot.drag-over{box-shadow:0 0 0 3px #ec5fa455;transform:scale(1.02)}.drag-ghost{position:fixed;z-index:99999;pointer-events:none;width:58px;height:58px;border-radius:14px;background:#ffb7d7;border:2px solid #ec5fa4;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 12px 28px #ec5fa455;transform:translate(-50%,-50%) scale(1.08)}.feedback{min-height:31px;margin:14px;font-size:18px;font-weight:800}.good{color:#087443}.bad{color:#c5222f}.actions{display:flex;gap:10px}.action{flex:1;border:0;border-radius:17px;padding:14px;font-weight:850;cursor:pointer}.check{background:#172033;color:#fff}.next{background:#ec5fa4;color:#fff}.hidden{display:none!important}.setup{display:none!important}.start{border:0;border-radius:18px;padding:15px 28px;background:#ec5fa4;color:#fff;font-size:20px;font-weight:850}@media(max-width:760px){.main{padding:12px}.title{font-size:29px}.game{padding:16px 12px}.scrambled,.slots{gap:6px}.slots{padding:10px}.actions{flex-direction:column}}@media(max-width:380px){.game{padding-left:9px;padding-right:9px}.scrambled,.slots{gap:4px}.slots{padding:8px}.letter,.slot{border-width:1.5px;border-radius:11px}.drag-ghost{width:46px;height:48px;font-size:22px}}</style></head><body><main class="main"><header class="top"><h1 class="title">🔤 Sắp xếp chữ cái</h1><p>Kéo các chữ cái vào ô bên dưới để tạo thành từ đúng.</p></header><div class="card"><section id="setup" class="panel setup" aria-hidden="true"><h2>⭐ Từ được chọn trong Vocabulary List</h2><p id="setupText">Đang tải…</p><button id="startBtn" class="start" type="button">Bắt đầu chơi ✨</button></section><section id="game" class="panel hidden"><div class="game"><div class="score">Câu <span id="qNo">1</span>/<span id="qTotal">0</span> · ⭐ <span id="score">0</span></div><div class="progress"><i id="progressBar"></i></div><h2>Sắp xếp thành từ đúng</h2><div id="meaning" class="meaning"></div><div id="picture" class="picture">✨</div><button id="speaker" class="speaker" type="button" aria-label="Nghe từ">🔊</button><div id="scrambled" class="scrambled"></div><div id="slots" class="slots"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="checkBtn" class="action check">Trả lời</button><button id="nextBtn" class="action next hidden">Tiếp theo →</button></div></div></section><section id="done" class="panel hidden" style="text-align:center"><h2>🎉 Hoàn thành!</h2><p id="doneText"></p><button id="restartBtn" class="start">Chơi lại</button></section></div></main><script src="sync.js"></script><script>const SELECTED_KEY='grade1EnglishSelectedWords',EMOJI={apple:'🍎',banana:'🍌',orange:'🍊',cake:'🍰',bread:'🍞',milk:'🥛',water:'💧',juice:'🧃',egg:'🥚',rice:'🍚',fish:'🐟',chicken:'🍗',dog:'🐶',cat:'🐱',bird:'🐦',lion:'🦁',duck:'🦆',deer:'🦌',tiger:'🐯',monkey:'🐵',elephant:'🐘',rabbit:'🐰',bear:'🐻',panda:'🐼',book:'📚',pen:'🖊️',pencil:'✏️',ruler:'📏',bag:'🎒',chair:'🪑',desk:'🖥️',window:'🪟',door:'🚪',school:'🏫',teacher:'👩‍🏫',friend:'🧒',family:'👨‍👩‍👧‍👦',ball:'⚽',robot:'🤖',boat:'⛵',scooter:'🛴',kite:'🪁',happy:'😊',sad:'😢',sunny:'☀️',rainy:'🌧️',hot:'🥵',cold:'🥶',red:'🔴',yellow:'🟡',green:'🟢',pink:'🩷',purple:'🟣',blue:'🔵',black:'⚫',white:'⚪',brown:'🟤'};let allWords=[],questions=[],qi=0,score=0,answer=[],answered=false;const $=id=>document.getElementById(id);function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function selectedWords(){try{let r=JSON.parse(localStorage.getItem(SELECTED_KEY)||'[]');return Array.isArray(r)?r.map(x=>typeof x==='string'?x:(x?.word||x?.text||'')).filter(w=>/^[a-z]+$/i.test(w)).map(w=>w.toLowerCase()):[]}catch(e){return[]}}function speakWord(w){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}catch(e){}}let ac=null;function ctx(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}function beep(){let c=ctx();if(!c)return;let t=c.currentTime;[300,210].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(f,t+i*.20);g.gain.setValueAtTime(.0001,t+i*.20);g.gain.exponentialRampToValueAtTime(.18,t+i*.20+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.20+.18);o.connect(g);g.connect(c.destination);o.start(t+i*.20);o.stop(t+i*.20+.20)});let o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(110,t+.42);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.43);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.45)}function make(){let p=shuffle(allWords);questions=p.map(w=>{w=w.toLowerCase();return{word:w,letters:shuffle(w.split(''))}})}function setLetterCount(el,count){el.style.setProperty('--letter-count',Math.max(1,count))}function render(){let q=questions[qi];answer=Array(q.word.length).fill(null);answered=false;$('qNo').textContent=qi+1;$('score').textContent=score;$('progressBar').style.width=((qi+1)/Math.max(1,questions.length))*100+'%';$('meaning').textContent='Nghĩa: '+(window.VOCA_MEANINGS?.[q.word]||'');$('picture').textContent=EMOJI[q.word]||'✨';$('feedback').textContent='';$('feedback').className='feedback';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=true;$('nextBtn').classList.add('hidden');let h=$('scrambled');setLetterCount(h,q.word.length);h.innerHTML='';q.letters.forEach((ch,i)=>{let b=document.createElement('button');b.className='letter';b.textContent=ch.toLowerCase();b.dataset.i=i;b.onclick=()=>{if(!window.__sortJustDragged)place(i)};h.appendChild(b)});drawSlots();bindDrag()}function drawSlots(){let h=$('slots');setLetterCount(h,questions[qi].word.length);h.innerHTML='';answer.forEach((x,i)=>{let s=document.createElement('button');s.className='slot '+(x?'filled':'');s.textContent=x?.char?.toLowerCase()||'';s.dataset.slot=i;s.onclick=()=>{if(!answered&&!window.__sortJustDragged){answer[i]=null;update()}};h.appendChild(s)});document.querySelectorAll('.letter').forEach(b=>b.classList.toggle('used',answer.some(x=>x&&x.i==b.dataset.i)));$('checkBtn').disabled=answer.some(x=>x===null)||answered}function place(i){if(answered)return;let old=answer.findIndex(x=>x&&x.i==i);if(old>=0)answer[old]=null;let slot=answer.findIndex(x=>x===null);if(slot>=0)answer[slot]={i,char:questions[qi].letters[i]};update()}function placeAt(i,targetSlot){if(answered)return;let source=answer.findIndex(x=>x&&x.i==i);if(source===targetSlot)return;if(source>=0)answer[source]=null;let existing=answer[targetSlot];if(existing&&source<0){let empty=answer.findIndex(x=>x===null);if(empty>=0)answer[empty]=existing;else return}else if(existing&&source>=0){answer[source]=existing}answer[targetSlot]={i,char:questions[qi].letters[i]};update()}function update(){drawSlots()}function bindDrag(){document.querySelectorAll('.letter,.slot.filled').forEach(el=>{if(el.dataset.dragBound==='1')return;el.dataset.dragBound='1';el.addEventListener('pointerdown',dragStart,{passive:false})})}function dragStart(e){if(answered)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const source=this;const isLetter=source.classList.contains('letter');const letterIndex=isLetter?Number(source.dataset.i):Number(answer[Number(source.dataset.slot)]?.i);if(!Number.isInteger(letterIndex)||letterIndex<0)return;const startX=e.clientX,startY=e.clientY;let dragging=false,ghost=null;const clearTargets=()=>document.querySelectorAll('.slot.drag-over').forEach(x=>x.classList.remove('drag-over'));const move=ev=>{if(!dragging){if(Math.hypot(ev.clientX-startX,ev.clientY-startY)<5)return;dragging=true;window.__sortJustDragged=true;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=questions[qi].letters[letterIndex].toLowerCase();document.body.appendChild(ghost);source.classList.add('dragging')}ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';clearTargets();const under=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(under)under.classList.add('drag-over')};const end=ev=>{document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',end,true);document.removeEventListener('pointercancel',end,true);clearTargets();if(ghost)ghost.remove();source.classList.remove('dragging');if(!dragging){window.__sortJustDragged=false;return}const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(target){placeAt(letterIndex,Number(target.dataset.slot))}else if(isLetter){place(letterIndex)}setTimeout(()=>window.__sortJustDragged=false,80)};document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true)}function check(){let q=questions[qi],got=answer.map(x=>x?.char||'').join('');if(got===q.word){answered=true;score++;$('score').textContent=score;$('feedback').className='feedback good';$('feedback').textContent='🎉 Chính xác!';speakWord(q.word);$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden')}else{answered=false;$('feedback').className='feedback bad';$('feedback').textContent='💪 Chưa đúng! Hãy thử lại nhé.';beep();$('checkBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');$('checkBtn').disabled=false}}function start(){allWords=selectedWords();if(!allWords.length)return;score=0;qi=0;make();$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}$('speaker').onclick=()=>speakWord(questions[qi].word);$('checkBtn').onclick=check;$('nextBtn').onclick=()=>{qi++;if(qi>=questions.length){qi=0;score=0;make()}render()};$('startBtn').onclick=start;$('restartBtn').onclick=()=>{qi=0;score=0;make();$('done').classList.add('hidden');$('game').classList.remove('hidden');render()};allWords=selectedWords();</script><script src="vocabulary-games-source-bridge.js?v=20261006v11"></script><script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script></body></html>
