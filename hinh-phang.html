<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hình phẳng · Toán lớp 1</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25253a;background:#fff5fa;--pink:#ec5fa4;--ink:#29243b;--muted:#777487;--line:#f0dbe7;--green:#35b978;--red:#ee7180}
*{box-sizing:border-box}body{margin:0;background:#fff5fa}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:20;overflow:auto}.brand{display:block;text-decoration:none;color:var(--ink);font-weight:900;font-size:21px;padding:8px 10px 18px}.navlabel{font-size:11px;font-weight:800;color:#aaa1ad;text-transform:uppercase;padding:0 10px 7px}.nav a,.grade{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-decoration:none;color:#5e5969;font-weight:700}.grade{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.nav a.active{background:var(--ink);color:#fff}.sub{display:none;margin:2px 0 6px 15px;padding-left:13px;border-left:1px solid var(--line)}.sub.open{display:grid;gap:3px}.sub a{font-size:14px;padding:8px 9px;border-radius:9px}.courses{display:grid;gap:2px;margin:0 0 4px 12px;padding-left:12px;border-left:1px dashed #ead9e3}.courses a{font-size:13px}.main{margin-left:260px;padding:20px;min-height:100vh}.wrap{max-width:900px;margin:auto}.mobile{display:none;border:0;background:#fff;border-radius:14px;padding:10px 13px;font-size:22px;box-shadow:0 5px 20px #4d274012}.hero{text-align:center;padding:18px 0 20px}.hero .emoji{font-size:46px}.hero h1{font-size:35px;margin:5px 0}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 28px #d84d9410}.settings{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:20px}.setting{background:#fff9fc;border:1px solid var(--line);border-radius:20px;padding:16px}.setting h3{margin:0 0 11px;font-size:16px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1.5px solid #e7c9d9;background:#fff;border-radius:13px;padding:10px 13px;font-weight:750;color:#625c6c;cursor:pointer}.choice.on{background:#ffe0ef;border-color:var(--pink);color:#c83b80}.start,.again{width:100%;border:0;border-radius:16px;padding:14px;background:var(--pink);color:white;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 6px 14px #ec5fa444}.quiz{display:none}.quiz.show{display:block}.setup.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:750}.bar{height:8px;background:#f1e4eb;border-radius:99px;overflow:hidden;margin:10px 0 28px}.bar i{display:block;height:100%;background:var(--pink);transition:.2s}.question{text-align:center;font-size:22px;font-weight:850;color:#575163;margin-bottom:18px}.shape-box{min-height:230px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffafd,#fff);border:1px solid #f4e2eb;border-radius:22px;margin:8px 0 20px;padding:18px}.shape-box svg{width:min(250px,70vw);height:min(190px,50vw)}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #ead3df;background:#fff;border-radius:18px;padding:15px 8px;font-size:18px;font-weight:850;color:#514b5c;cursor:pointer}.ans:hover{border-color:var(--pink)}.ans.correct{background:#e9f9f0;border-color:var(--green);color:#087443}.ans.wrong{background:#fff0f2;border-color:var(--red);color:#b4232e}.feedback{text-align:center;min-height:48px;padding:14px 0;font-weight:850;font-size:18px}.next{display:none;width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:white;font-weight:850;font-size:18px;cursor:pointer}.next.show{display:block}.count-scene{width:min(100%,650px);height:260px;position:relative;margin:auto}.shape-item{position:absolute;display:flex;align-items:center;justify-content:center}.shape-item svg{width:100%;height:100%}.count-prompt{font-size:21px;text-align:center;font-weight:850;color:#575163;margin-bottom:14px}.parts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 20px}.part{background:#fff8fc;border:1px solid #f0dbe7;border-radius:14px;padding:8px 12px;font-weight:800;color:#75687a}.complex{width:min(100%,600px);height:270px;display:block;margin:auto}.hint{margin-top:14px;background:#fff5fa;border-radius:16px;padding:12px;color:#756c78;font-size:13px;text-align:center}.result{text-align:center}.stars{font-size:46px}.result h2{font-size:29px;margin:8px}.result p{color:var(--muted);font-size:17px}
@media(max-width:760px){.side{transform:translateX(-105%);transition:.2s;box-shadow:10px 0 30px #3b213022}.side.open{transform:translateX(0)}.main{margin:0;padding:12px 14px 35px}.mobile{display:block}.card{padding:18px;border-radius:22px}.hero h1{font-size:30px}.answers{grid-template-columns:repeat(2,1fr)}.ans{padding:14px 4px}.shape-box{min-height:200px}.count-scene{height:230px}.complex{height:230px}}
</style></head>
<body>
<aside id="side" class="side"><a class="brand" href="index.html">🎓 Learning Hub</a><div class="navlabel">Các lớp</div><nav class="nav" id="nav"></nav></aside>
<main class="main"><button class="mobile" onclick="toggleNav()">☰</button><div class="wrap">
<header class="hero"><div class="emoji">🔺🟦⭕💗</div><h1>Hình phẳng</h1><p>Nhận biết, đếm và khám phá các hình phẳng cơ bản</p></header>
<section class="card setup" id="setup"><div class="settings"><div class="setting"><h3>🎯 Chọn mức luyện tập</h3><div class="choices" id="levels"></div></div></div><button class="start" onclick="startQuiz()">Bắt đầu luyện tập ✨</button><div class="hint">Mỗi bài gồm 10 câu. Câu hỏi được trộn tự động để bé luyện nhiều dạng khác nhau.</div></section>
<section class="card quiz" id="quiz"></section>
</div></main>
<script src="app-nav.js"></script>
<script>
const LEVELS=[['1','Nhận biết hình'],['2','Đếm hình'],['3','Đặc điểm hình'],['4','Ghép & chia hình'],['5','Hình trong hình'],['6','Tổng hợp']];
const SHAPES={circle:{name:'hình tròn',emoji:'⭕'},triangle:{name:'hình tam giác',emoji:'🔺'},square:{name:'hình vuông',emoji:'🟦'},rectangle:{name:'hình chữ nhật',emoji:'▭'}};
let level=Number(localStorage.getItem('flatShapeLevel')||1),qs=[],pos=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function choices(){$('levels').innerHTML=LEVELS.map(x=>`<button class="choice ${+x[0]===level?'on':''}" onclick="pickLevel(${x[0]})">Mức ${x[0]}<br><small>${x[1]}</small></button>`).join('')}
function pickLevel(v){level=+v;localStorage.setItem('flatShapeLevel',level);choices()}
function rnd(n){return Math.floor(Math.random()*n)}
function pickShape(){return Object.keys(SHAPES)[rnd(4)]}
function svgShape(type,x=0,y=0,w=100,h=100,fill='#ffd7e9',stroke='#ec5fa4',sw=4){if(type==='circle')return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${Math.min(w,h)*.38}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;if(type==='triangle')return `<polygon points="${x+w/2},${y+h*.12} ${x+w*.12},${y+h*.88} ${x+w*.88},${y+h*.88}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;return `<rect x="${x+w*.12}" y="${y+h*.12}" width="${w*.76}" height="${h*.76}" rx="${type==='square'?8:3}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}
function shapeSVG(type,rot=0){return `<svg viewBox="0 0 240 180" aria-label="${SHAPES[type].name}"><g transform="rotate(${rot} 120 90)">${svgShape(type,45,15,150,150)}</g></svg>`}
function simpleQ(){const t=pickShape();return{kind:'identify',prompt:'Đây là hình gì?',visual:shapeSVG(t,[-10,0,10,20][rnd(4)]),answer:t,opts:shuffle([t,...shuffle(Object.keys(SHAPES).filter(x=>x!==t)).slice(0,3)])}}
function countQ(){const wanted=pickShape(),count=2+rnd(5),types=[];for(let i=0;i<4;i++)types.push(wanted);for(let i=0;i<Math.min(7,3+rnd(5));i++)types.push(pickShape());shuffle(types);const items=types.map((t,i)=>{const x=25+rnd(550),y=20+rnd(190),s=35+rnd(25);return `<g transform="translate(${x} ${y})">${svgShape(t,0,0,s,s,t===wanted?'#ffd7e9':'#e6edff',t===wanted?'#ec5fa4':'#7f91c7',3)}</g>`}).join('');const actual=types.filter(t=>t===wanted).length;return{kind:'count',prompt:`Có bao nhiêu ${SHAPES[wanted].name} trong hình?`,visual:`<svg class="count-scene" viewBox="0 0 650 260"><rect x="2" y="2" width="646" height="256" rx="22" fill="#fffafd" stroke="#f0dbe7"/>${items}</svg>`,answer:String(actual),opts:shuffle([actual,Math.max(1,actual-1),actual+1,actual+2].map(String))}}
function propertyQ(){const t=pickShape();const data={circle:['Không có cạnh','1 cạnh cong','0 góc'],triangle:['3 cạnh','3 góc','3'],square:['4 cạnh bằng nhau','4 góc','4'],rectangle:['4 cạnh','2 cạnh dài và 2 cạnh ngắn','4']};let prompt,answer,opts;if(t==='circle'){prompt='Hình tròn có bao nhiêu góc?';answer='0';opts=['0','1','2','3']}else if(t==='triangle'){prompt='Hình tam giác có bao nhiêu cạnh?';answer='3';opts=['2','3','4','5']}else if(t==='square'){prompt='Hình vuông có bao nhiêu cạnh?';answer='4';opts=['3','4','5','6']}else{prompt='Hình chữ nhật có bao nhiêu cạnh?';answer='4';opts=['3','4','5','6']}return{kind:'property',prompt,visual:shapeSVG(t),answer,opts:shuffle(opts)} }
function partitionQ(){const t=Math.random()<.5?'square':'rectangle';const pieces=2+rnd(3);let lines='';if(pieces===2)lines=`<line x1="120" y1="20" x2="120" y2="160"/>`;else lines=`<line x1="80" y1="20" x2="80" y2="160"/><line x1="160" y1="20" x2="160" y2="160"/>`;return{kind:'complex',prompt:`Hình này được chia thành bao nhiêu phần?`,visual:`<svg class="complex" viewBox="0 0 240 180"><rect x="30" y="20" width="180" height="140" rx="3" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="5"/> <g stroke="#ec5fa4" stroke-width="4">${lines}</g></svg>`,answer:String(pieces),opts:shuffle([String(pieces),String(pieces+1),String(Math.max(2,pieces-1)),String(pieces+2)])}}
function complexCountQ(){const t=pickShape();let visual,answer;if(t==='rectangle'){visual=`<svg class="complex" viewBox="0 0 300 190"><rect x="35" y="35" width="230" height="120" fill="#e6edff" stroke="#697fc0" stroke-width="4"/><line x1="150" y1="35" x2="150" y2="155" stroke="#ec5fa4" stroke-width="4"/></svg>`;answer='3'}else if(t==='square'){visual=`<svg class="complex" viewBox="0 0 300 190"><rect x="80" y="15" width="140" height="140" fill="#ffd7e9" stroke="#ec5fa4" stroke-width="4"/><line x1="80" y1="85" x2="220" y2="85" stroke="#697fc0" stroke-width="4"/></svg>`;answer='3'}else{visual=shapeSVG(t);answer='1'}return{kind:'complex',prompt:t==='rectangle'?'Có tất cả bao nhiêu hình chữ nhật trong hình?':t==='square'?'Có tất cả bao nhiêu hình vuông trong hình?':'Có bao nhiêu hình trong hình?',visual,answer,opts:shuffle([answer,String(+answer+1),String(Math.max(1,+answer-1)),String(+answer+2)])}}
function composeQ(){const a=pickShape(),b=pickShape();return{kind:'identify',prompt:'Hình lớn được tạo bởi những hình nào?',visual:`<svg class="shape-box" viewBox="0 0 300 190"><g>${svgShape(a,35,20,100,100,'#ffd7e9','#ec5fa4',4)}${svgShape(b,145,50,100,100,'#e6edff','#697fc0',4)}</g></svg>`,answer:`${SHAPES[a].name} và ${SHAPES[b].name}`,opts:shuffle([`${SHAPES[a].name} và ${SHAPES[b].name}`,`${SHAPES[a].name} và hình tròn`,`hình vuông và hình tam giác`,`hình tròn và hình chữ nhật`])}}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function makeQuestion(){if(level===1)return simpleQ();if(level===2)return countQ();if(level===3)return propertyQ();if(level===4)return partitionQ();if(level===5)return complexCountQ();const fs=[simpleQ,countQ,propertyQ,partitionQ,complexCountQ,composeQ];return fs[rnd(fs.length)]()}
function build(){qs=[];for(let i=0;i<10;i++)qs.push(makeQuestion());pos=0;score=0}
function startQuiz(){build();$('setup').classList.add('hide');$('quiz').classList.add('show');render()}
function render(){answered=false;const q=qs[pos];let content=`<div class="top"><span>Câu ${pos+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${pos*10}%"></i></div><div class="question">${q.prompt}</div>`;content+=q.visual?`<div class="shape-box">${q.visual}</div>`:'';if(q.kind==='count'||q.kind==='complex')content+=`<div class="answers">${q.opts.map(o=>`<button class="ans" onclick="answer(this,'${escapeAttr(o)}')">${o}</button>`).join('')}</div>`;else content+=`<div class="answers">${q.opts.map(o=>`<button class="ans" onclick="answer(this,'${escapeAttr(o)}')">${o}</button>`).join('')}</div>`;content+=`<div id="fb" class="feedback"></div><button id="next" class="next" onclick="nextQuestion()">Tiếp theo →</button>`;$('quiz').innerHTML=content}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/'/g,"&#39;").replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function answer(btn,value){if(answered)return;answered=true;const q=qs[pos],ok=value===q.answer;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(ok){score++;btn.classList.add('correct');$('fb').textContent='🎉 Chính xác!';$('fb').style.color='#087443'}else{btn.classList.add('wrong');$('fb').textContent=`💪 Chưa đúng. Đáp án: ${q.answer}`;$('fb').style.color='#b4232e'}$('next').classList.add('show')}
function nextQuestion(){if(pos<9){pos++;render()}else{showResult()}}
function showResult(){$('quiz').innerHTML=`<div class="result"><div class="stars">${score>=9?'🌟🌟🌟':score>=7?'🌟🌟':'🌟'}</div><h2>Hoàn thành!</h2><p>Bé trả lời đúng <b>${score}/10</b> câu.</p><button class="again" onclick="startQuiz()">Luyện lại ✨</button></div>`}
choices();
function toggleNav(){document.getElementById('side')?.classList.toggle('open')}
</script>
</body></html>
