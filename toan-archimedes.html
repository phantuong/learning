<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toán Archimedes</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--pink:#e85aa5;--pink2:#fff2f8;--ink:#28233f;--line:#efcfe0;--green:#25a66a}
body{background:#fff7fb;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.arch-wrap{max-width:980px;margin:0 auto;padding:24px 18px 48px}.hero{text-align:center}.hero-icon{font-size:54px}.hero h1{margin:4px 0;font-size:38px}.hero p{margin:8px 0 24px;color:#8c7890}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.book{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px 16px;cursor:pointer;transition:.18s;box-shadow:0 5px 16px #e8c7d71f}.book:hover{transform:translateY(-3px);box-shadow:0 10px 24px #e8c7d744}.book .num{font-size:38px;font-weight:900;color:var(--pink)}.book h2{margin:6px 0 4px}.book p{margin:0;color:#907f8d;font-size:14px}.book .badge{display:inline-block;margin-top:14px;padding:5px 10px;border-radius:999px;background:var(--pink2);font-size:12px}.viewer{display:none}.viewer.active{display:block}.back{border:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;color:var(--ink);cursor:pointer;margin-bottom:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:16px;position:sticky;top:8px;z-index:5}.toolbar strong{font-size:18px}.toolbar button{border:0;background:var(--pink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.page-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 24px #e8c7d72b}.sheet{max-width:820px;margin:auto;background:#fffdf8;border:1px solid #e8d9ca;padding:28px 30px;border-radius:8px;box-shadow:0 2px 8px #00000012;min-height:680px}.sheet-head{display:flex;justify-content:space-between;border-bottom:3px solid #f3b45f;padding-bottom:8px;color:#26608d;font-weight:900}.week{display:inline-block;background:#fff0c8;padding:5px 10px;transform:rotate(-2deg)}.lesson{text-align:center;color:#e35445;font-weight:900;font-size:20px;margin:14px}.exercise{margin:20px 0}.exercise h3{font-size:17px;color:#2d4770;margin:0 0 10px}.exercise p{line-height:1.7}.blank{display:inline-block;width:74px;height:32px;border:2px solid #d9b9c8;border-radius:7px;background:#fff;text-align:center;font-size:18px;font-weight:800;vertical-align:middle}.blank:focus{outline:3px solid #ffd0e7;border-color:var(--pink)}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{border:2px solid #dfc5d3;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.choice.selected{border-color:var(--pink);background:#ffe3f0}.grid{display:grid;gap:2px;width:max-content}.cell{width:42px;height:42px;border:1px solid #777;background:#fff;text-align:center;display:flex;align-items:center;justify-content:center}.shape-row{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}.svgbox{width:150px;height:100px}.check{margin-top:20px;text-align:center}.check button{background:var(--pink);color:#fff;border:0;border-radius:14px;padding:13px 32px;font-size:17px;font-weight:900;cursor:pointer}.feedback{font-weight:800;margin-top:10px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.pager button{border:0;background:var(--pink);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer}.note{font-size:13px;color:#917e8b;text-align:center;margin-top:12px}@media(max-width:720px){.books{grid-template-columns:repeat(2,1fr)}.sheet{padding:18px 14px}.toolbar{position:static}.hero h1{font-size:30px}}
@media(max-width:430px){.books{grid-template-columns:1fr}.book{text-align:center}}
</style>
</head>
<body>
<div class="arch-wrap">
<header class="hero"><div class="hero-icon">📚🔢</div><h1>Toán Archimedes</h1><p>Học toán theo 4 quyển sách Archimedes · tương tác trên màn hình</p></header>
<section id="bookHome">
<div class="books">
<button class="book" data-book="1"><div class="num">①</div><h2>Toán 1</h2><p>Quyển 1 · Số và tư duy</p><span class="badge">50 trang</span></button>
<button class="book" data-book="2"><div class="num">②</div><h2>Toán 2</h2><p>Quyển 2 · Cộng, trừ &amp; bài toán</p><span class="badge">50 trang</span></button>
<button class="book" data-book="3"><div class="num">③</div><h2>Toán 3</h2><p>Quyển 3 · Hình học &amp; tư duy</p><span class="badge">56 trang</span></button>
<button class="book" data-book="4"><div class="num">④</div><h2>Toán 4</h2><p>Quyển 4 · Nâng cao</p><span class="badge">58 trang</span></button>
</div>
<p class="note">Các trang bài tập được tái dựng bằng HTML/CSS/SVG; ô trống và câu trắc nghiệm có thể tương tác.</p>
</section>
<section id="viewer" class="viewer">
<button class="back" id="backBtn">← Chọn quyển khác</button>
<div class="toolbar"><strong id="bookTitle">Toán 1</strong><div><button id="prev">← Trang trước</button> <button id="next">Trang sau →</button></div></div>
<div class="page-card"><div class="sheet" id="sheet"></div></div>
<div class="pager"><span id="pageLabel">Trang 3 / 50</span><button id="check">✓ Kiểm tra câu trả lời</button></div><div class="feedback" id="feedback"></div>
</section>
</div>
<script>
const books={1:{pages:50,title:'Toán 1 · Quyển 1'},2:{pages:50,title:'Toán 1 · Quyển 2'},3:{pages:56,title:'Toán 1 · Quyển 3'},4:{pages:58,title:'Toán 1 · Quyển 4'}};
let book=1,page=3;const home=document.getElementById('bookHome'),viewer=document.getElementById('viewer'),sheet=document.getElementById('sheet'),feedback=document.getElementById('feedback');
function svgShape(type){if(type==='triangle')return `<svg class="svgbox" viewBox="0 0 150 100"><polygon points="75,8 140,90 10,90" fill="#ffd86b" stroke="#d99726" stroke-width="4"/></svg>`;return `<svg class="svgbox" viewBox="0 0 150 100"><rect x="20" y="18" width="110" height="70" rx="3" fill="#c8e8ff" stroke="#4975a5" stroke-width="4"/></svg>`}
function render(){const b=books[book];document.getElementById('bookTitle').textContent=b.title;document.getElementById('pageLabel').textContent=`Trang ${page} / ${b.pages}`;feedback.textContent='';
if(page===3){sheet.innerHTML=`<div class="sheet-head"><span class="week">TUẦN 1</span><span>TIẾT 1</span></div><div class="exercise"><h3>Bài 1. Viết số lượng chấm tròn theo mẫu:</h3><div class="shape-row"><span>••• → <input class="blank" data-answer="3"></span><span>••••• → <input class="blank" data-answer="5"></span><span>•• → <input class="blank" data-answer="2"></span></div></div><div class="exercise"><h3>Bài 2. Điền số thích hợp vào ô trống:</h3><p>1 + <input class="blank" data-answer="2"> = 3 &nbsp;&nbsp; 4 + <input class="blank" data-answer="3"> = 7</p><p>9 − <input class="blank" data-answer="4"> = 5 &nbsp;&nbsp; 6 − <input class="blank" data-answer="2"> = 4</p></div><div class="exercise"><h3>Bài 3. Nối các điểm theo thứ tự từ 1 đến 10.</h3><p class="note">Khu vực tương tác sẽ được dựng thành SVG ở các trang hình học.</p></div><div class="exercise"><h3>Bài 4. An đứng thứ tư trong hàng. Có mấy bạn đứng trước An?</h3><div class="choices"><button class="choice" data-answer="2">2</button><button class="choice" data-answer="3">3</button><button class="choice" data-answer="4">4</button></div></div>`}
else if(page===4){sheet.innerHTML=`<div class="sheet-head"><span>ARCHIMEDES SCHOOL</span><span>TIẾT 2</span></div><div class="exercise"><h3>Bài 1. Điền số để mỗi hàng, mỗi cột có đủ 1, 2, 3, 4, 5:</h3><div class="grid" style="grid-template-columns:repeat(5,42px)">${[1,'',3,'',5,4,1,'',5,'', '',4,'',1,2,2,'',1,'', '',5,'',4,'',1].map((v,i)=>v===''?`<input class="cell blank" style="width:40px;height:40px" data-answer="${(i%5)+1}">`:`<div class="cell">${v}</div>`).join('')}</div></div><div class="exercise"><h3>Bài 2. Nếu chồng hình A lên hình B thì được hình nào? Hãy chọn.</h3><div class="choices"><button class="choice">A</button><button class="choice">B</button><button class="choice">C</button></div></div>`}
else if(page===5){sheet.innerHTML=`<div class="sheet-head"><span>ARCHIMEDES SCHOOL</span><span>TIẾT 3</span></div><div class="exercise"><h3>Bài 1. Xếp hình bằng cách đánh số theo mẫu.</h3><div class="shape-row">${svgShape('triangle')}${svgShape('triangle')}${svgShape('square')}</div></div><div class="exercise"><h3>Bài 2. Chia hình bên dưới thành các hình nhỏ.</h3><svg viewBox="0 0 500 180" style="width:100%;max-width:520px"><polygon points="30,145 140,40 450,40 450,145" fill="#fff" stroke="#555" stroke-width="3"/><path d="M140 40v105M245 40v105M350 40v105M30 145h420" stroke="#555" stroke-width="2"/></svg></div><div class="exercise"><h3>Bài 3. Điền số 1; 2; 3; 4 vào ô trống sao cho tổng mỗi hàng bằng 10.</h3><p><input class="blank" data-answer="3"> + 4 + <input class="blank" data-answer="3"> = 10</p></div>`}
else {sheet.innerHTML=`<div class="sheet-head"><span class="week">TUẦN ${Math.max(1,Math.ceil(page/2))}</span><span>${page%3===0?'TIẾT 3':'TIẾT '+((page%3)||1)}</span></div><div class="exercise"><h3>Bài 1. Điền số thích hợp vào ô trống:</h3><p>7 + <input class="blank" data-answer="3"> = 10 &nbsp;&nbsp; 10 − <input class="blank" data-answer="4"> = 6</p><p>5 + <input class="blank" data-answer="4"> = 9 &nbsp;&nbsp; 8 − <input class="blank" data-answer="3"> = 5</p></div><div class="exercise"><h3>Bài 2. Chọn đáp án đúng:</h3><p>Hình dưới đây có bao nhiêu hình tam giác?</p><div class="shape-row">${svgShape('triangle')}</div><div class="choices"><button class="choice">2</button><button class="choice">3</button><button class="choice">4</button></div></div><div class="exercise"><h3>Bài 3. Tìm quy luật rồi điền số tiếp theo:</h3><p>2, 4, 6, <input class="blank" data-answer="8">, 10</p></div>`}
}
function openBook(n){book=n;page=3;home.style.display='none';viewer.classList.add('active');render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.book').forEach(x=>x.addEventListener('click',()=>openBook(+x.dataset.book)));document.getElementById('backBtn').onclick=()=>{viewer.classList.remove('active');home.style.display='block'};document.getElementById('prev').onclick=()=>{if(page>3){page--;render()}};document.getElementById('next').onclick=()=>{if(page<books[book].pages){page++;render()}};document.getElementById('check').onclick=()=>{let blanks=[...sheet.querySelectorAll('[data-answer]')];let ok=blanks.every(x=>String(x.value||x.textContent).trim()===x.dataset.answer);feedback.textContent=blanks.length?(ok?'🎉 Chính xác!':'💪 Hãy kiểm tra lại các ô màu hồng.'):'Hãy chọn hoặc điền câu trả lời.'};sheet.addEventListener('click',e=>{if(e.target.classList.contains('choice')){sheet.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));e.target.classList.add('selected')}});
</script>
</body></html>
