<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5fb"><title>Vocabulary List · Tiếng Anh lớp 1</title>
<style>
:root{--bg:#f6f8ff;--ink:#172033;--muted:#667085;--line:#e7eaf2;--pink:#df4f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.main{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 34px #17203312;overflow:hidden}
.top{text-align:center;padding:26px 22px 18px}.title{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}
.toolbar{padding:0 20px 12px;display:grid;gap:10px}.search,.source-select{width:100%;border:2px solid #e5dff0;border-radius:16px;padding:13px 15px;font:inherit;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.source-select{cursor:pointer}.filter-label{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px -4px}
.controls{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px}.control{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-weight:750;background:#eef2ff;color:var(--ink);cursor:pointer}.control.active{background:#fce7f3;color:#b42318}
.count{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 8px}.sync{text-align:center;min-height:18px;font-size:12px;font-weight:700;padding:0 20px 10px}
.list{padding:0 16px 20px;display:grid;gap:10px}.word-card{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#fff9fd)}
.pic{width:62px;height:62px;border-radius:18px;background:linear-gradient(180deg,#fff7fc,#eef4ff);display:flex;align-items:center;justify-content:center;font-size:34px;border:2px solid #f0dff0}.word{font-size:21px;font-weight:850}.ipa{font-size:14px;color:var(--muted);margin-top:3px}.meaning{font-size:17px;font-weight:700;margin-top:4px}.sources{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.source-chip{font-size:11px;font-weight:750;color:#7a3560;background:#fff0f7;border-radius:999px;padding:4px 7px}
.actions{display:flex;gap:7px}.speak,.star{border:0;width:45px;height:45px;border-radius:14px;font-size:21px;cursor:pointer}.speak{background:#fff0f7;color:var(--pink)}.star{background:#f2f4f7;color:#98a2b3}.star.selected{background:#fff3b8;color:#f59e0b}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:650px){.main{padding:12px}.title{font-size:28px}.word-card{grid-template-columns:58px 1fr auto;gap:9px;padding:11px}.pic{width:56px;height:56px;font-size:30px}.word{font-size:19px}.meaning{font-size:16px}.speak,.star{width:41px;height:41px}.actions{flex-direction:column;gap:5px}}
</style>
</head>
<body>
<main class="main"><div class="card">
<header class="top"><h1 class="title">📚 Vocabulary List</h1><p class="subtitle">Từ vựng tiếng Anh lớp 1 · Nguồn dữ liệu dùng chung cho toàn bộ chương trình</p></header>
<div class="toolbar">
<input id="search" class="search" type="search" placeholder="🔎 Tìm từ vựng..." autocomplete="off">
<label class="filter-label" for="sourceFilter">📚 Lọc theo nguồn</label>
<select id="sourceFilter" class="source-select"><option value="">Tất cả nguồn</option></select>
</div>
<div class="controls"><button id="selectAll" class="control">⭐ Chọn tất cả</button><button id="clearAll" class="control">Bỏ chọn tất cả</button><button id="selectedFilter" class="control">⭐ Chỉ hiện từ đã chọn</button></div>
<div id="count" class="count">Đang tải...</div><div id="sync" class="sync">Đang kết nối...</div><section id="list" class="list"></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261005v3"></script><script src="auth-guard.js?v=20261005v3"></script>
<script>
const DATA_URL='data/grade1/english/vocabulary.json',SOURCES_URL='data/grade1/english/vocabulary-sources.json',KEY='grade1EnglishSelectedWords';
let words=[],sourceMap=new Map(),selected=new Set(),onlySelected=false,sourceFilter='';
const details={
'stand up':['/stænd ʌp/','đứng lên','🙋'],'sit down':['/sɪt daʊn/','ngồi xuống','🪑'],'open your book':['/ˈoʊpən jʊr bʊk/','mở sách','📖'],'raise your hand':['/reɪz jʊr hænd/','giơ tay','✋'],'listen and look':['/ˈlɪsən ænd lʊk/','lắng nghe và nhìn','👂'],'sit nicely':['/sɪt ˈnaɪsli/','ngồi ngay ngắn','🪑'],'be quiet':['/bi ˈkwaɪət/','giữ im lặng','🤫'],'speak English':['/spiːk ˈɪɡlɪʃ/','nói tiếng Anh','💬'],
'happy':['/ˈhæpi/','vui','😊'],'sad':['/sæd/','buồn','😢'],'angry':['/ˈæŋɡri/','tức giận','😠'],'hungry':['/ˈhʌŋɡri/','đói','😋'],'thirsty':['/ˈθɜrsti/','khát','🥤'],'sunny':['/ˈsʌni/','có nắng','☀️'],'rainy':['/ˈreɪni/','có mưa','🌧️'],'cloudy':['/ˈklaʊdi/','nhiều mây','☁️'],'windy':['/ˈwɪndi/','nhiều gió','💨'],'stormy':['/ˈstɔrmi/','có bão','⛈️'],'hot':['/hɑt/','nóng','🥵'],'cold':['/koʊld/','lạnh','🥶'],
'monday':['/ˈmʌndeɪ/','thứ Hai','📅'],'tuesday':['/ˈtuːzdeɪ/','thứ Ba','📅'],'wednesday':['/ˈwenzdeɪ/','thứ Tư','📅'],'thursday':['/ˈθɜrzdeɪ/','thứ Năm','📅'],'friday':['/ˈfraɪdeɪ/','thứ Sáu','📅'],'saturday':['/ˈsætərdeɪ/','thứ Bảy','📅'],'sunday':['/ˈsʌndeɪ/','Chủ nhật','📅'],
'one':['/wʌn/','một','1️⃣'],'two':['/tuː/','hai','2️⃣'],'three':['/θriː/','ba','3️⃣'],'four':['/fɔr/','bốn','4️⃣'],'five':['/faɪv/','năm','5️⃣'],'six':['/sɪks/','sáu','6️⃣'],'seven':['/ˈsevən/','bảy','7️⃣'],'eight':['/eɪt/','tám','8️⃣'],'nine':['/naɪn/','chín','9️⃣'],'ten':['/ten/','mười','🔟'],
'I':['/aɪ/','tôi','👤'],'see':['/siː/','nhìn thấy','👀'],'the':['/ðə/','mạo từ xác định','🔤'],'my':['/maɪ/','của tôi','👉'],'am':['/æm/','là / đang','🙂'],'and':['/ænd/','và','➕'],'it':['/ɪt/','nó','👉'],'to':['/tuː/','đến / để','➡️'],'set':['/set/','đặt / bộ','📦'],'like':['/laɪk/','thích','❤️'],'a':['/ə/','một','🔤'],'have':['/hæv/','có','🤲'],
'red':['/red/','đỏ','🔴'],'yellow':['/ˈjeloʊ/','vàng','🟡'],'green':['/ɡriːn/','xanh lá','🟢'],'pink':['/pɪŋk/','hồng','🩷'],'purple':['/ˈpɜrpəl/','tím','🟣'],'orange':['/ˈɔrɪndʒ/','cam','🟠'],'blue':['/bluː/','xanh dương','🔵'],'black':['/blæk/','đen','⚫'],'white':['/waɪt/','trắng','⚪'],'brown':['/braʊn/','nâu','🟤'],'gray':['/ɡreɪ/','xám','🩶']};
function info(w){return details[w]||['',w,'📘']}
function speak(w){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function localRead(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return new Set()}}
function localWrite(s){localStorage.setItem(KEY,JSON.stringify([...s]))}
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const shown=words.filter(item=>{const w=item.word||'';const matchText=!q||w.toLowerCase().includes(q);const matchSource=!sourceFilter||(item.sourceIds||[]).includes(sourceFilter);const matchSelected=!onlySelected||selected.has(w);return matchText&&matchSource&&matchSelected});
 document.getElementById('count').textContent=`Hiển thị ${shown.length} / ${words.length} từ · Đã chọn ${selected.size}`;
 document.getElementById('list').innerHTML=shown.length?shown.map(item=>{const w=item.word,d=info(w),sel=selected.has(w);const chips=(item.sourceIds||[]).map(id=>sourceMap.get(id)?.label).filter(Boolean).map(x=>`<span class="source-chip">${escapeHtml(x)}</span>`).join('');return `<article class="word-card"><div class="pic">${d[2]}</div><div><div class="word">${escapeHtml(w)}</div><div class="ipa">${escapeHtml(d[0])}</div><div class="meaning">${escapeHtml(d[1])}</div><div class="sources">${chips}</div></div><div class="actions"><button class="speak" data-speak="${escapeHtml(w)}">🔊</button><button class="star ${sel?'selected':''}" data-word="${escapeHtml(w)}">★</button></div></article>`}).join(''):'<div class="empty">Không tìm thấy từ phù hợp.</div>';
 document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>toggle(b.dataset.word));
}
function buildSourceFilter(sources){sourceMap=new Map((sources||[]).map(s=>[s.id,s]));const sel=document.getElementById('sourceFilter');sel.innerHTML='<option value="">Tất cả nguồn</option>'+(sources||[]).map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)}</option>`).join('');sel.value=sourceFilter}
async function toggle(w){const next=new Set(selected);next.has(w)?next.delete(w):next.add(w);selected=next;localWrite(selected);render();await syncToServer(next)}
async function syncToServer(next){const sb=window.learningAuth;if(!sb){setStatus('Chờ đăng nhập...');return}setStatus('Đang đồng bộ...');const before=window.__vocabServerSet||new Set();const add=[...next].filter(w=>!before.has(w));const remove=[...before].filter(w=>!next.has(w));if(add.length){const r=await sb.from('vocabulary_selected_words').upsert(add.map(word=>({word})),{onConflict:'user_id,word'});if(r.error){setStatus('Đồng bộ thất bại: '+r.error.message,true);return}}if(remove.length){const r=await sb.from('vocabulary_selected_words').delete().in('word',remove);if(r.error){setStatus('Đồng bộ thất bại: '+r.error.message,true);return}}window.__vocabServerSet=new Set(next);setStatus(`✓ Đã đồng bộ ${next.size} từ`)}
function setStatus(t,error=false){const e=document.getElementById('sync');e.textContent=t;e.style.color=error?'#b42318':'#12a05c'}
async function waitAuth(){for(let i=0;i<80;i++){if(window.learningAuth&&window.learningUser)return window.learningAuth;await new Promise(r=>setTimeout(r,250))}throw Error('Không thể kết nối tài khoản')}
async function loadRemote(sb){const r=await sb.from('vocabulary_selected_words').select('word');if(r.error)throw r.error;return new Set((r.data||[]).map(x=>x.word).filter(Boolean))}
async function boot(){try{await waitAuth();const sb=window.learningAuth;const local=localRead();let remote=await loadRemote(sb);if(remote.size===0&&local.size>0){const r=await sb.from('vocabulary_selected_words').upsert([...local].map(word=>({word})),{onConflict:'user_id,word'});if(r.error)throw r.error;remote=await loadRemote(sb)}selected=new Set(remote);window.__vocabServerSet=new Set(remote);localWrite(selected);render();setStatus(`✓ Đã đồng bộ ${selected.size} từ`);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,15000);async function refresh(){try{const latest=await loadRemote(sb);selected=latest;window.__vocabServerSet=new Set(latest);localWrite(latest);render();setStatus(`✓ Đã đồng bộ ${latest.size} từ`)}catch(e){setStatus('Đồng bộ thất bại: '+e.message,true)}}}catch(e){setStatus('Đồng bộ thất bại: '+e.message,true);render()}}
document.getElementById('search').oninput=render;document.getElementById('sourceFilter').onchange=e=>{sourceFilter=e.target.value;render()};document.getElementById('selectAll').onclick=async()=>{const q=document.getElementById('search').value.trim().toLowerCase();const visible=words.filter(item=>(!q||item.word.toLowerCase().includes(q))&&(!sourceFilter||(item.sourceIds||[]).includes(sourceFilter)));selected=new Set([...selected,...visible.map(x=>x.word)]);localWrite(selected);render();await syncToServer(selected)};document.getElementById('clearAll').onclick=async()=>{selected=new Set();localWrite(selected);render();await syncToServer(selected)};document.getElementById('selectedFilter').onclick=()=>{onlySelected=!onlySelected;document.getElementById('selectedFilter').classList.toggle('active',onlySelected);render()};
Promise.all([fetch(DATA_URL,{cache:'no-store'}).then(r=>r.json()),fetch(SOURCES_URL,{cache:'no-store'}).then(r=>r.json())]).then(([data,src])=>{words=(data.words||[]).filter(x=>x&&x.word);buildSourceFilter(src.sources||[]);render();boot()}).catch(e=>setStatus(e.message,true));
</script>
<script src="navigation-v2.js?v=20261005"></script><script src="navigation-hardening.js?v=20261003"></script>
</body></html>
